<style>
:root{
  --bg:#161019; --bg2:#1e1526; --bg3:#281c33; --raise:#31233f;
  --line:#3c2c4b; --line2:#503a63;
  --text:#f4eef7; --muted:#b6a5c4; --faint:#8a7a99;
  --accent:#ff3d8b; --accent-ink:#2a0d1c;
  --violet:#c8a2ff;
  --gain:#39e0a3; --loss:#ff6b6b; --gold:#ffd166;
  --safe-t:env(safe-area-inset-top,0px); --safe-b:env(safe-area-inset-bottom,0px);
  box-sizing:border-box;
}
*,*::before,*::after{box-sizing:inherit}
html,body{margin:0;height:100%}
body{
  background:var(--bg); color:var(--text);
  font-family:"Space Grotesk",system-ui,sans-serif;
  -webkit-font-smoothing:antialiased; line-height:1.45;
  padding-top:var(--safe-t); padding-bottom:var(--safe-b);
}
#root{max-width:760px;margin:0 auto;padding:0 16px 96px}
h1,h2,h3{margin:0;font-weight:600;line-height:1.1}
button{font-family:inherit;cursor:pointer;color:inherit}
input,select{font-family:inherit}
a{color:var(--violet)}

/* wordmark / hero */
.top{display:flex;align-items:baseline;justify-content:space-between;gap:12px;
  padding:22px 0 14px;position:sticky;top:var(--safe-t);background:linear-gradient(var(--bg),var(--bg) 70%,rgba(22,16,25,0));z-index:5}
.mark{font-family:"Fraunces",serif;font-weight:600;font-size:26px;letter-spacing:-.01em}
.mark em{font-style:italic;color:var(--accent)}
.mark .sub{display:block;font-family:"Space Grotesk";font-weight:400;font-size:12px;color:var(--faint);letter-spacing:.02em;margin-top:2px}
.badge{font-size:12px;color:var(--muted);border:1px solid var(--line);border-radius:999px;padding:5px 11px;white-space:nowrap}

/* panels */
.panel{background:var(--bg2);border:1px solid var(--line);border-radius:16px;padding:18px;margin:14px 0}
.panel h2{font-size:15px;color:var(--muted);font-weight:500;margin-bottom:12px}
.hint{color:var(--faint);font-size:13px;margin:6px 0 0}

/* show/season pickers */
.chips{display:flex;flex-wrap:wrap;gap:8px}
.chip{background:var(--bg3);border:1px solid var(--line);border-radius:11px;padding:10px 14px;font-size:14px;font-weight:500;transition:border-color .12s,background .12s}
.chip[aria-pressed="true"]{border-color:var(--accent);background:var(--accent-ink);color:var(--text)}
.field{display:flex;flex-direction:column;gap:6px;margin-top:14px}
.field label{font-size:13px;color:var(--muted)}
select,.textin{background:var(--bg3);border:1px solid var(--line);color:var(--text);border-radius:11px;padding:11px 12px;font-size:15px;width:100%}
.row{display:flex;gap:12px;flex-wrap:wrap;align-items:center}
.opt{display:flex;align-items:center;gap:9px;font-size:14px;color:var(--muted)}
.opt input[type=checkbox]{width:20px;height:20px;accent-color:var(--accent)}
.numin{width:64px;background:var(--bg3);border:1px solid var(--line);color:var(--text);border-radius:9px;padding:8px;font-size:15px;text-align:center}

/* primary action */
.cta{width:100%;background:var(--accent);color:#fff;border:none;border-radius:13px;
  padding:15px;font-size:16px;font-weight:600;letter-spacing:.01em;margin-top:16px}
.cta:disabled{opacity:.4}
.ghost{background:transparent;border:1px solid var(--line2);border-radius:11px;padding:11px 15px;font-size:14px;color:var(--text)}

/* rating list */
.ratehead{display:flex;gap:10px;align-items:center;flex-wrap:wrap;margin-bottom:10px}
.search{flex:1;min-width:160px}
.roster{display:flex;flex-direction:column;gap:8px}
.card{display:grid;grid-template-columns:1fr auto;gap:4px 12px;align-items:center;
  background:var(--bg2);border:1px solid var(--line);border-radius:12px;padding:11px 13px}
.card .who{min-width:0}
.card .nm{font-weight:600;font-size:15px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.card .meta{font-size:12px;color:var(--faint);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.val{font-family:"Fraunces",serif;font-size:26px;font-weight:600;min-width:38px;text-align:center;font-variant-numeric:tabular-nums}
.slider{grid-column:1/-1;display:flex;align-items:center;gap:10px}
.slider input[type=range]{flex:1;accent-color:var(--violet);height:26px}
.star{grid-column:2;justify-self:end;background:none;border:none;font-size:20px;line-height:1;padding:2px 4px;filter:grayscale(1);opacity:.5}
.star[aria-pressed="true"]{filter:none;opacity:1}
.more{width:100%;margin-top:10px}

/* results */
.scoreHero{text-align:center;padding:14px 0 6px}
.scoreHero .lbl{font-size:13px;color:var(--muted)}
.scoreHero .big{font-family:"Fraunces",serif;font-size:62px;font-weight:600;line-height:1;font-variant-numeric:tabular-nums;letter-spacing:-.02em}
.pos{color:var(--gain)} .neg{color:var(--loss)}
.play{display:flex;align-items:center;gap:12px;margin:8px 0}
.play button{background:var(--bg3);border:1px solid var(--line2);border-radius:10px;padding:9px 14px;font-size:14px;font-weight:600}
.play input[type=range]{flex:1;accent-color:var(--accent)}
.roundline{display:flex;justify-content:space-between;font-size:13px;color:var(--muted);margin-top:4px}
.spark{width:100%;height:64px;display:block;margin:8px 0 2px}
.tbl{width:100%;border-collapse:collapse;font-size:13px;margin-top:6px;font-variant-numeric:tabular-nums}
.tbl th{color:var(--faint);font-weight:500;text-align:right;padding:7px 6px;border-bottom:1px solid var(--line);font-size:12px}
.tbl th:first-child{text-align:left}
.tbl td{padding:8px 6px;border-bottom:1px solid var(--bg3);text-align:right}
.tbl td:first-child{text-align:left;font-weight:500}
.tbl tr.bonus td:first-child::after{content:"★";color:var(--gold);margin-left:6px}
.tag{font-size:11px;border-radius:6px;padding:2px 7px;border:1px solid var(--line2);color:var(--muted)}
.tag.win{color:var(--gold);border-color:#6b5320}
.tag.out{color:var(--loss);border-color:#6b2b2b}
.note{background:var(--bg3);border:1px solid var(--line);border-radius:11px;padding:11px 13px;font-size:12.5px;color:var(--muted);margin-top:12px;line-height:1.5}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}
</style>
</head>

<script>
const { useState, useMemo, useEffect, useRef } = React;
const html = htm.bind(React.createElement);
const DATA = window.DATA;
const SHOWS = Object.keys(DATA.shows);
const ESC = 1.2;

function seasonKey(show, s){ return s.name; }
function bootOrderFor(show, season){
  const key = (DATA.elimination[show]||{})[season.name];
  if(key && key.length) return {order:key, real:true};
  // no answer key (e.g. Beast Games) -> shuffle roster for a test run
  const names = season.cast.map(c=>c.name).slice();
  for(let i=names.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[names[i],names[j]]=[names[j],names[i]];}
  return {order:names, real:false};
}

function simulate(order, ratingOf, bonusPick, opts){
  const N=order.length, bonus=opts.bonus, esc=opts.esc, penW=opts.penW;
  const maxR=N-1;                        // rounds the winner survives
  const rewardTo=(E,s)=>{ if(!esc) return E*s; let g=0; for(let k=0;k<s;k++) g+=E*Math.pow(ESC,k); return g; };
  const rows=order.map((name,i)=>{
    const base=ratingOf(name);
    const E=base+(name===bonusPick?bonus:0);
    const survived=i;                    // rounds made it through
    const missed=maxR-i;                 // rounds after their boot (0 for winner)
    const booted=i<maxR;
    const gain=rewardTo(E,survived);
    const penalty=penW*E*missed;         // per missed round; shrinks the deeper they go
    return {name,i,base,bonus:name===bonusPick?bonus:0,E,survived,missed,booted,gain,penalty,net:gain-penalty};
  });
  const total=rows.reduce((a,r)=>a+r.net,0);
  const running=[0];
  for(let r=1;r<=maxR;r++){
    let s=0;
    for(const row of rows){
      const surv=Math.min(row.i,r);
      const miss=Math.max(0,Math.min(r,maxR)-row.i);
      s += rewardTo(row.E,surv) - penW*row.E*miss;
    }
    running.push(s);
  }
  return {rows,total,running,N};
}

function fmt(n){ const r=Math.round(n); return (r>0?"+":"")+r; }

function App(){
  const [phase,setPhase]=useState("setup");
  const [show,setShow]=useState(SHOWS[0]);
  const [seasonIdx,setSeasonIdx]=useState(0);
  const [esc,setEsc]=useState(false);
  const [bonus,setBonus]=useState(10);
  const [penW,setPenW]=useState(1);
  const [def,setDef]=useState(10);
  const [ratings,setRatings]=useState({});
  const [bonusPick,setBonusPick]=useState(null);
  const [q,setQ]=useState("");
  const [vis,setVis]=useState(80);
  const [sim,setSim]=useState(null);
  const [simReal,setSimReal]=useState(true);
  const [rnd,setRnd]=useState(0);
  const [playing,setPlaying]=useState(false);

  const season = DATA.shows[show].seasons[seasonIdx];
  const cast = season.cast;
  const ratingOf = (nm)=> ratings[nm]!=null ? ratings[nm] : def;

  function start(){ setRatings({}); setBonusPick(null); setQ(""); setVis(80); setPhase("rate"); }
  function lock(){
    const {order,real}=bootOrderFor(show,season);
    const res=simulate(order,ratingOf,bonusPick,{esc,bonus,penW});
    setSim(res); setSimReal(real); setRnd(res.N-1); setPlaying(false); setPhase("results");
  }

  // playback
  useEffect(()=>{
    if(!playing||!sim) return;
    if(rnd>=sim.N-1){setPlaying(false);return;}
    const t=setTimeout(()=>setRnd(r=>Math.min(r+1,sim.N-1)), 380);
    return ()=>clearTimeout(t);
  },[playing,rnd,sim]);

  const header = html`<div class="top">
    <div class="mark">Sight <em>Unseen</em><span class="sub">rate the cast blind · watch the season score it</span></div>
    <div class="badge">${cast.length.toLocaleString()} in cast</div>
  </div>`;

  if(phase==="setup"){
    return html`<div>${header}
      <div class="panel">
        <h2>Pick a show</h2>
        <div class="chips">
          ${SHOWS.map(s=>html`<button class="chip" key=${s} aria-pressed=${s===show}
            onClick=${()=>{setShow(s);setSeasonIdx(0);}}>${s}</button>`)}
        </div>
        <div class="field">
          <label>Season</label>
          <select value=${seasonIdx} onChange=${e=>setSeasonIdx(+e.target.value)}>
            ${DATA.shows[show].seasons.map((s,i)=>html`<option key=${i} value=${i}>${s.name} · ${s.cast.length} cast</option>`)}
          </select>
        </div>
        ${!(DATA.elimination[show]||{})[season.name] && html`<p class="hint">No real result on file for this one — the run will use a randomized boot order so you can still test scoring.</p>`}
      </div>

      <div class="panel">
        <h2>Scoring rules</h2>
        <div class="row" style=${{gap:'18px'}}>
          <label class="opt"><input type="checkbox" checked=${esc} onChange=${e=>setEsc(e.target.checked)}/> Endgame premium — late rounds worth more (×1.2 each)</label>
        </div>
        <div class="row" style=${{marginTop:'14px',gap:'18px',alignItems:'flex-end'}}>
          <div class="field" style=${{margin:0}}>
            <label>Bonus points on one pick</label>
            <input class="numin" type="number" min="0" max="50" value=${bonus} onChange=${e=>setBonus(Math.max(0,+e.target.value||0))}/>
          </div>
          <div class="field" style=${{margin:0}}>
            <label>Default rating</label>
            <input class="numin" type="number" min="1" max="20" value=${def} onChange=${e=>setDef(Math.min(20,Math.max(1,+e.target.value||1)))}/>
          </div>
          <div class="field" style=${{margin:0}}>
            <label>Penalty weight</label>
            <select style=${{width:'auto'}} value=${penW} onChange=${e=>setPenW(+e.target.value)}>
              <option value="1">1.0 · beat the median</option>
              <option value="0.5">0.5 · forgiving</option>
              <option value="0">0 · reward only</option>
            </select>
          </div>
        </div>
        <p class="hint">You're betting how deep each person goes. Every round they survive: +your value. Every round after they're booted: −your value. A high pick who flames out early bleeds all season; one who reaches the finale keeps almost all of it. Rate everyone the same and you net zero — your score is how well you split the deep runs from the early exits.</p>
      </div>

      <button class="cta" onClick=${start}>Rate the cast →</button>
    </div>`;
  }

  if(phase==="rate"){
    const ql=q.trim().toLowerCase();
    const filtered = ql ? cast.filter(c=>c.name.toLowerCase().includes(ql)) : cast;
    const shown = filtered.slice(0,vis);
    const customized = Object.keys(ratings).length;
    return html`<div>${header}
      <div class="ratehead">
        <input class="textin search" placeholder="Find someone…" value=${q}
          onInput=${e=>{setQ(e.target.value);setVis(80);}}/>
        <button class="ghost" onClick=${()=>{setRatings({});}}>Reset</button>
      </div>
      <p class="hint" style=${{marginTop:0}}>${season.name} · everyone starts at ${def}. ${customized} adjusted${bonusPick?` · ★ ${bonusPick}`:""}.</p>

      <div class="roster">
        ${shown.map(c=>{
          const v=ratingOf(c.name);
          const meta=[c.age,c.hometown,c.profession].filter(Boolean).join(" · ");
          return html`<div class="card" key=${c.name}>
            <div class="who"><div class="nm">${c.name}</div>${meta && html`<div class="meta">${meta}</div>`}</div>
            <div class="val">${v}</div>
            <button class="star" aria-pressed=${bonusPick===c.name} title="Bonus pick"
              onClick=${()=>setBonusPick(bonusPick===c.name?null:c.name)}>★</button>
            <div class="slider">
              <input type="range" min="1" max="20" value=${v}
                onInput=${e=>setRatings(r=>({...r,[c.name]:+e.target.value}))}/>
            </div>
          </div>`;
        })}
      </div>
      ${filtered.length>vis && html`<button class="ghost more" onClick=${()=>setVis(v=>v+120)}>Show ${Math.min(120,filtered.length-vis)} more (${filtered.length-vis} hidden)</button>`}

      <button class="cta" onClick=${lock}>Lock in & run the season →</button>
      <button class="ghost more" style=${{marginTop:'8px'}} onClick=${()=>setPhase('setup')}>← Back</button>
    </div>`;
  }

  // results
  const runScore = sim.running[rnd];
  const bootedThisRound = rnd>0 ? sim.rows[rnd-1] : null;
  const remaining = sim.N - rnd;
  // sparkline
  const W=680,H=64, rn=sim.running, mx=Math.max(...rn,1), mn=Math.min(...rn,0);
  const sx=i=> (i/(rn.length-1))*W;
  const sy=v=> H-4-((v-mn)/((mx-mn)||1))*(H-8);
  const path = rn.map((v,i)=>`${i?'L':'M'}${sx(i).toFixed(1)},${sy(v).toFixed(1)}`).join(" ");
  const zeroY = sy(0);
  const byNet=[...sim.rows].sort((a,b)=>b.net-a.net);
  const big = sim.rows.length>60;
  const tableRows = big ? [...byNet.slice(0,60), ...byNet.filter(r=>r.name===bonusPick && byNet.slice(0,60).indexOf(r)<0)] : byNet;

  return html`<div>${header}
    <div class="scoreHero">
      <div class="lbl">Your score${rnd<sim.N-1?` · through round ${rnd}`:" · final"}</div>
      <div class=${"big "+(runScore>=0?"pos":"neg")}>${fmt(runScore)}</div>
    </div>

    <svg class="spark" viewBox=${`0 0 ${W} ${H}`} preserveAspectRatio="none">
      <line x1="0" y1=${zeroY} x2=${W} y2=${zeroY} stroke="var(--line)" stroke-width="1"/>
      <path d=${path} fill="none" stroke="var(--accent)" stroke-width="2.5" stroke-linejoin="round"/>
      <circle cx=${sx(rnd)} cy=${sy(rn[rnd])} r="4" fill="var(--accent)"/>
    </svg>

    <div class="play">
      <button onClick=${()=>{ if(rnd>=sim.N-1){setRnd(0);setPlaying(true);} else setPlaying(p=>!p);} }>
        ${playing?"Pause":(rnd>=sim.N-1?"Replay":"Play")}
      </button>
      <input type="range" min="0" max=${sim.N-1} value=${rnd}
        onInput=${e=>{setPlaying(false);setRnd(+e.target.value);}}/>
      <button onClick=${()=>{setPlaying(false);setRnd(r=>Math.min(r+1,sim.N-1));}}>Step</button>
    </div>
    <div class="roundline">
      <span>${bootedThisRound?html`Booted: <b style=${{color:'var(--loss)'}}>${bootedThisRound.name}</b>`:"Season start"}</span>
      <span>${remaining} still in</span>
    </div>

    <div class="panel" style=${{marginTop:'16px'}}>
      <h2>Where your points came from</h2>
      <table class="tbl">
        <thead><tr><th>Contestant</th><th>Rating</th><th>Rounds</th><th>Gained</th><th>Lost</th><th>Net</th></tr></thead>
        <tbody>
        ${tableRows.map(r=>html`<tr key=${r.name} class=${r.name===bonusPick?"bonus":""}>
          <td>${r.name} ${r.i===sim.N-1?html`<span class="tag win">winner</span>`:(r.booted?"":"")}</td>
          <td>${r.base}${r.bonus?html`<span style=${{color:'var(--gold)'}}>+${r.bonus}</span>`:""}</td>
          <td>${r.survived}</td>
          <td class="pos">${r.gain?("+"+Math.round(r.gain)):"0"}</td>
          <td class="neg">${r.penalty?("−"+Math.round(r.penalty)):"0"}</td>
          <td style=${{fontWeight:600,color:r.net>=0?'var(--gain)':'var(--loss)'}}>${fmt(r.net)}</td>
        </tr>`)}
        </tbody>
      </table>
      ${big && html`<p class="hint">Showing top 60 by net${bonusPick?" (plus your ★ pick)":""} of ${sim.rows.length}.</p>`}
    </div>

    ${!simReal && html`<div class="note"><b>Randomized run.</b> There's no real elimination order on file for ${show}, so this boot order was shuffled just to exercise the engine. Lock in again for a different shuffle.</div>`}
    ${simReal && html`<div class="note">Boot order is final placement from the record. Twist seasons where players return (Redemption Island, Edge of Extinction, Blood vs. Water, ANTM recalls) aren't episode-exact — good enough to test, flagged for later.</div>`}

    <button class="cta" onClick=${()=>setPhase('rate')} style=${{marginTop:'16px'}}>Re-rate this cast</button>
    <button class="ghost more" style=${{marginTop:'8px'}} onClick=${()=>setPhase('setup')}>← New season</button>
  </div>`;
}
ReactDOM.createRoot(document.getElementById("root")).render(html`<${App}/>`);
</script>
</body>
</html>
