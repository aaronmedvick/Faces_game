<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="theme-color" content="#020535">
<title>Jeopardy Quiz</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Anton&family=Barlow:wght@500;600;700&display=swap" rel="stylesheet">
<style>
:root{
  --s:1.12; --st:1.06;
  --navy:#020535; --navy2:#050a63; --blue:#0a1bd1; --blue2:#1a2cf0;
  --gold:#ffcc33; --mute:#9fb0ff; --ok:#3ee08a; --bad:#ff7070;
  --display:"Anton","Impact","Arial Narrow",sans-serif;
  --body:"Barlow","Helvetica Neue",Arial,sans-serif;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;height:100%;overflow:hidden;background:var(--navy);color:#fff;font-family:var(--body);font-weight:500}
button{font-family:inherit;color:inherit;cursor:pointer}
input{font-family:inherit}
/* the whole app always fits the visible screen, so the Safari bars never cover it */
#root{height:100vh;height:calc(100dvh - var(--hb,0px));max-width:640px;margin:0 auto;padding:6px 8px calc(6px + env(safe-area-inset-bottom,0px));display:flex;flex-direction:column}
.scr{flex:1;min-height:0;display:flex;flex-direction:column;gap:6px}
.scroll{overflow-y:auto;-webkit-overflow-scrolling:touch}

.logo{font-family:var(--display);font-weight:400;font-size:calc(40px*var(--s,1));line-height:1;color:var(--gold);margin:10px 0 4px;text-shadow:3px 3px 0 #000}
.sub{color:var(--mute);margin:0 0 12px;font-size:calc(16px*var(--s,1));line-height:1.35}
.lbl{display:block;font-weight:700;margin:12px 0 5px;color:var(--mute);font-size:calc(13px*var(--s,1))}
.in{width:100%;background:var(--navy2);border:2px solid var(--blue);color:#fff;border-radius:6px;padding:12px;font-size:calc(18px*var(--s,1));font-weight:600}
.in:focus{outline:3px solid var(--gold);outline-offset:1px}
.row{display:flex;gap:8px;align-items:stretch}
.btn{display:block;width:100%;border:0;border-radius:6px;padding:13px 12px;font-size:calc(18px*var(--s,1));font-weight:700;background:var(--blue2);color:#fff;margin-top:8px;min-height:48px}
.btn:active{filter:brightness(1.15)}
.btn.gold{background:var(--gold);color:#1a1200}
.btn.ghost{background:transparent;border:2px solid var(--blue2)}
.btn.ok{background:var(--ok);color:#042312}
.btn.sm{width:auto;margin:0;padding:9px 14px;min-height:0;font-size:calc(15px*var(--s,1))}
.btn[disabled]{opacity:.4}
.link{background:none;border:0;color:var(--mute);text-decoration:underline;font-size:calc(14px*var(--s,1));padding:8px 4px}
.err{margin-top:10px;color:var(--bad);font-weight:700}
.two{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.three{display:grid;grid-template-columns:1fr 1fr 1fr;gap:8px}
.card{text-align:left;background:var(--navy2);border:2px solid var(--blue);border-radius:6px;padding:10px;width:100%}
.card.on{border-color:var(--gold);background:#0a1280}
.card b{font-family:var(--display);font-weight:400;font-size:calc(20px*var(--s,1));color:var(--gold);display:block}
.card span{color:var(--mute);font-size:calc(13px*var(--s,1))}

.streak{display:flex;align-items:center;gap:12px;background:var(--navy2);border:2px solid var(--blue);border-radius:10px;padding:10px 12px;margin-top:6px}
.streak .n{font-family:var(--display);font-size:calc(42px*var(--s,1));line-height:1;color:var(--gold)}
.streak small{display:block;color:var(--mute);font-size:calc(13px*var(--s,1));font-weight:700}
.banner{background:#0a1280;border:2px solid var(--gold);border-radius:8px;padding:9px 12px;margin-top:8px;font-weight:700;font-size:calc(15px*var(--s,1))}

.top{display:flex;justify-content:space-between;align-items:center;gap:8px;flex:none}
.rt{font-family:var(--display);font-size:calc(21px*var(--s,1));line-height:1.05;color:var(--gold);text-shadow:2px 2px 0 #000}
.meta{color:var(--mute);font-size:calc(12px*var(--s,1));margin-top:2px}
.mine{text-align:right}
.mine small{display:block;color:var(--mute);font-size:calc(11px*var(--s,1));font-weight:700}
.score{font-family:var(--display);font-size:calc(30px*var(--s,1));line-height:1;text-shadow:2px 2px 0 #000}
.score.neg{color:var(--bad)}

.board{flex:1;min-height:0;display:grid;grid-template-columns:repeat(6,minmax(0,1fr));grid-template-rows:auto repeat(5,minmax(0,1fr));gap:3px;background:#000;padding:3px;border-radius:6px}
.cat{background:var(--blue);border-radius:2px;min-height:42px;padding:3px 2px;font-size:calc(10px*var(--st,1));font-weight:700;line-height:1.1;text-transform:uppercase;display:flex;align-items:center;justify-content:center;text-align:center;word-break:break-word;overflow:hidden}
.tile{background:var(--blue);border:0;border-radius:2px;font-family:var(--display);font-size:calc(clamp(13px,4.6vw,22px)*var(--st,1));color:var(--gold);text-shadow:2px 2px 0 #000;padding:0;min-height:0}
.tile:active{background:var(--blue2)}
.tile[disabled]{opacity:.85}
.tile.done{background:#040a55;font-family:var(--body);font-size:calc(11px*var(--st,1));font-weight:700;text-shadow:none;color:var(--mute);display:flex;align-items:center;justify-content:center}
.board.c5 .tile{font-size:calc(clamp(14px,5.6vw,26px)*var(--st,1))}
.board.c5 .cat{font-size:calc(11px*var(--st,1));min-height:46px}
.tile.done.r{color:var(--ok)}
.tile.done.w{color:var(--bad)}
.foot{display:flex;justify-content:space-between;align-items:center;flex:none}
.hint{color:var(--mute);font-size:calc(12px*var(--s,1));margin:0}

.clue{flex:1;min-height:0;display:flex;flex-direction:column;gap:6px;background:var(--blue);border:3px solid #000;border-radius:8px;padding:8px 10px;position:relative;overflow-x:hidden;overflow-y:auto}
.cchead{display:flex;justify-content:space-between;align-items:baseline;gap:8px;flex:none}
.cc{font-family:var(--display);font-size:calc(16px*var(--s,1));color:var(--gold);text-shadow:2px 2px 0 #000;letter-spacing:.4px}
.cv{font-family:var(--display);font-size:calc(22px*var(--s,1));color:#fff;text-shadow:2px 2px 0 #000}
.cqwrap{flex:1;min-height:0;display:flex;align-items:center;justify-content:center;overflow:auto}
.cq{font-size:calc(clamp(16px,4.7vw,21px)*var(--s,1));line-height:1.25;font-weight:700;text-align:center;padding:2px 4px;text-shadow:1px 1px 0 #000}
.cq.flip{transform:rotate(180deg)}
.opts{display:grid;gap:10px;flex:none}
.opt{display:flex;align-items:center;gap:10px;text-align:left;background:var(--navy2);border:2px solid #000;border-radius:6px;padding:8px 10px;font-size:calc(16px*var(--s,1));font-weight:700;min-height:50px;width:100%}
.opt:active{background:var(--navy)}
.opt i{font-style:normal;font-family:var(--display);color:var(--gold);font-size:calc(19px*var(--s,1));width:18px;flex:none}
.opt.sel{border-color:var(--gold);background:#0a1280;box-shadow:inset 0 0 0 2px var(--gold)}
.opt.right{background:var(--ok);color:#042312;border-color:#042312}
.opt.right i,.opt.wrong i{color:inherit}
.opt.wrong{background:var(--bad);color:#2b0505;border-color:#2b0505}
.opt.dim{opacity:.45}
.opt[disabled]{opacity:1}
.opt.dim[disabled]{opacity:.45}
.rrow{display:flex;align-items:center;justify-content:space-between;gap:10px;flex:none}
.res{font-family:var(--display);font-size:calc(22px*var(--s,1));text-shadow:2px 2px 0 #000;line-height:1.1}
.res.r{color:var(--ok)}
.res.w{color:var(--bad)}
.rn{color:#d6dcff;font-size:calc(13px*var(--s,1))}
.tbar{flex:none;height:8px;background:#000;border-radius:4px;overflow:hidden;position:relative}
.tbar div{height:100%;background:var(--gold)}
.tbar.low div{background:var(--bad)}
.tlab{position:absolute;right:6px;top:-1px;font-size:calc(10px*var(--s,1));font-weight:700}

.ddsplash{font-family:var(--display);font-size:calc(40px*var(--s,1));line-height:1;text-align:center;color:var(--gold);text-shadow:3px 3px 0 #000,0 0 18px rgba(255,204,51,.7)}
.big{font-family:var(--display);font-size:calc(46px*var(--s,1));line-height:1;color:#fff;text-align:center;text-shadow:3px 3px 0 #000}
.note{text-align:center;color:#d6dcff;font-size:calc(14px*var(--s,1))}
.slide{width:100%;height:44px;accent-color:var(--gold)}
.ticks{display:flex;justify-content:space-between;color:var(--mute);font-size:calc(12px*var(--s,1));font-weight:700;margin:-4px 2px 0}
.mid{flex:1;min-height:0;display:flex;flex-direction:column;justify-content:center;gap:8px}

.buzz{flex:none;min-height:88px;border:0;border-radius:14px;font-family:var(--display);font-size:calc(42px*var(--s,1));letter-spacing:1px;background:var(--gold);color:#1a1200;box-shadow:0 6px 0 #a67c00}
.buzz:active{transform:translateY(4px);box-shadow:0 2px 0 #a67c00}
.buzz.wrongb{background:#7a2a2a;color:#ffd6d6;font-size:calc(22px*var(--s,1));line-height:1.1;padding:6px}
.buzz[disabled]{background:#3a4180;color:#9fb0ff;box-shadow:none;transform:none}

.chips{display:flex;gap:6px;overflow-x:auto;flex:none;padding-bottom:2px}
.chip{flex:none;background:var(--navy2);border:2px solid #000;border-radius:8px;padding:3px 8px;min-width:76px}
.chip.pick{border-color:var(--gold)}
.chip.ans{background:var(--blue2);border-color:#fff}
.chip.out{opacity:.5}
.chip b{display:flex;align-items:center;gap:5px;font-size:calc(12px*var(--s,1));white-space:nowrap}
.chip .dot{width:9px;height:9px;border-radius:50%;flex:none}
.tag{font-size:calc(9px*var(--s,1));font-weight:700;background:#4b1fb8;border-radius:3px;padding:0 4px;margin-left:2px}
.chip em{font-style:normal;font-family:var(--display);font-size:calc(16px*var(--s,1))}
.chip em.neg{color:var(--bad)}
.items{display:flex;gap:6px;flex:none;align-items:center;flex-wrap:wrap}
.item{background:#4b1fb8;border:2px solid #000;border-radius:6px;padding:7px 10px;font-weight:700;font-size:calc(14px*var(--s,1))}
.item:active{filter:brightness(1.2)}
.items small{color:var(--mute);font-size:calc(12px*var(--s,1))}
.fog{position:absolute;inset:0;z-index:5;pointer-events:none;background:rgba(210,220,255,.66);backdrop-filter:blur(11px);-webkit-backdrop-filter:blur(11px)}
.toast{position:fixed;left:10px;right:10px;top:calc(var(--hb,0px) + 8px);z-index:60;background:#000;border:2px solid var(--gold);border-radius:8px;padding:9px;text-align:center;font-weight:700;font-size:calc(15px*var(--s,1));max-width:620px;margin:0 auto}

.pr{display:flex;align-items:center;gap:10px;padding:10px 12px;border-bottom:1px solid #000}
.pr:last-child{border-bottom:0}
.dot{width:12px;height:12px;border-radius:50%;flex:none}
.pn{flex:1;font-weight:700;font-size:calc(17px*var(--s,1));white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.pn i{font-style:normal;color:var(--gold);font-size:calc(12px*var(--s,1));margin-left:6px}
.ps{font-family:var(--display);font-size:calc(22px*var(--s,1))}
.ps.neg{color:var(--bad)}
.rank{font-family:var(--display);font-size:calc(26px*var(--s,1));color:var(--gold);width:34px}
.box{background:var(--navy2);border-radius:6px;overflow:hidden}
.boxh{padding:9px 12px;font-weight:700;color:var(--mute);font-size:calc(13px*var(--s,1));border-bottom:2px solid #000}
.stats{background:var(--navy2);border-radius:6px;padding:10px 12px;font-size:calc(16px*var(--s,1));line-height:1.6}
.stats b{color:var(--gold)}
.code{font-family:var(--display);font-size:calc(54px*var(--s,1));letter-spacing:6px;color:var(--gold);text-align:center;text-shadow:3px 3px 0 #000}
.tabs{display:flex;gap:6px;margin-bottom:6px}
.tabs button{flex:1;background:var(--navy2);border:2px solid var(--blue);border-radius:6px;padding:8px 4px;font-weight:700;font-size:calc(14px*var(--s,1))}
.tabs button.on{border-color:var(--gold);color:var(--gold)}
@media (prefers-reduced-motion:no-preference){
  .ddsplash{animation:ddpop .55s cubic-bezier(.2,1.4,.4,1)}
  @keyframes ddpop{0%{transform:scale(.3) rotate(-6deg);opacity:0}60%{transform:scale(1.2) rotate(2deg);opacity:1}100%{transform:none}}
  .clue.flash{animation:ddflash .7s ease-out}
  @keyframes ddflash{0%{background:#ffcc33}100%{background:var(--blue)}}
  .fog{animation:fogpulse 1.6s ease-in-out infinite alternate}
  @keyframes fogpulse{from{background:rgba(210,220,255,.55)}to{background:rgba(230,235,255,.82)}}
}

.tile.done.ans{color:#cfd6ff;padding:1px}
.at{display:-webkit-box;-webkit-line-clamp:4;-webkit-box-orient:vertical;overflow:hidden;font-size:calc(9px*var(--st,1));line-height:1.05;text-align:center;word-break:break-word;padding:0 2px}
.botlist{display:flex;flex-wrap:wrap;gap:6px;margin-top:8px}
.botchip{display:flex;align-items:center;gap:8px;background:#4b1fb8;border-radius:18px;padding:4px 5px 4px 12px;font-size:calc(14px*var(--s,1))}
.botchip button{background:#000;border:0;border-radius:14px;padding:7px 11px;font-weight:700;font-size:calc(12px*var(--s,1))}
</style>
</head>

</script>

      { q:"Cinderella loses one of these at the ball.", o:["Tiara","Necklace","Glass slipper","Cloak"], a:2 },

      { q:"This is the largest planet in our solar system.", o:["Saturn","Neptune","Uranus","Jupiter"], a:3 },
      { q:"In 1961, Yuri Gagarin became the first human in space, flying for this country.", o:["The Soviet Union","The United States","China","Great Britain"], a:0 },

    ,{ name:"Inventions", clues:[

    if(!total) return { total:0 };
    const s = await base().lt("score",score);
    const p = await base().lt("pct",pct);
    return { total, beatScore:Math.round(100*(s.count||0)/total), beatPct:Math.round(100*(p.count||0)/total) };
  }catch(e){ return null; }
}

/* ================= shared pieces ================= */
function Countdown({ secs, k, onExpire }){
  const [left,setLeft] = useState(secs*1000);
  const cb = useRef(onExpire); cb.current = onExpire;
  useEffect(()=>{
    const total = secs*1000*TS, t0 = Date.now(); let fired = false;
    setLeft(total);
    const iv = setInterval(()=>{
      const l = Math.max(0,total-(Date.now()-t0));
      setLeft(l);
      if(l<=0 && !fired){ fired = true; clearInterval(iv); if(cb.current) cb.current(); }
    },100);
    return ()=>clearInterval(iv);
  },[k,secs]);
  const frac = Math.max(0,Math.min(1,left/(secs*1000*TS)));
  return <div className={"tbar"+(frac<0.3?" low":"")}><div style={{width:(frac*100)+"%"}}></div><span className="tlab">{Math.ceil(left/1000/TS)}s</span></div>;
}

function BoardView({ board, vals, round, played, onTile, disabled, answerOf }){
  const cols=board.length, rows=vals.length;
  const style={ gridTemplateColumns:"repeat("+cols+",minmax(0,1fr))", gridTemplateRows:"auto repeat("+rows+",minmax(0,1fr))" };
  return (
    <div className={"board c"+cols} style={style}>
      {board.map((cat,c)=><div key={"h"+c} className="cat">{cat.name}</div>)}
      {vals.map((v,i)=>board.map((cat,c)=>{
        const st = played[round+"-"+c+"-"+i];
        if(st) return <div key={c+"-"+i} className={"tile done "+(answerOf?"ans":st)}>{answerOf?<span className="at">{answerOf(c,i)}</span>:(st==="r"?"right":st==="w"?"missed":st==="t"?"time":"none")}</div>;
        return <button key={c+"-"+i} className="tile" disabled={disabled} onClick={()=>onTile(c,i)} aria-label={cat.name+" "+fmt(v)}>{"$"+v}</button>;
      }))}
    </div>);
}

function Options({ clue, order, picked, hidden, onPick, locked, fx, showAnswer, selected }){
  return (
    <div className="opts">
      {order.map((idx,slot)=>{
        if(hidden && hidden.indexOf(idx)>=0) return null;
        let cls = "opt";
        if(showAnswer){ if(idx===clue.a) cls+=" right"; else if(slot===picked) cls+=" wrong"; else cls+=" dim"; } else if(selected===slot) cls+=" sel";
        const label = fx && fx.scr ? scrambleText(clue.o[idx],fx.scr) : clue.o[idx];
        return <button key={slot} className={cls} disabled={locked||showAnswer} onClick={()=>onPick(slot)}><i>{LETTERS[slot]}</i><span>{label}</span></button>;
      })}
    </div>);
}

function ClueText({ text, fx }){

/* ================= SOLO ================= */
function Solo({ prefs, name, stats, setStats, onMenu, onLeaders }){
  const [game,setGame] = useState(null);
  const [cur,setCur] = useState(null);
  const [nopen,setNopen] = useState(false);
  const [timer,setTimer] = useState(0);
  const [size,setSize] = useState("full");
  const [muted,setMuted] = useState(ls.get("jpq_mute")==="1");
  const [endInfo,setEndInfo] = useState(null);
  const submitted = useRef(false);
  const [saved,setSaved] = useState(()=>{ try{ const s=JSON.parse(ls.get("jpq_save")||"null"); return s&&s.cats&&s.size?s:null; }catch(e){ return null; } });

  useEffect(()=>{ if(game) ls.set("jpq_save",JSON.stringify(game)); },[game]);
  /* a correct answer moves on by itself after a beat; a miss waits so you can read the right answer */
  useEffect(()=>{
    if(cur && cur.stage==="result" && cur.right){ const tm=setTimeout(()=>setCur(null),1100*TS); return ()=>clearTimeout(tm); }
  },[cur&&cur.stage,cur&&cur.key]);

  const gsize = game ? game.size : size;
  const SZ = SIZES[gsize];
  const round = game ? game.round : 0;
  const board = game ? boardFor(game.cats,round) : null;
  const vals = valuesFor(round,gsize);
  const topVal = vals[vals.length-1];
  const per = perRound(gsize);
  const total = per*ROUNDS.length;
  const playedCount = game ? Object.keys(game.played).filter(k=>k.indexOf(round+"-")===0).length : 0;
  const roundDone = !!game && !cur && playedCount>=per;
  const finished = roundDone && round===ROUNDS.length-1;
  const maxWager = game ? Math.max(game.score,topVal) : topVal;

  /* submit the finished run once: save score, update stats, show where you rank */
  useEffect(()=>{
    if(!finished || submitted.current) return;
    submitted.current = true;
    const pct = Math.round(100*game.right/total);
    (async()=>{
      const info = await rankInfo(game.score,pct,game.size);
      setEndInfo({ pct, info });
      const bestKey = game.size==="mini" ? "best_mini" : "best_score";
      const st = { ...stats, games:stats.games+1, [bestKey]:Math.max(stats[bestKey]||0,game.score), correct:stats.correct+game.right, answered:stats.answered+total };
      setStats(st); saveStats(st,name);
      if(sb) sb.from("jq_scores").insert({ uid:myId, name, score:game.score, correct:game.right, answered:total, pct, ranked:!game.nopen, timer:game.timer, hints:game.hintsUsed, size:game.size, day:today() }).then(()=>{},()=>{});
      ls.set("jpq_save",""); setSaved(null);
    })();
  },[finished]);

  function newRun(sz,np,tm){ return { round:0, score:0, played:{}, dd:placeDD(ROUNDS.length,sz), cats:pickCats(sz), size:sz, nopen:np, timer:tm, right:0, wrong:0, hintsUsed:0, run:0 }; }
  function start(){ submitted.current=false; setEndInfo(null); setGame(newRun(size,nopen,timer)); setCur(null); }
  function resume(){ submitted.current=false; setEndInfo(null); setGame(saved); setCur(null); }
  function restart(){ if(window.confirm("Start a new game? Your current score will be lost.")){ ls.set("jpq_save",""); setSaved(null); setGame(null); setCur(null); } }
  function toggleMute(){ const m=!muted; setMuted(m); ls.set("jpq_mute",m?"1":"0"); }

  function openTile(c,i){
    const key = round+"-"+c+"-"+i;
    if(game.played[key]) return;
    const isDD = game.dd.indexOf(key)>=0;
    setCur({ c, i, key, dd:isDD, stage:isDD?"wager":"clue", order:shuffle([0,1,2,3]), picked:null, wager:0, delta:0, hidden:[] });
    if(isDD) sfx("ddr");
  }
  function lockWager(pct){ setCur(cu=>({ ...cu, stage:"clue", wager:wagerFor(pct,maxWager) })); }
  function finish(slot,kind){
    /* kind: "pick" (slot chosen) or "timeout" */
    const clue = board[cur.c].clues[cur.i];
    const right = kind==="pick" && cur.order[slot]===clue.a;
    const amount = cur.dd ? cur.wager : vals[cur.i];
    const timeout = kind==="timeout";
    const delta = right ? amount : (timeout && !cur.dd) ? 0 : (game.nopen ? 0 : -amount);
    const code = right?"r":timeout?"t":"w";
    const run = right ? (game.run||0)+1 : 0;
    let cheer = "";
    if(prefs.sass) cheer = right ? (run>=3 ? run+" in a row"+(run>=5?", on fire":"") : cheerLine("right")) : (timeout ? cheerLine("late") : cheerLine("wrong"));
    setGame(g=>({ ...g, score:g.score+delta, played:{ ...g.played, [cur.key]:code }, right:g.right+(right?1:0), wrong:g.wrong+(right?0:1), run }));
    setCur({ ...cur, picked:timeout?-1:slot, stage:"result", delta, right, timeout, cheer });
    sfx(right?"r":"w");
  }
  function pick(slot){ if(cur.picked!==null) return; if(prefs.confirm) setCur({ ...cur, sel:slot }); else finish(slot,"pick"); }
  function submit(){ if(cur.picked!==null || cur.sel==null) return; finish(cur.sel,"pick"); }
  function expire(){ if(cur && cur.stage==="clue" && cur.picked===null) finish(-1,"timeout"); }
  function useHint(){
    if(stats.hints<1 || cur.hidden.length) return;
    const clue = board[cur.c].clues[cur.i];
    const wrong = shuffle([0,1,2,3].filter(i=>i!==clue.a)).slice(0,2);
    setCur({ ...cur, hidden:wrong });
    setGame(g=>({ ...g, hintsUsed:g.hintsUsed+1 }));
    const st = { ...stats, hints:stats.hints-1 }; setStats(st); saveStats(st,name);
  }
  function nextRound(){ setGame(g=>({ ...g, round:g.round+1 })); }
  function playAgain(){ submitted.current=false; setEndInfo(null); setGame(newRun(game.size,game.nopen,game.timer)); setCur(null); }

  /* ---------- start ---------- */
  if(!game) return (
    <div className="scr scroll">
      <h1 className="logo">Solo play</h1>
      <p className="sub">Two rounds, with Individual Bets hidden on the board. Pick a clue, pick your answer.</p>
      <label className="lbl">Quiz show size</label>
      <div className="two">
        {Object.keys(SIZES).map(k=>(<button key={k} className={"card"+(size===k?" on":"")} onClick={()=>setSize(k)}><b>{SIZES[k].label}</b><span>{SIZES[k].blurb}</span></button>))}
      </div>
      <label className="lbl">Wrong answers</label>
      <div className="two">
        <button className={"card"+(!nopen?" on":"")} onClick={()=>setNopen(false)}><b>Lose points</b><span>Ranked on the leaderboard</span></button>
        <button className={"card"+(nopen?" on":"")} onClick={()=>setNopen(true)}><b>No penalty</b><span>Casual, not ranked</span></button>
      </div>
      <label className="lbl">Clue timer</label>
      <div className="three">
        {[[0,"Off"],[10,"10 sec"],[20,"20 sec"]].map(x=>(<button key={x[0]} className={"card"+(timer===x[0]?" on":"")} onClick={()=>setTimer(x[0])}><b>{x[1]}</b></button>))}
      </div>
      <button className="btn gold" onClick={start}>Start new game</button>
      {saved && <button className="btn ghost" onClick={resume}>Continue saved {SIZES[saved.size].label.toLowerCase()} ({fmt(saved.score)})</button>}
      <button className="link" onClick={onMenu}>Back to menu</button>
    </div>);

  /* ---------- clue ---------- */
  if(cur){
    const cat = board[cur.c], clue = cat.clues[cur.i];
    if(cur.stage==="wager") return (
      <div className="scr">
        <Head title={ROUNDS[round].name} meta={cat.name} score={game.score} />
        <div className="clue flash"><DDPicker maxWager={maxWager} lockLabel="Lock in bet and show clue" onLock={lockWager} /></div>
      </div>);
    return (
      <div className="scr">
        <Head title={ROUNDS[round].name} meta={cat.name} score={game.score} />
        <div className="clue">
          <div className="cchead"><span className="cc">{cat.name}</span><span className="cv">{cur.dd?"BET "+fmt(cur.wager):fmt(vals[cur.i])}</span></div>
          {game.timer>0 && cur.stage==="clue" && <Countdown secs={game.timer} k={cur.key} onExpire={expire} />}
          <ClueText text={clue.q} />
          <Options clue={clue} order={cur.order} picked={cur.picked} hidden={cur.hidden} onPick={pick} selected={cur.sel} showAnswer={cur.stage==="result"} />
          {cur.stage==="clue" && ((stats.hints>0 && !cur.hidden.length) || prefs.confirm) && (
            <div className="rrow">
              {stats.hints>0 && !cur.hidden.length ? <button className="btn ghost sm" onClick={useHint}>50/50 ({stats.hints} left)</button> : <span></span>}
              {prefs.confirm && <button className="btn gold" style={{flex:1,marginTop:0}} disabled={cur.sel==null} onClick={submit}>Submit answer</button>}
            </div>)}
          {cur.stage==="result" && (
            <div className="rrow">
              <div>
                <div className={"res "+(cur.right?"r":"w")}>{cur.right?"Correct +"+fmt(cur.delta):(cur.timeout?"Time's up":"Wrong")+(cur.delta<0?" -"+fmt(-cur.delta):"")}</div>
                <div className="rn">{cur.cheer||""}</div>
              </div>
              <button className="btn gold sm" onClick={()=>setCur(null)}>Continue</button>
            </div>)}
        </div>
      </div>);
  }

  /* ---------- round complete / final ---------- */
  if(roundDone){
    const done = game.right+game.wrong;
    if(!finished) return (
      <div className="scr scroll">
        <h1 className="logo">{ROUNDS[round].name} complete</h1>
        <div className="stats">Score: <b>{fmt(game.score)}</b><br/>Correct so far: <b>{game.right} of {done}</b></div>
        <p className="sub" style={{marginTop:10}}>Next up: {ROUNDS[round+1].name}. Every clue is worth double, and {DD_COUNT[round+1]} Individual Bets are hiding.</p>
        <button className="btn gold" onClick={nextRound}>Start {ROUNDS[round+1].name}</button>
      </div>);
    const pct = Math.round(100*game.right/total);
    const msg = game.right===total?"FLAWLESS! Every answer right!":pct>=90?"Quiz champion!":pct>=70?"Very sharp!":pct>=50?"Nicely done!":"Good game. Play again and beat it!";
    const info = endInfo && endInfo.info;
    return (
      <div className="scr scroll">
        <h1 className="logo">Final score</h1>
        <div className="big" style={{fontSize:56,color:game.score<0?"var(--bad)":"var(--gold)"}}>{fmt(game.score)}</div>
        <div className="note" style={{fontSize:18,margin:"4px 0 8px"}}>{msg}</div>
        <div className="stats">{SIZES[game.size].label}<br/>Correct: <b>{game.right}</b> of {total} (<b>{pct}%</b>)<br/>Streak: <b>{stats.streak} {stats.streak===1?"day":"days"}</b>{game.nopen && <span><br/>No-penalty run: not ranked.</span>}
          {!game.nopen && info && info.total>0 && <span><br/>Your score beats <b>{info.beatScore}%</b> of ranked {game.size} runs.<br/>Your accuracy beats <b>{info.beatPct}%</b> of ranked {game.size} runs.</span>}
          {!game.nopen && info && info.total===0 && <span><br/>You set the first ranked {game.size} run!</span>}
        </div>
        <button className="btn gold" onClick={playAgain}>Play again</button>
        <button className="btn ghost" onClick={onLeaders}>Leaderboard</button>
        <button className="link" onClick={onMenu}>Back to menu</button>
      </div>);
  }

  /* ---------- board ---------- */
  return (
    <div className="scr">
      <Head title={ROUNDS[round].name} meta={playedCount+" of "+per+" played"+(game.timer?" | "+game.timer+"s timer":"")} score={game.score} />
      <BoardView board={board} vals={vals} round={round} played={game.played} onTile={openTile} cols={SZ.cols} rows={SZ.rows} />
      <div className="foot">
        <span className="hint">{DD_COUNT[round]===1?"1 Individual Bet":DD_COUNT[round]+" Individual Bets"} hiding</span>
        <span>
          <button className="link" onClick={toggleMute}>{muted?"Sound off":"Sound on"}</button>
          <button className="link" onClick={onMenu}>Menu</button>
          <button className="link" onClick={restart}>New game</button>
        </span>
      </div>
    </div>);
}

/* ================= MULTIPLAYER ================= */
function fxFor(S,uid){
  const r = {};
  ((S&&S.fx)||[]).filter(f=>f.target===uid).forEach(f=>{ if(f.kind==="fog") r.fog=true; if(f.kind==="flip") r.flip=true; if(f.kind==="rev") r.rev=true; if(f.kind==="scr") r.scr=String(f.id); });
  return r;
}

function Versus({ prefs, name, setName, entry, joinCode, onMenu }){
  const [code,setCode] = useState("");
  const [room,setRoom] = useState(null);
  const [players,setPlayers] = useState([]);
  const [codeInput,setCodeInput] = useState(joinCode||"");
  const [err,setErr] = useState("");
  const [sent,setSent] = useState(false);
  const [selSlot,setSelSlot] = useState(null);
  const [botNote,setBotNote] = useState("");
  const [toast,setToast] = useState("");
  const codeRef = useRef(""); const playersRef = useRef([]); const hostRef = useRef(false);
  const eng = useRef({ S:null, P:{}, lastId:0, timers:[], fxTimers:[], buzzes:[], busy:false, botMem:{} });
  const seenToast = useRef(0);
  codeRef.current = code; playersRef.current = players;

  const S = room && room.state || null;
  const isHost = !!room && room.host_id===myId;
  hostRef.current = isHost;
  const nameOf = (id) => { const p = playersRef.current.find(x=>x.id===id); return p?p.name:"Player"; };

  /* ---- hub hand-off (same pattern as the other hub games) ---- */
  useEffect(()=>{
    if(!entry || !sb || !(name||"").trim()) return;
    (async()=>{ try{
      if(entry.role==="host"){ await createRoom(entry.code); return; }
      const ok = await window.HUB.waitRoom("jq_rooms",entry.code,20000);
      if(ok) await joinRoom(entry.code); else await createRoom(entry.code);
    }catch(e){} })();
  },[]);

  /* ---- sync ---- */
  async function refetch(c){
    const r = await sb.from("jq_rooms").select("*").eq("code",c).maybeSingle();
    if(r.data && !hostRef.current) setRoom(r.data);
    const ps = await sb.from("jq_players").select("*").eq("code",c).order("joined_at");
    if(ps.data){
      setPlayers(ps.data.map(x=> (hostRef.current && eng.current.P[x.id]) ? { ...x, score:eng.current.P[x.id].score, items:{ b:eng.current.P[x.id].b, lvl:eng.current.P[x.id].lvl, xp:eng.current.P[x.id].xp } } : x));
    }
  }
  useEffect(()=>{
    if(!code) return;
    refetch(code);
    let ch = null;
    try{
      ch = sb.channel("jq:"+code)
        .on("postgres_changes",{event:"*",schema:"public",table:"jq_rooms",filter:"code=eq."+code},()=>refetch(code))
        .on("postgres_changes",{event:"*",schema:"public",table:"jq_players",filter:"code=eq."+code},()=>refetch(code))
        .on("postgres_changes",{event:"INSERT",schema:"public",table:"jq_actions",filter:"code=eq."+code},()=>{ if(hostRef.current) pollActions(); })
        .subscribe();
    }catch(e){}
    const p1 = setInterval(()=>refetch(code),800*TS);
    const p2 = setInterval(()=>{ if(hostRef.current) pollActions(); },400*TS);
    return ()=>{ try{ if(ch) sb.removeChannel(ch); }catch(e){} clearInterval(p1); clearInterval(p2); clearTimers(); };
  },[code]);

  /* a new phase means my "sent" flag resets; also show item toasts */
  useEffect(()=>{ setSent(false); setSelSlot(null); },[S&&S.seq]);
  const newestToast = (()=>{ const l=((S&&S.toasts)||[]).filter(x=>!x.to||x.to===myId); return l.length?l[l.length-1]:null; })();
  useEffect(()=>{
    if(newestToast && newestToast.id>seenToast.current){ seenToast.current=newestToast.id; setToast(newestToast.text); const tm=setTimeout(()=>setToast(""),3200); return ()=>clearTimeout(tm); }
  },[newestToast&&newestToast.id]);
  useEffect(()=>{ if(!botNote) return; const tm=setTimeout(()=>setBotNote(""),2500); return ()=>clearTimeout(tm); },[botNote]);

  /* ---- create / join ---- */
  async function createRoom(forced){
    setErr(""); if(!name.trim()){ setErr("Enter your name first."); return; }
    if(!sb){ setErr("Can't reach the server."); return; }
    const c = (typeof forced==="string"&&forced) ? forced : randCode();
    if(typeof forced==="string"&&forced) await sb.from("jq_rooms").delete().eq("code",c);
    const state = { phase:"lobby", seq:0, settings:{ chaos:false, pace:"normal", nopen:false, rounds:2, size:"full" } };
    const r = await sb.from("jq_rooms").insert({ code:c, host_id:myId, state });
    if(r.error){ setErr("Couldn't create room: "+r.error.message); return; }
    await sb.from("jq_players").delete().eq("id",myId);
    await sb.from("jq_players").insert({ id:myId, code:c, name:name.trim(), color:COLORS[0], score:0, items:[] });
    eng.current.S = state;
    setRoom({ code:c, host_id:myId, state });
    setCode(c);
  }
  async function joinRoom(cArg){
    setErr("");
    const c = ((typeof cArg==="string"&&cArg)||codeInput).trim().toUpperCase();
    if(!name.trim()){ setErr("Enter your name first."); return; }
    if(!c){ setErr("Enter a room code."); return; }
    if(!sb){ setErr("Can't reach the server."); return; }
    const r = await sb.from("jq_rooms").select("*").eq("code",c).maybeSingle();
    if(!r.data){ setErr("No room "+c+". Check the code."); return; }
    const st = r.data.state||{};
    const ps = await sb.from("jq_players").select("id").eq("code",c);
    const mine = (ps.data||[]).some(p=>p.id===myId);
    if(st.phase && st.phase!=="lobby" && !mine){ setErr("That game already started."); return; }
    const n = (ps.data||[]).filter(p=>p.id!==myId).length;
    if(!mine){
      await sb.from("jq_players").delete().eq("id",myId);
      const ins = await sb.from("jq_players").insert({ id:myId, code:c, name:name.trim(), color:COLORS[n%COLORS.length], score:0, items:[] });
      if(ins.error){ setErr("Couldn't join: "+ins.error.message); return; }
    }
    setRoom(r.data);
    setCode(c);
  }
  function leave(){
    if(code && sb){ sb.from("jq_players").delete().eq("id",myId).then(()=>{},()=>{}); }
    if(hostRef.current && eng.current.S && eng.current.S.bots) Object.keys(eng.current.S.bots).forEach(id=>sb.from("jq_players").delete().eq("id",id).then(()=>{},()=>{}));
    clearTimers(); eng.current = { S:null, P:{}, lastId:0, timers:[], fxTimers:[], buzzes:[], busy:false, botMem:{} };
    setCode(""); setRoom(null); setPlayers([]);
  }

  /* ---- send an action to the host ---- */
  function act(kind,payload){
    if(!S) return;
    sb.from("jq_actions").insert({ code:codeRef.current, uid:myId, kind, payload:{ ...(payload||{}), seq:S.seq } }).then(()=>{},()=>{});
  }

  /* ================= HOST ENGINE (only the host runs this) ================= */
  function E(){ return eng.current; }
  function clearTimers(){ const e=eng.current; e.timers.forEach(clearTimeout); e.timers=[]; }
  function paceOf(){ return PACE[E().S.settings.pace] || PACE.normal; }
  function writeState(){
    const e=E();
    sb.from("jq_rooms").update({ state:e.S }).eq("code",codeRef.current).then(()=>{},()=>{});
    setRoom(r=>r?{ ...r, state:e.S }:r);
  }
  function writePlayer(id){
    const p=E().P[id]; if(!p) return;
    const items={ b:p.b, lvl:p.lvl, xp:p.xp };
    sb.from("jq_players").update({ score:p.score, items }).eq("id",id).then(()=>{},()=>{});
    setPlayers(ps=>ps.map(x=>x.id===id?{ ...x, score:p.score, items }:x));
  }
  function go(patch){
    const e=E(); clearTimers(); e.buzzes=[];
    e.S = { ...e.S, ...patch, seq:(e.S.seq||0)+1, ts:Date.now() };
    writeState(); arm();
  }
  function touch(patch){ const e=E(); e.S={ ...e.S, ...patch }; writeState(); }
  function arm(){
    const e=E(), S=e.S, seq=S.seq, pace=paceOf();
    const set=(ms,fn)=>{ e.timers.push(setTimeout(()=>{ if(E().S.seq===seq) fn(); },ms*TS)); };
    if(S.phase==="pick") set(30000,autoPick);
    else if(S.phase==="dd") set(25000,()=>lockDD(5));
    else if(S.phase==="buzz") set(pace.buzz*1000,()=>reveal(false,"Time's up - nobody rang in"));
    else if(S.phase==="answer") set(pace.ans*1000,()=>resolveAnswer(-1));
    else if(S.phase==="reveal") set(S.played[S.clue.key]==="r"?1800:3000,afterReveal);
    else if(S.phase==="roundend") set(7000,nextRoundMP);
    botPlan();
  }
  const boardOf = (S) => boardFor(S.cats,S.round);
  const valuesOf = (S) => valuesFor(S.round,S.size);

  function startGame(){
    const e=E(), ps=playersRef.current; if(!ps.length) return;
    const st=e.S.settings;
    e.P={}; ps.forEach(p=>{ e.P[p.id]={ score:0, b:[], lvl:1, xp:0 }; });
    sb.from("jq_players").update({ score:0, items:RESET_ITEMS() }).eq("code",codeRef.current).then(()=>{},()=>{});
    setPlayers(list=>list.map(p=>({ ...p, score:0, items:RESET_ITEMS() })));
    const size=st.size||"full";
    go({ phase:"pick", round:0, picker:ps[rand(ps.length)].id, played:{}, size, cats:pickCats(size), dd:placeDD(st.rounds,size), clue:null, fx:[], toasts:[], msg:"", dur:30 });
  }
  /* ---- bots: the host's phone plays for them using the same actions a human sends ---- */
  async function addBot(skill){
    if(!hostRef.current || !BOT_SKILL[skill]) return;
    const ps=playersRef.current; if(ps.length>=MAX_PLAYERS) return;
    const id="bot_"+Math.random().toString(36).slice(2,8);
    const used=ps.map(p=>p.name);
    const free=BOT_NAMES.filter(n=>used.indexOf(n)<0);
    const nm=(free.length?free[rand(free.length)]:"Bot "+(ps.length+1));
    const color=COLORS[ps.length%COLORS.length];
    const row={ id, code:codeRef.current, name:nm, color, score:0, items:RESET_ITEMS() };
    const e=E(); e.S={ ...e.S, bots:{ ...(e.S.bots||{}), [id]:{ skill } } };
    playersRef.current=[...ps,row];                      /* shows up (and counts) right away, before the server answers */
    setPlayers(list=>list.some(p=>p.id===id)?list:[...list,row]);
    setBotNote("Added "+nm+" ("+BOT_SKILL[skill].label+")");
    writeState();
    const r=await sb.from("jq_players").insert(row);
    if(r && r.error){ removeBot(id); setBotNote("Could not add a bot: "+r.error.message); }
  }
  function removeBot(id){
    if(!hostRef.current || !isBotId(id)) return;
    const e=E(); const bots={ ...(e.S.bots||{}) }; delete bots[id]; e.S={ ...e.S, bots };
    const gone=playersRef.current.find(p=>p.id===id);
    sb.from("jq_players").delete().eq("id",id).then(()=>{},()=>{});
    playersRef.current=playersRef.current.filter(p=>p.id!==id);
    setPlayers(list=>list.filter(p=>p.id!==id));
    if(gone) setBotNote("Removed "+gone.name);
    writeState();
  }
  function botSkill(id){ const b=(E().S.bots||{})[id]; return BOT_SKILL[(b&&b.skill)||"medium"]; }
  function botMind(id,clue){
    const e=E(), k=clue.key+"|"+id;
    if(!e.botMem[k]){ const knows=Math.random()<Math.max(0.15,botSkill(id).know-clue.i*0.06); e.botMem[k]={ knows, guess:!knows&&Math.random()<0.2 }; }
    return e.botMem[k];
  }
  function botPlan(){
    const e=E(), S=e.S, seq=S.seq;
    const bots=playersRef.current.filter(p=>isBotId(p.id)).map(p=>p.id);
    if(!bots.length) return;
    const later=(ms,fn)=>{ e.timers.push(setTimeout(()=>{ if(E().S.seq===seq) fn(); },ms*TS)); };
    const send=(uid,kind,payload)=>{ sb.from("jq_actions").insert({ code:codeRef.current, uid, kind, payload:{ ...payload, seq } }).then(()=>{},()=>{}); };
    if(S.phase==="pick" && isBotId(S.picker)){
      later(1400+rand(1800),()=>{
        const left=[];
        for(let c=0;c<SIZES[S.size].cols;c++) for(let i=0;i<SIZES[S.size].rows;i++) if(!S.played[S.round+"-"+c+"-"+i]) left.push([c,i]);
        if(left.length){ const t=left[rand(left.length)]; send(S.picker,"pick",{ c:t[0], i:t[1] }); }
      });
    } else if(S.phase==="dd" && isBotId(S.picker)){
      later(1800+rand(1500),()=>send(S.picker,"wager",{ pct:3+rand(5) }));
    } else if(S.phase==="buzz" && S.clue){
      bots.forEach(id=>{
        if(S.clue.locked.indexOf(id)>=0) return;
        const m=botMind(id,S.clue), r=botSkill(id).rt;
        if(m.knows ? Math.random()<0.95 : m.guess) later(r[0]+rand(r[1])+S.clue.i*150,()=>send(id,"buzz",{}));
      });
    } else if(S.phase==="answer" && S.clue && isBotId(S.clue.buzzer)){
      const id=S.clue.buzzer;
      later(1500+rand(2500),()=>{
        const cur=E().S, q=boardOf(cur)[cur.clue.c].clues[cur.clue.i];
        const m=botMind(id,cur.clue);
        const right=m.knows || Math.random()<0.25;
        const good=cur.clue.order.indexOf(q.a);
        const others=[0,1,2,3].filter(x=>x!==good);
        send(id,"answer",{ slot: right ? good : others[rand(3)] });
      });
    }
    if(S.settings.chaos && (S.phase==="buzz" || S.phase==="answer")){
      bots.forEach(id=>{
        const p=e.P[id];
        if(p && p.b.length && Math.random()<0.5) later(1200+rand(2500),()=>{ const pi=E().P[id]; if(pi && pi.b.length) send(id,"item",{ kind:pi.b[0] }); });
      });
    }
  }
  function setSetting(k,v){ const e=E(); e.S={ ...e.S, settings:{ ...e.S.settings, [k]:v } }; writeState(); }
  function backToLobby(){
    const e=E(); clearTimers();
    e.P={}; sb.from("jq_players").update({ score:0, items:RESET_ITEMS() }).eq("code",codeRef.current).then(()=>{},()=>{});
    setPlayers(list=>list.map(p=>({ ...p, score:0, items:RESET_ITEMS() })));
    e.S={ phase:"lobby", seq:(e.S.seq||0)+1, settings:e.S.settings, bots:e.S.bots }; writeState();
  }
  function doPick(uid,c,i){
    const e=E(), S=e.S;
    if(S.phase!=="pick" || uid!==S.picker) return;
    const key=S.round+"-"+c+"-"+i;
    if(S.played[key]) return;
    const isDD=S.dd.indexOf(key)>=0;
    const clue={ key, c, i, dd:isDD, order:shuffle([0,1,2,3]), locked:[], buzzer:null, wager:0 };
    if(isDD) go({ phase:"dd", clue, dur:25, msg:"" });
    else go({ phase:"buzz", clue, dur:paceOf().buzz, msg:"" });
  }
  function autoPick(){
    const S=E().S; const vals=[]; 
    for(let c=0;c<SIZES[S.size].cols;c++) for(let i=0;i<SIZES[S.size].rows;i++) if(!S.played[S.round+"-"+c+"-"+i]) vals.push([c,i]);
    if(!vals.length) return;
    const t=vals[rand(vals.length)]; doPick(S.picker,t[0],t[1]);
  }
  function lockDD(pct){
    const e=E(), S=e.S; if(S.phase!=="dd") return;
    const uid=S.picker, vv=valuesOf(S), top=vv[vv.length-1];
    const maxW=Math.max(e.P[uid]?e.P[uid].score:0,top);
    go({ phase:"answer", clue:{ ...S.clue, wager:wagerFor(pct,maxW), buzzer:uid }, dur:paceOf().ans });
  }
  function resolveBuzz(seq){
    const e=E(); if(e.S.seq!==seq || e.S.phase!=="buzz" || !e.buzzes.length) return;
    const list=[...e.buzzes].sort((a,b)=> a.t<b.t?-1:a.t>b.t?1:a.id-b.id);
    go({ phase:"answer", clue:{ ...e.S.clue, buzzer:list[0].uid }, dur:paceOf().ans });
  }
  const newId = () => { const e=E(); e.tid=(e.tid||0)+1; return Date.now()*1000+(e.tid%1000); };
  function pushToast(text,to){
    const e=E(); const list=[...(e.S.toasts||[]), { id:newId(), text, ...(to?{ to }:{}) }].slice(-8);
    e.S={ ...e.S, toasts:list };
  }
  /* level up: +1 level and a random bomb (you can hold up to 3) */
  function levelUp(uid){
    const e=E(), p=e.P[uid]; if(!p) return;
    p.lvl+=1; p.xp=0;
    let got="";
    if(p.b.length<MAX_BOMBS){ const k=ITEM_KEYS[rand(ITEM_KEYS.length)]; p.b=[...p.b,k]; got=" - new bomb: "+ITEMS[k].n; }
    pushToast("Level up! You are level "+p.lvl+got,uid);
  }
  function resolveAnswer(slot){
    const e=E(), S=e.S; if(S.phase!=="answer") return;
    const clue=S.clue, uid=clue.buzzer, q=boardOf(S)[clue.c].clues[clue.i];
    const idx = slot>=0 ? clue.order[slot] : -1;
    const right = idx===q.a;
    const amount = clue.dd ? clue.wager : valuesOf(S)[clue.i];
    const pl=e.P[uid]; if(!pl) return;
    const delta = right ? amount : (S.settings.nopen ? 0 : -amount);
    pl.score += delta;
    const nm=nameOf(uid), chaos=!!S.settings.chaos;
    if(right){
      /* chaos: when somebody else scores, everyone else gets closer to a level up (2 scores = 1 level) */
      if(chaos) playersRef.current.forEach(p=>{ const o=e.P[p.id]; if(p.id===uid || !o) return; o.xp+=1; if(o.xp>=2) levelUp(p.id); writePlayer(p.id); });
      writePlayer(uid);
      reveal(true,nm+" correct +"+fmt(amount),uid);
      return;
    }
    if(chaos) levelUp(uid);                               /* a miss is an instant level up too */
    writePlayer(uid);
    const locked=[...clue.locked,uid];
    const what = slot<0 ? nm+" ran out of time" : nm+" wrong";
    const loss = delta<0 ? " -"+fmt(amount) : "";
    const lvl = chaos ? ", level up" : "";
    const ids=playersRef.current.map(p=>p.id);
    if(!clue.dd && ids.some(id=>locked.indexOf(id)<0)){
      go({ phase:"buzz", clue:{ ...clue, locked, buzzer:null }, dur:paceOf().buzz, msg:what+loss+lvl+" - anyone else?" });
    } else {
      reveal(false,what+loss+lvl+(clue.dd?"":" - nobody got it"),null,locked);
    }
  }
  function reveal(right,msg,winner,lockedList){
    const e=E(), S=e.S; if(!S.clue) return;
    const played={ ...S.played, [S.clue.key]: right?"r":"x" };
    let picker=S.picker;
    if(right && winner) picker=winner;
    go({ phase:"reveal", played, picker, fx:[], msg, dur:0, winner:winner||null, clue:{ ...S.clue, locked:lockedList||S.clue.locked } });
  }
  function afterReveal(){
    const e=E(), S=e.S;
    const done=Object.keys(S.played).filter(k=>k.indexOf(S.round+"-")===0).length>=perRound(S.size);
    if(!done){ go({ phase:"pick", clue:null, msg:"", dur:30 }); return; }
    if(S.round < S.settings.rounds-1) go({ phase:"roundend", clue:null, dur:0 });
    else go({ phase:"end", clue:null, dur:0 });
  }
  function nextRoundMP(){
    const e=E(), S=e.S; if(S.phase!=="roundend") return;
    const ids=playersRef.current.map(p=>p.id);
    let low=ids[0]; ids.forEach(id=>{ if((e.P[id]?e.P[id].score:0)<(e.P[low]?e.P[low].score:0)) low=id; });
    go({ phase:"pick", round:S.round+1, picker:low, clue:null, msg:"", dur:30 });
  }
  function useItem(a){
    const e=E(), S=e.S;
    if((S.phase!=="buzz" && S.phase!=="answer") || !S.clue) return;
    const kind=(a.payload||{}).kind, pl=e.P[a.uid];
    if(!pl || !ITEMS[kind] || pl.b.indexOf(kind)<0) return;
    const ids=playersRef.current.map(p=>p.id).filter(id=>id!==a.uid);
    if(!ids.length) return;
    let target=ids[0]; ids.forEach(id=>{ if((e.P[id]?e.P[id].score:0)>(e.P[target]?e.P[target].score:0)) target=id; });
    const at=pl.b.indexOf(kind); pl.b=pl.b.filter((_,i)=>i!==at);
    if(isBotId(target)){ const k=S.clue.key+"|"+target; e.botMem[k]={ ...(e.botMem[k]||{}), knows:false }; }
    const fx={ id:Date.now()+Math.floor(Math.random()*1000), kind, target, from:a.uid };
    const fxList=[...(S.fx||[]).filter(f=>!(f.target===target&&f.kind===kind)), fx];
    pushToast(nameOf(a.uid)+" hit "+nameOf(target)+" with "+ITEMS[kind].n.toUpperCase()+"!");
    touch({ fx:fxList });
    writePlayer(a.uid);
    e.fxTimers.push(setTimeout(()=>{ const cur=E().S; if(cur && (cur.fx||[]).some(f=>f.id===fx.id)) touch({ fx:cur.fx.filter(f=>f.id!==fx.id) }); }, ITEMS[kind].ms*Math.min(2,1+0.15*(pl.lvl-1))*TS));
  }
  function handle(a){
    const e=E(), S=e.S; if(!S) return;
    const p=a.payload||{};
    if(a.kind==="item") return useItem(a);
    if(p.seq!==S.seq) return;
    if(a.kind==="pick") doPick(a.uid,p.c,p.i);
    else if(a.kind==="wager"){ if(S.phase==="dd" && a.uid===S.picker) lockDD(p.pct); }
    else if(a.kind==="buzz"){
      if(S.phase!=="buzz" || !S.clue || S.clue.locked.indexOf(a.uid)>=0) return;
      if(e.buzzes.some(b=>b.uid===a.uid)) return;
      e.buzzes.push({ uid:a.uid, t:a.created_at||"", id:a.id });
      if(e.buzzes.length===1){ const seq=S.seq; e.timers.push(setTimeout(()=>resolveBuzz(seq),300*TS)); }
    }
    else if(a.kind==="answer"){ if(S.phase==="answer" && S.clue && a.uid===S.clue.buzzer) resolveAnswer(p.slot); }
  }
  async function pollActions(){
    const e=E(); if(e.busy || !codeRef.current || !e.S) return;
    e.busy=true;
    try{
      const r=await sb.from("jq_actions").select("*").eq("code",codeRef.current).gt("id",e.lastId).order("id",{ ascending:true });
      (r.data||[]).forEach(a=>{ e.lastId=Math.max(e.lastId,a.id); handle(a); });
    }catch(err2){}
    e.busy=false;
  }

  /* ================= screens ================= */
  function Chips(){
    const ids = S && S.clue ? S.clue : null;
    const sorted = [...players];
    return (
      <div className="chips">
        {sorted.map(p=>{
          const cls = "chip"+(S&&S.phase==="pick"&&S.picker===p.id?" pick":"")+(ids&&S.phase==="answer"&&ids.buzzer===p.id?" ans":"")+(ids&&S.phase==="buzz"&&ids.locked&&ids.locked.indexOf(p.id)>=0?" out":"");
          return <div key={p.id} className={cls}><b><span className="dot" style={{background:p.color}}></span>{p.id===myId?"You":p.name}{isBotId(p.id)&&<span className="tag">BOT</span>}{S&&S.settings&&S.settings.chaos&&<span className="tag">Lv{invOf(p).lvl}</span>}</b><em className={(p.score||0)<0?"neg":""}>{fmt(p.score||0)}</em></div>;
        })}
      </div>);
  }
  const me = players.find(p=>p.id===myId);
  const myInv = invOf(me);
  function ItemBar(){
    if(!S || !S.settings.chaos) return null;
    const active = S.phase==="buzz" || S.phase==="answer";
    return (
      <div className="items">
        <small>Level {myInv.lvl}</small>
        {myInv.b.length===0 && <small>level up to earn bombs (miss a clue, or when others score)</small>}
        {myInv.b.map((k,i)=>(<button key={k+i} className="item" disabled={!active} onClick={()=>{ sfx("item"); act("item",{ kind:k }); }}>{ITEMS[k].n}</button>))}
        {myInv.b.length>0 && <small>hits the leader</small>}
      </div>);
  }

  if(!code) return (
    <div className="scr scroll">
      <h1 className="logo">Multiplayer</h1>
      <p className="sub">Everyone plays the same clues at the same time. Fastest finger rings in, answers, and if they miss, everyone else gets a shot. Add bots to fill the room, or to play on your own.</p>
      {!(name||"").trim() && <div><label className="lbl">Your name</label><input className="in" value={name} onChange={e=>{ setName(e.target.value); ls.set("hub_name",e.target.value); }} maxLength={20} placeholder="Name" /></div>}
      <button className="btn gold" onClick={()=>createRoom()}>Create room</button>
      <label className="lbl">Or join a friend</label>
      <div className="row">
        <input className="in" value={codeInput} onChange={e=>setCodeInput(e.target.value.toUpperCase())} maxLength={8} placeholder="Room code" autoCapitalize="characters" />
        <button className="btn sm" onClick={()=>joinRoom()}>Join</button>
      </div>
      {err && <div className="err">{err}</div>}
      <button className="link" onClick={onMenu}>Back to menu</button>
    </div>);

  if(!S) return <div className="scr"><p className="sub">Connecting to room {code}...</p><button className="link" onClick={leave}>Cancel</button></div>;

  const st = S.settings || {};

  if(S.phase==="lobby") return (
    <div className="scr scroll">
      <div className="code">{code}</div>
      <p className="note">Room code. Friends choose Multiplayer, then Join.</p>
      <div className="box"><div className="boxh">Players ({players.length})</div>
        {players.map(p=>(<div className="pr" key={p.id}><span className="dot" style={{background:p.color}}></span><span className="pn">{p.name}{p.id===myId&&<i>you</i>}{room.host_id===p.id&&<i>host</i>}{isBotId(p.id)&&<i>bot {((S.bots||{})[p.id]||{}).skill}</i>}</span>{isHost&&isBotId(p.id)&&<button className="link" onClick={()=>removeBot(p.id)}>remove</button>}</div>))}
      </div>
      {isHost && (
        <div>
          <label className="lbl">Add a bot</label>
          {players.length<MAX_PLAYERS && (
            <div className="three">
              {Object.keys(BOT_SKILL).map(k=>(<button key={k} className="card" onClick={()=>addBot(k)}><b>+ {BOT_SKILL[k].label}</b><span>{BOT_SKILL[k].note}</span></button>))}
            </div>)}
          <div className="botlist">
            {players.filter(p=>isBotId(p.id)).length===0
              ? <span className="hint">No bots yet</span>
              : players.filter(p=>isBotId(p.id)).map(p=>(<span key={p.id} className="botchip"><b>{p.name}</b>{((S.bots||{})[p.id]||{}).skill}<button onClick={()=>removeBot(p.id)} aria-label={"Remove "+p.name}>Remove</button></span>))}
          </div>
          {botNote && <div className="note" style={{color:"var(--gold)",fontWeight:700,marginTop:6}}>{botNote}</div>}
        </div>)}
      <label className="lbl">Pace {isHost?"":"(host picks)"}</label>
      <div className="three">
        {Object.keys(PACE).map(k=>(<button key={k} disabled={!isHost} className={"card"+(st.pace===k?" on":"")} onClick={()=>setSetting("pace",k)}><b>{PACE[k].label}</b><span>{PACE[k].buzz}s buzz, {PACE[k].ans}s answer</span></button>))}
      </div>
      <label className="lbl">Quiz show size</label>
      <div className="two">
        {Object.keys(SIZES).map(k=>(<button key={k} disabled={!isHost} className={"card"+((st.size||"full")===k?" on":"")} onClick={()=>setSetting("size",k)}><b>{SIZES[k].label}</b><span>{SIZES[k].cols} x {SIZES[k].rows} per round</span></button>))}
      </div>
      <label className="lbl">Length</label>
      <div className="two">
        <button disabled={!isHost} className={"card"+(st.rounds===1?" on":"")} onClick={()=>setSetting("rounds",1)}><b>One round</b><span>Quick game</span></button>
        <button disabled={!isHost} className={"card"+(st.rounds===2?" on":"")} onClick={()=>setSetting("rounds",2)}><b>Two rounds</b><span>Second round worth double</span></button>
      </div>
      <label className="lbl">Wrong answers</label>
      <div className="two">
        <button disabled={!isHost} className={"card"+(!st.nopen?" on":"")} onClick={()=>setSetting("nopen",false)}><b>Lose points</b><span>Like the real show</span></button>
        <button disabled={!isHost} className={"card"+(st.nopen?" on":"")} onClick={()=>setSetting("nopen",true)}><b>No penalty</b><span>Wrong costs nothing</span></button>
      </div>
      <label className="lbl">Chaos mode</label>
      <div className="two">
        <button disabled={!isHost} className={"card"+(!st.chaos?" on":"")} onClick={()=>setSetting("chaos",false)}><b>Off</b><span>Straight quiz</span></button>
        <button disabled={!isHost} className={"card"+(st.chaos?" on":"")} onClick={()=>setSetting("chaos",true)}><b>On</b><span>Level up for random bombs to throw at the leader</span></button>
      </div>
      {isHost ? <button className="btn gold" onClick={startGame}>Start game</button> : <p className="note" style={{marginTop:10}}>Waiting for the host to start...</p>}
      <button className="link" onClick={()=>{ leave(); }}>Leave room</button>
    </div>);

  const round = S.round||0;
  const board = S.cats ? boardFor(S.cats,round) : null;
  const vals = S.size ? valuesFor(round,S.size) : [];
  const mine = fxFor(S,myId);
  const pickerName = S.picker?nameOf(S.picker):"";

  if(S.phase==="end"){
    const ranked=[...players].sort((a,b)=>(b.score||0)-(a.score||0));
    return (
      <div className="scr scroll">
        <h1 className="logo">Final scores</h1>
        <div className="box">
          {ranked.map((p,i)=>(<div className="pr" key={p.id}><span className="rank">{i+1}</span><span className="dot" style={{background:p.color}}></span><span className="pn">{p.name}{p.id===myId&&<i>you</i>}{isBotId(p.id)&&<i>bot</i>}</span><span className={"ps"+((p.score||0)<0?" neg":"")}>{fmt(p.score||0)}</span></div>))}
        </div>
        {isHost ? <button className="btn gold" onClick={backToLobby}>Play again (back to lobby)</button> : <p className="note" style={{marginTop:10}}>Waiting for the host...</p>}
        <button className="link" onClick={()=>{ leave(); onMenu(); }}>Leave and go to menu</button>
      </div>);
  }

  if(S.phase==="roundend"){
    const ranked=[...players].sort((a,b)=>(b.score||0)-(a.score||0));
    return (
      <div className="scr scroll">
        <h1 className="logo">{ROUNDS[round].name} complete</h1>
        <div className="box">{ranked.map((p,i)=>(<div className="pr" key={p.id}><span className="rank">{i+1}</span><span className="pn">{p.name}</span><span className={"ps"+((p.score||0)<0?" neg":"")}>{fmt(p.score||0)}</span></div>))}</div>
        <p className="note" style={{marginTop:10}}>{ROUNDS[round+1]?ROUNDS[round+1].name+" starts in a moment. Last place picks first.":""}</p>
      </div>);
  }

  if(S.phase==="pick"){
    const myTurn = S.picker===myId;
    return (
      <div className="scr">
        {Chips()}
        <Head title={ROUNDS[round].name} meta={myTurn?"Your pick! Choose a clue.":pickerName+" is picking..."} />
        <BoardView board={board} vals={vals} round={round} played={S.played} onTile={(c,i)=>act("pick",{ c, i })} disabled={!myTurn} answerOf={(c,i)=>{ const cl=board[c].clues[i]; return cl.o[cl.a]; }} />
        <Countdown secs={S.dur} k={S.seq} />
      </div>);
  }

  if(S.phase==="dd"){
    const myTurn = S.picker===myId;
    const cat = board[S.clue.c];
    return (
      <div className="scr">
        {Chips()}
        <div className="clue flash">
          {myTurn
            ? <DDPicker maxWager={Math.max(me?me.score||0:0,vals[vals.length-1])} lockLabel="Lock in bet" onLock={(pct)=>act("wager",{ pct })} />
            : <div className="mid"><div className="ddsplash">INDIVIDUAL BET!</div><div className="note">{pickerName} found an Individual Bet in {cat.name} and is placing a bet...</div></div>}
        </div>
      </div>);
  }

  /* buzz / answer / reveal share the clue card */
  const clue = board[S.clue.c].clues[S.clue.i];
  const cat = board[S.clue.c];
  const isBuzzer = S.clue.buzzer===myId;
  const lockedOut = S.clue.locked.indexOf(myId)>=0;
  const label = S.clue.dd ? "BET "+fmt(S.clue.wager) : fmt(vals[S.clue.i]);
  const buzzerName = S.clue.buzzer?nameOf(S.clue.buzzer):"";
  const myCheer = (prefs.sass && S.phase==="reveal") ? (S.winner===myId ? cheerSeeded("right",S.seq) : (S.clue.locked.indexOf(myId)>=0 ? cheerSeeded("wrong",S.seq) : "")) : "";
  return (
    <div className="scr">
      {Chips()}
      {S.phase==="buzz" && S.msg && <div className="note" style={{fontWeight:700,color:"var(--gold)"}}>{S.msg}</div>}
      <div className="clue">
        {mine.fog && <div className="fog"></div>}
        <div className="cchead"><span className="cc">{cat.name}</span><span className="cv">{label}</span></div>
        {S.phase!=="reveal" && S.dur>0 && <Countdown secs={S.dur} k={S.seq} />}
        <ClueText text={clue.q} fx={mine} />
        {S.phase==="answer" && isBuzzer && (
          <Options clue={clue} order={S.clue.order} picked={null} fx={mine} locked={sent} selected={selSlot} onPick={(slot)=>{ if(prefs.confirm){ if(!sent) setSelSlot(slot); } else { setSent(true); act("answer",{ slot }); } }} />)}
        {S.phase==="answer" && isBuzzer && prefs.confirm && (
          <button className="btn gold" style={{marginTop:0,flex:"none"}} disabled={selSlot===null||sent} onClick={()=>{ setSent(true); act("answer",{ slot:selSlot }); }}>Submit answer</button>)}
        {S.phase==="answer" && !isBuzzer && <div className="note" style={{fontWeight:700}}>{buzzerName} is answering...</div>}
        {S.phase==="buzz" && <div className="note">Ring in to see the choices!</div>}
        {S.phase==="reveal" && (
          <div>
            <Options clue={clue} order={S.clue.order} picked={null} showAnswer={true} onPick={()=>{}} />
            <div className="rn" style={{marginTop:6,textAlign:"center",fontWeight:700,color:"#fff"}}>{S.msg}</div>
            {myCheer && <div className="rn" style={{textAlign:"center",color:"var(--gold)",fontWeight:700}}>{myCheer}</div>}
          </div>)}
      </div>
      {S.phase==="buzz" && !S.clue.dd && (
        <button className={"buzz"+(lockedOut?" wrongb":"")} disabled={sent||lockedOut} onClick={()=>{ setSent(true); sfx("buzz"); act("buzz",{}); }}>{lockedOut?"WRONG: waiting on others":sent?"BUZZED":"BUZZ"}</button>)}
      {ItemBar()}
      {toast && <div className="toast">{toast}</div>}
    </div>);
}

/* ================= APP ================= */
function App(){
  const [mode,setMode] = useState("home");   /* home | solo | mp | leaders */
  const [name,setName] = useState(ls.get("hub_name")||"");
  const [stats,setStats] = useState(loadLocalStats());
  const [bonus,setBonus] = useState(null);
  const [entry,setEntry] = useState(null);
  const [prefs,setPrefs] = useState(loadPrefs());
  useEffect(()=>{ const sc=FS_SCALE[prefs.fs]||FS_SCALE.l, r=document.documentElement.style; r.setProperty("--s",sc[0]); r.setProperty("--st",sc[1]); },[prefs.fs]);
  const q = new URLSearchParams(location.search);
  const joinCode = (q.get("join")||"").toUpperCase();
  const fromHub = !!q.get("lobby");

  useEffect(()=>{ loadStats(ls.get("hub_name")||"").then(r=>{ setStats(r.st); setBonus(r.bonus); }); if(joinCode) setMode("mp"); },[]);
  /* hub top bar (when present) takes space: keep the app inside what is left */
  useEffect(()=>{
    const iv = setInterval(()=>{ const sp=document.querySelector(".hb-sp"); document.documentElement.style.setProperty("--hb",(sp?sp.offsetHeight:0)+"px"); },400);
    return ()=>clearInterval(iv);
  },[]);
  useEffect(()=>{
    if(!fromHub) return;
    let n=0; const iv=setInterval(()=>{
      n++;
      if(window.HUB && window.HUB.entry){ clearInterval(iv); const E=window.HUB.entry(); if(E){ setEntry(E); setMode("mp"); } }
      else if(n>60) clearInterval(iv);
    },100);
    return ()=>clearInterval(iv);
  },[]);

  if(mode==="settings") return <Settings prefs={prefs} setPrefs={setPrefs} onBack={()=>setMode("home")} />;
  if(mode==="solo") return <Solo prefs={prefs} name={name} stats={stats} setStats={setStats} onMenu={()=>setMode("home")} onLeaders={()=>setMode("leaders")} />;
  if(mode==="leaders") return <Leaders stats={stats} onBack={()=>setMode("home")} />;
  if(mode==="mp") return <Versus prefs={prefs} name={name} setName={setName} entry={entry} joinCode={joinCode} onMenu={()=>setMode("home")} />;
  return <Home name={name} setName={setName} stats={stats} bonus={bonus} go={setMode} />;
}

ReactDOM.createRoot(document.getElementById("root")).render(<App/>);
</script>
</body>
</html>
