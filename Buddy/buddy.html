<style>
  :root{
    box-sizing:border-box;
    padding-top: env(safe-area-inset-top, 0px);
    padding-bottom: env(safe-area-inset-bottom, 0px);
    --bg: #dcefe9;
    --bg2: #cfe8df;
    --dot: rgba(27,42,46,.06);
    --ink: #1b2a2e;
    --ink-soft:#4a5f62;
    --paper:#ffffff;
    --accent:#ffd23f;      /* highlighter yellow */
    --accent-ink:#5a4300;
    --coral:#ff7a59;       /* pop */
    --line:#1b2a2e;
    --chip:#ffffff;
    --chip-border: rgba(27,42,46,.22);
    --shadow: rgba(27,42,46,.28);
  }
  *{box-sizing:inherit}
  html,body{height:100%}
  @media (prefers-color-scheme: dark){
    :root:not([data-theme="light"]){
      --bg:#171f21; --bg2:#101617; --dot: rgba(255,255,255,.045);
      --ink:#eef4f2; --ink-soft:#9db1b3; --paper:#232d2f;
      --accent:#ffd23f; --accent-ink:#3a2b00; --coral:#ff8a6b;
      --line:#0c1112; --chip:#2b3639; --chip-border: rgba(255,255,255,.16);
      --shadow: rgba(0,0,0,.5);
    }
  }
  :root[data-theme="dark"]{
    --bg:#171f21; --bg2:#101617; --dot: rgba(255,255,255,.045);
    --ink:#eef4f2; --ink-soft:#9db1b3; --paper:#232d2f;
    --accent:#ffd23f; --accent-ink:#3a2b00; --coral:#ff8a6b;
    --line:#0c1112; --chip:#2b3639; --chip-border: rgba(255,255,255,.16);
    --shadow: rgba(0,0,0,.5);
  }
  body{
    margin:0;
    font-family:"Fredoka", system-ui, -apple-system, Segoe UI, Roboto, sans-serif;
    color:var(--ink);
    background:
      radial-gradient(var(--dot) 1.4px, transparent 1.4px) 0 0 / 20px 20px,
      linear-gradient(160deg, var(--bg), var(--bg2));
    -webkit-font-smoothing:antialiased;
  }
  #root{height:100%}
  .app{
    height:100%;
    display:flex; flex-direction:column;
    max-width:640px; margin:0 auto;
    padding: 10px 14px 14px;
  }

  /* header */
  .topbar{display:flex; align-items:center; gap:10px; padding: 4px 2px 8px;}
  .avatar-dot{
    width:38px;height:38px;border-radius:50%;
    background:var(--accent); border:2.5px solid var(--line);
    display:grid;place-items:center; font-size:20px; flex:none;
    box-shadow:3px 3px 0 var(--shadow);
  }
  .who{display:flex;flex-direction:column;line-height:1;}
  .who h1{margin:0;font-size:20px;font-weight:700;letter-spacing:.2px;}
  .who .status{font-size:12px;color:var(--ink-soft);font-weight:500;margin-top:3px;}
  .who .status b{color:var(--coral);}
  .vbadge{
    margin-left:auto; font-size:11px; font-weight:600;
    color:var(--ink-soft); border:1.5px solid var(--chip-border);
    border-radius:999px; padding:3px 8px; background:var(--chip);
  }

  /* stage */
  .stage{
    position:relative; flex:1 1 auto; min-height:0;
    display:flex; flex-direction:column; align-items:center;
    padding-top:6px;
  }
  .height-pill{
    position:absolute; top:2px; right:4px;
    font-size:12px; font-weight:600; color:var(--ink);
    background:var(--paper); border:2px solid var(--line);
    border-radius:999px; padding:4px 10px;
    box-shadow:2px 2px 0 var(--shadow);
    transform:rotate(3deg);
  }

  .bubble-wrap{width:100%; display:flex; justify-content:center; padding:0 2px;}
  .bubble{
    position:relative;
    background:var(--paper);
    border:3px solid var(--line);
    border-radius:22px;
    padding:16px 18px;
    max-width:460px; width:100%;
    box-shadow:5px 6px 0 var(--shadow);
    min-height:96px;
    display:flex; align-items:center;
  }
  .bubble .cat{
    position:absolute; top:-12px; left:18px;
    font-size:11px; font-weight:700; letter-spacing:.4px;
    background:var(--accent); color:var(--accent-ink);
    border:2px solid var(--line); border-radius:999px;
    padding:2px 9px;
  }
  .bubble p{
    margin:0; font-size:17px; line-height:1.4; font-weight:500;
    color:var(--ink);
  }
  .caret{display:inline-block; width:2px; margin-left:1px; color:var(--coral);}
  .talking .caret{animation:caret .6s step-end infinite;}
  @keyframes caret{50%{opacity:0}}
  /* comic tail pointing down toward Aaron */
  .bubble::after{
    content:""; position:absolute; bottom:-17px; left:50%; transform:translateX(-50%);
    width:0;height:0;border-left:16px solid transparent;border-right:10px solid transparent;
    border-top:18px solid var(--line);
  }
  .bubble::before{
    content:""; position:absolute; bottom:-11px; left:50%; transform:translateX(-46%);
    width:0;height:0;border-left:12px solid transparent;border-right:7px solid transparent;
    border-top:13px solid var(--paper); z-index:1;
  }

  .aaron-holder{flex:1 1 auto; min-height:0; display:flex; align-items:flex-end; justify-content:center; width:100%;}
  .aaron{height:100%; max-height:46vh; width:auto; max-width:300px; overflow:visible; cursor:pointer;}
  .bob{animation:bob 4.2s ease-in-out infinite; transform-box:fill-box; transform-origin:50% 100%;}
  @keyframes bob{0%,100%{transform:translateY(0)}50%{transform:translateY(-6px)}}
  .poke{animation:poke .55s ease;}
  @keyframes poke{0%{transform:translateY(0) scale(1,1)}25%{transform:translateY(-12px) scale(1.03,.97)}55%{transform:translateY(0) scale(.98,1.02)}100%{transform:translateY(0) scale(1,1)}}
  .lid{transform-box:fill-box; transform-origin:50% 0%; transform:scaleY(0); animation:blink 5.4s infinite;}
  .lid.two{animation-delay:.04s;}
  @keyframes blink{0%,90%,97%,100%{transform:scaleY(0)}93%,95%{transform:scaleY(1)}}
  .mouth-talk{transform-box:fill-box; transform-origin:50% 50%; animation:chatter .26s infinite;}
  @keyframes chatter{0%,100%{transform:scaleY(.45)}50%{transform:scaleY(1.15)}}

  /* dock */
  .dock{flex:none; padding-top:12px; display:flex; flex-direction:column; gap:12px;}
  .poke-row{display:flex; gap:10px;}
  .poke-btn{
    flex:1; font-family:inherit; font-size:19px; font-weight:700;
    color:var(--accent-ink); background:var(--accent);
    border:3px solid var(--line); border-radius:16px;
    padding:14px; cursor:pointer; box-shadow:4px 5px 0 var(--shadow);
    transition:transform .06s ease, box-shadow .06s ease;
  }
  .poke-btn:active{transform:translate(4px,5px); box-shadow:0 0 0 var(--shadow);}
  .icon-btn{
    flex:none; width:56px; font-size:22px;
    background:var(--chip); color:var(--ink);
    border:3px solid var(--line); border-radius:16px; cursor:pointer;
    box-shadow:4px 5px 0 var(--shadow);
    transition:transform .06s ease, box-shadow .06s ease;
  }
  .icon-btn:active{transform:translate(4px,5px); box-shadow:0 0 0 var(--shadow);}
  .icon-btn[aria-pressed="false"]{opacity:.55;}
  .chips{display:flex; gap:8px; flex-wrap:wrap; justify-content:center;}
  .chip{
    font-family:inherit; font-size:13px; font-weight:600;
    background:var(--chip); color:var(--ink-soft);
    border:2px solid var(--chip-border); border-radius:999px;
    padding:7px 13px; cursor:pointer;
  }
  .chip.on{background:var(--coral); color:#fff; border-color:var(--line);}

  @media (prefers-reduced-motion: reduce){
    .bob,.lid,.mouth-talk,.talking .caret{animation:none !important}
    .lid{transform:scaleY(0)}
  }
  @media (max-height:680px){
    .bubble p{font-size:15px}
    .aaron{max-height:38vh}
  }
</style>
<style>
  /* ===== SYNTHWAVE RESKIN (v4) ===== */
  :root{

    --chip:#ffffff;
    --shadow: rgba(20,6,40,.42);

    :root:not([data-theme="light"]){
      --paper:#241433; --ink:#fbeaff; --line:#08030f; --chip:#3a2350;
      --shadow: rgba(0,0,0,.55);
    }
  }
  body{
    background:
      radial-gradient(circle at 78% 8%, rgba(255,209,110,.28), transparent 42%),
      linear-gradient(180deg,#160a34 0%, #3a0d5e 26%, #8a1a6e 50%, #ff4d7d 74%, #ff9f5c 100%);
    background-attachment:fixed;
  }
  body::before{
    content:""; position:fixed; inset:0; z-index:0; pointer-events:none;
    background:
      repeating-linear-gradient(transparent 0 39px, rgba(18,215,255,.06) 39px 40px),
      repeating-linear-gradient(90deg, transparent 0 39px, rgba(255,45,149,.05) 39px 40px);
    mask-image: linear-gradient(180deg, transparent 40%, #000 100%);
  }
  .app{position:relative; z-index:1;}

  /* header on the dark part of the gradient */
  .who h1{
    color:#fff; font-size:22px;
    text-shadow:0 0 10px rgba(18,215,255,.7), 2px 2px 0 var(--accent);
  }
  .status{color:#ffd7ee;} .status b{color:var(--coral);}
  .avatar-dot{box-shadow:0 0 14px rgba(255,45,149,.7), 3px 3px 0 var(--shadow);}
  .vbadge{color:#fff; background:rgba(255,255,255,.14); border-color:rgba(255,255,255,.4);}

  /* speech bubble: light card, neon glow */
  .bubble{box-shadow:6px 7px 0 var(--shadow), 0 0 26px rgba(255,45,149,.35);}
  .bubble .cat{background:var(--coral); color:#062b33; border-color:var(--line);}
  .caret{color:var(--accent);}

  /* portrait card */
  .aaron-holder{align-items:center;}
  .portrait{
    height:min(33vh, 58vw); aspect-ratio:1/1; width:auto;
    border:4px solid var(--line); border-radius:18px; overflow:hidden;
    background:#000; cursor:pointer;
    box-shadow:0 0 0 3px rgba(255,45,149,.6), 0 0 30px rgba(18,215,255,.35), 8px 10px 0 var(--shadow);
    transition:transform .06s ease;
  }
  .portrait img{width:100%; height:100%; object-fit:cover; display:block; user-select:none;}
  .portrait.talk{animation:neon 1.1s ease-in-out infinite;}
  @keyframes neon{
    0%,100%{box-shadow:0 0 0 3px rgba(255,45,149,.6), 0 0 22px rgba(18,215,255,.3), 8px 10px 0 var(--shadow);}
    50%{box-shadow:0 0 0 3px rgba(18,215,255,.85), 0 0 40px rgba(255,45,149,.6), 8px 10px 0 var(--shadow);}
  }

  /* controls */
  .poke-btn{box-shadow:4px 5px 0 var(--shadow), 0 0 18px rgba(255,45,149,.45);}
  .chip.on{color:#062b33;}
  .height-pill{box-shadow:2px 2px 0 var(--shadow), 0 0 12px rgba(18,215,255,.4);}

  @media (prefers-reduced-motion: reduce){
    .portrait.talk{animation:none;}
  }
</style>

function loadPref(k, d){ try{ const v = localStorage.getItem(k); return v===null? d : JSON.parse(v);}catch(e){ return d; } }
function savePref(k, v){ try{ localStorage.setItem(k, JSON.stringify(v)); }catch(e){} }

// tiny synthesized "blip" so he feels alive (his favorite: Web Audio, no files)
let AC = null;
function blip(on){
  if(!on) return;
  try{
    AC = AC || new (window.AudioContext||window.webkitAudioContext)();
    if(AC.state === "suspended") AC.resume();
    const now = AC.currentTime;
    [ [520, 0], [700, 0.07] ].forEach(([f,dt])=>{
      const o = AC.createOscillator(), g = AC.createGain();
      o.type="triangle"; o.frequency.value=f;
      g.gain.setValueAtTime(0.0001, now+dt);
      g.gain.exponentialRampToValueAtTime(0.06, now+dt+0.01);
      g.gain.exponentialRampToValueAtTime(0.0001, now+dt+0.11);
      o.connect(g); g.connect(AC.destination);
      o.start(now+dt); o.stop(now+dt+0.13);
    });
  }catch(e){}
}

// keyboard clatter for coding lines
function clack(on){
  if(!on) return;
  try{
    AC = AC || new (window.AudioContext||window.webkitAudioContext)();
    if(AC.state === "suspended") AC.resume();
    const now = AC.currentTime;
    const n = 9;
    for(let k=0;k<n;k++){
      const dt = k*0.058 + Math.random()*0.022;
      const o = AC.createOscillator(), g = AC.createGain();
      o.type="square"; o.frequency.value = 1300 + Math.random()*1000;
      g.gain.setValueAtTime(0.0001, now+dt);
      g.gain.exponentialRampToValueAtTime(0.028, now+dt+0.004);
      g.gain.exponentialRampToValueAtTime(0.0001, now+dt+0.03);
      o.connect(g); g.connect(AC.destination);
      o.start(now+dt); o.stop(now+dt+0.04);
    }
  }catch(e){}
}

function App(){
  const [cat, setCat] = useState("all");
  const [soundOn, setSoundOn] = useState(()=>loadPref("aaron_sound", true));
  const [autoOn, setAutoOn] = useState(()=>loadPref("aaron_auto", true));
  const [line, setLine] = useState(LINES[0]);
  const [shown, setShown] = useState("");
  const [talking, setTalking] = useState(false);
  const [poking, setPoking] = useState(false);

  const lastText = useRef(LINES[0].t);
  const pokeTimer = useRef(null);

  const pickLine = useCallback(()=>{
    const pool = cat==="all" ? LINES : LINES.filter(l=>l.c===cat);
    let next = pool[Math.floor(Math.random()*pool.length)];
    if(pool.length > 1){
      let guard = 0;
      while(next.t === lastText.current && guard < 8){
        next = pool[Math.floor(Math.random()*pool.length)]; guard++;
      }
    }
    lastText.current = next.t;
    setLine(next);
    (next.c === "code" ? clack : blip)(soundOn);
  }, [cat, soundOn]);

  // typewriter
  useEffect(()=>{
    setShown("");
    setTalking(true);
    const full = line.t;
    let i = 0;
    const id = setInterval(()=>{
      i++;
      setShown(full.slice(0, i));
      if(i >= full.length){ clearInterval(id); setTalking(false); }
    }, 26);
    return ()=>clearInterval(id);
  }, [line]);

  // auto chatter: after he finishes, wait a beat, then say another
  useEffect(()=>{
    if(!autoOn || talking) return;
    const wait = 3800 + Math.random()*4200;
    const id = setTimeout(pickLine, wait);
    return ()=>clearTimeout(id);
  }, [autoOn, talking, line, pickLine]);

  const poke = ()=>{
    pickLine();
    setPoking(true);
    clearTimeout(pokeTimer.current);
    pokeTimer.current = setTimeout(()=>setPoking(false), 560);
  };

  const chooseCat = (k)=>{
    setCat(k);
    const pool = k==="all" ? LINES : LINES.filter(l=>l.c===k);
    let next = pool[Math.floor(Math.random()*pool.length)];
    lastText.current = next.t;
    setLine(next);
    (next.c === "code" ? clack : blip)(soundOn);
  };

  const toggleSound = ()=>{ const v=!soundOn; setSoundOn(v); savePref("aaron_sound", v); if(v) blip(true); };
  const toggleAuto = ()=>{ const v=!autoOn; setAutoOn(v); savePref("aaron_auto", v); };

  return (
    <div className="app">
      <div className="topbar">
        <div className="avatar-dot">🧢</div>
        <div className="who">
          <h1>Aaron</h1>
          <div className="status">certified legend · <b>online (unfortunately)</b></div>
