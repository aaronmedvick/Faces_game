<script type="text/babel">
const { useState, useEffect, useRef, useMemo } = React;
const VERSION = "v1";

/* ============ SUPABASE (reuses the shared project) ============ */
const SUPABASE_URL = "https://gyvgzeculdaxcwinblld.supabase.co";
const SUPABASE_KEY = "sb_publishable_kS8hQSqZR8Sog9imuq8dCg_-6iBy2Hi";

const sb = sbReady ? supabase.createClient(SUPABASE_URL, SUPABASE_KEY) : null;

/* ============ IDENTITY ============ */
function uid(){
  let v = localStorage.getItem("botc_uid");
  if(!v){ v = "u_"+Math.random().toString(36).slice(2,11); localStorage.setItem("botc_uid", v); }
  return v;
}
const MYID = uid();
const randCode = () => Array.from({length:4},()=>"ABCDEFGHJKMNPQRSTUVWXYZ23456789"[Math.floor(Math.random()*31)]).join("");

/* Seeded RNG so the whole town solves the SAME puzzle stream each night
   (only each player's START is randomly staggered — see MiniGame). */
function seededRng(seedStr){
  let h = 1779033703 ^ seedStr.length;
  for(let i=0;i<seedStr.length;i++){ h = Math.imul(h ^ seedStr.charCodeAt(i), 3432918353); h = (h<<13)|(h>>>19); }
  return function(){ h = Math.imul(h ^ (h>>>16), 2246822507); h = Math.imul(h ^ (h>>>13), 3266489909); return ((h ^= h>>>16) >>> 0) / 4294967296; };
}
function puzzleAt(code, night, i){
  const rng = seededRng(code+":"+night+":"+i);
  const op = rng()<0.5 ? "+" : "×";
  if(op==="+"){ const a=2+Math.floor(rng()*40), b=2+Math.floor(rng()*40); return {a,b,op,r:a+b}; }
  const a=2+Math.floor(rng()*11), b=2+Math.floor(rng()*11); return {a,b,op,r:a*b};
}
const DEMO_NAMES = ["Amelia","Bram","Cora","Dorian","Edwin","Fen","Greer","Hollis","Isolde","Jasper","Kestrel","Lysander","Mabel","Nero","Orla"];

/* ============ TROUBLE BREWING (names + types are game facts;
   reminders are my own concise paraphrases, not the official text) ============ */
const ROLES = {
  washerwoman:{name:"Washerwoman", type:"townsfolk", action:null,      fn:true,  on:false, rem:"You start knowing that 1 of 2 players is a particular Townsfolk."},
  librarian:  {name:"Librarian",   type:"townsfolk", action:null,      fn:true,  on:false, rem:"You start knowing that 1 of 2 players is a particular Outsider (or that there are none)."},
  investigator:{name:"Investigator",type:"townsfolk",action:null,      fn:true,  on:false, rem:"You start knowing that 1 of 2 players is a particular Minion."},
  chef:       {name:"Chef",        type:"townsfolk", action:null,      fn:true,  on:false, rem:"You start knowing how many pairs of evil players are sitting next to each other."},
  empath:     {name:"Empath",      type:"townsfolk", action:null,      fn:true,  on:true,  rem:"Each night, you learn how many of your 2 living neighbours are evil."},
  fortuneteller:{name:"Fortune Teller",type:"townsfolk",action:"target2",fn:true, on:true,  rem:"Each night, choose 2 players: you learn if either is the Demon. One good player registers as the Demon to you."},
  undertaker: {name:"Undertaker",  type:"townsfolk", action:null,      fn:false, on:true,  rem:"Each night (except the 1st), you learn which character was executed today."},
  monk:       {name:"Monk",        type:"townsfolk", action:"protect", fn:false, on:true,  rem:"Each night (except the 1st), choose a player (not yourself): they are safe from the Demon tonight."},
  ravenkeeper:{name:"Ravenkeeper", type:"townsfolk", action:null,      fn:false, on:false, rem:"If you die at night, you wake to choose a player and learn their character. (Storyteller wakes you.)"},
  virgin:     {name:"Virgin",      type:"townsfolk", action:null,      fn:false, on:false, rem:"The 1st time you are nominated, if the nominator is a Townsfolk, they are executed immediately."},
  slayer:     {name:"Slayer",      type:"townsfolk", action:null,      fn:false, on:false, rem:"Once per game, during the day, publicly choose a player: if they are the Demon, they die."},
  soldier:    {name:"Soldier",     type:"townsfolk", action:null,      fn:false, on:false, rem:"You are safe from the Demon."},
  mayor:      {name:"Mayor",       type:"townsfolk", action:null,      fn:false, on:false, rem:"If only 3 players live and no execution happens, your team wins. A Demon kill may hit someone else instead."},
  butler:     {name:"Butler",      type:"outsider",  action:"master",  fn:true,  on:true,  rem:"Each night, choose a master. Tomorrow you may only vote if your master is also voting."},
  drunk:      {name:"Drunk",       type:"outsider",  action:null,      fn:false, on:false, rem:"You do not know you are the Drunk. You think you are a Townsfolk, but your ability does nothing."},
  recluse:    {name:"Recluse",     type:"outsider",  action:null,      fn:false, on:false, rem:"You might register as evil, and as a Minion or Demon, even though you are good."},
  saint:      {name:"Saint",       type:"outsider",  action:null,      fn:false, on:false, rem:"If you are executed, your team loses."},
  poisoner:   {name:"Poisoner",    type:"minion",    action:"target",  fn:true,  on:true,  rem:"Each night, choose a player: they are poisoned tonight and tomorrow day (their ability malfunctions)."},
  spy:        {name:"Spy",         type:"minion",    action:null,      fn:true,  on:true,  rem:"Each night, you see the Grimoire (ask the Storyteller). You might register as good, and as a Townsfolk or Outsider."},
  scarletwoman:{name:"Scarlet Woman",type:"minion",  action:null,      fn:false, on:false, rem:"If there are 5+ players alive and the Demon dies, you become the Demon."},
  baron:      {name:"Baron",       type:"minion",    action:null,      fn:false, on:false, rem:"There are extra Outsiders in play. (Setup effect.)"},
  imp:        {name:"Imp",         type:"demon",     action:"kill",    fn:false, on:true,  rem:"Each night (except the 1st), choose a player: they die. If you kill yourself, a Minion becomes the Imp."}
};
const TYPE_LABEL = { townsfolk:"Townsfolk", outsider:"Outsider", minion:"Minion", demon:"Demon" };
const TYPE_CLS = { townsfolk:"tf", outsider:"out", minion:"min", demon:"dem" };
const TYPE_ORDER = ["townsfolk","outsider","minion","demon"];

// standard Trouble Brewing setup counts [townsfolk, outsider, minion, demon]
const DISTRIB = {5:[3,0,1,1],6:[3,1,1,1],7:[5,0,1,1],8:[5,1,1,1],9:[5,2,1,1],10:[7,0,2,1],11:[7,1,2,1],12:[7,2,2,1],13:[9,0,3,1],14:[9,1,3,1],15:[9,2,3,1]};

// night order reference (keys). Follow your physical night sheet as the source of truth.
const FIRST_NIGHT = ["poisoner","washerwoman","librarian","investigator","chef","empath","fortuneteller","butler","spy"];
const OTHER_NIGHT = ["poisoner","monk","imp","undertaker","empath","fortuneteller","butler","spy"];

const ACTION_LABEL = { target:"Choose a player", target2:"Choose 2 players", protect:"Choose a player to protect", master:"Choose your master", kill:"Choose a player to kill" };

/* ============ DB helpers (surface RLS/silent failures) ============ */
async function dbUpdateRoom(code, patch, setErr){
  const r = await sb.from("botc_rooms").update({ ...patch, updated_at:new Date().toISOString() }).eq("code", code);
  if(r.error){ console.error("room update", r.error); setErr && setErr(r.error.message); }
  return r;
}
async function dbUpdatePlayer(id, patch, setErr){
  const r = await sb.from("botc_players").update(patch).eq("id", id);
  if(r.error){ console.error("player update", r.error); setErr && setErr(r.error.message); }
  return r;
}

/* ============ realtime + poll room hook ============ */
function useRoom(code, fast){
  const [room,setRoom] = useState(null);
  const [players,setPlayers] = useState([]);
  const [err,setErr] = useState("");
  const refetch = async () => {
    if(!sb || !code) return;
    const g = await sb.from("botc_rooms").select("*").eq("code",code).maybeSingle();
    if(g.error){ setErr(g.error.message); } else { setRoom(g.data); }
    const ps = await sb.from("botc_players").select("*").eq("code",code).order("seat",{nullsFirst:false});
    if(!ps.error){ setPlayers(ps.data||[]); }
  };
  useEffect(()=>{
    if(!sb || !code) return;
    refetch();
    const ch = sb.channel("botc:"+code+":"+Math.random().toString(36).slice(2,7))
      .on("postgres_changes",{event:"*",schema:"public",table:"botc_rooms",filter:"code=eq."+code}, refetch)
      .on("postgres_changes",{event:"*",schema:"public",table:"botc_players",filter:"code=eq."+code}, refetch)
      .subscribe();
    const poll = setInterval(refetch, fast?1500:2500);
    return ()=>{ sb.removeChannel(ch); clearInterval(poll); };
  },[code]);
  const me = players.find(p=>p.id===MYID) || null;
  return { room, players, me, err, setErr, refetch };
}

const seated = (players)=> players.filter(p=>!p.is_storyteller && p.seat!=null).sort((a,b)=>a.seat-b.seat);
const livingCount = (players)=> seated(players).filter(p=>p.alive).length;
/* ===== HOST-LESS ENGINE START (pure functions; no DOM, no DB) ===== */
const AUTO_POOL = { townsfolk:["washerwoman","librarian","investigator","chef","empath","fortuneteller","undertaker","monk","soldier"], outsider:["saint"], minion:["poisoner","scarletwoman"], demon:["imp"] };
const AUTO_MIN = 5, AUTO_MAX = 12;
const NIGHT_MIN_MS = 20000, NIGHT_MAX_MS = 75000, DAY_MAX_MS = 600000, VOTE_MAX_MS = 45000;
const shuf = (a)=>{ a=a.slice(); for(let i=a.length-1;i>0;i--){ const j=Math.floor(Math.random()*(i+1)); const t=a[i]; a[i]=a[j]; a[j]=t; } return a; };
const pickOne = (a)=> a[Math.floor(Math.random()*a.length)];
const isEvil = (role)=>{ const R=ROLES[role]; return !!R && (R.type==="minion"||R.type==="demon"); };
const applyPatches = (list, patches)=> list.map(p=> patches[p.id] ? { ...p, ...patches[p.id] } : p);
const nightActs = (p, night)=>{ const R=ROLES[p.role]; return !!(R && R.action && (night<=1 ? R.fn : R.on) && !(p.role==="imp" && night<=1)); };

/* deal roles for a host-less game; list = seated players */
function autoDeal(list){
  const n = list.length;
  if(n<AUTO_MIN || n>AUTO_MAX) return null;
  const d = DISTRIB[n];
  const o = Math.min(d[1], AUTO_POOL.outsider.length), m = Math.min(d[2], AUTO_POOL.minion.length);
  const t = d[0] + (d[1]-o) + (d[2]-m);
  const roles = [].concat(shuf(AUTO_POOL.townsfolk).slice(0,t), shuf(AUTO_POOL.outsider).slice(0,o), shuf(AUTO_POOL.minion).slice(0,m), ["imp"]);
  const ids = shuf(list.map(p=>p.id));
  const assign = ids.map((id,i)=>({ id, role:roles[i] }));
  const good = assign.filter(a=>!isEvil(a.role));
  const hid = good.length ? pickOne(good).id : null;
  const herring = hid ? list.find(p=>p.id===hid).seat : null;
  return { assign, herring };
}

/* what the evil team is told before night 1 */
function teamInfo(list){
  const out = {};
  const demon = list.find(p=>p.role==="imp");
  const minions = list.filter(p=>ROLES[p.role] && ROLES[p.role].type==="minion");
  const inPlay = new Set(list.map(p=>p.role));
  const bluffPool = Object.keys(ROLES).filter(k=>(ROLES[k].type==="townsfolk"||ROLES[k].type==="outsider") && !inPlay.has(k));
  const bluffs = shuf(bluffPool).slice(0,3).map(k=>ROLES[k].name);
  if(demon) out[demon.id] = "Your minions: " + minions.map(x=>x.name+" ("+ROLES[x.role].name+")").join(", ") + ". Bluffs you can claim (good roles not in play): " + bluffs.join(", ") + ".";
  minions.forEach(mn=>{
    const others = minions.filter(x=>x.id!==mn.id);
    out[mn.id] = "Your Demon is " + (demon?demon.name:"?") + " (Imp)." + (others.length ? " Fellow minion: " + others.map(x=>x.name).join(", ") + "." : "");
  });
  return out;
}

function autoWin(list){
  const alive = list.filter(p=>p.alive);
  if(!alive.some(p=>p.role==="imp")) return "good";
  if(alive.length<=2) return "evil";
  return null;
}

/* execute the player on the block */
function executeSeat(list, seat){
  const v = list.find(p=>p.seat===seat);
  if(!v) return { patches:{}, winner:null, role:null };
  const aliveBefore = list.filter(p=>p.alive).length;
  const patches = {}; patches[v.id] = { alive:false };
  let winner = null;
  if(v.role==="saint") winner = "evil";
  else if(v.role==="imp"){
    const sw = list.find(p=>p.alive && p.id!==v.id && p.role==="scarletwoman");
    if(sw && aliveBefore>=5) patches[sw.id] = { role:"imp", role_type:"demon", auto_team:"The Demon was executed, so you are the Imp now. Choose a kill each night." };
  }
  if(!winner) winner = autoWin(applyPatches(list, patches));
  return { patches, winner, role:v.role };
}

/* resolve one night. list = seated players (with night_action). Returns { info:{id:text}, patches:{id:{...}}, victim, winner } */
function resolveNight({ list, night, herring, lastExec }){
  const alive = list.filter(p=>p.alive);
  const act = (p)=> p.night_action || {};
  const bySeat = (s)=> list.find(p=>p.seat===s);
  const nm = (s)=>{ const q=bySeat(s); return q?q.name:"?"; };
  const poisoner = alive.find(p=>p.role==="poisoner");
  const poisonedSeat = (poisoner && act(poisoner).target!=null) ? act(poisoner).target : null;
  const isP = (p)=> poisonedSeat!=null && p.seat===poisonedSeat;
  const patches = {}, info = {};
  const give = (p,text)=>{ info[p.id]=text; };
  const sorted = list.slice().sort((a,b)=>a.seat-b.seat);
  const rnd = (n)=>Math.floor(Math.random()*n);

  /* ---- night 1: the "you start knowing" roles ---- */
  if(night<=1){
    const kinds = { washerwoman:["townsfolk","Townsfolk"], librarian:["outsider","Outsider"], investigator:["minion","Minion"] };
    alive.forEach(p=>{
      const k = kinds[p.role];
      if(k){
        const pool = list.filter(x=>x.id!==p.id && ROLES[x.role].type===k[0]);
        if(isP(p)){
          const wrong = shuf(list.filter(x=>x.id!==p.id && ROLES[x.role].type!==k[0])).slice(0,2);
          const rn = ROLES[pickOne(Object.keys(ROLES).filter(r=>ROLES[r].type===k[0]))].name;
          if(wrong.length===2) give(p, "One of "+wrong[0].name+" or "+wrong[1].name+" is the "+rn+".");
        } else if(!pool.length){
          give(p, "There are no "+k[1]+"s in play.");
        } else {
          const t = pickOne(pool);
          const decoy = pickOne(list.filter(x=>x.id!==t.id && x.id!==p.id));
          const two = shuf([t,decoy]);
          give(p, "One of "+two[0].name+" or "+two[1].name+" is the "+ROLES[t.role].name+".");
        }
      }
      if(p.role==="chef"){
        let c = 0; for(let i=0;i<sorted.length;i++){ if(isEvil(sorted[i].role) && isEvil(sorted[(i+1)%sorted.length].role)) c++; }
        if(isP(p)) c = rnd(3);
        give(p, c+" pair"+(c===1?"":"s")+" of evil players sit next to each other.");
      }
    });
  }

  /* ---- nights 2+: monk, imp ---- */
  let victim = null;
  if(night>=2){
    const monk = alive.find(p=>p.role==="monk");
    const saved = (monk && !isP(monk) && act(monk).target!=null) ? act(monk).target : null;
    const imp = alive.find(p=>p.role==="imp");
    if(imp && !isP(imp) && act(imp).target!=null){
      const tgt = bySeat(act(imp).target);
      if(tgt && tgt.alive){
        if(tgt.id===imp.id){
          victim = imp;
          const mins = alive.filter(p=>ROLES[p.role].type==="minion");
          if(mins.length){ const np = pickOne(mins); patches[np.id] = { role:"imp", role_type:"demon", auto_team:"The Imp took their own life, so you are the Imp now. Choose a kill each night." }; give(np, "You are the Imp now."); }
        } else if(tgt.seat!==saved && !(tgt.role==="soldier" && !isP(tgt))){
          victim = tgt;
        }
      }
    }
    if(victim){ patches[victim.id] = Object.assign({}, patches[victim.id]||{}, { alive:false }); }
  }

  /* ---- info roles that wake every night (after the kill, like the real night order) ---- */
  const nowAlive = alive.filter(p=>!victim || p.id!==victim.id);
  const nbrs = (p)=>{
    const a = nowAlive.slice().sort((x,y)=>x.seat-y.seat); const k=a.length; const i=a.findIndex(x=>x.id===p.id);
    if(i<0||k<2) return [];
    const L=a[(i-1+k)%k], R=a[(i+1)%k]; return L.id===R.id ? [L] : [L,R];
  };
  nowAlive.forEach(p=>{
    if(p.role==="empath"){
      const ns = nbrs(p); let c = ns.filter(x=>isEvil(x.role)).length; if(isP(p)) c = rnd(ns.length+1);
      give(p, c+" of your "+ns.length+" living neighbour"+(ns.length===1?"":"s")+(c===1?" is":" are")+" evil.");
    }
    if(p.role==="fortuneteller" && act(p).target!=null && act(p).target2!=null){
      const a = bySeat(act(p).target), b = bySeat(act(p).target2);
      let yes = [a,b].some(x=>x && (x.role==="imp" || x.seat===herring));
      if(isP(p)) yes = Math.random()<0.5;
      give(p, nm(act(p).target)+" & "+nm(act(p).target2)+": "+(yes?"YES, one of them reads as the Demon.":"No, neither reads as the Demon."));
    }
    if(night>=2 && p.role==="undertaker"){
      if(isP(p)){ give(p, "The player executed today was the "+ROLES[pickOne(Object.keys(ROLES))].name+"."); }
      else give(p, lastExec && lastExec.role ? "The player executed today was the "+ROLES[lastExec.role].name+"." : "No one was executed today.");
    }
  });

  const winner = autoWin(applyPatches(list, patches));
  return { info, patches, victim, winner };
}
/* ===== HOST-LESS ENGINE END ===== */


/* ============ host-less: DB glue ============ */
async function autoStart(code, room, list, setErr){
  const deal = autoDeal(list);
  if(!deal){ setErr && setErr("Host-less games need "+AUTO_MIN+" to "+AUTO_MAX+" seated players."); return false; }
  const withRoles = list.map(p=>({ ...p, role: deal.assign.find(a=>a.id===p.id).role }));
  const team = teamInfo(withRoles);
  await Promise.all(deal.assign.map(a=> sb.from("botc_players").update({ role:a.role, role_type:ROLES[a.role].type, alive:true, night_action:null, auto_info:null, auto_team:team[a.id]||null, used_ghost_vote:false }).eq("id",a.id)));
  await dbUpdateRoom(code, { phase:"night", night_num:1, day_num:0, nomination:null, on_block:null, winner:null,
    settings:{ ...(room.settings||{}), auto:true, runner:MYID, herring:deal.herring, t0:Date.now(), last_exec:null } }, setErr);
  return true;
}
async function autoStep(code, setErr){
  const rr = await sb.from("botc_rooms").select("*").eq("code",code).maybeSingle(); const room = rr.data; if(!room) return;
  const st = room.settings||{}; if(!st.auto || st.runner!==MYID) return;
  const ps = await sb.from("botc_players").select("*").eq("code",code).order("seat",{nullsFirst:false});
  const players = ps.data||[]; const list = seated(players); const now = Date.now(); const t0 = st.t0||now;
  if(room.phase==="night"){
    const need = list.filter(p=>p.alive && nightActs(p,room.night_num));
    const done = need.every(p=>p.night_action && p.night_action.target!=null);
    const el = now-t0;
    if((done && el>=NIGHT_MIN_MS) || el>=NIGHT_MAX_MS){
      const out = resolveNight({ list, night:room.night_num, herring:st.herring, lastExec:st.last_exec });
      await Promise.all(list.map(p=> sb.from("botc_players").update({ ...(out.patches[p.id]||{}), night_action:null, auto_info: out.info[p.id] ? { night:room.night_num, text:out.info[p.id] } : null }).eq("id",p.id)));
      if(out.winner) await dbUpdateRoom(code,{ phase:"over", winner:out.winner, nomination:null, on_block:null }, setErr);
      else await dbUpdateRoom(code,{ phase:"day", day_num:room.day_num+1, nomination:null, on_block:null, settings:{ ...st, t0:Date.now(), last_exec:null } }, setErr);
    }
  } else if(room.phase==="day"){
    const nom = room.nomination;
    const alive = list.filter(p=>p.alive);
    if(nom && nom.open){
      const votes = nom.votes||{};
      const cast = alive.filter(p=>votes[p.seat]!==undefined).length;
      if(cast>=alive.length || (nom.t && now-nom.t>=VOTE_MAX_MS)){
        const yes = Object.values(votes).filter(Boolean).length, th = Math.ceil(alive.length/2);
        let ob = room.on_block; if(yes>=th && (!ob || yes>ob.votes)) ob = { seat:nom.nominee, votes:yes };
        await dbUpdateRoom(code,{ nomination:null, on_block:ob }, setErr);
      }
      return;
    }
    const ready = alive.every(p=>p.night_action && p.night_action.ready);
    if(ready || now-t0>=DAY_MAX_MS){
      let patches = {}, winner = null, last = null;
      if(room.on_block){ const r = executeSeat(list, room.on_block.seat); patches = r.patches; winner = r.winner; last = { role:r.role, seat:room.on_block.seat }; }
      await Promise.all(list.map(p=> sb.from("botc_players").update({ ...(patches[p.id]||{}), night_action:null }).eq("id",p.id)));
      if(winner) await dbUpdateRoom(code,{ phase:"over", winner, nomination:null, on_block:null }, setErr);
      else await dbUpdateRoom(code,{ phase:"night", night_num:room.night_num+1, nomination:null, on_block:null, settings:{ ...st, t0:Date.now(), last_exec:last } }, setErr);
    }
  }
}

function WhoRuns({ code, room, players, me, setErr, refetch }){
  const st = room.settings||{}; const auto = !!st.auto; const list = seated(players);
  const stRow = players.find(p=>p.id===room.host_id);
  const claim = async ()=>{
    const r = await sb.from("botc_rooms").update({ host_id:MYID, settings:{ ...st, auto:false, runner:null } }).eq("code",code).is("host_id",null).select();
    if(r.error){ setErr(r.error.message); return; }
    if(r.data && r.data.length) await sb.from("botc_players").update({ is_storyteller:true, seat:null, role:null }).eq("id",MYID);
    refetch();
  };
  const setAuto = async (on)=>{ const r = await sb.from("botc_rooms").update({ settings:{ ...st, auto:on, runner:null } }).eq("code",code).is("host_id",null); if(r.error) setErr(r.error.message); refetch(); };
  const start = async ()=>{ await autoStart(code, room, list, setErr); refetch(); };
  return (
    <Shell code={code} who={`Seat ${me.seat} · ${me.name}`} phase="Gathering the town">
      <div className="card center">
        <div className="label">Room code</div>
        <div className="code">{code}</div>
        <QR text={location.origin+location.pathname+"?join="+code} />
        <div className="hint">Share the code or QR. Everyone who joins takes a seat.</div>
      </div>
      <div className="card">
        <div className="label">Seated ({list.length})</div>
        {list.map(p=>(<div className="prow" key={p.id}><div className="pname"><span className="seatn">{p.seat}</span>{p.name}{p.id===MYID?" (you)":""}</div></div>))}
      </div>
      <div className="card">
        <div className="label">Who runs the game?</div>
        {room.host_id ? (
          <div className="note">👑 {stRow?stRow.name:"A Storyteller"} is the Storyteller. They'll deal the roles and run the nights.</div>
        ) : auto ? (
          <React.Fragment>
            <div className="note">🤖 Host-less: the app runs the nights, votes and executions. Everyone plays, nobody has to be Storyteller. {AUTO_MIN} to {AUTO_MAX} players.</div>
            <div className="note" style={{marginTop:6}}>Auto mode uses 14 of the 22 Trouble Brewing characters (the ones that never need a human's judgment).</div>
            <button className="btn primary go" style={{marginTop:12}} disabled={list.length<AUTO_MIN||list.length>AUTO_MAX} onClick={start}>
              {list.length<AUTO_MIN ? `Need ${AUTO_MIN-list.length} more (min ${AUTO_MIN})` : list.length>AUTO_MAX ? `Too many (max ${AUTO_MAX})` : "Deal roles & start 🌙"}
            </button>
            <button className="btn ghostb" style={{marginTop:8}} onClick={()=>setAuto(false)}>Use a Storyteller instead</button>
          </React.Fragment>
        ) : (
          <React.Fragment>
            <div className="note">Pick one: a person runs it as the Storyteller (full game, they don't play), or go host-less and let the app run it.</div>
            <button className="btn primary go" style={{marginTop:12}} onClick={claim}>👑 I'll be the Storyteller</button>
            <button className="btn ghostb" style={{marginTop:8}} onClick={()=>setAuto(true)}>🤖 Host-less: everyone plays</button>
          </React.Fragment>
        )}
      </div>
    </Shell>
  );
}

/* ============ QR ============ */
function QR({ text, size=150 }){
  const ref = useRef(null);
  useEffect(()=>{
    if(!ref.current || !window.QRCode) return;
    ref.current.innerHTML="";
    try{ new window.QRCode(ref.current,{ text, width:size, height:size, colorDark:"#0E0B1A", colorLight:"#ffffff", correctLevel:window.QRCode.CorrectLevel.M }); }catch(e){}
  },[text]);
  return <div className="qr"><div ref={ref}/></div>;
}

/* ============ Town circle (used on the big screen + ST) ============ */
function TownCircle({ players, nomination, showVotes }){
  const list = seated(players);
  const n = Math.max(list.length,1);
  return (
    <div className="town">
      <div className="clockface">
        {nomination && nomination.nominee!=null ? (
          <React.Fragment>
            <div className="tally">{Object.values(nomination.votes||{}).filter(Boolean).length}</div>
            <div className="tallyl">votes</div>
          </React.Fragment>
        ) : <div style={{fontSize:34}}>🕰️</div>}
      </div>
      {list.map((p,i)=>{
        const ang = (i/n)*2*Math.PI - Math.PI/2;
        const x = 50 + 43*Math.cos(ang);
        const y = 50 + 43*Math.sin(ang);
        const voted = nomination && nomination.votes ? nomination.votes[p.seat] : undefined;
        let cls = "seat";
        if(!p.alive) cls+=" dead";
        if(nomination && nomination.nominee===p.seat) cls+=" nominee";
        if(showVotes && nomination && nomination.open){ if(voted===true) cls+=" yes"; else if(voted===false) cls+=" no"; }
        return (
          <div key={p.id} className={cls} style={{left:x+"%", top:y+"%"}}>
            <div className="av">{(p.name||"?").slice(0,1).toUpperCase()}</div>
            <div className="sn">{p.name}</div>
          </div>
        );
      })}
    </div>
  );
}

    if(!name.trim()) return setErr("Enter your name.");
    if(codeIn.trim().length!==4) return setErr("Enter the 4-letter room code.");
    localStorage.setItem("botc_name", name.trim());
    onJoin(codeIn.trim().toUpperCase(), name.trim());
  };
  const host = ()=>{ localStorage.setItem("botc_name", name.trim()||"Storyteller"); onHost(name.trim()||"Storyteller"); };
  return (
    <div>
      <div className="title">Blood on the<br/>Clocktower</div>

        <div className="label">Join a town</div>

        <button className="btn" onClick={join}>Take a seat</button>

        <div className="label">Solo demo</div>

/* ============ Storyteller ============ */
function Storyteller({ code, name, onRole }){
  const { room, players, err, setErr, refetch } = useRoom(code);
  const [tab,setTab] = useState("grim");
  const [editSeat,setEditSeat] = useState(null);
  useEffect(()=>{ if(onRole && room && room.host_id!==MYID) onRole("player"); },[room && room.host_id]);
  useEffect(()=>{ document.body.className = room ? room.phase : ""; },[room && room.phase]);

  // ensure ST row exists
  useEffect(()=>{
    if(!room) return;
    if(!players.find(p=>p.id===MYID)){
      sb.from("botc_players").upsert({ id:MYID, code, name, is_storyteller:true, seat:null }).then(refetch);
    }
  },[room]);

  if(!room) return <Splash/>;
  const list = seated(players);
  const joinUrl = location.origin+location.pathname+"?join="+code;
  const screenUrl = location.origin+location.pathname+"?screen="+code;

  const setPhase = (patch)=> dbUpdateRoom(code, patch, setErr);

  /* hand the Storyteller seat to a player (they swap seats with you), or go host-less */
  const handOver = async (p)=>{
    const g = await sb.from("botc_rooms").update({ host_id:p.id }).eq("code",code).eq("host_id",MYID).select();
    if(g.error){ setErr(g.error.message); return; }
    if(!g.data || !g.data.length){ refetch(); return; }
    await sb.from("botc_players").update({ is_storyteller:true, seat:null, role:null, alive:true }).eq("id",p.id);
    await sb.from("botc_players").update({ is_storyteller:false, seat:p.seat, role:null, alive:true }).eq("id",MYID);
    refetch();
  };
  const goAuto = async ()=>{
    const used = new Set(list.map(x=>x.seat)); let seat=1; while(used.has(seat)) seat++;
    const g = await sb.from("botc_rooms").update({ host_id:null, settings:{ ...(room.settings||{}), auto:true, runner:null } }).eq("code",code).eq("host_id",MYID).select();
    if(g.error){ setErr(g.error.message); return; }
    if(!g.data || !g.data.length){ refetch(); return; }
    await sb.from("botc_players").update({ is_storyteller:false, seat, role:null, alive:true }).eq("id",MYID);
    refetch();
  };

  /* ---- Lobby ---- */
  if(room.phase==="lobby"){
    return (
      <Shell code={code} who="Storyteller 👑" phase="Gathering the town">
        <div className="card center">
          <div className="label">Room code</div>
          <div className="code">{code}</div>
          <QR text={joinUrl} />
          <div className="hint">Players scan to take a seat. Open the shared screen on a TV/laptop:</div>
          <div className="mono" style={{fontSize:12, wordBreak:"break-all", color:"var(--candle)"}}>?screen={code}</div>
        </div>
        {!(room.settings && room.settings.demo) && (
        <div className="card">
          <div className="label">Storyteller</div>
          <div className="note">You're the Storyteller. Hand it to someone else (you take their seat), or run the game host-less.</div>
          {list.map(p=>(<button key={p.id} className="btn ghostb" style={{marginTop:8}} onClick={()=>handOver(p)}>👑 Make {p.name} the Storyteller</button>))}
          <button className="btn ghostb" style={{marginTop:8}} onClick={goAuto}>🤖 Go host-less (no Storyteller)</button>
        </div>)}
        <div className="card">
          <div className="label">Seated ({list.length})</div>
          {list.length===0 && <div className="note">No one yet. Waiting for players…</div>}
          {list.map(p=>(
            <div className="prow" key={p.id}>
              <div className="pname"><span className="seatn">{p.seat}</span>{p.name}</div>
              <button className="pill" style={{color:"var(--rose)",borderColor:"var(--rose)",cursor:"pointer"}} onClick={async()=>{ await sb.from("botc_players").delete().eq("id",p.id); refetch(); }}>remove</button>
            </div>
          ))}
          <button className="btn primary go" style={{marginTop:14}} disabled={list.length<5}
            onClick={()=>setPhase({ phase:"setup" })}>
            {list.length<5 ? `Need ${5-list.length} more (min 5)` : "Assign roles →"}
          </button>
        </div>
      </Shell>
    );
  }

  /* ---- Setup: assign roles ---- */
  if(room.phase==="setup"){
    const d = DISTRIB[list.length] || null;
    const counts = TYPE_ORDER.map(t=> list.filter(p=>p.role && ROLES[p.role] && ROLES[p.role].type===t).length);
    return <Setup code={code} list={list} d={d} counts={counts} setErr={setErr} refetch={refetch}
             onBack={()=>setPhase({phase:"lobby"})} onBegin={()=>setPhase({ phase:"night", night_num:1, day_num:0, nomination:null, on_block:null })} />;
  }

  /* ---- Night ---- */
  if(room.phase==="night"){
    const order = room.night_num<=1 ? FIRST_NIGHT : OTHER_NIGHT;
    const inPlay = new Set(list.map(p=>p.role).filter(Boolean));
    const submitted = list.filter(p=>p.night_action && p.night_action.target!=null);
    return (
      <Shell code={code} who="Storyteller 👑" phase={`Night ${room.night_num}`} icon="🌙">
        <div className="tabs">
          <div className={"tab"+(tab==="grim"?" on":"")} onClick={()=>setTab("grim")}>Grimoire</div>
          <div className={"tab"+(tab==="order"?" on":"")} onClick={()=>setTab("order")}>Night order</div>
        </div>
        {tab==="order" && (

            {room.night_num<=1 && <div className="note" style={{marginBottom:8}}>Before waking anyone: show the Minions each other + the Demon, then show the Demon 3 not-in-play bluffs.</div>}
            {order.filter(k=>inPlay.has(k)).map((k,i)=>(
              <div className="orderline" key={k}><span className="oi">{i+1}</span><b>{ROLES[k].name}</b> <small>— {ROLES[k].rem}</small></div>
            ))}
            {order.filter(k=>inPlay.has(k)).length===0 && <div className="note">No ordered wakes among roles in play.</div>}
          </div>
        )}
        {tab==="grim" && (
          <div className="card">
            <div className="label">Grimoire — tap a character to change it · tap kill/revive for life</div>
            {list.map(p=>{
              const R = p.role && ROLES[p.role];
              const acted = p.night_action && p.night_action.target!=null;
              return (
                <div className={"prow"+(p.alive?"":" dead")} key={p.id}>
                  <div className="pname"><span className="seatn">{p.seat}</span>{p.name}
                    <button className="pill" style={{cursor:"pointer",marginLeft:6, color:R?"var(--mist)":"var(--dim)", borderColor:R?"var(--candle)":"var(--haze)"}}
                      onClick={()=>setEditSeat(editSeat===p.seat?null:p.seat)}>{R?R.name:"choose"}</button>
                  </div>
                  <div style={{display:"flex",gap:6,alignItems:"center"}}>
                    {acted && <span className="pill" title={JSON.stringify(p.night_action)}>→ seat {p.night_action.target}</span>}
                    {R && <span className={"pill "+TYPE_CLS[R.type]}>{TYPE_LABEL[R.type][0]}</span>}
                    <button className="pill" style={{cursor:"pointer",color:p.alive?"var(--rose)":"var(--mint)",borderColor:p.alive?"var(--rose)":"var(--mint)"}}
                      onClick={()=>dbUpdatePlayer(p.id,{alive:!p.alive},setErr)}>{p.alive?"kill":"revive"}</button>
                  </div>
                </div>
              );
            })}
            <div className="note" style={{marginTop:10}}>Wake players in order, give info verbally / from the Grimoire, then apply the Demon's kill by tapping “kill”. Submitted choices show as “→ seat N”.</div>
          </div>
        )}
        {tab==="grim" && editSeat!=null && (
          <RolePicker seat={editSeat} current={(list.find(x=>x.seat===editSeat)||{}).role}
            onPick={async(k)=>{ const p=list.find(x=>x.seat===editSeat); if(p){ await dbUpdatePlayer(p.id,{role:k, role_type:ROLES[k].type}, setErr); } setEditSeat(null); refetch(); }} />
        )}
        <div className="card center">
          <div className="note">{submitted.length} of the acting roles have submitted a choice.</div>
          <button className="btn primary go" style={{marginTop:10}}
            onClick={async()=>{ for(const p of list){ if(p.night_action) await sb.from("botc_players").update({night_action:null}).eq("id",p.id); } setPhase({ phase:"day", day_num:room.day_num+1, nomination:null, on_block:null }); }}>
            Open the day ☀️
          </button>
        </div>
      </Shell>
    );
  }

  /* ---- Day ---- */
  if(room.phase==="day"){
    const nom = room.nomination;
    const alive = livingCount(players);
    const threshold = Math.ceil(alive/2);
    const yes = nom ? Object.values(nom.votes||{}).filter(Boolean).length : 0;
    const block = room.on_block;
    return (
      <Shell code={code} who="Storyteller 👑" phase={`Day ${room.day_num}`} icon="☀️">
        <TownCircle players={players} nomination={nom} showVotes={true} />
        <div className="card">
          <div className="label">Execution</div>
          {block ? <div className="note">On the block: <b style={{color:"var(--mist)"}}>seat {block.seat}</b> with {block.votes} votes (needs a majority of {alive} living = {threshold}).</div>
                 : <div className="note">No one is on the block yet.</div>}
          {nom && nom.open ? (
            <div>
              <div className="center" style={{margin:"10px 0"}}><span className="big" style={{color:"var(--blood)"}}>{yes}</span> <span className="note">/ {threshold} needed · seat {nom.nominee} nominated by seat {nom.nominator}</span></div>
              <button className="btn blood" onClick={async()=>{
                let ob = block;
                if(yes>=threshold && (!block || yes>block.votes)) ob = { seat:nom.nominee, votes:yes };
                await dbUpdateRoom(code,{ nomination:null, on_block:ob }, setErr);
              }}>Close this vote</button>
            </div>
          ) : (
            <div className="note" style={{marginTop:8}}>Players nominate from their phones. When a nomination appears, it opens a live vote automatically.</div>
          )}
        </div>
        <div className="card center">
          <div className="row">
            <button className="btn ghostb" onClick={()=>setPhase({ phase:"night", night_num:room.night_num+1, nomination:null, on_block:null })}>Nightfall 🌙</button>
            <button className="btn blood" disabled={!block} onClick={async()=>{
              const victim = list.find(p=>p.seat===block.seat);
              if(victim) await dbUpdatePlayer(victim.id,{alive:false},setErr);
              await dbUpdateRoom(code,{ on_block:null, nomination:null }, setErr);
            }}>Execute {block?`seat ${block.seat}`:""} 🩸</button>
          </div>
          <div className="row" style={{marginTop:10}}>
            <button className="btn" style={{color:"var(--good)",borderColor:"var(--good)"}} onClick={()=>setPhase({phase:"over",winner:"good"})}>Good wins</button>
            <button className="btn" style={{color:"var(--evil)",borderColor:"var(--evil)"}} onClick={()=>setPhase({phase:"over",winner:"evil"})}>Evil wins</button>
          </div>
        </div>
      </Shell>
    );
  }

  /* ---- Over ---- */
  if(room.phase==="over"){
    return <GameOver room={room} players={players} code={code} isST={true} onReset={()=>setPhase({phase:"lobby",winner:null,nomination:null,on_block:null,day_num:0,night_num:0})} />;
  }
  return <Splash/>;
}

function RolePicker({ seat, current, onPick }){
  return (
    <div className="card">
      <div className="label">Character for seat {seat}</div>
      {TYPE_ORDER.map(t=>(
        <div key={t} style={{marginBottom:10}}>
          <div className="tallyl" style={{marginBottom:6}}>{TYPE_LABEL[t]}</div>
          <div className="grid">
            {Object.keys(ROLES).filter(k=>ROLES[k].type===t).map(k=>(
              <button key={k} className={"rchip"+(current===k?" on":"")} onClick={()=>onPick(k)}>
                <div className="rn">{ROLES[k].name}</div>
                <div className="rt">{ROLES[k].action?ACTION_LABEL[ROLES[k].action]:"info / passive"}</div>
              </button>
            ))}
          </div>
        </div>
      ))}

function Setup({ code, list, d, counts, onBack, onBegin, setErr, refetch }){
  const [pick,setPick] = useState(null); // seat currently editing
  const assign = async (seat, roleKey)=>{
    const p = list.find(x=>x.seat===seat);
    if(!p) return;
    await dbUpdatePlayer(p.id,{ role:roleKey, role_type: ROLES[roleKey].type }, setErr);
    setPick(null); refetch();
  };
  const allAssigned = list.every(p=>p.role);
  return (
    <Shell code={code} who="Storyteller 👑" phase="Assign roles">
      {d && (
        <div className="card">
          <div className="label">Standard mix for {list.length} players</div>
          <div className="row" style={{gap:8}}>
            {TYPE_ORDER.map((t,i)=>(
              <div key={t} className="center" style={{background:"var(--velvet)",border:"1px solid var(--haze)",borderRadius:12,padding:"8px 4px"}}>
                <div className="big" style={{fontSize:22, color: counts[i]===d[i]?"var(--mint)":"var(--candle)"}}>{counts[i]}/{d[i]}</div>
                <div className="tallyl">{TYPE_LABEL[t]}</div>
              </div>
            ))}
          </div>
          <div className="note" style={{marginTop:8}}>Grimoire freedom is yours — the Baron and other setup effects can change these targets.</div>
        </div>
      )}
      <div className="card">
        <div className="label">Seats — tap the character to change it</div>
        {list.map(p=>(
          <div className="prow" key={p.id}>
            <div className="pname"><span className="seatn">{p.seat}</span>{p.name}
              {p.role && ROLES[p.role] && <span className={"pill "+TYPE_CLS[ROLES[p.role].type]} style={{marginLeft:8}}>{TYPE_LABEL[ROLES[p.role].type][0]}</span>}
            </div>
            <button className="pill" style={{cursor:"pointer", color:p.role?"var(--mist)":"var(--dim)", borderColor:p.role?"var(--candle)":"var(--haze)"}}
              onClick={()=>setPick(pick===p.seat?null:p.seat)}>{p.role?ROLES[p.role].name:"choose"}</button>
          </div>
        ))}
        <button className="btn ghostb" style={{marginTop:12}} onClick={async()=>{
          // quick random legal-ish fill for testing (uses the standard mix if known)
          const mix = d ? [].concat(...TYPE_ORDER.map((t,i)=>Array(d[i]).fill(t))) : list.map(()=> "townsfolk");
          const shuffled = [...mix].sort(()=>Math.random()-0.5);
          for(let i=0;i<list.length;i++){
            const t = shuffled[i] || "townsfolk";
            const pool = Object.keys(ROLES).filter(k=>ROLES[k].type===t);
            const rk = pool[Math.floor(Math.random()*pool.length)];
            await dbUpdatePlayer(list[i].id,{ role:rk, role_type:t }, setErr);
          }
          setPick(null); refetch();
        }}>🎲 Random fill (test)</button>
      </div>
      {pick!=null && (
        <RolePicker seat={pick} current={(list.find(x=>x.seat===pick)||{}).role} onPick={(k)=>assign(pick,k)} />
      )}
      <div className="row">
        <button className="btn ghostb" onClick={onBack}>← Lobby</button>
        <button className="btn primary" disabled={!allAssigned} onClick={onBegin}>{allAssigned?"Begin Night 1 🌙":"Assign every seat"}</button>
      </div>
    </Shell>
  );
}

/* ============ Player ============ */
function PlayerCore({ code, name, asId }){
  const { room, players, setErr, refetch } = useRoom(code);
  const actingId = asId || MYID;
  const me = players.find(p=>p.id===actingId) || null;
  useEffect(()=>{ document.body.className = room ? room.phase : ""; },[room && room.phase]);

  // real players claim a seat; in demo hotseat (asId) the seat already exists
  useEffect(()=>{
    if(asId || !room || me) return;
    (async()=>{
      const ps = await sb.from("botc_players").select("seat").eq("code",code).not("seat","is",null);
      const used = new Set((ps.data||[]).map(x=>x.seat));
      let seat=1; while(used.has(seat)) seat++;
      await sb.from("botc_players").upsert({ id:MYID, code, name, seat, alive:true, is_storyteller:false });
      refetch();
    })();
  },[room]);

  if(!room) return <Splash/>;
  if(!me) return <Splash label="Taking a seat…"/>;
  const R = me.role && ROLES[me.role];

  if(room.phase==="lobby" && !asId){
    return <WhoRuns code={code} room={room} players={players} me={me} setErr={setErr} refetch={refetch} />;
  }

  if(room.phase==="lobby" || room.phase==="setup"){
    return (
      <Shell code={code} who={`Seat ${me.seat} · ${me.name}`} phase="Waiting for the Storyteller">
        <div className="card center">
          <div style={{fontSize:44}}>🕰️</div>
          <div className="note" style={{marginTop:8}}>You’re seated. The Storyteller is gathering the town and dealing roles. Keep your phone to yourself.</div>
        </div>
      </Shell>
    );
  }

  if(room.phase==="night"){
    return <PlayerNight code={code} room={room} me={me} R={R} setErr={setErr} refetch={refetch} players={players} />;
  }

  if(room.phase==="day"){
    return <PlayerDay code={code} room={room} me={me} players={players} setErr={setErr} refetch={refetch} />;
  }

  if(room.phase==="over"){
    const au = !!(room.settings && room.settings.auto);
    return <GameOver room={room} players={players} code={code} me={me} isST={au}
      onReset={au ? ()=>dbUpdateRoom(code,{ phase:"lobby", winner:null, nomination:null, on_block:null, day_num:0, night_num:0, settings:{ ...(room.settings||{}), runner:null, last_exec:null } }, setErr) : undefined} />;
  }
  return <Splash/>;
}

function Player({ code, name, asId, onRole }){
  const { room, players, setErr } = useRoom(code);
  const st = (room && room.settings) || {};
  useEffect(()=>{ if(!asId && onRole && room && room.host_id===MYID) onRole("host"); },[room && room.host_id]);
  const runner = !asId && !!st.auto && st.runner===MYID;
  useEffect(()=>{
    if(!runner) return;
    let busy=false;
    const iv = setInterval(async()=>{ if(busy) return; busy=true; try{ await autoStep(code,setErr); }catch(e){ console.error(e); } busy=false; },1500);
    return ()=>clearInterval(iv);
  },[runner,code]);
  const runnerRow = st.runner ? players.find(p=>p.id===st.runner) : null;
  const takeOver = async ()=>{ await sb.from("botc_rooms").update({ settings:{ ...st, runner:MYID } }).eq("code",code); };
  return (
    <React.Fragment>
      <PlayerCore code={code} name={name} asId={asId} />
      {!asId && st.auto && room && room.phase!=="lobby" && room.phase!=="over" && (
        <div style={{position:"fixed",left:0,right:0,bottom:0,zIndex:40,padding:"6px 10px calc(6px + env(safe-area-inset-bottom,0px))",background:"rgba(10,8,20,.92)",borderTop:"1px solid var(--haze)",fontSize:11,color:"var(--dim)",textAlign:"center"}}>
          🤖 Host-less · run by {runnerRow?runnerRow.name:"nobody"}{runner?" (you)":""}
          {!runner && <button className="pill" style={{marginLeft:8,cursor:"pointer"}} onClick={takeOver}>run from my phone</button>}
        </div>
      )}
    </React.Fragment>
  );
}

function RoleReveal({ R }){
  if(!R) return null;
  const teamGood = R.type==="townsfolk"||R.type==="outsider";
  return (
    <div className="rolecard">
      <span className={"teamtag "+TYPE_CLS[R.type]} style={{background: R.type==="demon"?"var(--blood)":"transparent", border:"1px solid currentColor"}}>{TYPE_LABEL[R.type]} · {teamGood?"GOOD":"EVIL"}</span>
      <div className="rname">{R.name}</div>
      <div className="rrem">{R.rem}</div>
    </div>
  );
}

function PlayerNight({ code, room, me, R, setErr, refetch, players }){
  const first = room.night_num<=1;
  const hasAction = R && R.action && (first ? R.fn : R.on) && !(R.name==="Imp" && first);
  const need2 = R && R.action==="target2";
  const [sel,setSel] = useState([]);
  const others = seated(players).filter(p=>p.seat!==me.seat);
  const submitted = me.night_action && me.night_action.target!=null;

  const toggle = (seat)=>{
    if(need2){ setSel(s=> s.includes(seat)? s.filter(x=>x!==seat) : (s.length<2?[...s,seat]:[s[1],seat])); }
    else setSel([seat]);
  };
  const submit = async ()=>{
    if(!sel.length) return;
    await dbUpdatePlayer(me.id,{ night_action:{ target:sel[0], target2:sel[1]??null } }, setErr);
    refetch();
  };

  if(!me.alive){
    return (
      <Shell code={code} who={`Seat ${me.seat} · ${me.name}`} phase={`Night ${room.night_num}`} icon="🌙">
        <div className="card center"><div style={{fontSize:40}}>💀</div><div className="note" style={{marginTop:8}}>You are dead. Rest quietly — you still have one vote to cast, forever. Play a round while the town sleeps.</div></div>
        <MiniGame me={me} code={code} night={room.night_num} />
      </Shell>
    );
  }

  return (
    <Shell code={code} who={`Seat ${me.seat} · ${me.name}`} phase={`Night ${room.night_num}`} icon="🌙">
      {hasAction && !submitted && (
        <div className="card">
          <div className="label">{R.name} · {ACTION_LABEL[R.action]}</div>
          <div className="grid">
            {others.filter(p=> R.action==="protect"? true : true).map(p=>(
              <button key={p.id} className={"rchip"+(sel.includes(p.seat)?" on":"")} onClick={()=>toggle(p.seat)} disabled={!p.alive && R.action==="kill"?false:false}>
                <div className="rn">{p.name}{!p.alive?" 💀":""}</div>
                <div className="rt">seat {p.seat}</div>
              </button>
            ))}
          </div>
          <button className="btn primary" style={{marginTop:12}} disabled={need2? sel.length!==2 : sel.length!==1} onClick={submit}>
            {need2? `Confirm ${sel.length}/2` : "Confirm choice"}
          </button>
        </div>
      )}
      {hasAction && submitted && (
        <div className="card center"><div className="note">{room.settings && room.settings.auto ? "Choice locked in. 🔒" : "Choice sent to the Storyteller. 🔒"}</div></div>
      )}
      {!hasAction && R && (
        <div className="card">
          <div className="label">{R.name}</div>
          <div className="note">{R.rem} {(R.fn&&first)||(R.on&&!first) ? "The Storyteller may wake you tonight — keep playing until then." : "Nothing to do at night — blend in and play."}</div>
        </div>
      )}
      {room.settings && room.settings.auto && <AutoInfo me={me} day={false} />}
      <MiniGame me={me} code={code} night={room.night_num} />
    </Shell>
  );
}

/* Everyone plays at night so no one's behaviour reveals whether they have an action. */
function MiniGame({ me, code, night }){
  const [idx,setIdx] = useState(0);
  const [ans,setAns] = useState("");
  const [score,setScore] = useState(()=> (me.minigame&&me.minigame.score)||0 );
  const [streak,setStreak] = useState(0);
  const [started,setStarted] = useState(false);
  const scoreRef = useRef(score);
  const inputRef = useRef(null);
  const q = puzzleAt(code, night||1, idx);

  // random 1-3s stagger so no one's start cadence reveals whether they acted
  useEffect(()=>{
    const t = setTimeout(()=>{ setStarted(true); if(inputRef.current) inputRef.current.focus(); }, 1000 + Math.floor(Math.random()*2000));
    return ()=>clearTimeout(t);
  },[]);
  useEffect(()=>{
    const id=setInterval(()=>{ dbUpdatePlayer(me.id,{ minigame:{ score:scoreRef.current } }); }, 4000);
    return ()=>clearInterval(id);
  },[]);
  const check = (val)=>{
    if(parseInt(val,10)===q.r){ const ns=score+1; setScore(ns); scoreRef.current=ns; setStreak(s=>s+1); setIdx(i=>i+1); setAns(""); }
  };
  return (
    <div className="card mg">
      <div className="label">Candlelit reckoning</div>
      {started ? (
        <React.Fragment>
          <div className="mgq">{q.a} {q.op} {q.b}</div>
          <input ref={inputRef} className="inp mono" style={{textAlign:"center",fontSize:22,letterSpacing:"normal"}} inputMode="numeric" value={ans}
            onChange={e=>{ const v=e.target.value.replace(/[^0-9-]/g,""); setAns(v); check(v); }} placeholder="?" />
          <div className="mgs"><span className="tallyl">Solved <b>{score}</b></span><span className="tallyl">Streak <b>{streak}</b></span></div>
        </React.Fragment>
      ) : (
        <div className="mgq" style={{fontSize:22,color:"var(--dim)"}}>the town settles…</div>
      )}
    </div>
  );
}

function PlayerDay({ code, room, me, players, setErr, refetch }){
  const auto = !!(room.settings && room.settings.auto);
  const readyNow = !!(me.night_action && me.night_action.ready);
  const nom = room.nomination;
  const alive = livingCount(players);
  const threshold = Math.ceil(alive/2);
  const others = seated(players).filter(p=>p.seat!==me.seat);
  const [nominee,setNominee] = useState(null);

  // a dead player can only vote once, ever
  const canVote = me.alive || !me.used_ghost_vote;
  const myVote = nom && nom.votes ? nom.votes[me.seat] : undefined;

  const nominate = async ()=>{
    if(nominee==null) return;
    await dbUpdateRoom(code,{ nomination:{ nominator:me.seat, nominee, open:true, votes:{}, t:Date.now() } }, setErr);
    setNominee(null);
  };
  const castVote = async (v)=>{
    if(!canVote || !nom || !nom.open) return;
    const votes = { ...(nom.votes||{}), [me.seat]: v };
    await dbUpdateRoom(code,{ nomination:{ ...nom, votes } }, setErr);
    if(!me.alive && v) await dbUpdatePlayer(me.id,{ used_ghost_vote:true }, setErr);
    refetch();
  };

  return (
    <Shell code={code} who={`Seat ${me.seat} · ${me.name}${me.alive?"":" 💀"}`} phase={`Day ${room.day_num}`} icon="☀️">
      {auto && <AutoInfo me={me} day={true} />}
      <TownCircle players={players} nomination={nom} showVotes={true} />
      {nom && nom.open ? (
        <div className="card center">
          <div className="label">Vote — seat {nom.nominee} on trial</div>
          <div className="note" style={{marginBottom:10}}>{Object.values(nom.votes||{}).filter(Boolean).length} / {threshold} to put them on the block.</div>
          {canVote ? (
            <div className="row">
              <button className={"btn"+(myVote===true?" primary":"")} onClick={()=>castVote(true)}>✋ Aye</button>
              <button className={"btn"+(myVote===false?" ghostb":"")} onClick={()=>castVote(false)}>Nay</button>
            </div>
          ) : <div className="note">Your ghost vote is spent.</div>}
        </div>
      ) : (
        <div className="card">
          <div className="label">Nominate for execution</div>
          {me.alive ? (
            <React.Fragment>
              <div className="grid">
                {others.filter(p=>p.alive).map(p=>(
                  <button key={p.id} className={"rchip"+(nominee===p.seat?" on":"")} onClick={()=>setNominee(nominee===p.seat?null:p.seat)}>
                    <div className="rn">{p.name}</div><div className="rt">seat {p.seat}</div>
                  </button>
                ))}
              </div>
              <button className="btn blood" style={{marginTop:12}} disabled={nominee==null} onClick={nominate}>Nominate seat {nominee??"—"}</button>
            </React.Fragment>
          ) : <div className="note">The dead cannot nominate. Wait for a vote to spend your final say.</div>}
        </div>
      )}
      {auto && me.alive && (
        <div className="card center">
          <button className={"btn"+(readyNow?" ghostb":" primary")} onClick={async()=>{ await dbUpdatePlayer(me.id,{ night_action: readyNow?null:{ ready:true } }, setErr); refetch(); }}>{readyNow?"Not ready yet":"🌙 I'm ready for night"}</button>
          <div className="note" style={{marginTop:8}}>Night falls when every living player is ready (or after 10 minutes). Whoever is on the block is executed at nightfall.</div>
        </div>
      )}
    </Shell>
  );
}

/* ============ Big shared screen (?screen=CODE) ============ */
function Screen({ code }){
  const { room, players } = useRoom(code, true);
  useEffect(()=>{ document.body.className = room ? room.phase : ""; },[room && room.phase]);
  if(!room) return <Splash label={"Screen · "+code}/>;
  const nom = room.nomination;
  const alive = livingCount(players);
  const threshold = Math.ceil(alive/2);
  const phaseLabel = room.phase==="night"?`Night ${room.night_num}`
    : room.phase==="day"?`Day ${room.day_num}`
    : room.phase==="lobby"?"Gather the town"
    : room.phase==="setup"?"Roles being dealt"
    : room.phase==="over"?"The town has spoken":"";
  const icon = room.phase==="night"?"🌙":room.phase==="day"?"☀️":"🕰️";
  return (
    <div className="wrap">
      <div className="top"><div className="brand">🩸 Clocktower · {code}</div><div className="ver">screen · {alive} alive</div></div>
      <div className="phase">{icon} {phaseLabel}</div>
      {room.phase==="lobby" ? (
        <div className="card center">
          <div className="code">{code}</div>
          <QR text={location.origin+location.pathname+"?join="+code} size={180}/>
          <div className="hint">Scan to take a seat.</div>
          <div className="note" style={{marginTop:6}}>{seated(players).length} seated</div>
        </div>
      ) : room.phase==="over" ? (
        <div className="card center"><div className="big" style={{fontSize:40, color: room.winner==="evil"?"var(--evil)":"var(--good)"}}>{room.winner==="evil"?"Evil wins 🩸":"Good wins ✨"}</div></div>
      ) : (
        <React.Fragment>
          <TownCircle players={players} nomination={nom} showVotes={true} />
          {nom && nom.open ? (
            <div className="card center">
              <div className="label">On trial — seat {nom.nominee}</div>
              <div className="big" style={{fontSize:52, color:"var(--blood)"}}>{Object.values(nom.votes||{}).filter(Boolean).length}<span className="note" style={{fontSize:16}}> / {threshold}</span></div>
              <div className="tallyl">votes to put them on the block</div>
            </div>
          ) : room.on_block ? (
            <div className="card center"><div className="note">On the block: <b style={{color:"var(--mist)"}}>seat {room.on_block.seat}</b> ({room.on_block.votes} votes)</div></div>
          ) : (
            <div className="card center"><div className="note">{room.phase==="night"?"The town sleeps…":"Discuss. Nominate when ready."}</div></div>
          )}
        </React.Fragment>
      )}
    </div>
  );
}

/* ============ shared bits ============ */
function Shell({ code, who, phase, icon, children }){
  return (
    <div className="wrap">
      <div className="top">
        <div className="brand">🩸 Clocktower</div>
        <div style={{display:"flex",gap:8,alignItems:"center"}}>
          <span className="who mono" style={{fontSize:11,color:"var(--dim)"}}>{who}</span>
          <span className="ver">{VERSION}</span>
        </div>
      </div>
      {phase && <div className="phase">{icon?icon+" ":""}{phase}</div>}
      {children}
    </div>
  );
}
function Splash({ label }){ return <div className="wrap"><div className="phase">🕰️</div><div className="hint">{label||"Loading the town…"}</div></div>; }

function GameOver({ room, players, code, me, isST, onReset }){
  const sharp = [...seated(players)].sort((a,b)=>((b.minigame&&b.minigame.score)||0)-((a.minigame&&a.minigame.score)||0))[0];
  return (
    <Shell code={code} who={isST?"Storyteller 👑":(me?`Seat ${me.seat}`:"")} phase="The town has spoken">
      <div className="card center">
        <div className="big" style={{fontSize:40, color: room.winner==="evil"?"var(--evil)":"var(--good)"}}>{room.winner==="evil"?"Evil wins 🩸":"Good wins ✨"}</div>
      </div>
      {sharp && (sharp.minigame&&sharp.minigame.score) ? (
        <div className="card center"><div className="label">Sharpest mind at the table</div><div className="note"><b style={{color:"var(--candle)"}}>{sharp.name}</b> solved {sharp.minigame.score} in the dark.</div></div>
      ) : null}
      <div className="card">
        <div className="label">Final roles</div>
        {seated(players).map(p=>(
          <div className={"prow"+(p.alive?"":" dead")} key={p.id}>
            <div className="pname"><span className="seatn">{p.seat}</span>{p.name}</div>
            {p.role && ROLES[p.role] && <span className={"pill "+TYPE_CLS[ROLES[p.role].type]}>{ROLES[p.role].name}</span>}
          </div>
        ))}
      </div>
      {isST && <button className="btn primary go" onClick={onReset}>New game, same town →</button>}
    </Shell>
  );
}

/* ============ Root ============ */
/* ============ Demo hotseat: one device plays the ST + all seats ============ */
function DemoController({ code }){
  const { players, room } = useRoom(code, true);
  const [acting,setActing] = useState("ST"); // "ST" or a seat id
  const list = seated(players);
  const actingSeat = acting==="ST" ? null : list.find(p=>p.id===acting);

  return (
    <div>
      <div style={{position:"sticky",top:"env(safe-area-inset-top,0px)",zIndex:50,background:"rgba(10,8,20,.92)",backdropFilter:"blur(6px)",borderBottom:"1px solid var(--haze)",padding:"8px 10px"}}>
        <div style={{display:"flex",gap:6,overflowX:"auto",alignItems:"center"}}>
          <span className="mono" style={{fontSize:10,color:"var(--candle)",letterSpacing:".1em",flexShrink:0}}>DEMO ▸</span>
          <button className={"chipd"+(acting==="ST"?" on":"")} onClick={()=>setActing("ST")}>👑 ST</button>
          {list.map(p=>{
            const R = p.role && ROLES[p.role];
            return (
              <button key={p.id} className={"chipd"+(acting===p.id?" on":"")+(p.alive?"":" gone")} onClick={()=>setActing(p.id)} title={p.name}>
                {p.seat}{R?" "+R.name.split(" ")[0].slice(0,4):""}{p.alive?"":" 💀"}
              </button>
            );
          })}
        </div>
        {actingSeat && <div className="mono" style={{fontSize:10,color:"var(--dim)",marginTop:5}}>playing seat {actingSeat.seat} · {actingSeat.name}{actingSeat.role?" · "+ROLES[actingSeat.role].name:""}</div>}
      </div>
      {acting==="ST"
        ? <Storyteller code={code} name={localStorage.getItem("botc_name")||"Storyteller"} />
        : <Player key={acting} code={code} asId={acting} />}
    </div>
  );
}

function App(){
  const params = new URLSearchParams(location.search);
  const screen = (params.get("screen")||"").toUpperCase();
  const hostResume = (params.get("host")||"").toUpperCase();
  const demoResume = params.get("demo")==="1";
  const myName = localStorage.getItem("botc_name")||"Storyteller";
  const [mode,setMode] = useState(
    screen ? {role:"screen",code:screen}
    : hostResume ? {role: demoResume?"demo":"host", code:hostResume, name:myName}
    : null
  );

  const newCode = async ()=>{
    let code, tries=0;
    do{ code=randCode(); const ex=await sb.from("botc_rooms").select("code").eq("code",code).maybeSingle(); if(!ex.data) break; }while(++tries<8);
    return code;
  };

  useEffect(()=>{ const E=window.HUB&&HUB.entry&&HUB.entry(); const nm=(localStorage.getItem("hub_name")||localStorage.getItem("botc_name")||"").trim(); if(!E||!nm||!sbReady) return;
    localStorage.setItem("botc_name",nm);
    /* lobby entry: everyone sits down as a player; the table then picks a Storyteller or goes host-less */
    const toPlayer=()=>{ history.replaceState(null,"","?join="+E.code); setMode({role:"player",code:E.code,name:nm}); };
    const make=()=>sb.from("botc_rooms").insert({ code:E.code, host_id:null, phase:"lobby", settings:{} });
    (async()=>{ try{ if(E.role==="host"){ await make(); toPlayer(); return; }
      const ok=await HUB.waitRoom("botc_rooms",E.code,20000);
      if(!ok) await make();
      toPlayer(); }catch(e){} })(); },[]);

  if(!sbReady) return <div className="wrap"><div className="title">Clocktower</div><div className="err">Supabase not configured.</div></div>;
  if(mode && mode.role==="screen") return <Screen code={mode.code} />;
  if(mode && mode.role==="demo") return <DemoController code={mode.code} />;
  const switchRole = (role)=>{ try{ history.replaceState(null,"",(role==="host"?"?host=":"?join=")+mode.code); }catch(e){} setMode({ role, code:mode.code, name:mode.name }); };
  if(mode && mode.role==="host") return <Storyteller code={mode.code} name={mode.name} onRole={switchRole} />;
  if(mode && mode.role==="player") return <Player code={mode.code} name={mode.name} onRole={switchRole} />;

  return <Landing
    onHost={async(name)=>{
      const code = await newCode();
      await sb.from("botc_rooms").insert({ code, host_id:MYID, phase:"lobby" });
      await sb.from("botc_players").upsert({ id:MYID, code, name, is_storyteller:true, seat:null });
      history.replaceState(null,"","?host="+code);
      setMode({role:"host",code,name});
    }}
    onJoin={(code,name)=>{ history.replaceState(null,"","?join="+code); setMode({role:"player",code,name}); }}
    onDemo={async(n)=>{
      const code = await newCode();
      await sb.from("botc_rooms").insert({ code, host_id:MYID, phase:"lobby", settings:{ demo:true } });
      const rows = [{ id:MYID, code, name:myName, is_storyteller:true, seat:null }];
      for(let s=1; s<=n; s++){ rows.push({ id:"demo_"+code+"_"+s, code, name:DEMO_NAMES[s-1]||("P"+s), seat:s, alive:true, is_storyteller:false }); }
      await sb.from("botc_players").upsert(rows);
      history.replaceState(null,"","?host="+code+"&demo=1");
      setMode({role:"demo",code,name:myName});
    }}
  />;
}

ReactDOM.createRoot(document.getElementById("root")).render(<App/>);
</script>
</body>
</html>
