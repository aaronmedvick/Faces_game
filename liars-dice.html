<style>

.loserTag { font-size:11px; font-weight:800; color:var(--lose); margin-left:auto; white-space:nowrap; }

.winName { font-family:'Fraunces',serif; font-size:44px; font-weight:600; color:var(--candle); text-align:center; margin:6px 0; }

button:focus-visible { outline:2px solid var(--candle); outline-offset:2px; }
@keyframes rollin { from { transform:translateY(-8px) rotate(-8deg); opacity:0; } to { transform:none; opacity:1; } }
.rollin { animation:rollin .35s ease-out both; }
@media (prefers-reduced-motion: reduce) { * { animation:none !important; } }
/* hero */
.heroWrap { display:flex; justify-content:center; margin:10px 0 0; }
.heroWrap svg { width:100%; max-width:290px; height:auto; overflow:visible; }
.tagline { text-align:center; color:var(--dim); font-size:12px; letter-spacing:.28em; text-transform:uppercase; margin-bottom:18px; }

.dieFloatA, .dieFloatB, .dieTumble { transform-box:fill-box; transform-origin:center; }

.dieFloatB { animation:floatB 6.1s ease-in-out infinite; }

@keyframes tumble { 0%{ transform:translateY(0) rotate(-11deg); } 50%{ transform:translateY(-11px) rotate(13deg); } 100%{ transform:translateY(0) rotate(-11deg); } }

/* poker digit tiles + cup + custom heckle */
.digitTile { position:relative; background:var(--bone); color:var(--ink); display:inline-flex; align-items:center; justify-content:center; font-family:'JetBrains Mono',monospace; font-weight:800; box-shadow:0 6px 10px rgba(0,0,0,.35); }

/* ============ SFX (Web Audio, no assets) ============ */
const SFX = (function(){
  let ctx=null, muted = ls.get("ld_muted")==="1";
  const ac = ()=>{ if(!ctx){ try{ ctx = new (window.AudioContext||window.webkitAudioContext)(); }catch(e){} } return ctx; };
  const unlock = ()=>{ const c=ac(); if(c && c.state==="suspended"){ try{ c.resume(); }catch(e){} } };
  function noiseBuf(c,dur){ const n=Math.floor(c.sampleRate*dur); const b=c.createBuffer(1,n,c.sampleRate); const d=b.getChannelData(0); for(let i=0;i<n;i++) d[i]=Math.random()*2-1; return b; }
  // one die "clack": short filtered-noise burst + a woody tap
  function clack(c,t,gain,freq){
    const s=c.createBufferSource(); s.buffer=noiseBuf(c,0.05);
    const bp=c.createBiquadFilter(); bp.type="bandpass"; bp.frequency.value=freq; bp.Q.value=1.3;
    const g=c.createGain(); g.gain.setValueAtTime(0,t); g.gain.linearRampToValueAtTime(gain,t+0.004); g.gain.exponentialRampToValueAtTime(0.0007,t+0.06);
    s.connect(bp); bp.connect(g); g.connect(c.destination); s.start(t); s.stop(t+0.09);
    const o=c.createOscillator(); o.type="triangle"; o.frequency.value=freq*0.5;
    const og=c.createGain(); og.gain.setValueAtTime(0,t); og.gain.linearRampToValueAtTime(gain*0.5,t+0.003); og.gain.exponentialRampToValueAtTime(0.0006,t+0.05);
    o.connect(og); og.connect(c.destination); o.start(t); o.stop(t+0.06);
  }
  function roll(){ if(muted) return; const c=ac(); if(!c) return; unlock(); let t=c.currentTime;
    const N=10+Math.floor(Math.random()*4);
    for(let i=0;i<N;i++){ t += 0.02+Math.random()*0.045; clack(c,t,0.10+Math.random()*0.06,1200+Math.random()*1600); }
    clack(c,t+0.09,0.22,900); clack(c,t+0.17,0.16,1500);   // settle
  }
  function lose(){ if(muted) return; const c=ac(); if(!c) return; const t=c.currentTime;
    const o=c.createOscillator(); o.type="sine"; o.frequency.setValueAtTime(180,t); o.frequency.exponentialRampToValueAtTime(58,t+0.26);
    const g=c.createGain(); g.gain.setValueAtTime(0.001,t); g.gain.linearRampToValueAtTime(0.32,t+0.01); g.gain.exponentialRampToValueAtTime(0.0006,t+0.3);
    o.connect(g); g.connect(c.destination); o.start(t); o.stop(t+0.32); clack(c,t,0.16,520);
  }
  function win(){ if(muted) return; const c=ac(); if(!c) return; const t=c.currentTime;
    [523.25,659.25,783.99,1046.5].forEach((f,i)=>{ const tt=t+i*0.12; const o=c.createOscillator(); o.type="triangle"; o.frequency.value=f;
      const g=c.createGain(); g.gain.setValueAtTime(0.0001,tt); g.gain.linearRampToValueAtTime(0.22,tt+0.02); g.gain.exponentialRampToValueAtTime(0.0006,tt+0.5);
      o.connect(g); g.connect(c.destination); o.start(tt); o.stop(tt+0.55); });
  }
  function tick(){ if(muted) return; const c=ac(); if(!c) return; clack(c,c.currentTime,0.12,2200); }
  function call(){ if(muted) return; const c=ac(); if(!c) return; const t=c.currentTime;
    const o=c.createOscillator(); o.type="sawtooth"; o.frequency.setValueAtTime(300,t); o.frequency.exponentialRampToValueAtTime(88,t+0.36);
    const lp=c.createBiquadFilter(); lp.type="lowpass"; lp.frequency.value=1200;
    const g=c.createGain(); g.gain.setValueAtTime(0.0001,t); g.gain.linearRampToValueAtTime(0.2,t+0.02); g.gain.exponentialRampToValueAtTime(0.0005,t+0.4);
    o.connect(lp); lp.connect(g); g.connect(c.destination); o.start(t); o.stop(t+0.42);
  }
  return { unlock, roll, lose, win, tick, call, setMuted:(m)=>{ muted=m; ls.set("ld_muted",m?"1":"0"); if(!m) unlock(); }, isMuted:()=>muted };
})();

function binomAtLeast(k,n,p){ if(k<=0) return 1; if(k>n) return 0; const q=1-p; let pmf=Math.pow(q,n), cum=0; for(let i=0;i<=n;i++){ if(i>=k) cum+=pmf; pmf=pmf*((n-i)/(i+1))*(p/q); } return clamp(cum,0,1); }
function binomExact(k,n,p){ if(k<0||k>n) return 0; const q=1-p; let pmf=Math.pow(q,n); for(let i=0;i<k;i++){ pmf=pmf*((n-i)/(i+1))*(p/q); } return clamp(pmf,0,1); }

/* ============ Room (lobby + play + reveal + over) ============ */
function Room({ myId, name, code, createIfMissing, onExit }){
  const [game,setGame] = useState(null);
  const [players,setPlayers] = useState([]);
  const [joined,setJoined] = useState(false);
  const [err,setErr] = useState("");
  const [pal] = useState(()=>ls.get("ld_palette")||"gr");
  useEffect(()=>{ applyPalette(pal); },[]);

  const gameRef = useRef(null); gameRef.current = game;
  const playersRef = useRef([]); playersRef.current = players;
  const resolveRef = useRef(null);
  const advanceRef = useRef(null);
  const botRef = useRef(null);
  const botTimerRef = useRef(null);
  const advSchedRef = useRef(null);
  const advTimerRef = useRef(null);
  const busyRef = useRef(false);
  const joinRef = useRef(false);
  const chanRef = useRef(null);
  const heckleAtRef = useRef(0);
  const [heckles,setHeckles] = useState([]);
  const showHeckle = (h)=>{
    const key = (h.id||randId())+"-"+Math.random().toString(36).slice(2,6);
    const item = { ...h, key };
    setHeckles(hs=>[...hs.slice(-4), item]);
    setTimeout(()=> setHeckles(hs=>hs.filter(x=>x.key!==key)), 3600);
  };

  // sound + roll animation
  const [muted,setMutedState] = useState(()=>SFX.isMuted());
  const [rolling,setRolling] = useState(false);
  const [rollFaces,setRollFaces] = useState([]);
  const [cupOn,setCupOn] = useState(()=> ls.get("ld_cup")!=="0");
  const [peek,setPeek] = useState(false);
  const [heckleText,setHeckleText] = useState("");
  const roundRef = useRef(0);
  const phaseRef = useRef(null);
  const pendingRollRef = useRef(false);
  const rollTimerRef = useRef(null);
  const toggleMute = ()=>{ const m=!muted; setMutedState(m); SFX.setMuted(m); if(!m) SFX.unlock(); };

  const refetch = async ()=>{
    if(!sb) return;
    const g = await sb.from("ld_games").select("*").eq("code",code).maybeSingle();
    setGame(g.data||null);
    const ps = await sb.from("ld_players").select("*").eq("code",code).order("num");
    setPlayers(ps.data||[]);
    return g.data;
  };

  // join / create on mount
  useEffect(()=>{
    if(!sb || joinRef.current) return;
    joinRef.current = true;
    (async()=>{
      let g = await sb.from("ld_games").select("*").eq("code",code).maybeSingle();
      if(!g.data){
        if(!createIfMissing){ setErr("No room with that code."); return; }
        const ins = await sb.from("ld_games").insert({ code, host_id:myId, phase:"lobby", round:0, wild:false, spoton:false }).select().maybeSingle();
        if(ins.error){ setErr("Couldn't create room: "+ins.error.message); return; }
        g = { data: ins.data };
      }
      // (re)insert self
      await sb.from("ld_players").delete().eq("id",myId);
      const ps = await sb.from("ld_players").select("num").eq("code",code);
      const nums = (ps.data||[]).map(p=>p.num);
      let n=1; while(nums.indexOf(n)!==-1) n++;
      const pi = await sb.from("ld_players").insert({ id:myId, code, name, num:n, dice:[], alive:true, ready:false, wins:0 });
      if(pi.error){ setErr("Couldn't join: "+pi.error.message); return; }
      ls.set("ld_code", code); ls.set("ld_name", name);
      setJoined(true);
      refetch();
    })();
  },[]);

  // realtime + poll
  useEffect(()=>{
    if(!sb || !joined) return;
    const ch = sb.channel("ld:"+code, { config:{ broadcast:{ self:false } } })
      .on("postgres_changes",{event:"*",schema:"public",table:"ld_games",filter:"code=eq."+code},()=>refetch())
      .on("postgres_changes",{event:"*",schema:"public",table:"ld_players",filter:"code=eq."+code},()=>refetch())
      .on("broadcast",{ event:"heckle" },({payload})=> showHeckle(payload))
      .subscribe();
    chanRef.current = ch;
    const poll = setInterval(refetch, 2500);
    return ()=>{ sb.removeChannel(ch); chanRef.current=null; clearInterval(poll); };
  },[joined]);

  const sendHeckle = (h)=>{
    const now = Date.now();
    if(now - heckleAtRef.current < 1000) return;   // gentle anti-spam
    heckleAtRef.current = now;
    const payload = { id:randId(), from:(me&&me.name)||"Someone", emoji:h.emoji, text:h.text };
    try{ chanRef.current && chanRef.current.send({ type:"broadcast", event:"heckle", payload }); }catch(e){}
    showHeckle(payload);   // show to myself immediately (self:false on the channel)
  };

  const me = players.find(p=>p.id===myId);
  const amHost = game && game.host_id===myId;
  const myNum = me ? me.num : null;

  // round change -> roll sound + arm the shake for when my dice arrive
  useEffect(()=>{
    if(!game || game.phase!=="playing") return;
    if(game.round!==roundRef.current){
      roundRef.current = game.round;
      if(game.round>0){ pendingRollRef.current = true; SFX.roll(); setPeek(false); }
    }
  },[game]);
  // my dice arrived while a roll is armed -> shake + tumble to values
  useEffect(()=>{
    if(!pendingRollRef.current || !me || !me.dice || me.dice.length===0) return;
    pendingRollRef.current = false;
    let reduce=false; try{ reduce=window.matchMedia("(prefers-reduced-motion: reduce)").matches; }catch(e){}
    if(reduce) return;
    const cnt = me.dice.length; let ticks=0;
    setRolling(true);
    clearInterval(rollTimerRef.current);
    rollTimerRef.current = setInterval(()=>{
      setRollFaces(Array.from({length:cnt},()=>1+Math.floor(Math.random()*6)));
      if(++ticks>7){ clearInterval(rollTimerRef.current); setRolling(false); }
    },70);
  },[me]);
  useEffect(()=>()=>clearInterval(rollTimerRef.current),[]);
  // phase transitions -> reveal / lose / win sounds
  useEffect(()=>{
    if(!game) return;
    const prev = phaseRef.current; phaseRef.current = game.phase;
    if(prev===game.phase) return;
    if(game.phase==="reveal"){
      SFX.roll();
      const la = game.last_action;
      if(la && la.loserNum!=null) setTimeout(()=>SFX.lose(), 620);
    } else if(game.phase==="over"){
      setTimeout(()=>SFX.win(), 220);
    }
  },[game]);

  /* ---------- shared action writers (say = optional bot banter) ---------- */
  const placeBid = async (num, qty, face, say=null)=>{
    const nxt = nextNum(num, sortedAliveNums(playersRef.current));
    await sb.from("ld_games").update({ bid:{qty,face,by:num,say}, turn:nxt }).eq("code",code);
  };
  const challenge = async (num, say=null)=>{ await sb.from("ld_games").update({ pending:{type:"challenge",by:num,say} }).eq("code",code); };
  const spoton = async (num, say=null)=>{ await sb.from("ld_games").update({ pending:{type:"spoton",by:num,say} }).eq("code",code); };

  /* ---------- host: resolve a pending challenge/spoton ---------- */
  const resolveChallenge = async (pending)=>{
    const g = gameRef.current, ps = playersRef.current;
    const bid = g.bid; if(!bid) return;
    const wild = g.wild && (g.mode!=="poker");
    let actual = 0;
    ps.forEach(p=>{ if(p.alive && p.dice) p.dice.forEach(d=>{ if(d===bid.face || (wild && bid.face!==1 && d===1)) actual++; }); });
    const caller = ps.find(p=>p.num===pending.by);
    let loserNum=null, correct=false, gainNum=null;
    if(pending.type==="challenge"){
      const bidTrue = actual >= bid.qty;
      correct = !bidTrue;               // caller correct if the bid was a lie
      loserNum = bidTrue ? pending.by : bid.by;
    } else { // spot on
      correct = (actual === bid.qty);
      if(correct){ gainNum = pending.by; } else { loserNum = pending.by; }
    }
    const snapshot = ps.filter(p=>p.alive).map(p=>({ num:p.num, name:p.name, dice:p.dice, bot:isBot(p.id) }));
    const sig = g.round+":"+pending.type+":"+pending.by;
    const hostP = ps.find(p=>p.id===g.host_id);
    const hostAlive = !!(hostP && hostP.alive && hostP.dice && hostP.dice.length>0);
    const auto = (g.autonext!==false) || !hostAlive;    // auto if toggle on, or the host is eliminated
    const advanceAt = Date.now() + (auto ? 5000 : 25000);
    await sb.from("ld_games").update({
      phase:"reveal", pending:null,
      last_action:{ type:pending.type, by:pending.by, target:bid.by, bid, actual, loserNum, gainNum, correct, wild, say:pending.say||null, auto, advanceAt, snapshot, sig }
    }).eq("code",code);
  };

  /* ---------- host: advance to next round (or game over) ---------- */
  const advanceRound = async ()=>{
    const g = gameRef.current, ps = playersRef.current;
    if(!g || g.phase!=="reveal" || !g.last_action) return;
    const la = g.last_action;
    let next = ps.map(p=>({ ...p, dice:[...(p.dice||[])] }));
    if(la.loserNum!=null){
      const L = next.find(p=>p.num===la.loserNum);
      if(L){ L.dice = L.dice.slice(0,-1); if(L.dice.length===0) L.alive=false; }
    }
    if(la.gainNum!=null){
      const G = next.find(p=>p.num===la.gainNum);
      if(G && G.dice.length<5){ G.dice = [...G.dice, 0]; }
    }
    const aliveAfter = next.filter(p=>p.alive && p.dice.length>0);

    if(aliveAfter.length<=1){
      const winner = aliveAfter[0];
      for(const p of next){ await sb.from("ld_players").update({ dice:p.dice, alive:p.alive }).eq("id",p.id); }
      if(winner){ await sb.from("ld_players").update({ wins:(winner.wins||0)+1 }).eq("id",winner.id); }
      await sb.from("ld_games").update({ phase:"over", winner: winner?winner.id:null }).eq("code",code);
      return;
    }
    // reroll everyone still alive
    for(const p of next){ if(p.alive){ p.dice = rollHand(p.dice.length, g.mode||"dice"); } }
    for(const p of next){ await sb.from("ld_players").update({ dice:p.dice, alive:p.alive }).eq("id",p.id); }
    const aliveNums = next.filter(p=>p.alive && p.dice.length>0).map(p=>p.num).sort((a,b)=>a-b);
    let startNum;
    const anchor = (la.type==="spoton") ? la.by : la.loserNum;
    if(aliveNums.indexOf(anchor)!==-1) startNum = anchor; else startNum = nextNum(anchor, aliveNums);
    await sb.from("ld_games").update({ phase:"playing", round:g.round+1, bid:null, pending:null, turn:startNum, starter:startNum, last_action:null }).eq("code",code);
  };

  const doAdvance = ()=>{
    const g = gameRef.current; if(!g || g.phase!=="reveal" || !g.last_action) return;
    const sig = g.last_action.sig;
    if(advanceRef.current===sig) return;
    advanceRef.current = sig;
    advanceRound();
  };

  /* ---------- the engine: one steady loop drives everything host-side ----------
     Runs a few times a second off the latest state (via refs), so the constant
     sync re-renders can't interfere. Whoever is the driver (the host, or the
     lowest-seat human if the host isn't in the room) resolves challenges,
     advances rounds, and plays the bots' turns. Self-heals if a step is missed. */
  const engineRef = useRef({ botSig:null, botAt:0, revealSig:null, revealAt:0 });
  useEffect(()=>{
    if(!sb || !joined) return;
    const tick = async ()=>{
      const g = gameRef.current, ps = playersRef.current;
      if(!g || !ps.length) return;
      const humans = ps.filter(p=>!isBot(p.id));
      const hostPresent = humans.some(h=>h.id===g.host_id);
      const lowHuman = humans.slice().sort((a,b)=>a.num-b.num)[0];
      const amDriver = (g.host_id===myId) || (!hostPresent && lowHuman && lowHuman.id===myId);
      if(!amDriver) return;
      const E = engineRef.current;

      // 1) resolve a pending challenge / spot-on
      if(g.phase==="playing" && g.pending && !busyRef.current){
        const sig = g.round+":"+g.pending.by+":"+g.pending.type;
        if(resolveRef.current!==sig){ resolveRef.current=sig; busyRef.current=true;
          try{ await resolveChallenge(g.pending); } finally { busyRef.current=false; } }
        return;
      }
      // 2) auto-advance the reveal at the shared advanceAt time
      if(g.phase==="reveal" && g.last_action){
        const at = g.last_action.advanceAt || 0;
        if(Date.now() >= at) doAdvance();
        return;
      }
      // 3) play a bot's turn
      if(g.phase==="playing" && !g.pending){
        const cur = ps.find(p=>p.num===g.turn && p.alive && p.dice && p.dice.length>0);
        if(cur && isBot(cur.id)){
          const per = personaFor(cur.id);
          const sig = g.round+":"+g.turn+":"+(g.bid?g.bid.qty+"-"+g.bid.face+"-"+g.bid.by:"open");
          if(E.botSig!==sig){ E.botSig=sig; E.botAt=Date.now() + (500+Math.random()*1400)*per.speed; return; }
          if(Date.now()>=E.botAt){ E.botAt=Date.now()+5000; botMove(cur); }
        }
      }
    };
    const id = setInterval(tick, 350);
    return ()=>clearInterval(id);
  },[joined]);

  /* ---------- bot brain (personas, bluffing, binomial calling) ---------- */
  const botMove = (bot)=>{
    const g = gameRef.current, ps = playersRef.current;
    if(!g || g.phase!=="playing" || g.pending) return;
    const mode = g.mode||"dice";
    const fmin = mode==="poker"?0:1, fmax = mode==="poker"?9:6;
    const alive = ps.filter(p=>p.alive && p.dice.length>0);
    const T = alive.reduce((s,p)=>s+p.dice.length,0);
    const wild = g.wild && mode!=="poker";
    const baseP = mode==="poker" ? 0.1 : (1/6);
    const my = bot.dice||[];
    const mine = (f)=> my.filter(d=> d===f || (wild && f!==1 && d===1)).length;
    const unknown = T - my.length;
    const pf = (f)=> wild ? (f===1?1/6:1/3) : baseP;   // odds an unknown die/digit shows this face
    const per = personaFor(bot.id);
    const lo = wild ? 2 : fmin;   // in dice-wild, avoid bidding 1s (they're wild)

    // OPENING BID
    if(!g.bid){
      let face;
      if(Math.random() < per.bluff*0.6){ face = fmin + Math.floor(Math.random()*(fmax-fmin+1)); }
      else { let best=fmax, bc=-1; for(let f=lo; f<=fmax; f++){ const c=mine(f); if(c>bc){ bc=c; best=f; } } face=best; }
      let qty = Math.max(1, mine(face) + Math.round(unknown*pf(face)) + (Math.random()<per.bluff ? Math.round(per.aggr) : 0));
      return placeBid(bot.num, Math.min(qty, Math.max(1,T)), face, pickSay("open",0.3));
    }

    // FACING A BID: how likely is it actually true?
    const bid = g.bid;
    const need = bid.qty - mine(bid.face);
    const pTrue = binomAtLeast(need, unknown, pf(bid.face));
    const callCut = clamp(0.18 + per.sus*0.30 + (Math.random()-0.5)*0.14, 0.05, 0.62);
    if(bid.qty > T || pTrue < 0.06 || pTrue < callCut){
      return challenge(bot.num, pickSay("call", 0.5));
    }
    if(g.spoton && per.spot && unknown<=6 && need>=0 && binomExact(need,unknown,pf(bid.face))>0.24 && Math.random()<0.45){
      return spoton(bot.num, pickSay("spot", 0.7));
    }

    // RAISE — honest bump, or a bluff
    const bluffing = Math.random() < per.bluff;
    let nf, nq;
    if(!bluffing){
      let sf=-1, sc=-1; for(let f=bid.face+1; f<=fmax; f++){ const c=mine(f); if(c>sc){ sc=c; sf=f; } }
      if(sf>bid.face && sc>=1){ nf=sf; nq=bid.qty; }
      else { let s=fmin,c=-1; for(let f=fmin;f<=fmax;f++){ const cc=mine(f); if(cc>c){ c=cc; s=f; } } nf=s; nq=bid.qty+1; }
    } else {
      const jump = 1 + Math.floor(Math.random()*Math.max(1, Math.round(per.aggr)));
      if(Math.random()<0.45 && bid.face<fmax){ nf=bid.face+1; nq=bid.qty; }
      else { nf = fmin+Math.floor(Math.random()*(fmax-fmin+1)); nq = bid.qty + jump; }
    }
    if(!higher(nq,nf,bid)){ nq=bid.qty+1; nf=bid.face; }
    if(nq>T){ return challenge(bot.num, pickSay("call",0.5)); }
    return placeBid(bot.num, nq, nf, pickSay(bluffing?"bluff":"raise", bluffing?0.5:0.3));
  };

  /* ---------- lobby actions ---------- */
  const toggleReady = async ()=>{ if(!me) return; SFX.unlock(); await sb.from("ld_players").update({ ready:!me.ready }).eq("id",myId); };
  const kick = async (id)=>{ await sb.from("ld_players").delete().eq("id",id); };
  const addBot = async ()=>{
    const nums = players.map(p=>p.num); let n=1; while(nums.indexOf(n)!==-1) n++;
    const used = players.filter(p=>isBot(p.id)).length;
    const nm = BOT_NAMES[used % BOT_NAMES.length] + " 🤖";
    await sb.from("ld_players").insert({ id:"bot_"+randId(), code, name:nm, num:n, dice:[], alive:true, ready:true, wins:0 });
  };
  const setWild = async (v)=>{ await sb.from("ld_games").update({ wild:v }).eq("code",code); };
  const setSpot = async (v)=>{ await sb.from("ld_games").update({ spoton:v }).eq("code",code); };
  const setAutonext = async (v)=>{ try{ await sb.from("ld_games").update({ autonext:v }).eq("code",code); }catch(e){} };
  const setMode = async (v)=>{ try{ await sb.from("ld_games").update({ mode:v }).eq("code",code); }catch(e){} };
  const setDollars = async (v)=>{ try{ await sb.from("ld_games").update({ dollars:v }).eq("code",code); }catch(e){} };
  const startGame = async ()=>{
    SFX.unlock();
    const roster = playersRef.current.filter(p=>p.alive!==false);
    if(roster.length<2) return;
    for(const p of roster){ await sb.from("ld_players").update({ dice:rollHand(5, gameRef.current.mode||"dice"), alive:true, ready:false }).eq("id",p.id); }
    const first = roster.map(p=>p.num).sort((a,b)=>a-b)[0];
    resolveRef.current=null; advanceRef.current=null; botRef.current=null;
    await sb.from("ld_games").update({ phase:"playing", round:1, bid:null, pending:null, turn:first, starter:first, last_action:null, winner:null }).eq("code",code);
  };
  const playAgain = async ()=>{
    for(const p of playersRef.current){ await sb.from("ld_players").update({ dice:[], alive:true, ready:isBot(p.id) }).eq("id",p.id); }
    await sb.from("ld_games").update({ phase:"lobby", round:0, bid:null, pending:null, last_action:null, winner:null }).eq("code",code);
  };
  const leave = async ()=>{ try{ await sb.from("ld_players").delete().eq("id",myId); }catch(e){} ls.del("ld_code"); onExit(); };

  /* ---------- render ---------- */
  if(err) return (<div className="wrap"><div className="top"><div className="brand">⚄ LIAR'S&nbsp;DICE</div></div><div className="card"><p style={{margin:0,lineHeight:1.5}}>{err}</p></div><button className="readyBtn" style={{marginTop:14}} onClick={onExit}>Back</button></div>);
  if(!game || !me) return (<div className="wrap"><div className="top"><div className="brand">⚄ LIAR'S&nbsp;DICE</div></div><div className="waitTurn"><div className="big">🎲</div>Connecting to room {code}…</div></div>);

  const totalDice = players.filter(p=>p.alive && p.dice).reduce((s,p)=>s+p.dice.length,0);

  if(game.phase==="lobby") return (
    <Lobby game={game} players={players} me={me} amHost={amHost} code={code} muted={muted} onMute={toggleMute}
      onReady={toggleReady} onKick={kick} onAddBot={addBot} onWild={setWild} onSpot={setSpot} onAutonext={setAutonext} onMode={setMode} onDollars={setDollars} onStart={startGame} onLeave={leave} />
  );

  const alive = players.filter(p=>p.alive);
  const iAmAlive = me.alive && me.dice && me.dice.length>0;
  const myTurn = game.phase==="playing" && !game.pending && game.turn===myNum && iAmAlive;
  const mode = game.mode||"dice";
  const dollars = mode==="poker" && !!game.dollars;
  const handWord = mode==="poker" ? "Your bill" : "Your dice";
  const totalWord = mode==="poker" ? "digits in play" : "dice on the table";

  return (
    <div className="wrap">
      {heckles.length>0 && (
        <div className="heckleToasts">
          {heckles.map(h=>(<div key={h.key} className="heckleToast"><span className="he">{h.emoji}</span> <b>{h.from}</b> {h.text}</div>))}
        </div>
      )}
      <div className="top">
        <div className="brand">⚄ LIAR'S&nbsp;DICE</div>
        <div style={{display:"flex",gap:8,alignItems:"center"}}>
          <button className={"chip"+(muted?"":" on")} onClick={toggleMute}>{muted?"🔇 Off":"🔊 On"}</button>
          <span className="who mono">{code}</span>
        </div>
      </div>
      <div className="status">
        <span className="rnd">Round {game.round}</span>
        <span className="tot"><b>{totalDice}</b> {totalWord}</span>
      </div>

      {game.phase==="over" ? (
        <GameOver game={game} players={players} amHost={amHost} mode={mode} dollars={dollars} onAgain={playAgain} onLeave={leave} />
      ) : (
      <React.Fragment>
        {/* seats */}
        <div className="seats">
          {players.slice().sort((a,b)=>a.num-b.num).map(p=>{
            const out = !p.alive || !p.dice || p.dice.length===0;
            const isTurn = game.phase==="playing" && !game.pending && game.turn===p.num && !out;
            const bidHere = game.bid && game.bid.by===p.num;
            return (
              <div key={p.id} className={"seat"+(isTurn?" turn":"")+(out?" out":"")}>
                <div className="seatL">
                  {isTurn && <span className="turnDot">▶</span>}
                  <span className="seatName">{p.name}{p.id===myId?" (you)":""}</span>
                </div>
                <div className="seatR">
                  {bidHere && <span className="bidTag">{game.bid.qty} <FaceTile mode={mode} dollars={dollars} v={game.bid.face} size={17} /></span>}
                  {out ? <span className="tot">out</span> : <Backs n={p.dice.length} sm />}
                </div>
              </div>
            );
          })}
        </div>

        {/* current bid */}
        {game.bid ? (
          <div className="bidBanner">
            <div className="who2">{(players.find(p=>p.num===game.bid.by)||{}).name} bids</div>
            <div className="amt"><span className="amtWord">{numWord(game.bid.qty)}</span><FaceTile mode={mode} dollars={dollars} v={game.bid.face} size={64} /></div>
            {game.bid.say && <div className="saybubble">“{game.bid.say}”</div>}
          </div>
        ) : (
          <div className="openMsg">{game.turn===myNum ? "You open the round — make the first bid." : ((players.find(p=>p.num===game.turn)||{}).name || "Someone") + " opens the round…"}</div>
        )}

        {/* my hand */}
        {iAmAlive && (
          <div className="myhand">
            <div className="lbl">{rolling?"Rolling…":handWord}</div>
            {rolling
              ? <div className="hand">{(rollFaces.length?rollFaces:me.dice).map((d,i)=>(<span key={i} className="shaking"><FaceTile mode={mode} dollars={dollars} v={d} size={46} /></span>))}</div>
              : (cupOn && !peek
                  ? <Cup n={me.dice.length} mode={mode} />
                  : <FaceRow dice={me.dice} size={46} glowVal={game.bid?game.bid.face:null} wild={mode!=="poker"&&game.wild} mode={mode} dollars={dollars} />)}
            {!rolling && cupOn && (
              <button className={"peekBtn"+(peek?" open":"")} onClick={()=>setPeek(v=>!v)}>{peek ? "🙈 Hide" : "👀 Peek"}</button>
            )}
            <div className="cupToggle" onClick={()=>{ const v=!cupOn; setCupOn(v); ls.set("ld_cup", v?"1":"0"); if(!v) setPeek(false); }}>
              {cupOn ? "cup on — tap to keep them shown" : "cup off — tap to hide under a cup"}
            </div>
          </div>
        )}
        {!iAmAlive && <div className="waitTurn" style={{padding:"8px 0 16px"}}>You're out — spectating till the winner.</div>}

        {/* controls */}
        {myTurn ? (
          <BidControls bid={game.bid} totalDice={totalDice} wild={mode!=="poker"&&game.wild} spoton={game.spoton} mode={mode} dollars={dollars}
            onBid={(q,f)=>{ SFX.unlock(); SFX.tick(); placeBid(myNum,q,f); }} onCall={()=>{ SFX.unlock(); SFX.call(); challenge(myNum); }} onSpot={()=>{ SFX.unlock(); SFX.call(); spoton(myNum); }} />
        ) : game.phase==="playing" ? (
          <div className="waitTurn"><div className="big">⏳</div>Waiting for <b style={{color:"var(--bone)"}}>{(players.find(p=>p.num===game.turn)||{}).name||"…"}</b></div>
        ) : null}

        {mode!=="poker" && game.wild && <div className="hint" style={{marginTop:14}}>⚀ Wild ones — 1s count as every face except when the bid is on 1s.</div>}
        {mode==="poker" && <div className="hint" style={{marginTop:14}}>💵 Liar's Poker — bid how many of a digit (0–9) are across everyone's bills.</div>}

        <div className="heckleLabel">Heckle 📣</div>
        <div className="heckleBar">
          {HECKLES.map((h,i)=>(
            <button key={i} className="heckleBtn" title={h.text} onClick={()=>{ SFX.unlock(); sendHeckle(h); }}>{h.emoji}</button>
          ))}
        </div>
        <div className="heckleSay">
          <input className="inp" style={{margin:0}} value={heckleText} maxLength={40} placeholder="say your own…"
            onChange={e=>setHeckleText(e.target.value)}
            onKeyDown={e=>{ if(e.key==="Enter" && heckleText.trim()){ SFX.unlock(); sendHeckle({emoji:"💬", text:heckleText.trim()}); setHeckleText(""); } }} />
          <button className="primary" style={{flex:"0 0 auto",padding:"12px 16px"}} disabled={!heckleText.trim()} onClick={()=>{ if(heckleText.trim()){ SFX.unlock(); sendHeckle({emoji:"💬", text:heckleText.trim()}); setHeckleText(""); } }}>Say</button>
        </div>
      </React.Fragment>
      )}

      {game.phase==="reveal" && game.last_action && (
        <Reveal la={game.last_action} amHost={amHost} iAmAlive={iAmAlive} mode={mode} dollars={dollars} onNext={doAdvance} onHeckle={sendHeckle} />
      )}
    </div>
  );
}

/* ============ Lobby ============ */
function Lobby({ game, players, me, amHost, code, muted, onMute, onReady, onKick, onAddBot, onWild, onSpot, onAutonext, onMode, onDollars, onStart, onLeave }){
  const joinUrl = location.origin + location.pathname + "?join=" + code;
  const humans = players.filter(p=>!isBot(p.id));
  const allReady = humans.every(p=>p.ready) && players.length>=2;
  const mode = game.mode||"dice";
  return (
    <div className="wrap">
      <div className="top"><div className="brand">⚄ LIAR'S&nbsp;DICE</div><div style={{display:"flex",gap:8}}><button className={"chip"+(muted?"":" on")} onClick={onMute}>{muted?"🔇 Sound off":"🔊 Sound on"}</button><button className="chip" onClick={onLeave}>Leave</button></div></div>
      <div className="label" style={{marginTop:6}}>Room code</div>
      <div className="codeBig">{code}</div>
      <div className="qrbox"><QR text={joinUrl} size={148} /></div>
      <div className="hint">Scan to join, or share the code.</div>

      <div className="label">In the room · {players.length}</div>
      <div className="card">
        <div className="roster">
          {players.slice().sort((a,b)=>a.num-b.num).map(p=>(
            <div key={p.id} className="prow">
              <div className="pname">{game.host_id===p.id && <span className="crown">♛</span>}{p.name}{p.id===me.id?" (you)":""}</div>
              <div className="rgt">
                {isBot(p.id) ? <span className="pill bot">{personaFor(p.id).name}</span> : (p.ready ? <span className="pill ready">ready</span> : <span className="pill wait">waiting</span>)}
                {amHost && p.id!==me.id && <button className="kick" onClick={()=>onKick(p.id)}>{isBot(p.id)?"×":"kick"}</button>}
              </div>
            </div>
          ))}
        </div>
        {!isBot(me.id) && <button className={"readyBtn"+(me.ready?" on":"")} onClick={onReady}>{me.ready?"✓ Ready":"Tap when ready"}</button>}
      </div>

      {amHost && (
        <React.Fragment>
          <div className="label">Game</div>
          <div className="sel">
            <button className={"chip"+(mode!=="poker"?" on":"")} onClick={()=>onMode("dice")}>🎲 Liar's Dice</button>
            <button className={"chip"+(mode==="poker"?" on":"")} onClick={()=>onMode("poker")}>💵 Liar's Poker</button>
          </div>
          <div className="hint" style={{textAlign:"left",marginTop:6}}>{mode==="poker" ? "Everyone gets a dollar-bill serial. Bid how many of a digit (0–9) are across all bills." : "Everyone rolls five hidden dice. Bid how many of a face (1–6) are on the table."}</div>

          <div className="label">House rules</div>
          <div className="card">
            {mode==="poker"
              ? <Rule title="Show as dollar bills" desc="Render hands as green bill serials instead of plain number tiles." on={!!game.dollars} onToggle={()=>onDollars(!game.dollars)} />
              : <Rule title="Wild ones" desc="1s count as any face. Classic Perudo, harder to read." on={game.wild} onToggle={()=>onWild(!game.wild)} />}
            <div style={{height:1,background:"var(--haze)",margin:"12px 0"}} />
            <Rule title="Spot-on calls" desc="Claim a bid is exactly right — nail it, win one back." on={game.spoton} onToggle={()=>onSpot(!game.spoton)} />
            <div style={{height:1,background:"var(--haze)",margin:"12px 0"}} />
            <Rule title="Auto-advance rounds" desc="Rounds move on by themselves after a short countdown — no clicking." on={game.autonext!==false} onToggle={()=>onAutonext(!(game.autonext!==false))} />
          </div>
          <button className="ghost" style={{width:"100%",marginTop:12}} onClick={onAddBot}>+ Add a bot</button>
          <button className="go" disabled={!allReady} onClick={onStart}>{mode==="poker"?"Deal the bills ›":"Deal the dice ›"}</button>
          {!allReady && <div className="hint">Need 2+ players and everyone ready.</div>}
        </React.Fragment>
      )}
      {!amHost && <div className="hint" style={{marginTop:16}}>Waiting for the host to deal…</div>}
    </div>
  );
}
function Rule({ title, desc, on, onToggle }){
  return (
    <div style={{display:"flex",alignItems:"center",justifyContent:"space-between",gap:12}}>
      <div style={{minWidth:0}}>
        <div style={{fontWeight:700,fontSize:15}}>{title}</div>
        <div style={{fontSize:12,color:"var(--dim)",lineHeight:1.4,marginTop:2}}>{desc}</div>
      </div>
      <button className={"readyBtn"+(on?" on":"")} style={{width:64,margin:0,flexShrink:0}} onClick={onToggle}>{on?"On":"Off"}</button>
    </div>
  );
}

/* ============ Bid controls ============ */
function BidControls({ bid, totalDice, wild, spoton, mode="dice", dollars=false, onBid, onCall, onSpot }){
  const faces = faceList(mode);
  const fmax = faces[faces.length-1], fmin = faces[0];
  const initFace = bid ? (bid.face<fmax ? bid.face+1 : fmin) : (mode==="poker"?5:3);
  const initQty  = bid ? (bid.face<fmax ? bid.qty : bid.qty+1) : 1;
  const [qty,setQty] = useState(initQty);
  const [face,setFace] = useState(initFace);
  useEffect(()=>{ setQty(initQty); setFace(initFace); },[bid?bid.qty+"-"+bid.face:"open"]);
  const legal = higher(qty, face, bid);
  const maxQ = Math.max(1, totalDice);
  const tileSize = mode==="poker" ? 30 : 34;
  return (
    <div className="controls">
      <div className="ctitle">Your move</div>
      <div className="stepRow">
        <button className="stepBtn" disabled={qty<=1} onClick={()=>setQty(q=>Math.max(1,q-1))}>−</button>
        <span className="qtyNum">{qty}</span>
        <button className="stepBtn" disabled={qty>=maxQ} onClick={()=>setQty(q=>Math.min(maxQ,q+1))}>+</button>
      </div>
      <div className={"faces"+(mode==="poker"?" faces10":"")}>
        {faces.map(f=>(
          <button key={f} className={"faceBtn"+(face===f?" on":"")} onClick={()=>setFace(f)}><FaceTile mode={mode} dollars={dollars} v={f} size={tileSize} /></button>
        ))}
      </div>
      <button className="primary full" style={{marginBottom:10, display:"inline-flex", alignItems:"center", justifyContent:"center", gap:8}} disabled={!legal} onClick={()=>onBid(qty,face)}>
        Bid {numWord(qty)} <FaceTile mode={mode} dollars={dollars} v={face} size={22} />{!legal && bid ? " — too low" : ""}
      </button>
      <div className="btnrow">
        {bid && <button className="ghost danger" style={{flex:1}} onClick={onCall}>Call liar!</button>}
        {bid && spoton && <button className="ghost" style={{flex:1}} onClick={onSpot}>Spot on</button>}
      </div>
    </div>
  );
}

/* ============ Reveal ============ */
function Reveal({ la, amHost, iAmAlive, mode="dice", dollars=false, onNext, onHeckle }){
  const bid = la.bid;
  const nameOf = (n)=> (la.snapshot.find(p=>p.num===n)||{}).name || "—";
  const [left,setLeft] = useState(()=> Math.max(0, Math.ceil(((la.advanceAt||0)-Date.now())/1000)) );
  useEffect(()=>{
    const id=setInterval(()=> setLeft(Math.max(0, Math.ceil(((la.advanceAt||0)-Date.now())/1000))), 400);
    return ()=>clearInterval(id);
  },[la.advanceAt]);
  let title, cls;
  if(la.type==="spoton"){ title = la.correct ? "Spot on." : "Not quite."; cls = la.correct ? "win" : "lose"; }
  else { title = la.correct ? "Bluff called." : "The bid held."; cls = la.correct ? "win" : "lose"; }
  const loser = la.snapshot.find(p=>p.num===la.loserNum);
  const gainer = la.snapshot.find(p=>p.num===la.gainNum);
  const met = la.actual >= bid.qty;
  // will this reveal end the game? (loser drops to 0 dice, leaving one player)
  const remaining = la.snapshot.filter(p=> (p.num===la.loserNum ? (p.dice.length-1)>0 : p.dice.length>0));
  const willEnd = la.loserNum!=null && remaining.length<=1;
  const manualHost = !la.auto && amHost && iAmAlive;   // only an alive host clicks; everyone else just waits/watches
  const waitText = willEnd ? (left>0 ? `Winner in ${left}…` : "Crowning the winner…") : (left>0 ? `Next round in ${left}…` : "Next round…");
  return (
    <div className="overlay">
      <div className="revealCard">
        <div className="revSpot" />
        <div className={"verdict "+cls}>{title}</div>
        <div className="vsub">{nameOf(la.target)} bid {numWord(bid.qty)} · {nameOf(la.by)} {la.type==="spoton"?"called spot-on":"called liar"}</div>
        {la.say && <div className="saybubble" style={{textAlign:"center",marginBottom:6}}>“{la.say}”</div>}

        <div className="tallyWrap">
          <div className="tallyBig"><FaceTile mode={mode} dollars={dollars} v={bid.face} size={56} /> <span className="tallyCount">{numWord(la.actual)}</span></div>
          <div className="tallySub">on the table · bid was <b className={met?"c-win":"c-lose"}>{numWord(bid.qty)}</b></div>
        </div>

        {loser && <div className="outcome lose">{loser.name} loses a die.</div>}
        {gainer && <div className="outcome win">{gainer.name} wins a die back.</div>}

        {manualHost
          ? <button className="revBtn" onClick={onNext}>{willEnd ? "See who won ›" : "Next round ›"}</button>
          : <div className="revWait">{waitText}{amHost && iAmAlive && la.auto && <span className="skip" onClick={onNext}> Skip ›</span>}</div>}

        {onHeckle && (
          <div className="heckleBar heckleRev">
            {HECKLES.map((h,i)=>(<button key={i} className="heckleBtn" title={h.text} onClick={()=>{ SFX.unlock(); onHeckle(h); }}>{h.emoji}</button>))}
          </div>
        )}

        <div className="revList">
          {la.snapshot.slice().sort((a,b)=>a.num-b.num).map(p=>(
            <div key={p.num} className="rrow">
              <span className="rname">{p.name}</span>
              <div className="rdice"><FaceRow dice={p.dice} size={27} glowVal={bid.face} wild={la.wild} spotlight={true} mode={mode} dollars={dollars} /></div>
              {la.loserNum===p.num && <span className="loserTag">−1</span>}
              {la.gainNum===p.num && <span className="gainTag">+1</span>}
            </div>
          ))}
        </div>
      </div>
    </div>
  );
}

/* ============ Game over ============ */
function GameOver({ game, players, amHost, mode="dice", dollars=false, onAgain, onLeave }){
  const winner = players.find(p=>p.id===game.winner);
  const board = players.slice().sort((a,b)=>(b.wins||0)-(a.wins||0));
  return (
    <div>
      <div className="winScene">
        <div className="winSpot" />
        <div className="crownBig">♛</div>
        <div className="winName">{winner?winner.name:"—"}</div>
        <div className="tagline" style={{marginBottom:14}}>{mode==="poker"?"last bill standing":"last one holding dice"}</div>
        {winner && winner.dice && winner.dice.length>0 &&
          <div style={{marginBottom:6}}><FaceRow dice={winner.dice} size={40} mode={mode} dollars={dollars} /></div>}
      </div>
      <div className="label">Wins</div>
      <div className="card">
        <div className="roster">
          {board.map(p=>(
            <div key={p.id} className="prow">
              <div className="pname">{p.id===game.winner && <span className="crown">♛ </span>}{p.name}</div>
              <div className="rgt"><span className={"pill"+(p.id===game.winner?" ready":" wait")}>{p.wins||0}</span></div>
            </div>
          ))}
        </div>
      </div>
      {amHost ? <button className="go" onClick={onAgain}>Play again ›</button> : <div className="hint" style={{marginTop:16}}>Waiting for the host to restart…</div>}
      <button className="ghost" style={{width:"100%",marginTop:10}} onClick={onLeave}>Leave room</button>
    </div>
  );
}

/* ============ App ============ */
function App(){
  const [myId] = useState(persistId);
  const [route,setRoute] = useState(null); // {name, code, create}
  const enter = (name, code, create)=> setRoute({ name, code, create });
  const exit = ()=>{ try{ history.replaceState(null,"",location.pathname); }catch(e){} setRoute(null); };
  if(!route) return <Home onEnter={enter} />;
  return <Room myId={myId} name={route.name} code={route.code} createIfMissing={route.create} onExit={exit} />;
}

ReactDOM.createRoot(document.getElementById("root")).render(<App />);
</script>
</body>
</html>
