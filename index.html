<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
<title>Game Night</title>
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,500;9..144,600&family=Space+Grotesk:wght@400;500;600;700&display=swap" rel="stylesheet" />
<style>
* { box-sizing: border-box; }
html, body { margin: 0; }
:root { --ink:#0E0B1A; --velvet:#171126; --panel:#1E1735; --haze:#332853; --candle:#F5B14C; --psychic:#A78BFA; --mist:#E9E3F6; --dim:#8B82A6; --mint:#7DF0A6; }
body { background: radial-gradient(120% 80% at 50% -10%, #241a3d 0%, var(--ink) 55%); min-height:100vh; font-family:'Space Grotesk',system-ui,sans-serif; color:var(--mist); -webkit-font-smoothing:antialiased; }
.wrap { max-width:520px; margin:0 auto; padding:20px 16px 30px; }
.brand { display:flex; align-items:center; justify-content:center; gap:7px; letter-spacing:.22em; font-weight:700; font-size:13px; color:var(--candle); }
.title { font-family:'Fraunces',serif; font-weight:600; font-size:44px; text-align:center; margin:16px 0 4px; }
.sub { text-align:center; color:var(--dim); font-size:13px; letter-spacing:.14em; text-transform:uppercase; margin-bottom:24px; }
.card { display:block; text-decoration:none; color:inherit; background:linear-gradient(180deg,var(--panel),var(--velvet)); border:1px solid var(--haze); border-radius:18px; padding:16px 18px; margin-bottom:12px; box-shadow:0 14px 34px -22px #000; transition:transform .12s; }
.card.live:active { transform:scale(.98); }
.card.soon { opacity:.6; }
.row { display:flex; align-items:center; gap:14px; }
.emoji { font-size:30px; width:44px; text-align:center; flex:0 0 auto; }
.name { font-family:'Fraunces',serif; font-size:21px; font-weight:600; }
.tag { font-size:11px; letter-spacing:.12em; text-transform:uppercase; color:var(--candle); }
.tag.soontag { color:var(--dim); }
.badge { font-size:10px; font-weight:800; letter-spacing:.1em; padding:2px 7px; border-radius:999px; background:var(--candle); color:var(--ink); margin-left:8px; }
.desc { font-size:13px; line-height:1.5; color:var(--dim); margin-top:8px; }
.foot { text-align:center; color:var(--dim); font-size:11px; margin-top:18px; }
</style>
</head>
<body>
<div class="wrap">
  <div class="brand">◍ GAME&nbsp;NIGHT</div>
  <div class="title">Pick a game</div>
  <div class="sub">multiplayer party games · one phone or many</div>
  <div id="games">Loading…</div>
  <div class="foot">Made for playing together.</div>
</div>
<script src="games.js"></script>
<script src="https://unpkg.com/@supabase/supabase-js@2/dist/umd/supabase.js"></script>
<script>
const SUPABASE_URL="https://gyvgzeculdaxcwinblld.supabase.co";
const SUPABASE_KEY="sb_publishable_kS8hQSqZR8Sog9imuq8dCg_-6iBy2Hi";
const esc=s=>(s||"").replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/"/g,"&quot;");
function card(g){
  const st=g.status||(g.url?"live":"soon");
  const clickable=(st==="live"||st==="demo") && g.url;
  const badge = st==="demo" ? "<span class='badge'>DEMO</span>" : "";
  const tag = clickable ? (esc(g.tag)+badge) : "Coming soon";
  const inner="<div class='row'><div class='emoji'>"+(esc(g.emoji)||"🎮")+"</div><div><div class='name'>"+esc(g.name)+"</div><div class='tag"+(clickable?"":" soontag")+"'>"+tag+"</div></div></div><div class='desc'>"+esc(g.desc||g.descr)+"</div>";
  return clickable ? "<a class='card live' href='"+esc(g.url)+"'>"+inner+"</a>" : "<div class='card soon'>"+inner+"</div>";
}
function draw(list){ document.getElementById("games").innerHTML = list.map(card).join("") || "<div class='foot'>No games yet.</div>"; }
async function boot(){
  let games=null;
  try{
    const sb=supabase.createClient(SUPABASE_URL,SUPABASE_KEY);
    const r=await sb.from("pages").select("*").neq("status","off").order("sort").order("name");
    if(r.data && r.data.length) games=r.data.map(p=>({name:p.name,tag:p.tag,emoji:p.emoji,url:p.url,desc:p.descr,status:p.status}));
  }catch(e){}
  if(!games) games=(window.GAMES||[]);   // offline fallback = games.js
  draw(games);
}
boot();
</script>
</body>
</html>
