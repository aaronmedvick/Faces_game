<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
<title>Cold Read</title>
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,500;9..144,600&family=Space+Grotesk:wght@400;500;600;700&family=JetBrains+Mono:wght@500;700&display=swap" rel="stylesheet" />
<style>
* { box-sizing: border-box; }
html, body { margin: 0; }
:root {
  --ink:#0E0B1A; --velvet:#171126; --panel:#1E1735; --haze:#332853;
  --candle:#F5B14C; --psychic:#A78BFA; --rose:#F26D8B; --mist:#E9E3F6; --dim:#8B82A6;
}
body { background: radial-gradient(120% 80% at 50% -10%, #241a3d 0%, var(--ink) 55%); min-height: 100vh; }
.wrap {
  font-family:'Space Grotesk',system-ui,sans-serif; color:var(--mist);
  max-width:520px; margin:0 auto; padding:16px 16px 28px; -webkit-font-smoothing:antialiased;
}
.top { display:flex; align-items:center; justify-content:space-between; margin-bottom:12px; }
.brand { display:flex; align-items:center; gap:7px; letter-spacing:.22em; font-weight:700; font-size:14px; color:var(--candle); }
.who { font-family:'JetBrains Mono',monospace; font-size:11px; color:var(--dim); }
.diffs { display:flex; gap:6px; }
.chip { font-family:'JetBrains Mono',monospace; font-size:12px; font-weight:700; color:var(--dim);
  background:var(--velvet); border:1px solid var(--haze); border-radius:999px; padding:6px 11px; cursor:pointer; }
.chip.on { color:var(--ink); background:var(--candle); border-color:var(--candle); }
.reading { font-size:13px; color:var(--dim); text-align:center; margin:6px 0 14px; }
.reading b { color:var(--mist); }
.qcard { background:linear-gradient(180deg,var(--panel),var(--velvet)); border:1px solid var(--haze);
  border-radius:20px; padding:18px; margin-bottom:16px; box-shadow:0 18px 40px -24px #000; }
.qmeta { display:flex; align-items:center; justify-content:space-between; margin-bottom:12px; }
.counter { font-family:'JetBrains Mono',monospace; font-weight:700; font-size:15px; color:var(--psychic); }
.counter i { color:var(--dim); font-style:normal; font-size:12px; }
.lead { font-family:'Fraunces',serif; font-size:18px; margin:0 0 12px; }
.picks { display:grid; gap:9px; }
.pick { text-align:left; font-family:inherit; font-weight:600; font-size:15px; color:var(--mist);
  background:var(--velvet); border:1px solid var(--haze); border-radius:13px; padding:14px; cursor:pointer; line-height:1.3; }
.pick:active { transform:scale(.98); }
.miniToggle { background:none; border:1px solid var(--haze); color:var(--dim); font-size:11px; font-weight:600;
  border-radius:999px; padding:5px 10px; cursor:pointer; font-family:inherit; }
.qtext { font-family:'Fraunces',serif; font-weight:500; font-size:22px; line-height:1.25; margin:2px 0 16px; }
.qtext.small { font-size:17px; margin:0; }
.qhi { color:var(--candle); font-style:italic; }
.gridHead { display:flex; align-items:center; justify-content:space-between; margin:0 2px 10px; }
.tally { font-size:12px; color:var(--dim); font-family:'JetBrains Mono',monospace; }
.grid { display:grid; gap:8px; }
.cell { position:relative; padding:0; border:1.5px solid var(--haze); border-radius:15px; overflow:hidden;
  background:var(--velvet); cursor:pointer; aspect-ratio:1; }
.cell img, .cell svg { width:100%; height:100%; display:block; object-fit:cover; }
.cell:active { transform:scale(.95); }
.cell.likely { border-color:var(--psychic); box-shadow:0 0 0 2px rgba(167,139,250,.35), 0 10px 24px -12px var(--psychic); }
.cell.out { opacity:.32; filter:grayscale(.7); }
.cell.picked { border-color:var(--candle); box-shadow:0 0 0 3px rgba(245,177,76,.5); }
.badge { position:absolute; top:5px; right:5px; width:22px; height:22px; border-radius:999px;
  display:grid; place-items:center; color:var(--ink); font-weight:800; font-size:13px; line-height:1; }
.badge.like { background:var(--psychic); } .badge.no { background:var(--rose); } .badge.pick { background:var(--candle); }
.footer { display:flex; gap:10px; margin-top:16px; }
.primary { flex:1; display:inline-flex; align-items:center; justify-content:center; gap:6px; font-family:inherit;
  font-weight:700; font-size:15px; padding:14px; border-radius:14px; cursor:pointer; border:none;
  background:var(--candle); color:var(--ink); }
.primary:disabled { opacity:.4; cursor:not-allowed; }
.primary.full { width:100%; }
.ghost { display:inline-flex; align-items:center; gap:6px; font-family:inherit; font-weight:600; font-size:14px;
  padding:14px 16px; border-radius:14px; cursor:pointer; background:var(--velvet); color:var(--mist); border:1px solid var(--haze); }
.flash { position:fixed; inset:0; display:grid; place-items:center; padding:24px; text-align:center; z-index:15; }
.flash.yes { background:radial-gradient(120% 90% at 50% 40%, rgba(74,222,128,.22), rgba(14,11,26,.92)); }
.flash.no { background:radial-gradient(120% 90% at 50% 40%, rgba(242,109,139,.22), rgba(14,11,26,.92)); }
.flashCard { max-width:420px; }
.flashQ { font-size:13px; color:var(--dim); margin-bottom:14px; }
.verdictBig { font-family:'Fraunces',serif; font-size:64px; font-weight:600; letter-spacing:.02em; margin:0 0 22px; }
.flash.yes .verdictBig { color:#7DF0A6; } .flash.no .verdictBig { color:var(--rose); }
.revealOverlay { position:fixed; inset:0; background:rgba(8,6,16,.82); display:grid; place-items:center; padding:20px; z-index:20; }
.revealCard { background:linear-gradient(180deg,var(--panel),var(--velvet)); border:1px solid var(--haze);
  border-radius:22px; padding:24px 22px; max-width:460px; width:100%; text-align:center; box-shadow:0 30px 60px -20px #000; }
.verdict { font-family:'Fraunces',serif; font-size:30px; font-weight:600; margin-bottom:18px; }
.verdict.win { color:var(--candle); } .verdict.lose { color:var(--rose); }
.revealFaces { display:flex; gap:22px; justify-content:center; margin-bottom:20px; }
.rf { display:flex; flex-direction:column; align-items:center; gap:7px; }
.rf .face { width:104px; height:104px; border-radius:16px; overflow:hidden; border:2px solid var(--haze); }
.rf .face img, .rf .face svg { width:100%; height:100%; object-fit:cover; display:block; }
.rf span { font-size:12px; color:var(--dim); }
.stats { display:grid; grid-template-columns:repeat(3,1fr); gap:8px; margin-bottom:16px; }
.stats div { background:var(--velvet); border:1px solid var(--haze); border-radius:12px; padding:11px 6px; }
.stats b { display:block; font-family:'JetBrains Mono',monospace; font-size:14px; color:var(--psychic); }
.stats span { font-size:10.5px; color:var(--dim); }
.note { font-size:12px; color:var(--dim); line-height:1.5; margin:0 0 18px; }
button:focus-visible { outline:2px solid var(--candle); outline-offset:2px; }
@media (prefers-reduced-motion: reduce) { * { transition:none !important; } }
</style>
</head>
<body>
<div id="root"></div>

<script src="https://unpkg.com/react@18/umd/react.production.min.js" crossorigin></script>
<script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js" crossorigin></script>
<script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>

<script type="text/babel">
const { useState, useMemo, useEffect, useCallback } = React;

/* --- config --- */
const FACE_POOL = 25;                 // how many jpgs you uploaded to /faces (001..025)
const ROUNDS = 8;                     // questions before the final guess
const TARGET = "the suspect";
const GRID = { easy:{n:9,cols:3}, medium:{n:16,cols:4}, hard:{n:25,cols:5} };
const FALLBACK_Q = [
  "Does this person help granny across the street?","Does this person have a death stare?",
  "Is this person suspiciously good at poker?","Would this person eat food off the floor if no one saw?",
  "Does this person own a shovel but no garden?","Would this person rescue a spider instead of squishing it?",
  "Does this person clap when the plane lands?","Would this person help you move a body, no questions asked?",
  "Does this person give off cult-leader energy?","Does this person name their houseplants?",
  "Would this person snitch for a good sandwich?","Does this person secretly love pineapple on pizza?",
];

/* --- deterministic drawn-face fallback --- */
function mulberry32(a){return function(){a|=0;a=(a+0x6d2b79f5)|0;let t=Math.imul(a^(a>>>15),1|a);t=(t+Math.imul(t^(t>>>7),61|t))^t;return((t^(t>>>14))>>>0)/4294967296;};}
function hashSeed(s){let h=2166136261;for(let i=0;i<s.length;i++){h^=s.charCodeAt(i);h=Math.imul(h,16777619);}return h>>>0;}
const SKIN=["#F3C9A5","#E7B08A","#D69A6C","#B87A4B","#8C5A34","#6A4327","#FADCB8"];
const HAIR=["#221B2E","#3B2A1A","#6B4226","#B5651D","#D9A441","#9CA3AF","#7C3AED","#DC2626","#EAE4F2","#0F172A"];

function FaceSVG({ seed }){
  const f = useMemo(()=>{
    const r=mulberry32(hashSeed(String(seed))); const pick=a=>a[Math.floor(r()*a.length)];
    return { skin:pick(SKIN), hair:pick(HAIR), style:Math.floor(r()*6), glasses:r()<0.34, round:r()<0.5,
      beard:Math.floor(r()*4), mouth:Math.floor(r()*4), acc:Math.floor(r()*5) };
  },[seed]);
  return (
    <svg viewBox="0 0 100 100" xmlns="http://www.w3.org/2000/svg">
      <rect x="0" y="0" width="100" height="100" fill="#171126" />
      <rect x="42" y="66" width="16" height="16" rx="6" fill={f.skin} />
      <circle cx="28" cy="50" r="6" fill={f.skin} /><circle cx="72" cy="50" r="6" fill={f.skin} />
      <rect x="30" y="26" width="40" height="46" rx={f.round?20:13} fill={f.skin} />
      {f.beard===2 && <path d="M31 50 Q50 82 69 50 L69 60 Q50 78 31 60 Z" fill={f.hair} opacity="0.9" />}
      {f.beard===1 && <path d="M33 56 Q50 72 67 56 L67 61 Q50 70 33 61 Z" fill={f.hair} opacity="0.35" />}
      {f.beard===3 && <path d="M42 58 Q50 64 58 58 L58 60 Q50 65 42 60 Z" fill={f.hair} />}
      <circle cx="42" cy="47" r="2.6" fill="#241a33" /><circle cx="58" cy="47" r="2.6" fill="#241a33" />
      <rect x="37" y="40" width="10" height="2.2" rx="1" fill={f.hair} opacity="0.8" />
      <rect x="53" y="40" width="10" height="2.2" rx="1" fill={f.hair} opacity="0.8" />
      {f.mouth===0 && <path d="M43 58 Q50 64 57 58" stroke="#7a2b3d" strokeWidth="2" fill="none" strokeLinecap="round" />}
      {f.mouth===1 && <line x1="44" y1="60" x2="56" y2="60" stroke="#7a2b3d" strokeWidth="2" strokeLinecap="round" />}
      {f.mouth===2 && <path d="M43 61 Q50 60 57 57" stroke="#7a2b3d" strokeWidth="2" fill="none" strokeLinecap="round" />}
      {f.mouth===3 && <circle cx="50" cy="60" r="3" fill="#7a2b3d" />}
      {f.glasses && (<g stroke="#EAE4F2" strokeWidth="1.6" fill="none" opacity="0.9">
        {f.round ? (<React.Fragment><circle cx="42" cy="47" r="6" /><circle cx="58" cy="47" r="6" /></React.Fragment>)
                 : (<React.Fragment><rect x="36" y="42" width="12" height="10" rx="2" /><rect x="52" y="42" width="12" height="10" rx="2" /></React.Fragment>)}
        <line x1="48" y1="47" x2="52" y2="47" /></g>)}
      {f.style===0 && <path d="M28 40 Q30 20 50 20 Q70 20 72 40 L72 34 Q66 26 50 26 Q34 26 28 34 Z" fill={f.hair} />}
      {f.style===1 && <path d="M27 46 Q28 18 50 18 Q72 18 73 46 L73 40 Q70 24 50 24 Q30 24 27 40 Z" fill={f.hair} />}
      {f.style===2 && <path d="M26 66 Q22 20 50 18 Q78 20 74 66 L70 66 Q73 30 50 26 Q27 30 30 66 Z" fill={f.hair} />}
      {f.style===3 && <React.Fragment><circle cx="50" cy="20" r="8" fill={f.hair} /><path d="M29 42 Q30 22 50 22 Q70 22 71 42 L71 36 Q66 28 50 28 Q34 28 29 36 Z" fill={f.hair} /></React.Fragment>}
      {f.style===4 && <path d="M30 38 Q32 24 50 24 Q68 24 70 38 L70 36 Q64 30 50 30 Q36 30 30 36 Z" fill={f.hair} opacity="0.55" />}
      {f.acc===2 && <path d="M27 34 Q50 12 73 34 L73 40 Q50 22 27 40 Z" fill="#7C3AED" />}
      {f.acc===3 && <rect x="28" y="34" width="44" height="4" rx="2" fill="#F5B14C" />}
    </svg>
  );
}

/* photo with graceful fallback to a drawn face */
function Face({ photoNum, seed }){
  const [ok, setOk] = useState(true);
  const src = `./faces/${String(photoNum).padStart(3,"0")}.jpg`;
  if (ok) return <img src={src} alt="" onError={()=>setOk(false)} />;
  return <FaceSVG seed={seed} />;
}

function App(){
  const [diff, setDiff] = useState("medium");
  const [seed, setSeed] = useState(1);
  const [pool, setPool] = useState(FALLBACK_Q);
  const [round, setRound] = useState(1);
  const [phase, setPhase] = useState("pick");      // pick | flash | narrow | guessing | reveal
  const [askedQ, setAskedQ] = useState("");
  const [readYes, setReadYes] = useState(true);
  const [sortLikely, setSortLikely] = useState(true);
  const [status, setStatus] = useState({});
  const [guess, setGuess] = useState(null);
  const cfg = GRID[diff];

  useEffect(()=>{
    fetch("./questions.json").then(r=>r.json())
      .then(d=>{ if(Array.isArray(d)&&d.length) setPool(d.map(x=>x.text)); }).catch(()=>{});
  },[]);

  const faces = useMemo(()=>{
    const r = mulberry32(hashSeed(`${diff}:${seed}`));
    const nums = []; while(nums.length<cfg.n){ const p=1+Math.floor(r()*FACE_POOL); if(!nums.includes(p)) nums.push(p); }
    return nums.map((p,i)=>({ id:i, photo:p, seed:`${diff}-${seed}-${p}-${i}` }));
  },[diff,seed,cfg.n]);
  const secret = useMemo(()=>{ const r=mulberry32(hashSeed(`secret:${diff}:${seed}`)); return Math.floor(r()*cfg.n); },[diff,seed,cfg.n]);

  const options = useMemo(()=>{
    const r = mulberry32(hashSeed(`opts:${diff}:${seed}:${round}`)); const out=[]; const used=new Set();
    while(out.length<4 && used.size<pool.length){ const i=Math.floor(r()*pool.length); if(!used.has(i)){ used.add(i); out.push(pool[i]); } }
    return out;
  },[pool,diff,seed,round]);

  const reset = useCallback((d)=>{ setDiff(d||diff); setSeed(s=>s+1); setRound(1); setPhase("pick"); setStatus({}); setGuess(null); },[diff]);

  const askQuestion = (q)=>{ const r=mulberry32(hashSeed(`read:${seed}:${round}:${q}`)); setAskedQ(q); setReadYes(r()<0.5); setPhase("flash"); };
  const cycle = (id)=>{
    if(phase==="guessing"){ setGuess(id); return; }
    if(phase!=="narrow") return;
    setStatus(prev=>{ const c=prev[id]; const n={...prev}; if(!c)n[id]="likely"; else if(c==="likely")n[id]="out"; else delete n[id]; return n; });
  };
  const nextRound = ()=>{ if(round<ROUNDS){ setRound(r=>r+1); setPhase("pick"); } else setPhase("guessing"); };

  const ordered = useMemo(()=>{
    if(!sortLikely) return faces;
    const rank=id=>(status[id]==="likely"?0:status[id]==="out"?2:1);
    return [...faces].sort((a,b)=>rank(a.id)-rank(b.id)||a.id-b.id);
  },[faces,status,sortLikely]);

  const likely = Object.values(status).filter(s=>s==="likely").length;
  const out = Object.values(status).filter(s=>s==="out").length;
  const correct = guess===secret;
  const badge = round<=3?"TRUE PSYCHIC":round<=5?"SHARP READ":round<=7?"SOLID GUESS":"PLAYED IT SAFE";

  return (
    <div className="wrap">
      <header className="top">
        <div>
          <div className="brand">◍ COLD&nbsp;READ</div>
          <div className="who">You are Detective 1</div>
        </div>
        <div className="diffs">
          {["easy","medium","hard"].map(d=>(
            <button key={d} className={"chip"+(diff===d?" on":"")} onClick={()=>reset(d)}>
              {d==="easy"?"3×3":d==="medium"?"4×4":"5×5"}
            </button>
          ))}
        </div>
      </header>

      {phase!=="reveal" && <div className="reading">You're reading <b>{TARGET}</b>. One of these faces is their secret identity.</div>}

      {phase==="pick" && (
        <section className="qcard">
          <div className="qmeta">
            <span className="counter">{String(round).padStart(2,"0")}<i>/{ROUNDS}</i></span>
            <span className="miniToggle">Vote a question</span>
          </div>
          <p className="lead">Which question do we send to the seer?</p>
          <div className="picks">
            {options.map((q,i)=>(<button key={i} className="pick" onClick={()=>askQuestion(q)}>{q}</button>))}
          </div>
        </section>
      )}

      {phase==="narrow" && (
        <section className="qcard">
          <div className="qmeta">
            <span className="counter">{String(round).padStart(2,"0")}<i>/{ROUNDS}</i></span>
            <button className="miniToggle" onClick={()=>setSortLikely(v=>!v)}>Sort: {sortLikely?"likely first":"off"}</button>
          </div>
          <p className="qtext small">The seer said <span className="qhi">{readYes?"YES":"NO"}</span> — now read your suspects.</p>
        </section>
      )}

      {phase==="guessing" && (
        <section className="qcard"><p className="qtext small">Lock in the face you think is <b>{TARGET}</b>.</p></section>
      )}

      <div className="gridHead">
        <span className="tally">✦ {likely} likely · {out} out</span>
      </div>

      <div className="grid" style={{ gridTemplateColumns:`repeat(${cfg.cols}, 1fr)` }}>
        {ordered.map(f=>{
          const st=status[f.id]; const picked=phase==="guessing"&&guess===f.id;
          const cls=["cell",st==="likely"?"likely":"",st==="out"?"out":"",picked?"picked":""].join(" ");
          return (
            <button key={f.id} className={cls} onClick={()=>cycle(f.id)} aria-label={`Face ${f.id+1}`}>
              <Face photoNum={f.photo} seed={f.seed} />
              {st==="likely" && <span className="badge like">✓</span>}
              {st==="out" && <span className="badge no">✕</span>}
              {picked && <span className="badge pick">◆</span>}
            </button>
          );
        })}
      </div>

      {phase==="narrow" && (
        <div className="footer">
          <button className="ghost" onClick={()=>setPhase("guessing")}>Guess now</button>
          <button className="primary" onClick={nextRound}>{round<ROUNDS?"Next question":"Time to guess"} ›</button>
        </div>
      )}
      {phase==="guessing" && (
        <div className="footer">
          <button className="ghost" onClick={()=>setPhase("narrow")}>Back</button>
          <button className="primary" disabled={guess===null} onClick={()=>setPhase("reveal")}>Lock my guess ◆</button>
        </div>
      )}

      {phase==="flash" && (
        <div className={"flash "+(readYes?"yes":"no")} onClick={()=>setPhase("narrow")}>
          <div className="flashCard">
            <div className="flashQ">Does {TARGET} {askedQ.replace(/^Does this person /,"").replace(/^Would this person /,"").replace(/\?$/,"")}?</div>
            <p className="verdictBig">{readYes?"YES":"NO"}</p>
            <button className="primary full" onClick={()=>setPhase("narrow")}>Read your suspects ›</button>
          </div>
        </div>
      )}

      {phase==="reveal" && (
        <div className="revealOverlay">
          <div className="revealCard">
            <div className={"verdict "+(correct?"win":"lose")}>{correct?"You read them.":"Not quite."}</div>
            <div className="revealFaces">
              <div className="rf"><div className="face"><Face photoNum={faces[guess]?.photo} seed={faces[guess]?.seed} /></div><span>Your guess</span></div>
              {!correct && <div className="rf"><div className="face"><Face photoNum={faces[secret]?.photo} seed={faces[secret]?.seed} /></div><span>Was {TARGET}</span></div>}
            </div>
            <div className="stats">
              <div><b>{badge}</b><span>read at Q{Math.min(round,ROUNDS)}</span></div>
              <div><b>{likely}</b><span>marked likely</span></div>
              <div><b>{out}</b><span>ruled out</span></div>
            </div>
            <p className="note">In multiplayer this screen adds the group math: % of answers matching the seer, and the single most divisive question.</p>
            <button className="primary full" onClick={()=>reset()}>↻ Play again</button>
          </div>
        </div>
      )}
    </div>
  );
}

ReactDOM.createRoot(document.getElementById("root")).render(<App />);
</script>
</body>
</html>
