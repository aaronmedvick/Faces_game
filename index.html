<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
<title>Cold Read</title>
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,500;9..144,600&family=Space+Grotesk:wght@400;500;600;700&family=JetBrains+Mono:wght@500;700&display=swap" rel="stylesheet" />
<style>
* { box-sizing: border-box; }
html, body { margin: 0; }
:root {
  --ink:#0E0B1A; --velvet:#171126; --panel:#1E1735; --haze:#332853;
  --candle:#F5B14C; --psychic:#A78BFA; --rose:#F26D8B; --mist:#E9E3F6; --dim:#8B82A6; --mint:#7DF0A6; --yes:#7DF0A6; --no:#F26D8B;
}
body { background: radial-gradient(120% 80% at 50% -10%, #241a3d 0%, var(--ink) 55%); min-height: 100vh; }
.wrap { font-family:'Space Grotesk',system-ui,sans-serif; color:var(--mist); max-width:520px; margin:0 auto; padding:16px 16px 30px; -webkit-font-smoothing:antialiased; }
.top { display:flex; align-items:center; justify-content:space-between; margin-bottom:12px; }
.brand { display:flex; align-items:center; gap:7px; letter-spacing:.22em; font-weight:700; font-size:14px; color:var(--candle); }
.brandBig { font-family:'Fraunces',serif; font-weight:600; font-size:38px; letter-spacing:.02em; color:var(--candle); margin:18px 0 4px; }
.sub { color:var(--dim); font-size:14px; margin-bottom:18px; }
.who { font-family:'JetBrains Mono',monospace; font-size:11px; color:var(--dim); }
.chip { font-family:'JetBrains Mono',monospace; font-size:12px; font-weight:700; color:var(--dim); background:var(--velvet); border:1px solid var(--haze); border-radius:999px; padding:7px 12px; cursor:pointer; }
.chip.on { color:var(--ink); background:var(--candle); border-color:var(--candle); }
.sel { display:flex; gap:7px; flex-wrap:wrap; margin:8px 0 4px; }
.label { font-size:11px; letter-spacing:.14em; text-transform:uppercase; color:var(--dim); margin:18px 0 8px; }
.card { background:linear-gradient(180deg,var(--panel),var(--velvet)); border:1px solid var(--haze); border-radius:20px; padding:16px 18px; box-shadow:0 18px 40px -24px #000; }
.roster { display:flex; flex-direction:column; }
.prow { display:flex; align-items:center; justify-content:space-between; padding:11px 0; border-bottom:1px solid var(--haze); }
.prow:last-child { border-bottom:none; }
.pname { font-weight:600; font-size:15px; display:flex; align-items:center; gap:8px; }
.crown { color:var(--candle); }
.rgt { display:flex; align-items:center; gap:8px; }
.pill { font-family:'JetBrains Mono',monospace; font-size:11px; font-weight:700; padding:4px 9px; border-radius:999px; }
.pill.ready { color:var(--ink); background:var(--mint); }
.pill.wait { color:var(--dim); border:1px solid var(--haze); }
.kick { font-size:11px; font-weight:700; color:var(--rose); border:1px solid var(--rose); background:none; border-radius:999px; padding:4px 9px; cursor:pointer; font-family:inherit; }
.readyBtn { width:100%; margin-top:12px; font-family:inherit; font-weight:700; font-size:15px; padding:13px; border-radius:13px; cursor:pointer; border:1px solid var(--haze); background:var(--velvet); color:var(--mist); }
.readyBtn.on { background:rgba(125,240,166,.14); border-color:var(--mint); color:var(--mint); }
.go { width:100%; margin-top:16px; font-family:'Fraunces',serif; font-weight:600; font-size:22px; letter-spacing:.03em; padding:16px; border-radius:16px; cursor:pointer; border:none; background:var(--candle); color:var(--ink); }
.go:disabled { opacity:.4; cursor:not-allowed; }
.hint { font-size:12px; color:var(--dim); text-align:center; margin-top:10px; }
.roleTog { display:flex; background:var(--velvet); border:1px solid var(--haze); border-radius:999px; padding:4px; gap:4px; margin-bottom:12px; }
.roleTog button { flex:1; border:none; background:none; color:var(--dim); font-weight:700; font-size:14px; padding:10px; border-radius:999px; font-family:inherit; cursor:pointer; }
.roleTog button.on { background:var(--candle); color:var(--ink); }
.qcard { background:linear-gradient(180deg,var(--panel),var(--velvet)); border:1px solid var(--haze); border-radius:20px; padding:18px; margin-bottom:16px; }
.qmeta { display:flex; align-items:center; justify-content:space-between; margin-bottom:12px; }
.counter { font-family:'JetBrains Mono',monospace; font-weight:700; font-size:15px; color:var(--psychic); }
.counter i { color:var(--dim); font-style:normal; font-size:12px; }
.lead { font-family:'Fraunces',serif; font-size:18px; margin:0 0 12px; }
.picks { display:grid; gap:9px; }
.pick { text-align:left; font-family:inherit; font-weight:600; font-size:15px; color:var(--mist); background:var(--velvet); border:1px solid var(--haze); border-radius:13px; padding:14px; cursor:pointer; line-height:1.3; }
.miniToggle { background:none; border:1px solid var(--haze); color:var(--dim); font-size:11px; font-weight:600; border-radius:999px; padding:5px 10px; cursor:pointer; font-family:inherit; }
.qtext { font-family:'Fraunces',serif; font-weight:500; font-size:22px; line-height:1.25; margin:2px 0 16px; }
.qtext.small { font-size:17px; margin:0; }
.qhi { color:var(--candle); font-style:italic; }
.waitBox { text-align:center; color:var(--dim); padding:14px 6px; }
.waitBox .big { font-size:40px; margin-bottom:6px; }
.seerBig { text-align:center; }
.suspect { display:flex; flex-direction:column; align-items:center; gap:8px; margin-bottom:16px; padding-bottom:16px; border-bottom:1px solid var(--haze); }
.suspect .face { width:120px; height:120px; border-radius:18px; overflow:hidden; border:2px solid var(--candle); box-shadow:0 0 0 3px rgba(245,177,76,.18); }
.suspect .face img, .suspect .face svg { width:100%; height:100%; object-fit:cover; display:block; }
.suspect span { font-size:11px; letter-spacing:.12em; text-transform:uppercase; color:var(--candle); }
.seerQ { font-family:'Fraunces',serif; font-size:24px; line-height:1.25; margin:6px 0 18px; }
.ansRow { display:grid; grid-template-columns:1fr 1fr; gap:10px; }
.ans { font-family:inherit; font-weight:700; font-size:18px; padding:18px; border-radius:14px; cursor:pointer; border:1px solid var(--haze); background:var(--velvet); color:var(--mist); }
.ans.y { border-color:var(--yes); color:var(--yes); } .ans.n { border-color:var(--no); color:var(--no); }
.scaleRow { margin-top:14px; }
.scaleRow input { width:100%; accent-color:var(--psychic); }
.scaleVal { font-family:'JetBrains Mono',monospace; color:var(--psychic); font-weight:700; }
.gridHead { display:flex; align-items:center; justify-content:space-between; margin:0 2px 10px; }
.tally { font-size:12px; color:var(--dim); font-family:'JetBrains Mono',monospace; }
.grid { display:grid; gap:8px; }
.cell { position:relative; padding:0; border:1.5px solid var(--haze); border-radius:15px; overflow:hidden; background:var(--velvet); cursor:pointer; aspect-ratio:1; }
.cell img, .cell svg { width:100%; height:100%; display:block; object-fit:cover; }
.cell:active { transform:scale(.95); }
.cell.likely { border-color:var(--psychic); box-shadow:0 0 0 2px rgba(167,139,250,.35), 0 10px 24px -12px var(--psychic); }
.cell.out { opacity:.32; filter:grayscale(.7); }
.cell.picked { border-color:var(--candle); box-shadow:0 0 0 3px rgba(245,177,76,.5); }
.badge { position:absolute; top:5px; right:5px; width:22px; height:22px; border-radius:999px; display:grid; place-items:center; color:var(--ink); font-weight:800; font-size:13px; }
.badge.like { background:var(--psychic); } .badge.no { background:var(--rose); } .badge.pick { background:var(--candle); }
.footer { display:flex; gap:10px; margin-top:16px; }
.primary { flex:1; display:inline-flex; align-items:center; justify-content:center; gap:6px; font-family:inherit; font-weight:700; font-size:15px; padding:14px; border-radius:14px; cursor:pointer; border:none; background:var(--candle); color:var(--ink); }
.primary:disabled { opacity:.4; cursor:not-allowed; }
.primary.full { width:100%; }
.ghost { display:inline-flex; align-items:center; gap:6px; font-family:inherit; font-weight:600; font-size:14px; padding:14px 16px; border-radius:14px; cursor:pointer; background:var(--velvet); color:var(--mist); border:1px solid var(--haze); }
.flash { position:fixed; inset:0; display:grid; place-items:center; padding:24px; text-align:center; z-index:15; }
.flash.yes { background:radial-gradient(120% 90% at 50% 40%, color-mix(in srgb, var(--yes) 22%, transparent), rgba(14,11,26,.92)); }
.flash.no { background:radial-gradient(120% 90% at 50% 40%, color-mix(in srgb, var(--no) 22%, transparent), rgba(14,11,26,.92)); }
.flashCard { max-width:420px; }
.flashQ { font-size:13px; color:var(--dim); margin-bottom:14px; }
.verdictBig { font-family:'Fraunces',serif; font-size:64px; font-weight:600; margin:0 0 8px; }
.flash.yes .verdictBig { color:var(--yes); } .flash.no .verdictBig { color:var(--no); }
.conf { font-family:'JetBrains Mono',monospace; color:var(--dim); margin-bottom:18px; }
.revealOverlay { position:fixed; inset:0; background:rgba(8,6,16,.82); display:grid; place-items:center; padding:20px; z-index:20; }
.revealCard { background:linear-gradient(180deg,var(--panel),var(--velvet)); border:1px solid var(--haze); border-radius:22px; padding:24px 22px; max-width:460px; width:100%; text-align:center; box-shadow:0 30px 60px -20px #000; }
.verdict { font-family:'Fraunces',serif; font-size:30px; font-weight:600; margin-bottom:18px; }
.verdict.win { color:var(--candle); } .verdict.lose { color:var(--rose); }
.revealFaces { display:flex; gap:22px; justify-content:center; margin-bottom:20px; }
.rf { display:flex; flex-direction:column; align-items:center; gap:7px; }
.rf .face { width:104px; height:104px; border-radius:16px; overflow:hidden; border:2px solid var(--haze); }
.rf .face img, .rf .face svg { width:100%; height:100%; object-fit:cover; display:block; }
.rf span { font-size:12px; color:var(--dim); }
.note { font-size:12px; color:var(--dim); line-height:1.5; margin:0 0 18px; }
button:focus-visible { outline:2px solid var(--candle); outline-offset:2px; }
@keyframes sway { 0%,100%{ transform:rotate(-14deg); } 50%{ transform:rotate(14deg); } }
.pendulum { transform-origin:50% 9%; animation:sway 3.4s ease-in-out infinite; }
@media (prefers-reduced-motion: reduce) { * { transition:none !important; } .pendulum { animation:none !important; } }
</style>
</head>
<body>
<div id="root"></div>
<script src="https://unpkg.com/react@18/umd/react.production.min.js" crossorigin></script>
<script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js" crossorigin></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>
<script src="https://unpkg.com/@supabase/supabase-js@2/dist/umd/supabase.js"></script>
<script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
<script type="text/babel">
const { useState, useMemo, useEffect, useCallback } = React;

const FACE_POOL = 25, ROUNDS = 8;
const FACE_DIR = "Faces";
const FACE_FILES = ["IMG_7742.jpeg","IMG_7745.jpeg","IMG_7746.jpeg","IMG_7747.jpeg","IMG_7748.jpeg","IMG_7749.jpeg","IMG_7750.jpeg","IMG_7751.jpeg","IMG_7753.jpeg","IMG_7754.jpeg","IMG_7755.jpeg","IMG_7756.jpeg","IMG_7757.jpeg","IMG_7758.jpeg","IMG_7759.jpeg","IMG_7760.jpeg","IMG_7761.jpeg","IMG_7762.jpeg","IMG_7763.jpeg","IMG_7764.jpeg","IMG_7765.jpeg","IMG_7766.jpeg","IMG_7768.jpeg","IMG_7770.jpeg","IMG_7771.jpeg","IMG_7772.jpeg","IMG_7773.jpeg","IMG_7774.jpeg","IMG_7775.jpeg","IMG_7776.jpeg","IMG_7777.jpeg","IMG_7778.jpeg","IMG_7779.jpeg","IMG_7781.jpeg","IMG_7782.jpeg","IMG_7783.jpeg","IMG_7784.jpeg"];
const GRID = { easy:{n:9,cols:3}, medium:{n:16,cols:4}, hard:{n:25,cols:5} };
const FALLBACK_Q = [
  "Does this person help granny across the street?","Does this person have a death stare?",
  "Is this person suspiciously good at poker?","Would this person eat food off the floor if no one saw?",
  "Does this person own a shovel but no garden?","Would this person rescue a spider instead of squishing it?",
  "Does this person clap when the plane lands?","Would this person help you move a body, no questions asked?",
  "Does this person give off cult-leader energy?","Does this person name their houseplants?",
  "Would this person snitch for a good sandwich?","Does this person secretly love pineapple on pizza?",
];

function mulberry32(a){return function(){a|=0;a=(a+0x6d2b79f5)|0;let t=Math.imul(a^(a>>>15),1|a);t=(t+Math.imul(t^(t>>>7),61|t))^t;return((t^(t>>>14))>>>0)/4294967296;};}
function hashSeed(s){let h=2166136261;for(let i=0;i<s.length;i++){h^=s.charCodeAt(i);h=Math.imul(h,16777619);}return h>>>0;}
const SKIN=["#F3C9A5","#E7B08A","#D69A6C","#B87A4B","#8C5A34","#6A4327","#FADCB8"];
const HAIR=["#221B2E","#3B2A1A","#6B4226","#B5651D","#D9A441","#9CA3AF","#7C3AED","#DC2626","#EAE4F2","#0F172A"];

function FaceSVG({ seed }){
  const f = useMemo(()=>{
    const r=mulberry32(hashSeed(String(seed))); const pick=a=>a[Math.floor(r()*a.length)];
    return { skin:pick(SKIN), hair:pick(HAIR), style:Math.floor(r()*6), glasses:r()<0.34, round:r()<0.5, beard:Math.floor(r()*4), mouth:Math.floor(r()*4) };
  },[seed]);
  return (
    <svg viewBox="0 0 100 100" xmlns="http://www.w3.org/2000/svg">
      <rect x="0" y="0" width="100" height="100" fill="#171126" />
      <rect x="42" y="66" width="16" height="16" rx="6" fill={f.skin} />
      <circle cx="28" cy="50" r="6" fill={f.skin} /><circle cx="72" cy="50" r="6" fill={f.skin} />
      <rect x="30" y="26" width="40" height="46" rx={f.round?20:13} fill={f.skin} />
      {f.beard===2 && <path d="M31 50 Q50 82 69 50 L69 60 Q50 78 31 60 Z" fill={f.hair} opacity="0.9" />}
      {f.beard===1 && <path d="M33 56 Q50 72 67 56 L67 61 Q50 70 33 61 Z" fill={f.hair} opacity="0.35" />}
      {f.beard===3 && <path d="M42 58 Q50 64 58 58 L58 60 Q50 65 42 60 Z" fill={f.hair} />}
      <circle cx="42" cy="47" r="2.6" fill="#241a33" /><circle cx="58" cy="47" r="2.6" fill="#241a33" />
      <rect x="37" y="40" width="10" height="2.2" rx="1" fill={f.hair} opacity="0.8" />
      <rect x="53" y="40" width="10" height="2.2" rx="1" fill={f.hair} opacity="0.8" />
      {f.mouth===0 && <path d="M43 58 Q50 64 57 58" stroke="#7a2b3d" strokeWidth="2" fill="none" strokeLinecap="round" />}
      {f.mouth===1 && <line x1="44" y1="60" x2="56" y2="60" stroke="#7a2b3d" strokeWidth="2" strokeLinecap="round" />}
      {f.mouth===2 && <path d="M43 61 Q50 60 57 57" stroke="#7a2b3d" strokeWidth="2" fill="none" strokeLinecap="round" />}
      {f.mouth===3 && <circle cx="50" cy="60" r="3" fill="#7a2b3d" />}
      {f.glasses && (<g stroke="#EAE4F2" strokeWidth="1.6" fill="none" opacity="0.9">
        {f.round ? (<React.Fragment><circle cx="42" cy="47" r="6" /><circle cx="58" cy="47" r="6" /></React.Fragment>)
                 : (<React.Fragment><rect x="36" y="42" width="12" height="10" rx="2" /><rect x="52" y="42" width="12" height="10" rx="2" /></React.Fragment>)}
        <line x1="48" y1="47" x2="52" y2="47" /></g>)}
      {f.style===0 && <path d="M28 40 Q30 20 50 20 Q70 20 72 40 L72 34 Q66 26 50 26 Q34 26 28 34 Z" fill={f.hair} />}
      {f.style===1 && <path d="M27 46 Q28 18 50 18 Q72 18 73 46 L73 40 Q70 24 50 24 Q30 24 27 40 Z" fill={f.hair} />}
      {f.style===2 && <path d="M26 66 Q22 20 50 18 Q78 20 74 66 L70 66 Q73 30 50 26 Q27 30 30 66 Z" fill={f.hair} />}
      {f.style===3 && <React.Fragment><circle cx="50" cy="20" r="8" fill={f.hair} /><path d="M29 42 Q30 22 50 22 Q70 22 71 42 L71 36 Q66 28 50 28 Q34 28 29 36 Z" fill={f.hair} /></React.Fragment>}
      {f.style===4 && <path d="M30 38 Q32 24 50 24 Q68 24 70 38 L70 36 Q64 30 50 30 Q36 30 30 36 Z" fill={f.hair} opacity="0.55" />}
    </svg>
  );
}
function Face({ file, seed }){
  const [ok, setOk] = useState(true);
  if (ok && file) return <img src={"./"+FACE_DIR+"/"+file} alt="" onError={()=>setOk(false)} />;
  return <FaceSVG seed={seed} />;
}

function seedPlayers(){
  const you = 1 + Math.floor(Math.random()*6);
  const others = [1,2,3,4,5,6].filter(n=>n!==you).slice(0,3);
  const bots = others.map((n,i)=>({ id:"b"+n, num:n, name:"Detective "+n, ready:false, you:false, lag:i===2 }));
  const all = [{ id:"you", num:you, name:"Detective "+you, ready:false, you:true, lag:false }, ...bots];
  return all.sort((a,b)=>a.num-b.num);
}

function SoloApp(){
  const [screen,setScreen] = useState("lobby");
  const [players,setPlayers] = useState(seedPlayers);
  const [leaderMode,setLeaderMode] = useState("random");
  const [crown,setCrown] = useState(null);
  const [diff,setDiff] = useState("medium");

  const [role,setRole] = useState("detective");
  const [seed,setSeed] = useState(1);
  const [faceFiles,setFaceFiles] = useState([]);
  const [pool,setPool] = useState(FALLBACK_Q);
  const [round,setRound] = useState(1);
  const [phase,setPhase] = useState("vote");     // vote|waiting|reading|narrow|guessing|reveal
  const [askedQ,setAskedQ] = useState("");
  const [seerAns,setSeerAns] = useState(null);   // {ans:'yes'|'no', conf:number|null}
  const [answerMode,setAnswerMode] = useState("yesno");
  const [conf,setConf] = useState(7);
  const [sortMode,setSortMode] = useState("rounds");
  const [status,setStatus] = useState({});
  const [score,setScore] = useState({});
  const [marks,setMarks] = useState({});
  const [showMode,setShowMode] = useState("score");
  const [intro,setIntro] = useState(true);
  const [freed,setFreed] = useState({});
  const [vision,setVision] = useState(null);
  const [visionDone,setVisionDone] = useState(false);
  const [brief1,setBrief1] = useState(false);
  const [brief2,setBrief2] = useState(false);
  const [hist,setHist] = useState([]);
  const [reaction,setReaction] = useState(null);
  const [pal,setPal] = useState(()=>ls.get("cr_palette")||"gr");
  const pickPal=(p)=>{ setPal(p); applyPalette(p); ls.set("cr_palette",p); };
  const [guess,setGuess] = useState(null);
  const [seerId,setSeerId] = useState(null);
  const cfg = GRID[diff];

  useEffect(()=>{ fetch("./questions.json").then(r=>r.json()).then(d=>{ if(Array.isArray(d)&&d.length) setPool(d.map(x=>x.text)); }).catch(()=>{}); },[]);
  useEffect(()=>{ fetch("./faces/manifest.json").then(r=>r.json()).then(d=>{ if(Array.isArray(d)&&d.length) setFaceFiles(d); }).catch(()=>{}); },[]);

  // bots ready up on their own (one laggard never does -> shows the kick)
  useEffect(()=>{
    if(screen!=="lobby") return;
    const timers = players.filter(p=>!p.you && !p.lag).map(p=>
      setTimeout(()=>setPlayers(ps=>ps.map(x=>x.id===p.id?{...x,ready:true}:x)), 700+Math.random()*2000));
    return ()=>timers.forEach(clearTimeout);
  },[screen]);

  const allReady = players.length>0 && players.every(p=>p.ready);
  const toggleYou = ()=> setPlayers(ps=>ps.map(p=>p.you?{...p,ready:!p.ready}:p));
  const kick = (id)=> setPlayers(ps=>ps.filter(p=>p.id!==id));

  const chooseSeer = ()=>{
    if(leaderMode==="picked" && crown && players.some(p=>p.id===crown)) return crown;
    if(leaderMode==="random") return players[Math.floor(Math.random()*players.length)].id;
    return players[0].id; // rotating starts with lowest number
  };
  const start = ()=>{ setSeerId(chooseSeer()); setRole("detective"); setRound(1); setPhase("vote"); setAskedQ(""); setSeerAns(null); setStatus({}); setScore({}); setMarks({}); setGuess(null); setIntro(true); setFreed({}); setVision(null); setVisionDone(false); setBrief1(false); setBrief2(false); setHist([]); setReaction(null); setSeed(Math.floor(Math.random()*1000000)+1); setScreen("game"); };

  const faces = useMemo(()=>{
    const source = faceFiles.length ? faceFiles : FACE_FILES;
    const r = mulberry32(hashSeed(diff+":"+seed+":"+source.length));
    const distinct = source.length>=cfg.n; const idx=[];
    while(idx.length<cfg.n){ const k=Math.floor(r()*source.length); if(distinct && idx.includes(k)) continue; idx.push(k); }
    return idx.map((k,i)=>({ id:i, file:source[k], seed:diff+"-"+seed+"-"+k+"-"+i }));
  },[diff,seed,cfg.n,faceFiles]);
  const secret = useMemo(()=>{ const r=mulberry32(hashSeed("secret:"+diff+":"+seed)); return Math.floor(r()*cfg.n); },[diff,seed,cfg.n]);
  const options = useMemo(()=>{
    const r=mulberry32(hashSeed("opts:"+seed+":"+round)); const out=[]; const used=new Set();
    while(out.length<4 && used.size<pool.length){ const i=Math.floor(r()*pool.length); if(!used.has(i)){ used.add(i); out.push(pool[i]); } }
    return out;
  },[pool,seed,round]);

  const pickQuestion = (q)=>{ setAskedQ(q); setSeerAns(null); setPhase("waiting"); };
  const seerAnswer = (ans)=>{ setSeerAns({ ans, conf:null }); setPhase("reading"); };
  const seerScale = ()=>{ setSeerAns({ ans: conf>=5?"yes":"no", conf }); setPhase("reading"); };
  const simulate = ()=>{ const r=mulberry32(hashSeed("read:"+seed+":"+round)); setSeerAns({ ans:r()<0.5?"yes":"no", conf:null }); setPhase("reading"); };
  const tapFace = (id)=>{ if(phase==="guessing"){ if(guess===id){ setGuess(null); setReaction({text:pickReact(GUILTY_FREE),kind:"yay"}); } else { setGuess(id); setReaction({text:pickReact(GUILTY_ACCUSE),kind:"aw"}); } return; } if(phase!=="narrow") return; const key=round+":"+id; const on=!!marks[key]; setMarks(m=>{ const n={...m}; if(on) delete n[key]; else n[key]=true; return n; }); setScore(s=>({...s,[id]:Math.max(0,(s[id]||0)+(on?-1:1))})); };
  const tallyMarks = (n)=>{ let s=""; for(let i=0;i<n;i++) s+="|"; return s; };
  const next = ()=>{ setHist(h=>h.concat([{ q:askedQ, ans:seerAns?seerAns.ans:null, conf:seerAns?seerAns.conf:null }])); if(round<ROUNDS){ setRound(r=>r+1); setPhase("vote"); setAskedQ(""); setSeerAns(null); } else setPhase("guessing"); };

  const liveOrder = useMemo(()=> [...faces].sort((a,b)=>{ const fr=(f)=>freed[f.id]?1:0; return fr(a)-fr(b) || ((score[b.id]||0)-(score[a.id]||0)) || a.id-b.id; }), [faces,score,freed]);
  const roundOrder = useMemo(()=> [...faces].sort((a,b)=>{ const fr=(f)=>freed[f.id]?1:0; return fr(a)-fr(b) || ((score[b.id]||0)-(score[a.id]||0)) || a.id-b.id; }), [round,faces]);
  const ordered = sortMode==="off"?faces : (sortMode==="live"?liveOrder:roundOrder);
  const correct = guess===secret;
  const youP = players.find(p=>p.you);
  const seerP = players.find(p=>p.id===seerId);
  const shortQ = (q)=> q.replace(/^Does this person /,"").replace(/^Would this person /,"").replace(/\?$/,"");

  /* ---------------- LOBBY ---------------- */
  if(screen==="lobby"){
    return (
      <div className="wrap">
        <div className="brand">◍ COLD&nbsp;READ</div>
        <div className="brandBig">Assemble the detectives</div>
        <div className="sub">Everyone piles in and gets a number. Ready up, boot the stragglers, then go.</div>

        <div className="label">In the room</div>
        <div className="card"><div className="roster">
          {players.map(p=>(
            <div className="prow" key={p.id}>
              <div className="pname">{p.name}{p.you && <span className="who">you</span>}{crown===p.id && leaderMode==="picked" && <span className="crown">👑</span>}</div>
              <div className="rgt">
                <span className={"pill "+(p.ready?"ready":"wait")}>{p.ready?"ready":"waiting"}</span>
                {!p.you && !p.ready && <button className="kick" onClick={()=>kick(p.id)}>kick</button>}
              </div>
            </div>
          ))}
        </div></div>
        <button className={"readyBtn"+(youP&&youP.ready?" on":"")} onClick={toggleYou}>{youP&&youP.ready?"✓ You're ready":"Ready up"}</button>

        <div className="label">Grid size</div>
        <div className="sel">
          {["easy","medium","hard"].map(d=>(<button key={d} className={"chip"+(diff===d?" on":"")} onClick={()=>setDiff(d)}>{d==="easy"?"Easy · 3×3":d==="medium"?"Medium · 4×4":"Hard · 5×5"}</button>))}
        </div>

        <div className="label">Who's the seer</div>
        <div className="sel">
          {[["picked","Picked"],["random","Random"],["rotating","Rotating"]].map(([m,l])=>(<button key={m} className={"chip"+(leaderMode===m?" on":"")} onClick={()=>setLeaderMode(m)}>{l}</button>))}
        </div>
        {leaderMode==="picked" && <div className="sel">{players.map(p=>(<button key={p.id} className={"chip"+(crown===p.id?" on":"")} onClick={()=>setCrown(p.id)}>{p.name}</button>))}</div>}

        <div className="label">Seer answers with</div>
        <div className="sel">
          {[["yesno","Yes / No"],["scale","Sliding scale 0–10"]].map(([m,l])=>(<button key={m} className={"chip"+(answerMode===m?" on":"")} onClick={()=>setAnswerMode(m)}>{l}</button>))}
        </div>

        <button className="go" disabled={!allReady || (leaderMode==="picked" && !crown)} onClick={start}>LET'S GOOOO</button>
        <div className="hint">{allReady ? "Detectives ready." : "Waiting on someone — ready them or kick them."}</div>
      </div>
    );
  }

  if(intro){
    return (<div className="wrap">
      <div className="revealOverlay"><div className="revealCard" style={{textAlign:"left"}}>
        <div className="verdict win" style={{fontSize:26,textAlign:"center",marginBottom:14}}>The Pendulum Case</div>
        <p style={{fontSize:14,lineHeight:1.6,margin:"0 0 12px"}}>A crime was committed. The details are sealed — we can't tell you what they did. What we <i>can</i> tell you: we hired <b>you</b>, a psychic detective.</p>
        <p style={{fontSize:14,lineHeight:1.6,margin:"0 0 12px"}}>Your tool is a pendulum, held by the <b>Seer</b>. It answers one thing: <b style={{color:"var(--mint)"}}>YES</b> or <b style={{color:"var(--rose)"}}>NO</b>. Each round, ask a question, read the vision, and narrow the lineup.</p>
        <p style={{fontSize:14,lineHeight:1.6,margin:"0 0 12px"}}>First, one <b style={{color:"var(--psychic)"}}>psychic hunch</b> — call the suspect blind for a bonus. Then tap everyone who fits each reading. Two optional <b>Briefing Rooms</b> let you free the innocent for grace points. Lock your final answer at round 8.</p>
        <button className="primary full" onClick={()=>setIntro(false)}>Begin the séance ›</button>
      </div></div>
    </div>);
  }

  if(!visionDone && role==="detective"){
    return (<div className="wrap">
      <section className="qcard" style={{textAlign:"center"}}>
        <div className="verdict win" style={{fontSize:22,margin:"0 0 6px"}}>Psychic Hunch</div>
        <p style={{fontSize:14,lineHeight:1.5,margin:0}}>Before any questions — what's your gut telling you? Call it blind for <b style={{color:"var(--psychic)"}}>major prestige</b>. You still play the whole séance either way. Optional.</p>
      </section>
      <div className="grid" style={{ gridTemplateColumns:"repeat("+cfg.cols+", 1fr)" }}>
        {faces.map(f=>{ const isV=vision===f.id; const cls=["cell",isV?"picked":""].join(" ");
          return (<button key={f.id} className={cls} onClick={()=>setVision(v=>v===f.id?null:f.id)}><Face file={f.file} seed={f.seed} />{isV && <span className="badge" style={{background:"var(--psychic)"}}>🔮</span>}</button>);
        })}
      </div>
      <div className="footer" style={{marginTop:14}}>
        <button className="ghost" onClick={()=>{ setVision(null); setVisionDone(true); }}>Skip</button>
        <button className="primary" disabled={vision===null} onClick={()=>setVisionDone(true)}>Lock my hunch ›</button>
      </div>
    </div>);
  }

  if(round>=4 && !brief1 && role==="detective"){
    const freeMax = diff==="easy"?1 : diff==="hard"?3 : 2;
    const freedCount = Object.keys(freed).filter(k=>freed[k]).length;
    const tapFree = (id)=>{ const on=!!freed[id]; if(!on && freedCount>=freeMax) return; setFreed(fr=>{ const n={...fr}; if(on) delete n[id]; else n[id]=true; return n; }); setReaction({ text: on?pickReact(FREE_AW):pickReact(FREE_YAY), kind: on?"aw":"yay" }); };
    return (<div className="wrap">
      <section className="qcard" style={{textAlign:"center"}}>
        <div className="verdict win" style={{fontSize:22,margin:"0 0 6px"}}>Briefing Room</div>
        <p style={{fontSize:13,color:"var(--dim)",margin:"0 0 8px"}}>Three readings in. Anyone you're sure is innocent?</p>
        <p style={{fontSize:14,lineHeight:1.5,margin:0}}>Free up to <b>{freeMax}</b> — grace points for each innocent you send home. <b style={{color:"var(--candle)"}}>({freeMax-freedCount} left)</b> · optional</p>
        <div style={{fontWeight:700,minHeight:22,marginTop:8,color:reaction?(reaction.kind==="yay"?"var(--mint)":"var(--rose)"):"transparent"}}>{reaction?reaction.text:"·"}</div>
      </section>
      <div className="grid" style={{ gridTemplateColumns:"repeat("+cfg.cols+", 1fr)" }}>
        {faces.map(f=>{ const isFreed=!!freed[f.id]; const cls=["cell",isFreed?"out":""].join(" ");
          return (<button key={f.id} className={cls} onClick={()=>tapFree(f.id)}><Face file={f.file} seed={f.seed} />{isFreed && <span className="badge" style={{background:"var(--mint)"}}>🕊️</span>}</button>);
        })}
      </div>
      <div className="footer" style={{marginTop:14}}><button className="primary full" onClick={()=>setBrief1(true)}>Continue ›</button></div>
    </div>);
  }

  if(round>=6 && !brief2 && role==="detective"){
    const freeMax = diff==="easy"?1 : diff==="hard"?3 : 2;
    const cap = freeMax*2;
    const freedCount = Object.keys(freed).filter(k=>freed[k]).length;
    const tapFree = (id)=>{ const on=!!freed[id]; if(!on && freedCount>=cap) return; setFreed(fr=>{ const n={...fr}; if(on) delete n[id]; else n[id]=true; return n; }); setReaction({ text: on?pickReact(FREE_AW):pickReact(FREE_YAY), kind: on?"aw":"yay" }); };
    return (<div className="wrap">
      <section className="qcard" style={{textAlign:"center"}}>
        <div className="verdict win" style={{fontSize:22,margin:"0 0 6px"}}>Second Briefing</div>
        <p style={{fontSize:13,color:"var(--dim)",margin:"0 0 8px"}}>More visions in. Anyone else clearly out?</p>
        <p style={{fontSize:14,lineHeight:1.5,margin:0}}>Free up to <b>{freeMax}</b> more. <b style={{color:"var(--candle)"}}>({cap-freedCount} left)</b> · optional</p>
        <div style={{fontWeight:700,minHeight:22,marginTop:8,color:reaction?(reaction.kind==="yay"?"var(--mint)":"var(--rose)"):"transparent"}}>{reaction?reaction.text:"·"}</div>
      </section>
      <div className="grid" style={{ gridTemplateColumns:"repeat("+cfg.cols+", 1fr)" }}>
        {faces.map(f=>{ const isFreed=!!freed[f.id]; const cls=["cell",isFreed?"out":""].join(" ");
          return (<button key={f.id} className={cls} onClick={()=>tapFree(f.id)}><Face file={f.file} seed={f.seed} />{isFreed && <span className="badge" style={{background:"var(--mint)"}}>🕊️</span>}</button>);
        })}
      </div>
      <div className="footer" style={{marginTop:14}}><button className="primary full" onClick={()=>setBrief2(true)}>Continue ›</button></div>
    </div>);
  }

  /* ---------------- GAME ---------------- */
  return (
    <div className="wrap">
      {role==="detective" && phase==="narrow" && seerAns && <div style={{position:"fixed",inset:0,pointerEvents:"none",border:"6px solid "+(seerAns.ans==="yes"?"var(--yes)":"var(--no)"),zIndex:5}} />}
      <header className="top">
        <div><div className="brand">◍ COLD&nbsp;READ</div>
          <div className="who">{youP&&youP.name} · seer: {seerP?seerP.name:"—"} · Q{Math.min(round,ROUNDS)}/{ROUNDS}</div></div>
        <div style={{display:"flex",gap:6}}><button className="miniToggle" onClick={()=>pickPal(pal==="gr"?"bo":"gr")}>{pal==="gr"?"Colors: G/R":"Colors: B/O"}</button><button className="miniToggle" onClick={()=>setScreen("lobby")}>Lobby</button></div>
      </header>

      <div className="roleTog">
        <button className={role==="detective"?"on":""} onClick={()=>setRole("detective")}>🕵 Detective</button>
        <button className={role==="seer"?"on":""} onClick={()=>setRole("seer")}>🔮 Seer</button>
      </div>

      {role==="seer" && (
        <section className="qcard seerBig">
          <div className="suspect">
            <div className="face"><Face file={faces[secret]?.file} seed={faces[secret]?.seed} /></div>
            <span>Your suspect — only you see this</span>
          </div>
          {!askedQ && <div className="waitBox"><div className="big">🔮</div>Waiting for the detectives to agree on a question…</div>}
          {askedQ && !seerAns && (<div>
            <div className="who" style={{textAlign:"center",marginBottom:6}}>The detectives are asking</div>
            <p className="seerQ">Does {shortQ(askedQ)}?</p>
            {answerMode==="yesno" ? (
              <div className="ansRow">
                <button className="ans y" onClick={()=>seerAnswer("yes")}>YES</button>
                <button className="ans n" onClick={()=>seerAnswer("no")}>NO</button>
              </div>
            ) : (
              <div className="scaleRow">
                <input type="range" min="0" max="10" value={conf} onChange={e=>setConf(+e.target.value)} />
                <div className="who" style={{margin:"8px 0 14px"}}>reading <span className="scaleVal">{conf}/10</span> — {conf>=5?"leaning yes":"leaning no"}</div>
                <button className="primary full" onClick={seerScale}>Send reading ›</button>
              </div>
            )}
          </div>)}
          {seerAns && <div className="waitBox"><div className="big">{seerAns.ans==="yes"?"✅":"⛔"}</div>You answered <b>{seerAns.ans.toUpperCase()}</b>{seerAns.conf!=null?` · ${seerAns.conf}/10`:""}. The reading's been sent — sit tight for the next question.</div>}
        </section>
      )}

      {role==="detective" && phase==="vote" && (
        <section className="qcard">
          <div className="qmeta"><span className="counter">{String(round).padStart(2,"0")}<i>/{ROUNDS}</i></span><button className="miniToggle" onClick={()=>setSortMode(m=>m==="rounds"?"live":(m==="live"?"off":"rounds"))}>Sort: {sortMode==="rounds"?"between rounds":sortMode}</button></div>
          <p className="lead">Which question do we send to the seer?</p>
          <div className="picks">{options.map((q,i)=>(<button key={i} className="pick" onClick={()=>pickQuestion(q)}>{q}</button>))}</div>
        </section>
      )}

      {role==="detective" && phase==="waiting" && (
        <section className="qcard">
          <div className="qmeta"><span className="counter">{String(round).padStart(2,"0")}<i>/{ROUNDS}</i></span></div>
          <div className="waitBox"><div className="big">🔮</div>Sent to the seer: <b>Does {shortQ(askedQ)}?</b></div>
          <div className="footer">
            <button className="ghost" onClick={()=>setRole("seer")}>Peek as seer</button>
            <button className="primary" onClick={simulate}>Simulate reading ›</button>
          </div>
        </section>
      )}

      {role==="detective" && (phase==="narrow"||phase==="guessing") && (
        <section className="qcard"><div className="qmeta">
          <span className="counter">{String(round).padStart(2,"0")}<i>/{ROUNDS}</i></span>
          {phase==="narrow" && <button className="miniToggle" onClick={()=>setSortMode(m=>m==="rounds"?"live":(m==="live"?"off":"rounds"))}>Sort: {sortMode==="rounds"?"between rounds":sortMode}</button>}
        </div>
        <p className="qtext small">{phase==="narrow" ? <span><b>Does {shortQ(askedQ)}?</b><br/>The pendulum said <b style={{color:seerAns&&seerAns.ans==="yes"?"var(--yes)":"var(--no)"}}>{seerAns&&seerAns.ans.toUpperCase()}</b> — tap the suspects who fit. <b style={{color:"var(--candle)"}}>{Object.keys(marks).filter(k=>marks[k] && k.split(":")[0]===String(round)).length} marked</b></span> : <span>The pendulum points to the guilty party — <b>tap to accuse</b>, then lock the verdict.</span>}</p>
        </section>
      )}

      {role==="detective" && phase!=="vote" && phase!=="waiting" && (
        <React.Fragment>
          <div className="gridHead">
            <span className="tally">{phase==="guessing"?"tap the suspect":"tap faces that fit"}</span>
            <button className="miniToggle" onClick={()=>setShowMode(m=>m==="score"?"tally":"score")}>{showMode==="score"?"Show: score":"Show: tally"}</button>
          </div>
          {phase==="narrow" && <div className="footer" style={{marginTop:0,marginBottom:12}}>{round>=5 && <button className="ghost" onClick={()=>setPhase("guessing")}>Guess early</button>}<button className="primary" onClick={next}>{(round===3||round===5)?"Enter briefing room":(round<ROUNDS?"Next question":"Enter final vote")} ›</button></div>}
          {phase==="guessing" && <div className="footer" style={{marginTop:0,marginBottom:8}}><button className="ghost" onClick={()=>setPhase("narrow")}>Back</button><button className="primary" disabled={guess===null} onClick={()=>setPhase("reveal")}>Lock the verdict</button></div>}
          {phase==="guessing" && <div style={{textAlign:"center",fontWeight:700,minHeight:20,marginBottom:8,color:reaction?(reaction.kind==="yay"?"var(--mint)":"var(--rose)"):"transparent"}}>{reaction?reaction.text:"·"}</div>}
          <div className="grid" style={{ gridTemplateColumns:"repeat("+cfg.cols+", 1fr)" }}>
            {ordered.map(f=>{
              const sc=score[f.id]||0; const hit=!!marks[round+":"+f.id]; const picked=phase==="guessing"&&guess===f.id; const isVision=vision===f.id; const isFreed=!!freed[f.id];
              const narrow=phase==="narrow"; const readYes=seerAns&&seerAns.ans==="yes"; const matchV=readYes?"var(--yes)":"var(--no)"; const oppV=readYes?"var(--no)":"var(--yes)";
              const cellStyle = Object.assign({}, narrow&&hit ? { borderColor:matchV, boxShadow:"0 0 0 2px color-mix(in srgb, "+matchV+" 55%, transparent)" } : {}, isVision ? { outline:"2px dashed var(--psychic)", outlineOffset:"-3px" } : {}, isFreed ? { opacity:.6 } : {});
              const cls=["cell",picked?"picked":""].join(" ");
              return (<button key={f.id} className={cls} style={cellStyle} onClick={()=>tapFace(f.id)} aria-label={"Face "+(f.id+1)}>
                <Face file={f.file} seed={f.seed} />
                {narrow && <span style={{position:"absolute",inset:0,pointerEvents:"none",background: hit ? "color-mix(in srgb, "+matchV+" 30%, transparent)" : "color-mix(in srgb, "+oppV+" 26%, transparent)"}} />}
                {narrow && <span style={{position:"absolute",bottom:4,left:"50%",transform:"translateX(-50%)",pointerEvents:"none",fontSize:11,fontWeight:800,fontFamily:"'JetBrains Mono',monospace",letterSpacing:".05em",padding:"1px 8px",borderRadius:999,background: hit?matchV:oppV, color:"#0E0B1A"}}>{hit?(readYes?"YES":"NO"):(readYes?"NO":"YES")}</span>}
                {isFreed && <span className="badge" style={{background:"var(--mint)",left:5,right:"auto"}}>🕊️</span>}
                {sc>0 && <span className="badge like" style={{minWidth:24,width:"auto",height:24,padding:"0 6px",fontFamily:"'JetBrains Mono',monospace",fontSize:15,fontWeight:800}}>{showMode==="score"?sc:tallyMarks(sc)}</span>}
                {picked && phase==="guessing" && <span style={{position:"absolute",inset:0,display:"grid",placeItems:"center",pointerEvents:"none"}}><span style={{transform:"rotate(-18deg)",border:"3px solid var(--no)",color:"var(--no)",fontWeight:900,fontSize:13,letterSpacing:".1em",padding:"2px 8px",borderRadius:4,background:"rgba(14,11,26,.4)"}}>GUILTY</span></span>}
              </button>);
            })}
          </div>
          {phase==="narrow" && <div className="hint" style={{marginTop:12,textAlign:"center",color:"var(--candle)"}}>Remember: tap everyone who matches, every round.</div>}
        </React.Fragment>
      )}

      {role==="detective" && phase==="reading" && seerAns && (
        <div className={"flash "+(seerAns.ans==="yes"?"yes":"no")} onClick={()=>setPhase("narrow")}>
          <div className="flashCard">
            <div className="flashQ">Does {shortQ(askedQ)}?</div>
            <p className="verdictBig">{seerAns.ans.toUpperCase()}</p>
            {seerAns.conf!=null && <div className="conf">seer is {seerAns.conf}/10 sure</div>}
            <button className="primary full" onClick={()=>setPhase("narrow")}>Feel them out ›</button>
          </div>
        </div>
      )}

      {phase==="reveal" && (()=>{
        const pf=Object.keys(freed).filter(k=>freed[k]).map(Number); const innocent=pf.filter(i=>i!==secret).length; const freedGuilty=pf.indexOf(secret)>=0;
        const visionHit=vision===secret; const total=(correct?100:0)+innocent*20-(freedGuilty?40:0)+(visionHit?5:0);
        const suspectHit=(r)=>!!marks[r+":"+secret];
        const trackedN=hist.filter((h,i)=>suspectHit(i+1)).length;
        const totalHits=Object.keys(marks).filter(k=>marks[k]).length;
        const precision=totalHits>0?Math.round((trackedN/totalHits)*100):0;
        const tier = precision>=85?"🔮 Perfect psychic — you barely touched an innocent":precision>=55?"🎯 Sharp read":precision>=30?"🔫 A bit scattergun":"🤪 Your pendulum might be broken";
        return (<div className="revealOverlay"><div className="revealCard" style={{textAlign:"left",maxHeight:"86vh",overflowY:"auto"}}>
          <div className="verdict win" style={{textAlign:"center"}}>Case closed</div>
          {visionHit && <div style={{textAlign:"center",background:"color-mix(in srgb, var(--psychic) 18%, transparent)",border:"1px solid var(--psychic)",borderRadius:12,padding:"10px 12px",margin:"0 0 14px",color:"var(--psychic)",fontWeight:800}}>🔮 TRUE PSYCHIC — you named the culprit blind!</div>}
          <div style={{display:"flex",justifyContent:"center",marginBottom:14}}><div className="rf"><div className="face"><Face file={faces[secret]?.file} seed={faces[secret]?.seed} /></div><span>The guilty suspect</span></div></div>
          <div className="label">Your score</div>
          <div style={{fontFamily:"'JetBrains Mono',monospace",fontSize:28,fontWeight:700,color:"var(--psychic)",textAlign:"center"}}>{total} pts</div>
          <div style={{fontSize:12,color:"var(--dim)",textAlign:"center",marginTop:4}}>{correct?"caught ✓ ":"missed "}{innocent>0?("· freed "+innocent+" "):""}{visionHit?"· 🔮 psychic hunch ":""}{freedGuilty?"· ⚠ freed suspect":""}</div>
          <div className="label">The readings</div>
          {hist.map((h,i)=>(<div key={i} style={{fontSize:13,padding:"7px 0",borderBottom:"1px solid var(--haze)",display:"flex",justifyContent:"space-between",gap:8}}><span>Q{i+1}: Does {shortQ(h.q)}? — <b style={{color:h.ans==="yes"?"var(--mint)":"var(--rose)"}}>{h.ans?h.ans.toUpperCase():"—"}</b></span><span style={{color:suspectHit(i+1)?"var(--mint)":"var(--dim)",fontWeight:700,whiteSpace:"nowrap"}}>{suspectHit(i+1)?"✓ tracked":"✗ missed"}</span></div>))}
          <div className="label">How you read the room</div>
          <div style={{fontSize:13,lineHeight:1.6}}>Suspect tracked <b style={{color:"var(--mint)"}}>{trackedN}/{hist.length}</b> rounds · read accuracy <b style={{color:"var(--psychic)"}}>{precision}%</b><br/><span style={{fontWeight:700}}>{tier}</span></div>
          <p className="note" style={{marginTop:12}}>+100 caught · +5 psychic hunch (+ eternal glory) · +20 each innocent freed · −40 freeing the suspect.</p>
          <p className="note" style={{marginTop:6}}>The pendulum never lies — every "miss" was in how <i>you</i> read a stranger's face. Turns out you can't tell much from a face at all.</p>
          <p className="note" style={{marginTop:6}}>Why a pendulum "answers" → <a href="https://en.wikipedia.org/wiki/Ideomotor_phenomenon" target="_blank" rel="noopener" style={{color:"var(--psychic)"}}>the ideomotor effect ↗</a> · Reading faces → <a href="https://en.wikipedia.org/wiki/Physiognomy" target="_blank" rel="noopener" style={{color:"var(--psychic)"}}>physiognomy ↗</a></p>
          <div className="footer" style={{marginTop:14}}><button className="ghost" onClick={()=>setScreen("lobby")}>Lobby</button><button className="primary" onClick={start}>Play again ↻</button></div>
        </div></div>);
      })()}
    </div>
  );
}

function QR({ text, size }){
  const ref = React.useRef(null);
  useEffect(()=>{
    if(!ref.current) return;
    ref.current.innerHTML = "";
    if(!window.QRCode) return;
    try{ new window.QRCode(ref.current, { text, width:size, height:size, colorDark:"#0E0B1A", colorLight:"#ffffff", correctLevel: window.QRCode.CorrectLevel.M }); }catch(e){}
  },[text,size]);
  return <div ref={ref} style={{width:size,height:size}} />;
}

  if(game.phase==="revealed"){
    const dets = players.filter(p=>p.id!==game.seer_id);
    const scored = dets.map(p=>{ const pf=p.freed||[]; const innocent=pf.filter(i=>i!==suspect).length; const freedGuilty=pf.indexOf(suspect)>=0; const g=p.guess===suspect?100:0; const fr=innocent*20-(freedGuilty?40:0); const sh=(p.stars||[]).indexOf(suspect)>=0; const st=sh?5:0; return { name:p.name, total:g+fr+st, correct:p.guess===suspect, innocent, freedGuilty, starHit:sh }; }).sort((a,b)=>b.total-a.total);
    const seerP2 = players.find(p=>p.id===game.seer_id);
    const hist = game.history||[];
    const qStats = hist.map((h,i)=>{ const r=i+1; const answered=dets.filter(p=>p.answers && p.answers[r]!=null); const tracked=answered.filter(p=>(p.answers[r]||[]).indexOf(suspect)>=0).length; return { pct: answered.length?Math.round(tracked/answered.length*100):null }; });
    const accBoard = dets.map(p=>{ const a=p.answers||{}; let t=0; for(let r=1;r<=hist.length;r++){ if(a[r]!=null && (a[r]||[]).indexOf(suspect)>=0) t++; } return { name:p.name, tracked:t }; }).sort((x,y)=>y.tracked-x.tracked);
    return (<div className="wrap">{header}
      <div className="revealOverlay"><div className="revealCard" style={{textAlign:"left",maxHeight:"86vh",overflowY:"auto"}}>
        <div className="verdict win" style={{textAlign:"center"}}>Case closed</div>
        <div style={{display:"flex",justifyContent:"center",marginBottom:16}}><div className="rf"><div className="face"><Face file={faces[suspect]?.file} seed={faces[suspect]?.seed} /></div><span>The guilty suspect</span></div></div>
        <div className="label">Final scoreboard</div>
        <div className="roster">{scored.map((b,i)=>(<div key={i} className="prow"><div className="pname"><span style={{color:i===0?"var(--candle)":"var(--mist)"}}>{i+1}. {b.name}</span></div><div style={{textAlign:"right"}}><div style={{fontFamily:"'JetBrains Mono',monospace",fontWeight:700,color:"var(--psychic)"}}>{b.total} pts</div><div style={{fontSize:10.5,color:"var(--dim)"}}>{b.correct?"caught ✓ ":""}{b.innocent>0?("freed "+b.innocent+" "):""}{b.starHit && <span style={{color:"var(--psychic)",fontWeight:800}}>🔮 TRUE PSYCHIC </span>}{b.freedGuilty?"⚠ freed suspect":""}</div></div></div>))}</div>
        <div style={{fontSize:12,color:"var(--dim)",margin:"6px 0 4px"}}>Seer this game: <b style={{color:"var(--mist)"}}>{seerP2?seerP2.name:"—"}</b></div>
        <div className="label">The readings</div>
        {hist.map((h,i)=>(<div key={i} style={{fontSize:13,padding:"7px 0",borderBottom:"1px solid var(--haze)",display:"flex",justifyContent:"space-between",gap:8}}><span>Q{i+1}: Does {shortQ(h.q)}? — <b style={{color:h.ans==="yes"?"var(--mint)":"var(--rose)"}}>{h.ans?h.ans.toUpperCase():"—"}</b></span><span style={{color:"var(--candle)",fontWeight:700,whiteSpace:"nowrap"}}>{qStats[i] && qStats[i].pct!=null ? qStats[i].pct+"% read it" : ""}</span></div>))}
        {accBoard.length>0 && accBoard[0].tracked>0 && <div style={{fontSize:13,marginTop:10}}>Sharpest read: <b style={{color:"var(--psychic)"}}>{accBoard[0].name}</b> tracked the suspect <b>{accBoard[0].tracked}/{hist.length}</b> rounds.</div>}
        <p className="note" style={{marginTop:12}}>Scoring: caught the suspect +100 · each innocent freed +20 · ★ prime suspect correct +50 · freeing the real suspect −40.</p>
        <p className="note" style={{marginTop:4}}>Coming next: per-question group stats — who read each face right.</p>
        <p className="note" style={{marginTop:6}}>Why a pendulum "answers" → <a href="https://en.wikipedia.org/wiki/Ideomotor_phenomenon" target="_blank" rel="noopener" style={{color:"var(--psychic)"}}>the ideomotor effect ↗</a> · Reading faces → <a href="https://en.wikipedia.org/wiki/Physiognomy" target="_blank" rel="noopener" style={{color:"var(--psychic)"}}>physiognomy ↗</a></p>
        {amHost && <button className="primary full" onClick={backToLobby}>Back to lobby</button>}
      </div></div>
    </div>);
  }

  if(intro && (game.phase==="playing"||game.phase==="guessing")){
    return (<div className="wrap">{header}
      <div className="revealOverlay"><div className="revealCard" style={{textAlign:"left"}}>
        <div className="verdict win" style={{fontSize:26,textAlign:"center",marginBottom:14}}>The Pendulum Case</div>
        <p style={{fontSize:14,lineHeight:1.6,margin:"0 0 12px"}}>A crime was committed. The details are sealed — we can't tell you what they did. What we <i>can</i> tell you: we hired <b>you</b>, a circle of psychic detectives.</p>
        <p style={{fontSize:14,lineHeight:1.6,margin:"0 0 12px"}}>Your only tool is a pendulum, held by the <b>Seer</b>. It answers one thing: <b style={{color:"var(--mint)"}}>YES</b> or <b style={{color:"var(--rose)"}}>NO</b>. Each round the group <b>votes</b> on a question to ask it, the Seer reads the vision, and you narrow the lineup.</p>
        <p style={{fontSize:14,lineHeight:1.6,margin:"0 0 12px"}}>First, one <b style={{color:"var(--psychic)"}}>psychic hunch</b> — call the suspect blind for a bonus. Then tap everyone who fits each reading. Two optional <b>Briefing Rooms</b> let you free the innocent for grace points. Final answer locks at round 8.</p>
        <p style={{fontSize:13,lineHeight:1.6,color:"var(--dim)",margin:"0 0 18px"}}>Trust your gut, then name the suspect.</p>
        <button className="primary full" onClick={()=>setIntro(false)}>{amSeer?"Take the pendulum ›":"Begin the séance ›"}</button>
      </div></div>
    </div>);
  }

  if(amSeer){
    return (<div className="wrap">{header}
      <section className="qcard seerBig">
        <div className="suspect"><div className="face"><Face file={faces[suspect]?.file} seed={faces[suspect]?.seed} /></div><span>Your suspect — only you see this</span></div>
        {game.phase==="guessing" ? (
          <div className="waitBox"><div className="big">🔮</div>The detectives are locking their guesses.<button className="primary full" style={{marginTop:14}} onClick={reveal}>Reveal the suspect ›</button></div>
        ) : !game.asked_q ? (
          <div className="waitBox"><div className="big">🔮</div>The detectives are voting on a question…</div>
        ) : !game.seer_ans ? (
          <div>
            <div className="who" style={{textAlign:"center",marginBottom:6}}>The detectives are asking</div>
            <p className="seerQ">Does {shortQ(game.asked_q)}?</p>
            {game.answer_mode==="yesno" ? (
              <div className="ansRow"><button className="ans y" onClick={()=>seerYesNo("yes")}>YES</button><button className="ans n" onClick={()=>seerYesNo("no")}>NO</button></div>
            ) : (
              <div className="scaleRow"><input type="range" min="0" max="10" value={conf} onChange={e=>setConf(+e.target.value)} /><div className="who" style={{margin:"8px 0 14px"}}>reading <span className="scaleVal">{conf}/10</span> — {conf>=5?"leaning yes":"leaning no"}</div><button className="primary full" onClick={seerScale}>Send reading ›</button></div>
            )}
          </div>
        ) : (
          <div className="waitBox">
            <div className="big">{game.seer_ans.ans==="yes"?"✅":"⛔"}</div>
            You answered <b>{game.seer_ans.ans.toUpperCase()}</b>{game.seer_ans.conf!=null?(" · "+game.seer_ans.conf+"/10"):""}.
            <div style={{marginTop:12,fontSize:13,color:"var(--dim)"}}>
              Detectives done: <b style={{color:"var(--mint)"}}>{players.filter(p=>p.id!==game.seer_id&&p.ready).length}</b> / {players.filter(p=>p.id!==game.seer_id).length}
              <div style={{marginTop:6}}>{players.filter(p=>p.id!==game.seer_id).map(p=>(<span key={p.id} style={{marginRight:10,color:p.ready?"var(--mint)":"var(--dim)"}}>{p.ready?"✓":"○"} {p.name}</span>))}</div>
            </div>
            {game.seer_ans.until && game.seer_ans.until>nowT && <div style={{color:"var(--candle)",marginTop:10,fontWeight:700,fontSize:18}}>Next in {Math.ceil((game.seer_ans.until-nowT)/1000)}s…</div>}
            <div className="footer" style={{marginTop:14}}>
              <button className="ghost" onClick={()=>seerWarn(30)}>Give 30s</button>
              <button className="ghost" onClick={()=>seerWarn(60)}>Give 60s</button>
              <button className="primary" onClick={nextRound}>Next now ›</button>
            </div>
          </div>
        )}
      </section>
    </div>);
  }

  if(!visionDone && game.round===1){
    return (<div className="wrap">{header}
      <section className="qcard" style={{textAlign:"center"}}>
        <div className="verdict win" style={{fontSize:22,margin:"0 0 6px"}}>Psychic Hunch</div>
        <p style={{fontSize:14,lineHeight:1.5,margin:0}}>Before any questions — what's your gut telling you? Call it blind for <b style={{color:"var(--psychic)"}}>major prestige</b>. You still play the whole séance either way. Optional.</p>
      </section>
      <div className="grid" style={{ gridTemplateColumns:"repeat("+cfg.cols+", 1fr)" }}>
        {faces.map(f=>{ const isV=vision===f.id; const cls=["cell",isV?"picked":""].join(" ");
          return (<button key={f.id} className={cls} onClick={()=>setVision(v=>v===f.id?null:f.id)}><Face file={f.file} seed={f.seed} />{isV && <span className="badge" style={{background:"var(--psychic)"}}>🔮</span>}</button>);
        })}
      </div>
      <div className="footer" style={{marginTop:14}}>
        <button className="ghost" onClick={()=>lockHunch(null)}>Skip</button>
        <button className="primary" disabled={vision===null} onClick={()=>lockHunch(vision)}>Lock my hunch ›</button>
      </div>
    </div>);
  }

  if(game.phase==="playing" && game.round>=4 && game.round<6 && !brief1){
    const freeMax = cfg.n>=25?3:(cfg.n>=16?2:1);
    const freedCount = Object.keys(freed).filter(k=>freed[k]).length;
    const tapFree = (id)=>{ const on=!!freed[id]; if(!on && freedCount>=freeMax) return; setFreed(fr=>{ const n=Object.assign({},fr); if(on) delete n[id]; else n[id]=true; return n; }); setReaction({text:on?pickReact(FREE_AW):pickReact(FREE_YAY),kind:on?"aw":"yay"}); };
    return (<div className="wrap">{header}
      <section className="qcard" style={{textAlign:"center"}}>
        <div className="verdict win" style={{fontSize:22,margin:"0 0 6px"}}>Briefing Room</div>
        <p style={{fontSize:13,color:"var(--dim)",margin:"0 0 8px"}}>Three readings in. Anyone you're sure is innocent?</p>
        <p style={{fontSize:14,lineHeight:1.5,margin:0}}>Free up to <b>{freeMax}</b> — grace points for each innocent. <b style={{color:"var(--candle)"}}>({freeMax-freedCount} left)</b> · optional</p>
        <div style={{fontWeight:700,minHeight:22,marginTop:8,color:reaction?(reaction.kind==="yay"?"var(--mint)":"var(--rose)"):"transparent"}}>{reaction?reaction.text:"·"}</div>
      </section>
      <div className="grid" style={{ gridTemplateColumns:"repeat("+cfg.cols+", 1fr)" }}>
        {faces.map(f=>{ const isFreed=!!freed[f.id]; const cls=["cell",isFreed?"out":""].join(" ");
          return (<button key={f.id} className={cls} onClick={()=>tapFree(f.id)}><Face file={f.file} seed={f.seed} />{isFreed && <span className="badge" style={{background:"var(--mint)"}}>🕊️</span>}</button>);
        })}
      </div>
      <div className="footer" style={{marginTop:14}}><button className="primary full" onClick={()=>finishBrief(setBrief1)}>Continue ›</button></div>
    </div>);
  }

  if(game.phase==="playing" && game.round>=6 && !brief2){
    const freeMax = cfg.n>=25?3:(cfg.n>=16?2:1);
    const cap = freeMax*2;
    const freedCount = Object.keys(freed).filter(k=>freed[k]).length;
    const tapFree = (id)=>{ const on=!!freed[id]; if(!on && freedCount>=cap) return; setFreed(fr=>{ const n=Object.assign({},fr); if(on) delete n[id]; else n[id]=true; return n; }); setReaction({text:on?pickReact(FREE_AW):pickReact(FREE_YAY),kind:on?"aw":"yay"}); };
    return (<div className="wrap">{header}
      <section className="qcard" style={{textAlign:"center"}}>
        <div className="verdict win" style={{fontSize:22,margin:"0 0 6px"}}>Second Briefing</div>
        <p style={{fontSize:13,color:"var(--dim)",margin:"0 0 8px"}}>More visions in. Anyone else clearly out?</p>
        <p style={{fontSize:14,lineHeight:1.5,margin:0}}>Free up to <b>{freeMax}</b> more. <b style={{color:"var(--candle)"}}>({cap-freedCount} left)</b> · optional</p>
        <div style={{fontWeight:700,minHeight:22,marginTop:8,color:reaction?(reaction.kind==="yay"?"var(--mint)":"var(--rose)"):"transparent"}}>{reaction?reaction.text:"·"}</div>
      </section>
      <div className="grid" style={{ gridTemplateColumns:"repeat("+cfg.cols+", 1fr)" }}>
        {faces.map(f=>{ const isFreed=!!freed[f.id]; const cls=["cell",isFreed?"out":""].join(" ");
          return (<button key={f.id} className={cls} onClick={()=>tapFree(f.id)}><Face file={f.file} seed={f.seed} />{isFreed && <span className="badge" style={{background:"var(--mint)"}}>🕊️</span>}</button>);
        })}
      </div>
      <div className="footer" style={{marginTop:14}}><button className="primary full" onClick={()=>finishBrief(setBrief2)}>Continue ›</button></div>
    </div>);
  }

  const roundMarks = Object.keys(marks).filter(k=>marks[k] && k.split(":")[0]===String(game.round)).length;
  const showFlash = game.phase==="playing" && game.seer_ans && dismissed!==game.round;
  return (<div className="wrap">{header}
    {game.phase==="playing" && game.seer_ans && <div style={{position:"fixed",inset:0,pointerEvents:"none",border:"6px solid "+(game.seer_ans.ans==="yes"?"var(--yes)":"var(--no)"),zIndex:5}} />}
    {game.phase==="playing" && !game.asked_q && (
      <section className="qcard">
        <div className="qmeta"><span className="counter">{String(game.round).padStart(2,"0")}<i>/{ROUNDS}</i></span><button className="miniToggle" onClick={()=>setSortMode(m=>m==="rounds"?"live":(m==="live"?"off":"rounds"))}>Sort: {sortMode==="rounds"?"rounds":sortMode}</button></div>
        <p className="lead">Vote which question to ask the pendulum:</p>
        <div className="picks">{options.map((q,i)=>{
          const c=players.filter(p=>p.id!==game.seer_id && p.vote===i).length; const mine=me&&me.vote===i;
          return (<button key={i} className="pick" style={mine?{borderColor:"var(--candle)",background:"rgba(245,177,76,.10)"}:{}} onClick={()=>castVote(i)}>{q}{c>0 && <span style={{float:"right",color:"var(--candle)",fontFamily:"'JetBrains Mono',monospace"}}>{"✓".repeat(c)}</span>}</button>);
        })}</div>
        {amHost && <div className="footer" style={{marginTop:12}}><button className="ghost" onClick={resolveVote}>Ask the top question now</button></div>}
        <div className="hint" style={{marginTop:8}}>Change your vote any time until everyone's in.</div>
      </section>
    )}
    {game.phase==="playing" && game.asked_q && !game.seer_ans && (
      <section className="qcard"><div className="waitBox"><div className="big">🔮</div>Sent to the seer: <b>Does {shortQ(game.asked_q)}?</b><br/>Waiting for the reading…</div></section>
    )}
    {((game.phase==="playing" && game.seer_ans) || game.phase==="guessing") && (
      <section className="qcard"><div className="qmeta"><span className="counter">{String(Math.min(game.round,ROUNDS)).padStart(2,"0")}<i>/{ROUNDS}</i></span></div>
        <p className="qtext small">{game.phase==="guessing" ? <span>The pendulum points to the guilty party — <b>tap to accuse</b>, then lock the verdict.</span> : <span><b>Does {shortQ(game.asked_q)}?</b><br/>The pendulum said <b style={{color:game.seer_ans.ans==="yes"?"var(--yes)":"var(--no)"}}>{game.seer_ans.ans.toUpperCase()}</b>{game.seer_ans.conf!=null?(" · "+game.seer_ans.conf+"/10"):""} — tap the suspects who fit. <b style={{color:"var(--candle)"}}>{roundMarks} marked</b></span>}</p>
      </section>
    )}
    {(game.phase==="guessing" || (game.phase==="playing" && game.seer_ans)) && (
      <React.Fragment>
        <div className="gridHead">
          <span className="tally">{game.phase==="guessing" ? "tap the suspect" : "tap faces that fit the reading"}</span>
          <button className="miniToggle" onClick={()=>setSortMode(m=>m==="rounds"?"live":(m==="live"?"off":"rounds"))}>Sort: {sortMode==="rounds"?"rounds":sortMode}</button>
          <button className="miniToggle" onClick={()=>setShowMode(m=>m==="score"?"tally":"score")}>{showMode==="score"?"Show: score":"Show: tally"}</button>
        </div>
        {game.phase==="playing" && game.seer_ans && game.seer_ans.until && game.seer_ans.until>nowT && <div className="hint" style={{marginTop:-4,marginBottom:8,color:"var(--candle)"}}>Seer moving on in {Math.ceil((game.seer_ans.until-nowT)/1000)}s — mark fast!</div>}
        {game.phase==="playing" && <div className="footer" style={{marginTop:0,marginBottom:12}}><button className="primary full" style={me&&me.ready?{background:"var(--mint)",color:"var(--ink)"}:{}} onClick={toggleDone}>{me&&me.ready?"✓ Done — waiting for the seer":"I'm done marking"}</button></div>}
        <div className="grid" style={{ gridTemplateColumns:"repeat("+cfg.cols+", 1fr)" }}>
          {ordered.map(f=>{
            const sc=score[f.id]||0; const hit=!!marks[game.round+":"+f.id]; const picked=game.phase==="guessing"&&guess===f.id; const isVision=vision===f.id; const isFreed=!!freed[f.id];
            const narrow=game.phase==="playing"&&!!game.seer_ans; const readYes=game.seer_ans&&game.seer_ans.ans==="yes"; const matchV=readYes?"var(--yes)":"var(--no)"; const oppV=readYes?"var(--no)":"var(--yes)";
            const cellStyle = Object.assign({}, narrow&&hit ? { borderColor:matchV, boxShadow:"0 0 0 2px color-mix(in srgb, "+matchV+" 55%, transparent)" } : {}, isVision ? { outline:"2px dashed var(--psychic)", outlineOffset:"-3px" } : {}, isFreed ? { opacity:.6 } : {});
            const cls=["cell",picked?"picked":""].join(" ");
            return (<button key={f.id} className={cls} style={cellStyle} onClick={()=>tapFace(f.id)}>
              <Face file={f.file} seed={f.seed} />
              {narrow && <span style={{position:"absolute",inset:0,pointerEvents:"none",background: hit ? "color-mix(in srgb, "+matchV+" 30%, transparent)" : "color-mix(in srgb, "+oppV+" 26%, transparent)"}} />}
              {narrow && <span style={{position:"absolute",bottom:4,left:"50%",transform:"translateX(-50%)",pointerEvents:"none",fontSize:11,fontWeight:800,fontFamily:"'JetBrains Mono',monospace",letterSpacing:".05em",padding:"1px 8px",borderRadius:999,background: hit?matchV:oppV, color:"#0E0B1A"}}>{hit?(readYes?"YES":"NO"):(readYes?"NO":"YES")}</span>}
              {isFreed && <span className="badge" style={{background:"var(--mint)",left:5,right:"auto"}}>🕊️</span>}
              {sc>0 && <span className="badge like" style={{minWidth:24,width:"auto",height:24,padding:"0 6px",fontFamily:"'JetBrains Mono',monospace",fontSize:15,fontWeight:800}}>{showMode==="score"?sc:tallyMarks(sc)}</span>}
              {picked && game.phase==="guessing" && <span style={{position:"absolute",inset:0,display:"grid",placeItems:"center",pointerEvents:"none"}}><span style={{transform:"rotate(-18deg)",border:"3px solid var(--no)",color:"var(--no)",fontWeight:900,fontSize:13,letterSpacing:".1em",padding:"2px 8px",borderRadius:4,background:"rgba(14,11,26,.4)"}}>GUILTY</span></span>}
            </button>);
          })}
        </div>
        {game.phase==="guessing" && <div style={{textAlign:"center",fontWeight:700,minHeight:20,marginTop:10,color:reaction?(reaction.kind==="yay"?"var(--mint)":"var(--rose)"):"transparent"}}>{reaction?reaction.text:"·"}</div>}
        {game.phase==="guessing" && (me && me.guess!=null
          ? <div className="hint" style={{marginTop:8}}>Verdict locked. Waiting for the seer to reveal…</div>
          : <div className="footer"><button className="primary full" disabled={guess===null} onClick={lockGuess}>Lock the verdict</button></div>)}
      </React.Fragment>
    )}
    {(game.phase==="playing" && game.seer_ans) && <div className="hint" style={{marginTop:12,textAlign:"center",color:"var(--candle)"}}>Remember: tap everyone who matches, every round.</div>}
    {showFlash && (
      <div className={"flash "+(game.seer_ans.ans==="yes"?"yes":"no")} onClick={()=>setDismissed(game.round)}>
        <div className="flashCard"><div className="flashQ">Does {shortQ(game.asked_q)}?</div><p className="verdictBig">{game.seer_ans.ans.toUpperCase()}</p>{game.seer_ans.conf!=null && <div className="conf">seer is {game.seer_ans.conf}/10 sure</div>}<button className="primary full" onClick={()=>setDismissed(game.round)}>Feel them out ›</button></div>
      </div>
    )}
  </div>);
}

function App(){
  const [mode,setMode] = useState(()=>{ try{ return new URLSearchParams(location.search).get("join") ? "online" : null; }catch(e){ return null; } });
  useEffect(()=>{ applyPalette(ls.get("cr_palette")||"gr"); },[]);
  if(mode==="solo") return <SoloApp/>;
  if(mode==="online") return <OnlineApp onExit={()=>setMode(null)} />;
  return <Home configured={sbReady} onPick={setMode} />;
}
ReactDOM.createRoot(document.getElementById("root")).render(<App />);
</script>
</body>
</html>
