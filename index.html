<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
<title>Cold Read</title>
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,500;9..144,600&family=Space+Grotesk:wght@400;500;600;700&family=JetBrains+Mono:wght@500;700&display=swap" rel="stylesheet" />
<style>
* { box-sizing: border-box; }
html, body { margin: 0; }
:root {
  --ink:#0E0B1A; --velvet:#171126; --panel:#1E1735; --haze:#332853;
  --candle:#F5B14C; --psychic:#A78BFA; --rose:#F26D8B; --mist:#E9E3F6; --dim:#8B82A6; --mint:#7DF0A6;
}
body { background: radial-gradient(120% 80% at 50% -10%, #241a3d 0%, var(--ink) 55%); min-height: 100vh; }
.wrap { font-family:'Space Grotesk',system-ui,sans-serif; color:var(--mist); max-width:520px; margin:0 auto; padding:16px 16px 30px; -webkit-font-smoothing:antialiased; }
.top { display:flex; align-items:center; justify-content:space-between; margin-bottom:12px; }
.brand { display:flex; align-items:center; gap:7px; letter-spacing:.22em; font-weight:700; font-size:14px; color:var(--candle); }
.brandBig { font-family:'Fraunces',serif; font-weight:600; font-size:38px; letter-spacing:.02em; color:var(--candle); margin:18px 0 4px; }
.sub { color:var(--dim); font-size:14px; margin-bottom:18px; }
.who { font-family:'JetBrains Mono',monospace; font-size:11px; color:var(--dim); }
.chip { font-family:'JetBrains Mono',monospace; font-size:12px; font-weight:700; color:var(--dim); background:var(--velvet); border:1px solid var(--haze); border-radius:999px; padding:7px 12px; cursor:pointer; }
.chip.on { color:var(--ink); background:var(--candle); border-color:var(--candle); }
.sel { display:flex; gap:7px; flex-wrap:wrap; margin:8px 0 4px; }
.label { font-size:11px; letter-spacing:.14em; text-transform:uppercase; color:var(--dim); margin:18px 0 8px; }
.card { background:linear-gradient(180deg,var(--panel),var(--velvet)); border:1px solid var(--haze); border-radius:20px; padding:16px 18px; box-shadow:0 18px 40px -24px #000; }
.roster { display:flex; flex-direction:column; }
.prow { display:flex; align-items:center; justify-content:space-between; padding:11px 0; border-bottom:1px solid var(--haze); }
.prow:last-child { border-bottom:none; }
.pname { font-weight:600; font-size:15px; display:flex; align-items:center; gap:8px; }
.crown { color:var(--candle); }
.rgt { display:flex; align-items:center; gap:8px; }
.pill { font-family:'JetBrains Mono',monospace; font-size:11px; font-weight:700; padding:4px 9px; border-radius:999px; }
.pill.ready { color:var(--ink); background:var(--mint); }
.pill.wait { color:var(--dim); border:1px solid var(--haze); }
.kick { font-size:11px; font-weight:700; color:var(--rose); border:1px solid var(--rose); background:none; border-radius:999px; padding:4px 9px; cursor:pointer; font-family:inherit; }
.readyBtn { width:100%; margin-top:12px; font-family:inherit; font-weight:700; font-size:15px; padding:13px; border-radius:13px; cursor:pointer; border:1px solid var(--haze); background:var(--velvet); color:var(--mist); }
.readyBtn.on { background:rgba(125,240,166,.14); border-color:var(--mint); color:var(--mint); }
.go { width:100%; margin-top:16px; font-family:'Fraunces',serif; font-weight:600; font-size:22px; letter-spacing:.03em; padding:16px; border-radius:16px; cursor:pointer; border:none; background:var(--candle); color:var(--ink); }
.go:disabled { opacity:.4; cursor:not-allowed; }
.hint { font-size:12px; color:var(--dim); text-align:center; margin-top:10px; }
.roleTog { display:flex; background:var(--velvet); border:1px solid var(--haze); border-radius:999px; padding:4px; gap:4px; margin-bottom:12px; }
.roleTog button { flex:1; border:none; background:none; color:var(--dim); font-weight:700; font-size:14px; padding:10px; border-radius:999px; font-family:inherit; cursor:pointer; }
.roleTog button.on { background:var(--candle); color:var(--ink); }
.qcard { background:linear-gradient(180deg,var(--panel),var(--velvet)); border:1px solid var(--haze); border-radius:20px; padding:18px; margin-bottom:16px; }
.qmeta { display:flex; align-items:center; justify-content:space-between; margin-bottom:12px; }
.counter { font-family:'JetBrains Mono',monospace; font-weight:700; font-size:15px; color:var(--psychic); }
.counter i { color:var(--dim); font-style:normal; font-size:12px; }
.lead { font-family:'Fraunces',serif; font-size:18px; margin:0 0 12px; }
.picks { display:grid; gap:9px; }
.pick { text-align:left; font-family:inherit; font-weight:600; font-size:15px; color:var(--mist); background:var(--velvet); border:1px solid var(--haze); border-radius:13px; padding:14px; cursor:pointer; line-height:1.3; }
.miniToggle { background:none; border:1px solid var(--haze); color:var(--dim); font-size:11px; font-weight:600; border-radius:999px; padding:5px 10px; cursor:pointer; font-family:inherit; }
.qtext { font-family:'Fraunces',serif; font-weight:500; font-size:22px; line-height:1.25; margin:2px 0 16px; }
.qtext.small { font-size:17px; margin:0; }
.qhi { color:var(--candle); font-style:italic; }
.waitBox { text-align:center; color:var(--dim); padding:14px 6px; }
.waitBox .big { font-size:40px; margin-bottom:6px; }
.seerBig { text-align:center; }
.suspect { display:flex; flex-direction:column; align-items:center; gap:8px; margin-bottom:16px; padding-bottom:16px; border-bottom:1px solid var(--haze); }
.suspect .face { width:120px; height:120px; border-radius:18px; overflow:hidden; border:2px solid var(--candle); box-shadow:0 0 0 3px rgba(245,177,76,.18); }
.suspect .face img, .suspect .face svg { width:100%; height:100%; object-fit:cover; display:block; }
.suspect span { font-size:11px; letter-spacing:.12em; text-transform:uppercase; color:var(--candle); }
.seerQ { font-family:'Fraunces',serif; font-size:24px; line-height:1.25; margin:6px 0 18px; }
.ansRow { display:grid; grid-template-columns:1fr 1fr; gap:10px; }
.ans { font-family:inherit; font-weight:700; font-size:18px; padding:18px; border-radius:14px; cursor:pointer; border:1px solid var(--haze); background:var(--velvet); color:var(--mist); }
.ans.y { border-color:var(--mint); color:var(--mint); } .ans.n { border-color:var(--rose); color:var(--rose); }
.scaleRow { margin-top:14px; }
.scaleRow input { width:100%; accent-color:var(--psychic); }
.scaleVal { font-family:'JetBrains Mono',monospace; color:var(--psychic); font-weight:700; }
.gridHead { display:flex; align-items:center; justify-content:space-between; margin:0 2px 10px; }
.tally { font-size:12px; color:var(--dim); font-family:'JetBrains Mono',monospace; }
.grid { display:grid; gap:8px; }
.cell { position:relative; padding:0; border:1.5px solid var(--haze); border-radius:15px; overflow:hidden; background:var(--velvet); cursor:pointer; aspect-ratio:1; }
.cell img, .cell svg { width:100%; height:100%; display:block; object-fit:cover; }
.cell:active { transform:scale(.95); }
.cell.likely { border-color:var(--psychic); box-shadow:0 0 0 2px rgba(167,139,250,.35), 0 10px 24px -12px var(--psychic); }
.cell.out { opacity:.32; filter:grayscale(.7); }
.cell.picked { border-color:var(--candle); box-shadow:0 0 0 3px rgba(245,177,76,.5); }
.badge { position:absolute; top:5px; right:5px; width:22px; height:22px; border-radius:999px; display:grid; place-items:center; color:var(--ink); font-weight:800; font-size:13px; }
.badge.like { background:var(--psychic); } .badge.no { background:var(--rose); } .badge.pick { background:var(--candle); }
.footer { display:flex; gap:10px; margin-top:16px; }
.primary { flex:1; display:inline-flex; align-items:center; justify-content:center; gap:6px; font-family:inherit; font-weight:700; font-size:15px; padding:14px; border-radius:14px; cursor:pointer; border:none; background:var(--candle); color:var(--ink); }
.primary:disabled { opacity:.4; cursor:not-allowed; }
.primary.full { width:100%; }
.ghost { display:inline-flex; align-items:center; gap:6px; font-family:inherit; font-weight:600; font-size:14px; padding:14px 16px; border-radius:14px; cursor:pointer; background:var(--velvet); color:var(--mist); border:1px solid var(--haze); }
.flash { position:fixed; inset:0; display:grid; place-items:center; padding:24px; text-align:center; z-index:15; }
.flash.yes { background:radial-gradient(120% 90% at 50% 40%, rgba(74,222,128,.22), rgba(14,11,26,.92)); }
.flash.no { background:radial-gradient(120% 90% at 50% 40%, rgba(242,109,139,.22), rgba(14,11,26,.92)); }
.flashCard { max-width:420px; }
.flashQ { font-size:13px; color:var(--dim); margin-bottom:14px; }
.verdictBig { font-family:'Fraunces',serif; font-size:64px; font-weight:600; margin:0 0 8px; }
.flash.yes .verdictBig { color:var(--mint); } .flash.no .verdictBig { color:var(--rose); }
.conf { font-family:'JetBrains Mono',monospace; color:var(--dim); margin-bottom:18px; }
.revealOverlay { position:fixed; inset:0; background:rgba(8,6,16,.82); display:grid; place-items:center; padding:20px; z-index:20; }
.revealCard { background:linear-gradient(180deg,var(--panel),var(--velvet)); border:1px solid var(--haze); border-radius:22px; padding:24px 22px; max-width:460px; width:100%; text-align:center; box-shadow:0 30px 60px -20px #000; }
.verdict { font-family:'Fraunces',serif; font-size:30px; font-weight:600; margin-bottom:18px; }
.verdict.win { color:var(--candle); } .verdict.lose { color:var(--rose); }
.revealFaces { display:flex; gap:22px; justify-content:center; margin-bottom:20px; }
.rf { display:flex; flex-direction:column; align-items:center; gap:7px; }
.rf .face { width:104px; height:104px; border-radius:16px; overflow:hidden; border:2px solid var(--haze); }
.rf .face img, .rf .face svg { width:100%; height:100%; object-fit:cover; display:block; }
.rf span { font-size:12px; color:var(--dim); }
.note { font-size:12px; color:var(--dim); line-height:1.5; margin:0 0 18px; }
button:focus-visible { outline:2px solid var(--candle); outline-offset:2px; }
@media (prefers-reduced-motion: reduce) { * { transition:none !important; } }
</style>
</head>
<body>
<div id="root"></div>
<script src="https://unpkg.com/react@18/umd/react.production.min.js" crossorigin></script>
<script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js" crossorigin></script>
<script src="https://unpkg.com/@supabase/supabase-js@2/dist/umd/supabase.js"></script>
<script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
<script type="text/babel">
const { useState, useMemo, useEffect, useCallback } = React;

const FACE_POOL = 25, ROUNDS = 8;
const FACE_DIR = "Faces";
const FACE_FILES = ["IMG_7742.jpeg","IMG_7745.jpeg","IMG_7746.jpeg","IMG_7747.jpeg","IMG_7748.jpeg","IMG_7749.jpeg","IMG_7750.jpeg","IMG_7751.jpeg","IMG_7753.jpeg","IMG_7754.jpeg","IMG_7755.jpeg","IMG_7756.jpeg","IMG_7757.jpeg","IMG_7758.jpeg","IMG_7759.jpeg","IMG_7760.jpeg","IMG_7761.jpeg","IMG_7762.jpeg","IMG_7763.jpeg","IMG_7764.jpeg","IMG_7765.jpeg","IMG_7766.jpeg","IMG_7768.jpeg","IMG_7770.jpeg","IMG_7771.jpeg","IMG_7772.jpeg","IMG_7773.jpeg","IMG_7774.jpeg","IMG_7775.jpeg","IMG_7776.jpeg","IMG_7777.jpeg","IMG_7778.jpeg","IMG_7779.jpeg","IMG_7781.jpeg","IMG_7782.jpeg","IMG_7783.jpeg","IMG_7784.jpeg"];
const GRID = { easy:{n:9,cols:3}, medium:{n:16,cols:4}, hard:{n:25,cols:5} };
const FALLBACK_Q = [
  "Does this person help granny across the street?","Does this person have a death stare?",
  "Is this person suspiciously good at poker?","Would this person eat food off the floor if no one saw?",
  "Does this person own a shovel but no garden?","Would this person rescue a spider instead of squishing it?",
  "Does this person clap when the plane lands?","Would this person help you move a body, no questions asked?",
  "Does this person give off cult-leader energy?","Does this person name their houseplants?",
  "Would this person snitch for a good sandwich?","Does this person secretly love pineapple on pizza?",
];

function mulberry32(a){return function(){a|=0;a=(a+0x6d2b79f5)|0;let t=Math.imul(a^(a>>>15),1|a);t=(t+Math.imul(t^(t>>>7),61|t))^t;return((t^(t>>>14))>>>0)/4294967296;};}
function hashSeed(s){let h=2166136261;for(let i=0;i<s.length;i++){h^=s.charCodeAt(i);h=Math.imul(h,16777619);}return h>>>0;}
const SKIN=["#F3C9A5","#E7B08A","#D69A6C","#B87A4B","#8C5A34","#6A4327","#FADCB8"];
const HAIR=["#221B2E","#3B2A1A","#6B4226","#B5651D","#D9A441","#9CA3AF","#7C3AED","#DC2626","#EAE4F2","#0F172A"];

function FaceSVG({ seed }){
  const f = useMemo(()=>{
    const r=mulberry32(hashSeed(String(seed))); const pick=a=>a[Math.floor(r()*a.length)];
    return { skin:pick(SKIN), hair:pick(HAIR), style:Math.floor(r()*6), glasses:r()<0.34, round:r()<0.5, beard:Math.floor(r()*4), mouth:Math.floor(r()*4) };
  },[seed]);
  return (
    <svg viewBox="0 0 100 100" xmlns="http://www.w3.org/2000/svg">
      <rect x="0" y="0" width="100" height="100" fill="#171126" />
      <rect x="42" y="66" width="16" height="16" rx="6" fill={f.skin} />
      <circle cx="28" cy="50" r="6" fill={f.skin} /><circle cx="72" cy="50" r="6" fill={f.skin} />
      <rect x="30" y="26" width="40" height="46" rx={f.round?20:13} fill={f.skin} />
      {f.beard===2 && <path d="M31 50 Q50 82 69 50 L69 60 Q50 78 31 60 Z" fill={f.hair} opacity="0.9" />}
      {f.beard===1 && <path d="M33 56 Q50 72 67 56 L67 61 Q50 70 33 61 Z" fill={f.hair} opacity="0.35" />}
      {f.beard===3 && <path d="M42 58 Q50 64 58 58 L58 60 Q50 65 42 60 Z" fill={f.hair} />}
      <circle cx="42" cy="47" r="2.6" fill="#241a33" /><circle cx="58" cy="47" r="2.6" fill="#241a33" />
      <rect x="37" y="40" width="10" height="2.2" rx="1" fill={f.hair} opacity="0.8" />
      <rect x="53" y="40" width="10" height="2.2" rx="1" fill={f.hair} opacity="0.8" />
      {f.mouth===0 && <path d="M43 58 Q50 64 57 58" stroke="#7a2b3d" strokeWidth="2" fill="none" strokeLinecap="round" />}
      {f.mouth===1 && <line x1="44" y1="60" x2="56" y2="60" stroke="#7a2b3d" strokeWidth="2" strokeLinecap="round" />}
      {f.mouth===2 && <path d="M43 61 Q50 60 57 57" stroke="#7a2b3d" strokeWidth="2" fill="none" strokeLinecap="round" />}
      {f.mouth===3 && <circle cx="50" cy="60" r="3" fill="#7a2b3d" />}
      {f.glasses && (<g stroke="#EAE4F2" strokeWidth="1.6" fill="none" opacity="0.9">
        {f.round ? (<React.Fragment><circle cx="42" cy="47" r="6" /><circle cx="58" cy="47" r="6" /></React.Fragment>)
                 : (<React.Fragment><rect x="36" y="42" width="12" height="10" rx="2" /><rect x="52" y="42" width="12" height="10" rx="2" /></React.Fragment>)}
        <line x1="48" y1="47" x2="52" y2="47" /></g>)}
      {f.style===0 && <path d="M28 40 Q30 20 50 20 Q70 20 72 40 L72 34 Q66 26 50 26 Q34 26 28 34 Z" fill={f.hair} />}
      {f.style===1 && <path d="M27 46 Q28 18 50 18 Q72 18 73 46 L73 40 Q70 24 50 24 Q30 24 27 40 Z" fill={f.hair} />}
      {f.style===2 && <path d="M26 66 Q22 20 50 18 Q78 20 74 66 L70 66 Q73 30 50 26 Q27 30 30 66 Z" fill={f.hair} />}
      {f.style===3 && <React.Fragment><circle cx="50" cy="20" r="8" fill={f.hair} /><path d="M29 42 Q30 22 50 22 Q70 22 71 42 L71 36 Q66 28 50 28 Q34 28 29 36 Z" fill={f.hair} /></React.Fragment>}
      {f.style===4 && <path d="M30 38 Q32 24 50 24 Q68 24 70 38 L70 36 Q64 30 50 30 Q36 30 30 36 Z" fill={f.hair} opacity="0.55" />}
    </svg>
  );
}
function Face({ file, seed }){
  const [ok, setOk] = useState(true);
  if (ok && file) return <img src={"./"+FACE_DIR+"/"+file} alt="" onError={()=>setOk(false)} />;
  return <FaceSVG seed={seed} />;
}

function seedPlayers(){
  const you = 1 + Math.floor(Math.random()*6);
  const others = [1,2,3,4,5,6].filter(n=>n!==you).slice(0,3);
  const bots = others.map((n,i)=>({ id:"b"+n, num:n, name:"Detective "+n, ready:false, you:false, lag:i===2 }));
  const all = [{ id:"you", num:you, name:"Detective "+you, ready:false, you:true, lag:false }, ...bots];
  return all.sort((a,b)=>a.num-b.num);
}

function SoloApp(){
  const [screen,setScreen] = useState("lobby");
  const [players,setPlayers] = useState(seedPlayers);
  const [leaderMode,setLeaderMode] = useState("random");
  const [crown,setCrown] = useState(null);
  const [diff,setDiff] = useState("medium");

  const [role,setRole] = useState("detective");
  const [seed,setSeed] = useState(1);
  const [faceFiles,setFaceFiles] = useState([]);
  const [pool,setPool] = useState(FALLBACK_Q);
  const [round,setRound] = useState(1);
  const [phase,setPhase] = useState("vote");     // vote|waiting|reading|narrow|guessing|reveal
  const [askedQ,setAskedQ] = useState("");
  const [seerAns,setSeerAns] = useState(null);   // {ans:'yes'|'no', conf:number|null}
  const [answerMode,setAnswerMode] = useState("yesno");
  const [conf,setConf] = useState(7);
  const [sortLikely,setSortLikely] = useState(true);
  const [status,setStatus] = useState({});
  const [score,setScore] = useState({});
  const [marks,setMarks] = useState({});
  const [showMode,setShowMode] = useState("score");
  const [guess,setGuess] = useState(null);
  const [seerId,setSeerId] = useState(null);
  const cfg = GRID[diff];

  useEffect(()=>{ fetch("./questions.json").then(r=>r.json()).then(d=>{ if(Array.isArray(d)&&d.length) setPool(d.map(x=>x.text)); }).catch(()=>{}); },[]);
  useEffect(()=>{ fetch("./faces/manifest.json").then(r=>r.json()).then(d=>{ if(Array.isArray(d)&&d.length) setFaceFiles(d); }).catch(()=>{}); },[]);

  // bots ready up on their own (one laggard never does -> shows the kick)
  useEffect(()=>{
    if(screen!=="lobby") return;
    const timers = players.filter(p=>!p.you && !p.lag).map(p=>
      setTimeout(()=>setPlayers(ps=>ps.map(x=>x.id===p.id?{...x,ready:true}:x)), 700+Math.random()*2000));
    return ()=>timers.forEach(clearTimeout);
  },[screen]);

  const allReady = players.length>0 && players.every(p=>p.ready);
  const toggleYou = ()=> setPlayers(ps=>ps.map(p=>p.you?{...p,ready:!p.ready}:p));
  const kick = (id)=> setPlayers(ps=>ps.filter(p=>p.id!==id));

  const chooseSeer = ()=>{
    if(leaderMode==="picked" && crown && players.some(p=>p.id===crown)) return crown;
    if(leaderMode==="random") return players[Math.floor(Math.random()*players.length)].id;
    return players[0].id; // rotating starts with lowest number
  };
  const start = ()=>{ setSeerId(chooseSeer()); setRole("detective"); setRound(1); setPhase("vote"); setAskedQ(""); setSeerAns(null); setStatus({}); setScore({}); setMarks({}); setGuess(null); setSeed(Math.floor(Math.random()*1000000)+1); setScreen("game"); };

  const faces = useMemo(()=>{
    const source = faceFiles.length ? faceFiles : FACE_FILES;
    const r = mulberry32(hashSeed(diff+":"+seed+":"+source.length));
    const distinct = source.length>=cfg.n; const idx=[];
    while(idx.length<cfg.n){ const k=Math.floor(r()*source.length); if(distinct && idx.includes(k)) continue; idx.push(k); }
    return idx.map((k,i)=>({ id:i, file:source[k], seed:diff+"-"+seed+"-"+k+"-"+i }));
  },[diff,seed,cfg.n,faceFiles]);
  const secret = useMemo(()=>{ const r=mulberry32(hashSeed("secret:"+diff+":"+seed)); return Math.floor(r()*cfg.n); },[diff,seed,cfg.n]);
  const options = useMemo(()=>{
    const r=mulberry32(hashSeed("opts:"+seed+":"+round)); const out=[]; const used=new Set();
    while(out.length<4 && used.size<pool.length){ const i=Math.floor(r()*pool.length); if(!used.has(i)){ used.add(i); out.push(pool[i]); } }
    return out;
  },[pool,seed,round]);

  const pickQuestion = (q)=>{ setAskedQ(q); setSeerAns(null); setPhase("waiting"); };
  const seerAnswer = (ans)=>{ setSeerAns({ ans, conf:null }); setPhase("reading"); };
  const seerScale = ()=>{ setSeerAns({ ans: conf>=5?"yes":"no", conf }); setPhase("reading"); };
  const simulate = ()=>{ const r=mulberry32(hashSeed("read:"+seed+":"+round)); setSeerAns({ ans:r()<0.5?"yes":"no", conf:null }); setPhase("reading"); };
  const tapFace = (id)=>{ if(phase==="guessing"){ setGuess(id); return; } if(phase!=="narrow") return; const key=round+":"+id; const on=!!marks[key]; setMarks(m=>{ const n={...m}; if(on) delete n[key]; else n[key]=true; return n; }); setScore(s=>({...s,[id]:Math.max(0,(s[id]||0)+(on?-1:1))})); };
  const tallyMarks = (n)=>{ let s=""; for(let i=0;i<n;i++) s+="|"; return s; };
  const next = ()=>{ if(round<ROUNDS){ setRound(r=>r+1); setPhase("vote"); setAskedQ(""); setSeerAns(null); } else setPhase("guessing"); };

  const ordered = useMemo(()=>{ if(!sortLikely) return faces; return [...faces].sort((a,b)=>((score[b.id]||0)-(score[a.id]||0))||a.id-b.id); },[faces,score,sortLikely]);
  const correct = guess===secret;
  const youP = players.find(p=>p.you);
  const seerP = players.find(p=>p.id===seerId);

          <div className="qmeta"><span className="counter">{String(round).padStart(2,"0")}<i>/{ROUNDS}</i></span></div>

          <span className="counter">{String(round).padStart(2,"0")}<i>/{ROUNDS}</i></span>

        </section>
      )}

      {role==="detective" && phase!=="vote" && phase!=="waiting" && (
        <React.Fragment>
          <div className="gridHead">
            <span className="tally">{phase==="guessing"?"tap the suspect":"tap faces that fit"}</span>
            <button className="miniToggle" onClick={()=>setShowMode(m=>m==="score"?"tally":"score")}>{showMode==="score"?"Show: score":"Show: tally"}</button>
          </div>
          {phase==="narrow" && <div className="footer" style={{marginTop:0,marginBottom:12}}><button className="ghost" onClick={()=>setPhase("guessing")}>Guess now</button><button className="primary" onClick={next}>{round<ROUNDS?"Next question":"Time to guess"} ›</button></div>}
          <div className="grid" style={{ gridTemplateColumns:"repeat("+cfg.cols+", 1fr)" }}>
            {ordered.map(f=>{
              const sc=score[f.id]||0; const hit=!!marks[round+":"+f.id]; const picked=phase==="guessing"&&guess===f.id;
              const cls=["cell",hit&&phase!=="guessing"?"likely":"",picked?"picked":""].join(" ");
              return (<button key={f.id} className={cls} onClick={()=>tapFace(f.id)} aria-label={"Face "+(f.id+1)}>
                <Face file={f.file} seed={f.seed} />
                {sc>0 && <span className="badge like" style={{minWidth:24,width:"auto",height:24,padding:"0 6px",fontFamily:"'JetBrains Mono',monospace",fontSize:15,fontWeight:800}}>{showMode==="score"?sc:tallyMarks(sc)}</span>}
                {picked && <span className="badge pick">◆</span>}
              </button>);
            })}
          </div>
          {phase==="guessing" && <div className="footer"><button className="ghost" onClick={()=>setPhase("narrow")}>Back</button><button className="primary" disabled={guess===null} onClick={()=>setPhase("reveal")}>Lock my guess ◆</button></div>}
        </React.Fragment>
      )}

      {role==="detective" && phase==="reading" && seerAns && (
        <div className={"flash "+(seerAns.ans==="yes"?"yes":"no")} onClick={()=>setPhase("narrow")}>
          <div className="flashCard">
            <div className="flashQ">Does {shortQ(askedQ)}?</div>
            <p className="verdictBig">{seerAns.ans.toUpperCase()}</p>
            {seerAns.conf!=null && <div className="conf">seer is {seerAns.conf}/10 sure</div>}
            <button className="primary full" onClick={()=>setPhase("narrow")}>Read your suspects ›</button>
          </div>
        </div>
      )}

      {phase==="reveal" && (
        <div className="revealOverlay"><div className="revealCard">
          <div className={"verdict "+(correct?"win":"lose")}>{correct?"You read them.":"Not quite."}</div>
          <div className="revealFaces">
            <div className="rf"><div className="face"><Face file={faces[guess]?.file} seed={faces[guess]?.seed} /></div><span>Your guess</span></div>
            {!correct && <div className="rf"><div className="face"><Face file={faces[secret]?.file} seed={faces[secret]?.seed} /></div><span>The suspect</span></div>}
          </div>
          <p className="note">In the live game this adds the group math: % of detectives who matched the seer, and the single most divisive question.</p>
          <div className="footer"><button className="ghost" onClick={()=>setScreen("lobby")}>Lobby</button><button className="primary" onClick={start}>Play again ↻</button></div>
        </div></div>
      )}
    </div>
  );
}

function OnlineApp({ onExit }){
  const inp = { width:"100%", padding:"13px", borderRadius:"12px", border:"1px solid var(--haze)", background:"var(--velvet)", color:"var(--mist)", fontFamily:"inherit", fontSize:"16px", marginBottom:"10px" };

  const [codeInput,setCodeInput] = useState(()=>ls.get("cr_code")||"");
  const [savedCode] = useState(()=>ls.get("cr_code")||"");
  const [code,setCode] = useState("");
  const [game,setGame] = useState(null);
  const [players,setPlayers] = useState([]);
  const [pool,setPool] = useState(FALLBACK_Q);
  const [faceFiles,setFaceFiles] = useState([]);
  const [status,setStatus] = useState({});
  const [guess,setGuess] = useState(null);
  const [conf,setConf] = useState(7);
  const [pendingSeer,setPendingSeer] = useState(null);
  const [dismissed,setDismissed] = useState(0);
  const [score,setScore] = useState({});
  const [marks,setMarks] = useState({});
  const [showMode,setShowMode] = useState("score");
  const [nowT,setNowT] = useState(Date.now());
  const firedRef = React.useRef(null);
  const [err,setErr] = useState("");

  useEffect(()=>{
    fetch("./questions.json").then(r=>r.json()).then(d=>{ if(Array.isArray(d)&&d.length) setPool(d.map(x=>x.text)); }).catch(()=>{});
    fetch("./faces/manifest.json").then(r=>r.json()).then(d=>{ if(Array.isArray(d)&&d.length) setFaceFiles(d); }).catch(()=>{});
  },[]);

  const refetch = useCallback(async (c)=>{
    const gc = c || code; if(!gc || !sb) return;
    const g = await sb.from("games").select("*").eq("code",gc).maybeSingle();
    setGame(g.data);
    const ps = await sb.from("players").select("*").eq("code",gc).order("num");
    setPlayers(ps.data || []);
  },[code]);

  useEffect(()=>{
    if(!code || !sb) return;
    refetch(code);
    const ch = sb.channel("room:"+code)
      .on("postgres_changes",{event:"*",schema:"public",table:"games",filter:"code=eq."+code},()=>refetch(code))
      .on("postgres_changes",{event:"*",schema:"public",table:"players",filter:"code=eq."+code},()=>refetch(code))
      .subscribe();
    return ()=>{ sb.removeChannel(ch); };
  },[code]);

  const me = players.find(p=>p.id===myId);
  const amHost = game && game.host_id===myId;
  const amSeer = game && game.seer_id===myId;
  const cfg = game ? (GRID[game.difficulty]||GRID.medium) : GRID.medium;

  const faces = useMemo(()=>{
    if(!game) return [];
    const source = faceFiles.length ? faceFiles : FACE_FILES;
    const r = mulberry32(hashSeed(game.difficulty+":"+game.seed+":"+source.length));
    const distinct = source.length>=cfg.n; const idx=[];
    while(idx.length<cfg.n){ const k=Math.floor(r()*source.length); if(distinct && idx.includes(k)) continue; idx.push(k); }
    return idx.map((k,i)=>({ id:i, file:source[k], seed:game.difficulty+"-"+game.seed+"-"+k+"-"+i }));
  },[game,faceFiles,cfg.n]);
  const options = useMemo(()=>{
    if(!game) return [];
    const r = mulberry32(hashSeed("opts:"+game.seed+":"+game.round)); const out=[],used=new Set();
    while(out.length<4 && used.size<pool.length){ const i=Math.floor(r()*pool.length); if(!used.has(i)){ used.add(i); out.push(pool[i]); } }
    return out;
  },[game,pool]);

  const createGame = async ()=>{
    if(!name.trim()){ setErr("Enter a name first"); return; }
    const c = randCode();
    const g = await sb.from("games").insert({ code:c, host_id:myId, phase:"lobby", difficulty:"medium", answer_mode:"yesno", seed:Math.floor(Math.random()*1000000)+1, round:1 });
    if(g.error){ setErr(g.error.message); return; }
    await sb.from("players").insert({ id:myId, code:c, name:name.trim(), num:1, ready:false });
    ls.set("cr_code",c); ls.set("cr_name",name.trim());
    setCode(c);
  };
  const joinGame = async ()=>{
    const c = codeInput.trim().toUpperCase();
    if(!c){ setErr("Enter a code"); return; }
    if(!name.trim()){ setErr("Enter a name"); return; }
    const g = await sb.from("games").select("code").eq("code",c).maybeSingle();
    if(!g.data){ setErr("No game with that code"); return; }
    const ps = await sb.from("players").select("num").eq("code",c);
    const num = (ps.data && ps.data.length ? Math.max.apply(null, ps.data.map(p=>p.num)) : 0) + 1;
    await sb.from("players").insert({ id:myId, code:c, name:name.trim(), num, ready:false });

    setCode(c);

  const toggleReady = async ()=>{ if(!me) return; await sb.from("players").update({ ready:!me.ready }).eq("id",myId); };
  const kick = async (id)=>{ await sb.from("players").delete().eq("id",id); };
  const resume = ()=>{ if(savedCode){ setCodeInput(savedCode); setCode(savedCode); } };
  const setDiff = async (d)=>{ await sb.from("games").update({ difficulty:d }).eq("code",code); };
  const setAns = async (m)=>{ await sb.from("games").update({ answer_mode:m }).eq("code",code); };
  const startGame = async ()=>{
    if(!(players.length>0 && players.every(p=>p.ready))) return;
    const seer = (pendingSeer && players.some(p=>p.id===pendingSeer)) ? pendingSeer : players[Math.floor(Math.random()*players.length)].id;
    const suspect = Math.floor(Math.random()*cfg.n);
    await sb.from("games").update({ phase:"playing", round:1, seer_id:seer, suspect_idx:suspect, seed:Math.floor(Math.random()*1000000)+1, asked_q:null, seer_ans:null }).eq("code",code);
    await sb.from("players").update({ ready:false }).eq("code",code);
  };
  const sendQuestion = async (q)=>{ await sb.from("games").update({ asked_q:q, seer_ans:null }).eq("code",code); };
  const seerYesNo = async (ans)=>{ await sb.from("games").update({ seer_ans:{ ans, conf:null } }).eq("code",code); };
  const seerScale = async ()=>{ await sb.from("games").update({ seer_ans:{ ans:(conf>=5?"yes":"no"), conf } }).eq("code",code); };
  const nextRound = async ()=>{
    await sb.from("players").update({ ready:false }).eq("code",code);
    if(game.round<ROUNDS) await sb.from("games").update({ round:game.round+1, asked_q:null, seer_ans:null }).eq("code",code);
    else await sb.from("games").update({ phase:"guessing", asked_q:null, seer_ans:null }).eq("code",code);
  };
  const lockGuess = async ()=>{ if(guess==null) return; await sb.from("players").update({ guess }).eq("id",myId); };
  const reveal = async ()=>{ await sb.from("games").update({ phase:"revealed" }).eq("code",code); };
  const toggleDone = async ()=>{ if(!me) return; await sb.from("players").update({ ready:!me.ready }).eq("id",myId); };
  const backToLobby = async ()=>{ await sb.from("players").update({ ready:false }).eq("code",code); await sb.from("games").update({ phase:"lobby", seer_id:null, suspect_idx:null, asked_q:null, seer_ans:null, seed:Math.floor(Math.random()*1000000)+1 }).eq("code",code); };

  useEffect(()=>{ setScore({}); setMarks({}); setGuess(null); firedRef.current=null; }, [game && game.seed]);
  useEffect(()=>{ const t=setInterval(()=>setNowT(Date.now()), 300); return ()=>clearInterval(t); }, []);
  useEffect(()=>{
    if(!game || !amSeer) return;
    const until = game.seer_ans && game.seer_ans.until;
    if(until && Date.now()>=until && firedRef.current!==game.round){ firedRef.current=game.round; nextRound(); }
  }, [nowT, game, amSeer]);

  const tapFace = (id)=>{
    if(game.phase==="guessing"){ setGuess(id); return; }
    const key = game.round+":"+id; const on = !!marks[key];
    setMarks(m=>{ const n=Object.assign({},m); if(on) delete n[key]; else n[key]=true; return n; });
    setScore(s=>Object.assign({},s,{ [id]: Math.max(0,(s[id]||0)+(on?-1:1)) }));
  };
  const seerWarn = async (secs)=>{ const cur = game.seer_ans || {}; await sb.from("games").update({ seer_ans:Object.assign({},cur,{ until: Date.now()+secs*1000 }) }).eq("code",code); };
  const tallyMarks = (n)=>{ let s=""; for(let i=0;i<n;i++) s+="|"; return s; };

  if(!sb){
    return (<div className="wrap"><div className="brand">◍ COLD&nbsp;READ</div><div className="card" style={{marginTop:18}}><p style={{margin:0,lineHeight:1.5}}>To play online, paste your Supabase <b>Project URL</b> and <b>key</b> into the two marked lines at the top of index.html, then re-upload.</p></div><button className="readyBtn" style={{marginTop:14}} onClick={onExit}>Back</button></div>);
  }

  if(!code){
    return (<div className="wrap">
      <div className="brand">◍ COLD&nbsp;READ</div>
      <div className="brandBig">Join the case</div>
      {savedCode && <button className="go" style={{background:"var(--psychic)",marginBottom:16}} onClick={resume}>↩ Return to game {savedCode}</button>}
      <input style={inp} placeholder="Your detective name" value={name} onChange={e=>setName(e.target.value)} />
      <input style={inp} placeholder="Game code (e.g. K4TQ)" value={codeInput} onChange={e=>setCodeInput(e.target.value)} />
      <button className="go" onClick={joinGame}>Join game</button>
      <div style={{textAlign:"center",marginTop:16}}><button style={{background:"none",border:"none",color:"var(--dim)",textDecoration:"underline",fontFamily:"inherit",fontSize:"13px",cursor:"pointer",padding:"6px"}} onClick={createGame}>Start a new game</button></div>
      {err && <div className="hint" style={{color:"var(--rose)"}}>{err}</div>}
      <button className="readyBtn" style={{marginTop:16}} onClick={onExit}>Back</button>
    </div>);
  }

  if(!game){ return (<div className="wrap"><div className="waitBox" style={{marginTop:40}}><div className="big">🔮</div>Connecting to {code}…</div><button className="readyBtn" style={{marginTop:16}} onClick={()=>setCode("")}>Back</button></div>); }

  const seerP = players.find(p=>p.id===game.seer_id);
  const suspect = game.suspect_idx;

  if(game.phase==="lobby"){
    const allReady = players.length>0 && players.every(p=>p.ready);
    return (<div className="wrap">
      <div className="brand">◍ COLD&nbsp;READ</div>
      <div className="card" style={{marginTop:14,textAlign:"center"}}>
        <div className="label" style={{margin:"0 0 6px"}}>Share this code</div>
        <div style={{fontFamily:"'JetBrains Mono',monospace",fontSize:"40px",fontWeight:"700",letterSpacing:".2em",color:"var(--candle)"}}>{code}</div>
      </div>
      <div className="label">In the room</div>
      <div className="card"><div className="roster">
        {players.map(p=>(
          <div className="prow" key={p.id}>

            <div className="rgt">
              <span className={"pill "+(p.ready?"ready":"wait")}>{p.ready?"ready":"waiting"}</span>
              {amHost && p.id!==myId && <button className="kick" onClick={()=>kick(p.id)}>kick</button>}
              {amHost && <button className="kick" style={{color:"var(--psychic)",borderColor:"var(--psychic)"}} onClick={()=>setPendingSeer(p.id)}>seer</button>}
            </div>
          </div>
        ))}
      </div></div>
      <button className={"readyBtn"+(me&&me.ready?" on":"")} onClick={toggleReady}>{me&&me.ready?"✓ You are ready":"Ready up"}</button>
      {amHost && (<div>
        <div className="label">Grid size (host)</div>
        <div className="sel">{["easy","medium","hard"].map(d=>(<button key={d} className={"chip"+(game.difficulty===d?" on":"")} onClick={()=>setDiff(d)}>{d==="easy"?"3×3":d==="medium"?"4×4":"5×5"}</button>))}</div>
        <div className="label">Seer answers with (host)</div>
        <div className="sel">{[["yesno","Yes / No"],["scale","Sliding scale"]].map(([m,l])=>(<button key={m} className={"chip"+(game.answer_mode===m?" on":"")} onClick={()=>setAns(m)}>{l}</button>))}</div>
        <button className="go" disabled={!allReady} onClick={startGame}>LET'S GOOOO</button>
        <div className="hint">{allReady?"Detectives ready.":"Waiting on everyone to ready up."}</div>
      </div>)}
      {!amHost && <div className="hint" style={{marginTop:14}}>Waiting for the host to start…</div>}
      <button className="readyBtn" style={{marginTop:16}} onClick={onExit}>Leave</button>
    </div>);
  }

  const header = (<header className="top">
    <div><div className="brand">◍ COLD&nbsp;READ</div><div className="who">{me&&me.name} · {amSeer?"you are the seer":("seer: "+(seerP?seerP.name:"—"))} · Q{Math.min(game.round,ROUNDS)}/{ROUNDS}</div></div>
    <button className="miniToggle" onClick={onExit}>Leave</button>
  </header>);

  if(game.phase==="revealed"){
    const correct = me && me.guess===suspect;
    return (<div className="wrap">{header}
      <div className="revealOverlay"><div className="revealCard">
        <div className={"verdict "+(correct?"win":"lose")}>{amSeer?"Case closed.":(correct?"You read them.":"Not quite.")}</div>
        <div className="revealFaces">
          {!amSeer && me && me.guess!=null && <div className="rf"><div className="face"><Face file={faces[me.guess]?.file} seed={faces[me.guess]?.seed} /></div><span>Your guess</span></div>}
          <div className="rf"><div className="face"><Face file={faces[suspect]?.file} seed={faces[suspect]?.seed} /></div><span>The suspect</span></div>
        </div>
        <p className="note">Group math (who matched the seer, most divisive question) comes next once this loop feels right.</p>
        {amHost && <button className="primary full" onClick={backToLobby}>Back to lobby</button>}
      </div></div>
    </div>);
  }

  if(amSeer){
    return (<div className="wrap">{header}
      <section className="qcard seerBig">
        <div className="suspect"><div className="face"><Face file={faces[suspect]?.file} seed={faces[suspect]?.seed} /></div><span>Your suspect — only you see this</span></div>
        {game.phase==="guessing" ? (
          <div className="waitBox"><div className="big">🔮</div>The detectives are locking their guesses.<button className="primary full" style={{marginTop:14}} onClick={reveal}>Reveal the suspect ›</button></div>
        ) : !game.asked_q ? (
          <div className="waitBox"><div className="big">🔮</div>Waiting for a detective to send a question…</div>
        ) : !game.seer_ans ? (
          <div>
            <div className="who" style={{textAlign:"center",marginBottom:6}}>The detectives are asking</div>
            <p className="seerQ">Does {shortQ(game.asked_q)}?</p>
            {game.answer_mode==="yesno" ? (
              <div className="ansRow"><button className="ans y" onClick={()=>seerYesNo("yes")}>YES</button><button className="ans n" onClick={()=>seerYesNo("no")}>NO</button></div>
            ) : (
              <div className="scaleRow"><input type="range" min="0" max="10" value={conf} onChange={e=>setConf(+e.target.value)} /><div className="who" style={{margin:"8px 0 14px"}}>reading <span className="scaleVal">{conf}/10</span> — {conf>=5?"leaning yes":"leaning no"}</div><button className="primary full" onClick={seerScale}>Send reading ›</button></div>
            )}
          </div>
        ) : (
          <div className="waitBox">
            <div className="big">{game.seer_ans.ans==="yes"?"✅":"⛔"}</div>
            You answered <b>{game.seer_ans.ans.toUpperCase()}</b>{game.seer_ans.conf!=null?(" · "+game.seer_ans.conf+"/10"):""}.
            <div style={{marginTop:12,fontSize:13,color:"var(--dim)"}}>
              Detectives done: <b style={{color:"var(--mint)"}}>{players.filter(p=>p.id!==game.seer_id&&p.ready).length}</b> / {players.filter(p=>p.id!==game.seer_id).length}
              <div style={{marginTop:6}}>{players.filter(p=>p.id!==game.seer_id).map(p=>(<span key={p.id} style={{marginRight:10,color:p.ready?"var(--mint)":"var(--dim)"}}>{p.ready?"✓":"○"} {p.name}</span>))}</div>
            </div>
            {game.seer_ans.until && game.seer_ans.until>nowT && <div style={{color:"var(--candle)",marginTop:10,fontWeight:700,fontSize:18}}>Next in {Math.ceil((game.seer_ans.until-nowT)/1000)}s…</div>}
            <div className="footer" style={{marginTop:14}}>
              <button className="ghost" onClick={()=>seerWarn(10)}>Give 10s</button>
              <button className="ghost" onClick={()=>seerWarn(20)}>Give 20s</button>
              <button className="primary" onClick={nextRound}>Next now ›</button>
            </div>
          </div>
        )}
      </section>
    </div>);
  }

  const showFlash = game.phase==="playing" && game.seer_ans && dismissed!==game.round;
  return (<div className="wrap">{header}
    {game.phase==="playing" && !game.asked_q && (
      <section className="qcard">
        <div className="qmeta"><span className="counter">{String(game.round).padStart(2,"0")}<i>/{ROUNDS}</i></span><span className="miniToggle">Send a question</span></div>
        <p className="lead">Pick a question to send the seer:</p>
        <div className="picks">{options.map((q,i)=>(<button key={i} className="pick" onClick={()=>sendQuestion(q)}>{q}</button>))}</div>
      </section>
    )}
    {game.phase==="playing" && game.asked_q && !game.seer_ans && (
      <section className="qcard"><div className="waitBox"><div className="big">🔮</div>Sent to the seer: <b>Does {shortQ(game.asked_q)}?</b><br/>Waiting for the reading…</div></section>
    )}
    {((game.phase==="playing" && game.seer_ans) || game.phase==="guessing") && (
      <section className="qcard"><div className="qmeta"><span className="counter">{String(Math.min(game.round,ROUNDS)).padStart(2,"0")}<i>/{ROUNDS}</i></span></div>
        <p className="qtext small">{game.phase==="guessing" ? <span>Lock in who is <b>the suspect</b>.</span> : <span>Seer said <span className="qhi">{game.seer_ans.ans.toUpperCase()}</span>{game.seer_ans.conf!=null?(" ("+game.seer_ans.conf+"/10)"):""} — read your suspects.</span>}</p>
      </section>
    )}
    {(game.phase==="guessing" || (game.phase==="playing" && game.seer_ans)) && (
      <React.Fragment>
        <div className="gridHead">
          <span className="tally">{game.phase==="guessing" ? "tap the suspect" : "tap faces that fit the reading"}</span>
          <button className="miniToggle" onClick={()=>setShowMode(m=>m==="score"?"tally":"score")}>{showMode==="score"?"Show: score":"Show: tally"}</button>
        </div>
        {game.phase==="playing" && game.seer_ans && game.seer_ans.until && game.seer_ans.until>nowT && <div className="hint" style={{marginTop:-4,marginBottom:8,color:"var(--candle)"}}>Seer moving on in {Math.ceil((game.seer_ans.until-nowT)/1000)}s — mark fast!</div>}
        {game.phase==="playing" && <div className="footer" style={{marginTop:0,marginBottom:12}}><button className="primary full" style={me&&me.ready?{background:"var(--mint)",color:"var(--ink)"}:{}} onClick={toggleDone}>{me&&me.ready?"✓ Done — waiting for the seer":"I'm done marking"}</button></div>}
        <div className="grid" style={{ gridTemplateColumns:"repeat("+cfg.cols+", 1fr)" }}>
          {[...faces].sort((a,b)=>((score[b.id]||0)-(score[a.id]||0))||a.id-b.id).map(f=>{
            const sc=score[f.id]||0; const hit=!!marks[game.round+":"+f.id]; const picked=game.phase==="guessing"&&guess===f.id;
            const cls=["cell",hit&&game.phase!=="guessing"?"likely":"",picked?"picked":""].join(" ");
            return (<button key={f.id} className={cls} onClick={()=>tapFace(f.id)}>
              <Face file={f.file} seed={f.seed} />
              {sc>0 && <span className="badge like" style={{minWidth:24,width:"auto",height:24,padding:"0 6px",fontFamily:"'JetBrains Mono',monospace",fontSize:15,fontWeight:800}}>{showMode==="score"?sc:tallyMarks(sc)}</span>}
              {picked && <span className="badge pick">◆</span>}
            </button>);
          })}
        </div>
        {game.phase==="guessing" && (me && me.guess!=null
          ? <div className="hint" style={{marginTop:14}}>Guess locked. Waiting for the seer to reveal…</div>
          : <div className="footer"><button className="primary full" disabled={guess===null} onClick={lockGuess}>Lock my guess ◆</button></div>)}
      </React.Fragment>
    )}
    {showFlash && (
      <div className={"flash "+(game.seer_ans.ans==="yes"?"yes":"no")} onClick={()=>setDismissed(game.round)}>
        <div className="flashCard"><div className="flashQ">Does {shortQ(game.asked_q)}?</div><p className="verdictBig">{game.seer_ans.ans.toUpperCase()}</p>{game.seer_ans.conf!=null && <div className="conf">seer is {game.seer_ans.conf}/10 sure</div>}<button className="primary full" onClick={()=>setDismissed(game.round)}>Read your suspects ›</button></div>
      </div>
    )}
  </div>);
}

function App(){
  const [mode,setMode] = useState(null);
  if(mode==="solo") return <SoloApp/>;
  if(mode==="online") return <OnlineApp onExit={()=>setMode(null)} />;
  return <Home configured={sbReady} onPick={setMode} />;
}
ReactDOM.createRoot(document.getElementById("root")).render(<App />);
</script>
</body>
</html>
