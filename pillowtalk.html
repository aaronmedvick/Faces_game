<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#1a1625">
<title>Know Your Partner</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:ital,opsz,wght@0,9..144,400..800;1,9..144,400..800&family=Space+Grotesk:wght@400..700&display=swap" rel="stylesheet">
<script src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
<script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
<script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
<script src="https://unpkg.com/@supabase/supabase-js@2/dist/umd/supabase.js"></script>
<style>
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;min-height:100%;background:#1a1625}
body{font-family:'Space Grotesk',system-ui,sans-serif;-webkit-font-smoothing:antialiased}
button{font-family:inherit;cursor:pointer}
input{font-family:inherit}

.app{min-height:100dvh;position:relative;overflow-x:hidden;background:linear-gradient(160deg,#1a1625 0%,#2d1b38 100%);color:#e8dff5;transition:background 1.2s}
.app.match{background:linear-gradient(160deg,#fff0f7,#ffe8f0);color:#4d1838}
.wrap{position:relative;z-index:2;max-width:480px;margin:0 auto;padding:calc(12px + env(safe-area-inset-top)) 16px calc(24px + env(safe-area-inset-bottom))}

.hdr{display:flex;align-items:center;justify-content:space-between;gap:10px;margin-bottom:14px}
.logo{font-family:Fraunces,serif;font-style:italic;font-weight:700;font-size:21px}
.pill{border:1px solid rgba(255,255,255,.25);background:rgba(255,255,255,.08);color:inherit;border-radius:999px;padding:6px 11px;font-size:12px;font-weight:600;cursor:pointer}
.app.match .pill{border-color:rgba(0,0,0,.15);background:rgba(255,255,255,.4);color:#4d1838}

.card{background:rgba(255,255,255,.05);border:1px solid rgba(255,255,255,.1);border-radius:20px;padding:18px}
.card+.card{margin-top:12px}
.app.match .card{background:rgba(255,255,255,.4);border-color:rgba(255,255,255,.6)}

.q{font-family:Fraunces,serif;font-style:italic;font-weight:600;font-size:27px;line-height:1.18;margin:6px 0 8px}
.app.match .q{color:#4d1838}
.sub{color:rgba(255,255,255,.65);font-size:14px;line-height:1.4;margin:0 0 14px}
.app.match .sub{color:rgba(0,0,0,.6)}

.tiles{display:grid;grid-template-columns:repeat(5,1fr);gap:8px}
.tile{height:56px;border-radius:14px;border:1.5px solid rgba(255,255,255,.15);background:rgba(255,255,255,.08);color:inherit;font-family:Fraunces,serif;font-weight:700;font-size:22px;transition:transform .12s,background-color .2s;cursor:pointer}
.tile.sel{background:#c684d9;border-color:#c684d9;color:#fff}
.app.match .tile{border-color:rgba(255,102,153,.2);background:rgba(255,102,153,.08)}
.app.match .tile.sel{background:#ff6699;border-color:#ff6699;color:#fff}

.btn{display:block;width:100%;padding:16px;border-radius:16px;border:none;background:#c684d9;color:#fff;font-size:17px;font-weight:700;margin-top:14px;transition:opacity .2s;cursor:pointer}
.btn:disabled{opacity:.35;cursor:not-allowed}
.btn.ghost{background:transparent;color:inherit;border:1.5px solid rgba(255,255,255,.25)}
.app.match .btn{background:#ff6699}
.app.match .btn.ghost{border-color:rgba(0,0,0,.2);color:#4d1838}

.inp{width:100%;padding:15px 16px;border-radius:14px;border:1.5px solid rgba(255,255,255,.15);background:rgba(255,255,255,.08);color:inherit;font-size:17px;outline:none}
.inp:focus{border-color:#c684d9}
.inp::placeholder{color:rgba(255,255,255,.4)}

.center{text-align:center;padding:26px 8px}
.hero{font-family:Fraunces,serif;font-weight:800;font-size:44px;line-height:1;margin:22px 0 8px}
.code{font-family:Fraunces,serif;font-weight:800;font-size:54px;letter-spacing:.14em;text-align:center;margin:4px 0}

.who{display:flex;align-items:center;gap:10px;padding:10px 0;font-size:16px}
.dot{width:10px;height:10px;border-radius:50%;background:rgba(255,255,255,.3)}
.dot.on{background:#c684d9}

.chip{padding:12px 8px;border-radius:14px;border:1.5px solid rgba(255,255,255,.15);background:rgba(255,255,255,.08);color:inherit;font-size:15px;font-weight:600;cursor:pointer}
.chip.sel{background:#c684d9;border-color:#c684d9;color:#fff}
.chips{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin:8px 0}

.step{font-size:12px;color:rgba(255,255,255,.5);margin:0 2px 10px;font-weight:600}
.ends{display:flex;justify-content:space-between;font-size:12px;color:rgba(255,255,255,.5);margin:8px 2px 0}

.reveal{opacity:0;transform:translateY(10px);transition:opacity .5s,transform .5s;margin-top:12px}
.reveal.in{opacity:1;transform:none}

.pct{font-family:Fraunces,serif;font-weight:800;font-size:72px;line-height:1;text-align:center;margin:4px 0}
.app.match .pct{color:#ff6699}

.verdict{font-family:Fraunces,serif;font-style:italic;font-weight:600;font-size:24px;text-align:center;margin:4px 0 12px;line-height:1.2}
.app.match .verdict{color:#c75a8f}

.knowscore{display:flex;gap:8px;margin:12px 0;font-size:14px;font-weight:600}
.knowscore>div{flex:1;padding:12px;border-radius:12px;border:1px solid rgba(255,255,255,.15);background:rgba(255,255,255,.05);text-align:center}
.knowscore .big{font-size:28px;font-family:Fraunces,serif;font-weight:700;color:#c684d9;margin:4px 0}
.app.match .knowscore>div{border-color:rgba(255,102,153,.2);background:rgba(255,102,153,.08)}
.app.match .knowscore .big{color:#ff6699}

.dims{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin:12px 0}
.dim{padding:12px;border-radius:12px;border:1px solid rgba(255,255,255,.15);background:rgba(255,255,255,.05)}
.app.match .dim{border-color:rgba(255,102,153,.2);background:rgba(255,102,153,.08)}
.dim h4{margin:0 0 6px;font-size:12px;color:rgba(255,255,255,.65);font-weight:600;text-transform:capitalize}
.dim .bar{height:5px;border-radius:2px;background:rgba(255,255,255,.1);overflow:hidden;margin-bottom:6px}
.dim .bar i{display:block;height:100%;background:linear-gradient(90deg,#c684d9,#e0a4f0);border-radius:2px;transition:width .4s}
.dim .pct{font-size:20px;margin:0}

.idea{padding:12px;border-radius:12px;border-left:4px solid #c684d9;background:rgba(255,255,255,.08);font-size:14px;line-height:1.5;margin-bottom:10px}
.app.match .idea{border-left-color:#ff6699;background:rgba(255,102,153,.08)}

.small{font-size:12px;color:rgba(255,255,255,.45);margin:6px 0}
.app.match .small{color:rgba(0,0,0,.5)}

.prize{padding:14px;border-radius:14px;background:rgba(255,102,153,.15);border:1px solid rgba(255,102,153,.3);font-size:16px;font-weight:700;text-align:center;margin-top:12px}

:focus-visible{outline:2px solid #c684d9;outline-offset:2px}
@media(prefers-reduced-motion:reduce){*{transition:none!important}}
</style>
</head>
<body>
<div id="root"></div>
<script type="text/babel">
const {useState,useEffect,useRef,useMemo}=React;
const SUPABASE_URL="https://gyvgzeculdaxcwinblld.supabase.co";
const SUPABASE_KEY="sb_publishable_kS8hQSqZR8Sog9imuq8dCg_-6iBy2Hi";
const sb=supabase.createClient(SUPABASE_URL,SUPABASE_KEY);

function hubId(){let v=localStorage.getItem("hub_uid");if(!v){v="u"+Math.random().toString(36).slice(2,11);localStorage.setItem("hub_uid",v);}return v;}
const genCode=()=>{const A="ABCDEFGHJKLMNPQRSTUVWXYZ";let s="";for(let i=0;i<4;i++)s+=A[Math.floor(Math.random()*A.length)];return s;};

async function loadQuestions(){const data=await (await fetch("data/08.knowyourpartner.pack.json"+"?v="+Math.floor(Date.now()/60000))).json();return data.cards||[];}

function scoreGuess(guess,truth){if(guess==null||truth==null)return 0;const d=Math.abs(guess-truth);return d===0?3:d===1?2:d===2?1:0;}

function scoreCompat(a1,a2){if(a1==null||a2==null)return 0;const d=Math.abs(a1-a2);return Math.max(0,3-d);}

function verdictFor(pct){if(pct>=95)return "Match made in heaven";if(pct>=80)return "Perfectly in tune";if(pct>=65)return "You've got this";if(pct>=50)return "Getting there";if(pct>=25)return "Work in progress";return "A lot left to learn";}

function Home({name,setName,joinCode,setJoinCode,create,join,err,busy}){return(<div><div className="hero">Know Your<br/>Partner</div><p className="sub">Answer honestly. See how well you know each other. Plus your real compatibility.</p><div className="card"><input className="inp" placeholder="Your name" value={name} maxLength={14} onChange={e=>setName(e.target.value)}/><button className="btn" disabled={busy||!name.trim()} onClick={create}>Start a room</button></div><div className="card"><div className="small">Join with a code</div><div style={{display:"flex",gap:8}}><input className="inp" placeholder="ABCD" value={joinCode} maxLength={4} autoCapitalize="characters" style={{letterSpacing:".2em",textTransform:"uppercase",fontWeight:700}} onChange={e=>setJoinCode(e.target.value.toUpperCase())}/><button className="btn" style={{margin:0,width:"auto",padding:"0 22px"}} disabled={busy||!name.trim()||joinCode.length<4} onClick={join}>Join</button></div></div>{err&&<div style={{color:"#ff8a8a",fontSize:14,margin:"10px 0"}}>{err}</div>}</div>);}

function Lobby({room,isHost,start,copyLink,startBot}){return(<div><div className="card"><div className="small" style={{textAlign:"center",margin:0}}>Room</div><div className="code">{room.code}</div>{isHost&&!room.guest_uid&&<button className="btn ghost" style={{marginTop:4}} onClick={copyLink}>Copy link</button>}<div style={{marginTop:12}}><div className="who"><span className="dot on"/>{room.host_name}{isHost?" (you)":""}</div>{room.guest_uid&&<div className="who"><span className="dot on"/>{room.guest_name} {"(them)"}</div>}</div></div><div className="card"><p className="sub" style={{margin:0}}>Newlywed game: both answer 3 questions, then guess 3.</p></div>{isHost&&!room.guest_uid&&<button className="btn ghost" onClick={startBot} style={{marginTop:8}}>Play with bot</button>}{isHost&&room.guest_uid?<button className="btn" onClick={start}>Start</button>:<div className="center sub">{isHost?"Waiting for partner...":room.host_name+" will start soon."}</div>}</div>);}

function AnswerScreen({q,names,slot,onSubmit,onSkip}){const [ans,setAns]=useState(null);return(<div><div className="card"><div className="step">Your answer: {names[slot]}</div><div className="q">{q.q}</div><p className="sub">{q.sub}</p><div className="tiles">{Array.from({length:10}).map((_,i)=><button key={i} className={"tile"+(ans===i+1?" sel":"")} onClick={()=>setAns(i+1)}>{i+1}</button>)}</div><div className="ends"><span>1</span><span>10</span></div><button className="btn" disabled={ans==null} onClick={()=>onSubmit(ans)}>Lock in</button><button className="btn ghost" onClick={onSkip}>Skip</button></div></div>);}

function GuessScreen({q,names,guessing,truth,onSubmit,onReveal}){const [guess,setGuess]=useState(null);const [show,setShow]=useState(false);const pts=scoreGuess(guess,truth);return(<div><div className="card"><div className="step">Guess: {names[1-guessing]}'s answer</div><div className="q">{q.q}</div><p className="sub">{q.sub}</p><div className="tiles">{Array.from({length:10}).map((_,i)=><button key={i} className={"tile"+(guess===i+1?" sel":"")} onClick={()=>setGuess(i+1)}>{i+1}</button>)}</div><div className="ends"><span>1</span><span>10</span></div><button className="btn" disabled={guess==null} onClick={()=>{onSubmit(guess);setShow(true);}}>Lock in</button></div>{show&&<div className="card reveal in"><div style={{marginBottom:12,paddingBottom:12,borderBottom:"1px solid rgba(255,255,255,.1)"}}><div style={{fontSize:12,color:"rgba(255,255,255,.5)",marginBottom:4,fontWeight:700}}>THEIR ANSWER:</div><div style={{fontSize:22,fontWeight:700}}>{truth}</div></div><div style={{marginBottom:12,paddingBottom:12,borderBottom:"1px solid rgba(255,255,255,.1)"}}><div style={{fontSize:12,color:"rgba(255,255,255,.5)",marginBottom:4,fontWeight:700}}>YOUR GUESS:</div><div style={{fontSize:22,fontWeight:700}}>{guess}</div></div><div style={{fontSize:20,fontWeight:700,color:guess===truth?"#c684d9":"rgba(255,255,255,.6)",marginBottom:12}}>+{pts} pts</div><button className="btn" onClick={onReveal} style={{marginTop:0}}>Next</button></div>}</div>);}

function ResultsScreen({names,answers,questions,leave}){
  const dims=['adventure','social','planning','affection','togetherness','financial','conflict','humor'];
  
  // Calculate knowledge scores
  const knowA=answers.filter(a=>a.slot===0&&a.guess!=null).map(a=>scoreGuess(a.guess,a.ans)).reduce((a,b)=>a+b,0)/Math.max(1,answers.filter(a=>a.slot===0&&a.guess!=null).length);
  const knowB=answers.filter(a=>a.slot===1&&a.guess!=null).map(a=>scoreGuess(a.guess,a.ans)).reduce((a,b)=>a+b,0)/Math.max(1,answers.filter(a=>a.slot===1&&a.guess!=null).length);
  const knowPctA=Math.round(100*knowA/3);
  const knowPctB=Math.round(100*knowB/3);
  
  // Calculate compatibility per dimension
  const dimScores=dims.map(d=>{
    const qs=questions.filter(q=>q.dim===d);
    const ansPairs=qs.map(q=>{const a0=answers.find(a=>a.qid===q.id&&a.slot===0);const a1=answers.find(a=>a.qid===q.id&&a.slot===1);return a0&&a1?scoreCompat(a0.ans,a1.ans):null;}).filter(x=>x!=null);
    const avg=ansPairs.length>0?ansPairs.reduce((a,b)=>a+b,0)/ansPairs.length:0;
    return{dim:d,pct:Math.round(100*avg/3),pairs:ansPairs.length};
  });
  
  const overallCompat=Math.round(dimScores.reduce((a,b)=>a+b.pct,0)/dimScores.length);
  const weakest=dimScores.filter(d=>d.pct<70).sort((a,b)=>a.pct-b.pct)[0];
  
  const ideas={
    adventure:"Plan a trip somewhere you've never been. Try something new together.",
    social:"Invite friends over or plan a double date. Build your social circle together.",
    planning:"Try being spontaneous—take a weekend trip with minimal prep.",
    affection:"Be more intentional with touch and intimacy. Small gestures matter.",
    togetherness:"Schedule more one-on-one time. Protect your couple time.",
    financial:"Have a money conversation. Align on splurges vs saving.",
    conflict:"Practice expressing disagreements calmly. Don't avoid tough talks.",
    humor:"Make each other laugh more. Find inside jokes. Don't take everything seriously."
  };
  
  const vacations=["🏝️ Bora Bora","🗻 Swiss Alps","🚂 Japan Rail","🏜️ Morocco","🌊 Iceland","🏖️ Maldives","🎭 Italy Coast","🦁 Kenya Safari","🌴 Costa Rica","🏰 Scotland","🗼 Paris","🌅 Greece"];
  const vacation=vacations[Math.floor(Math.random()*vacations.length)];
  
  return(<div>
    <div className="card center">
      <div style={{fontSize:14,color:"rgba(255,255,255,.6)",margin:"0 0 8px",fontWeight:600}}>Overall Compatibility</div>
      <div className="pct">{overallCompat}%</div>
      <div className="verdict">{verdictFor(overallCompat)}</div>
    </div>
    
    <div className="card">
      <div className="small" style={{margin:"0 0 12px",fontWeight:700}}>How well you know each other</div>
      <div className="knowscore">
        <div><div style={{fontSize:12}}>{names[0]}<br/>knows you</div><div className="big">{knowPctB}%</div></div>
        <div><div style={{fontSize:12}}>You know<br/>{names[1]}</div><div className="big">{knowPctA}%</div></div>
      </div>
    </div>
    
    <div className="card">
      <div className="small" style={{margin:"0 0 12px",fontWeight:700}}>Compatibility by vibe</div>
      <div className="dims">
        {dimScores.map(d=><div key={d.dim} className="dim"><h4>{d.dim}</h4><div className="bar"><i style={{width:d.pct+"%"}}/></div><div className="pct">{d.pct}%</div></div>)}
      </div>
    </div>
    
    {weakest&&<div className="card">
      <div className="small" style={{margin:"0 0 10px",fontWeight:700}}>Strengthen your {weakest.dim}</div>
      <div className="idea">{ideas[weakest.dim]}</div>
      <div className="prize">🎁 {vacation}</div>
    </div>}
    
    <button className="btn" onClick={leave}>Play again</button>
  </div>);
}

function App(){
  const uid=useMemo(hubId,[]);
  const [name,setName]=useState(localStorage.getItem("hub_name")||"");
  const [code,setCode]=useState(localStorage.getItem("kyp_code")||"");
  const [joinCode,setJoinCode]=useState((new URLSearchParams(location.search).get("room")||"").toUpperCase().slice(0,4));
  const [room,setRoom]=useState(null);
  const [questions,setQuestions]=useState([]);
  const [answers,setAnswers]=useState([]);
  const [err,setErr]=useState("");
  const [busy,setBusy]=useState(false);
  const [match,setMatch]=useState(0);
  
  const isHost=!!room&&room.host_uid===uid;
  const slot=isHost?0:1;
  const names=room?[room.host_name||"",room.guest_name||""]:[name,""];
  
  useEffect(()=>{loadQuestions().then(setQuestions).catch(e=>setErr(String(e.message||e)));},[]);
  
  const load=async(c)=>{
    const [rr,aa]=await Promise.all([sb.from("kyp_rooms").select("*").eq("code",c).maybeSingle(),sb.from("kyp_answers").select("*").eq("room",c)]);
    if(rr.data)setRoom(rr.data);else if(!rr.error){setCode("");setRoom(null);}
    if(aa.data)setAnswers(aa.data);
  };
  
  useEffect(()=>{if(!code)return;let dead=false;const tick=async()=>{if(dead)return;await load(code);};tick();const iv=setInterval(tick,2500);return()=>{dead=true;clearInterval(iv);};},[code]);
  
  const create=async()=>{setBusy(true);setErr("");localStorage.setItem("hub_name",name.trim());for(let i=0;i<5;i++){const c=genCode();const {error}=await sb.from("kyp_rooms").insert({code:c,host_uid:uid,host_name:name.trim(),phase:"lobby",round:0});if(!error){localStorage.setItem("kyp_code",c);setCode(c);setBusy(false);return;}}setBusy(false);};
  
  const join=async()=>{const c=joinCode.trim().toUpperCase();setBusy(true);setErr("");localStorage.setItem("hub_name",name.trim());const {data:r}=await sb.from("kyp_rooms").select("*").eq("code",c).maybeSingle();if(!r){setErr("Room not found");setBusy(false);return;}if(r.host_uid===uid||r.guest_uid===uid){localStorage.setItem("kyp_code",c);setCode(c);setBusy(false);return;}if(r.guest_uid){setErr("Room is full");setBusy(false);return;}const {data:u}=await sb.from("kyp_rooms").update({guest_uid:uid,guest_name:name.trim()}).eq("code",c).is("guest_uid",null).select().maybeSingle();if(!u){setErr("Someone took that seat");setBusy(false);return;}localStorage.setItem("kyp_code",c);setCode(c);setBusy(false);};
  
  const botAnswer=(qid)=>{const seed=parseInt(qid.replace(/[^\d]/g,''))||0;return((seed*12345)%10)+1;};
  
  const start=async()=>{const ids=questions.map(q=>q.id).sort(()=>Math.random()-.5).slice(0,6);await sb.from("kyp_rooms").update({phase:"answer1",round:0,qids:ids}).eq("code",room.code).then(()=>load(room.code));};
  
  const startBot=async()=>{const ids=questions.map(q=>q.id).sort(()=>Math.random()-.5).slice(0,6);await sb.from("kyp_rooms").update({guest_uid:"bot",guest_name:"Bot",phase:"answer1",round:0,qids:ids}).eq("code",room.code).then(()=>load(room.code));};
  
  const answerQ=async(val)=>{await sb.from("kyp_answers").upsert({room:room.code,round:room.round,slot,qid:room.qids[room.round],ans:val,guess:null},{onConflict:"room,round,slot,qid"}).then(async()=>{if(room.guest_uid==="bot"&&slot===0){const botAns=botAnswer(room.qids[room.round]);await sb.from("kyp_answers").upsert({room:room.code,round:room.round,slot:1,qid:room.qids[room.round],ans:botAns,guess:null},{onConflict:"room,round,slot,qid"});await new Promise(r=>setTimeout(r,600));await nextRound();}else{await load(room.code);}});};
  
  const guessQ=async(val)=>{await sb.from("kyp_answers").update({guess:val}).eq("room",room.code).eq("round",room.round).eq("slot",slot).then(async()=>{if(room.guest_uid==="bot"&&slot===0){const botGuess=botAnswer(room.qids[room.round]+(room.round*1000));await sb.from("kyp_answers").update({guess:botGuess}).eq("room",room.code).eq("round",room.round).eq("slot",1);await new Promise(r=>setTimeout(r,600));await nextRound();}else{await load(room.code);}});};
  
  const nextRound=async()=>{const nr=room.round+1;if(room.phase==="answer1"&&nr>2){await sb.from("kyp_rooms").update({phase:"guess1",round:0}).eq("code",room.code).then(()=>load(room.code));}else if(room.phase==="guess1"&&nr>2){await sb.from("kyp_rooms").update({phase:"answer2",round:3}).eq("code",room.code).then(()=>load(room.code));}else if(room.phase==="answer2"&&nr>5){await sb.from("kyp_rooms").update({phase:"guess2",round:3}).eq("code",room.code).then(()=>load(room.code));}else if(room.phase==="guess2"&&nr>5){setMatch(1);await sb.from("kyp_rooms").update({phase:"results"}).eq("code",room.code).then(()=>load(room.code));}else{await sb.from("kyp_rooms").update({round:nr}).eq("code",room.code).then(()=>load(room.code));}};
  
  const renderBody=()=>{
    if(!room)return<Home name={name} setName={setName} joinCode={joinCode} setJoinCode={setJoinCode} create={create} join={join} err={err} busy={busy}/>;
    if(room.phase==="lobby")return<Lobby room={room} isHost={isHost} start={start} startBot={startBot} copyLink={async()=>navigator.clipboard.writeText(location.origin+location.pathname+"?room="+room.code)}/>;
    
    const qid=room.qids?.[room.round];const q=questions.find(x=>x.id===qid);
    
    if(!q)return<div className="card center sub">Loading...</div>;
    
    if(room.phase==="answer1"||room.phase==="answer2"){
      const mine=answers.find(a=>a.qid===qid&&a.slot===slot&&a.round===room.round);
      return mine?<div className="card center sub">Waiting for {names[1-slot]}...</div>:<AnswerScreen q={q} names={names} slot={slot} onSubmit={answerQ} onSkip={()=>answerQ(-1)}/>;
    }
    
    if(room.phase==="guess1"||room.phase==="guess2"){
      const other=answers.find(a=>a.qid===qid&&a.slot===(1-slot)&&a.round===room.round);
      const mine=answers.find(a=>a.qid===qid&&a.slot===slot&&a.round===room.round);
      if(!other)return<div className="card center sub">Waiting for {names[1-slot]}...</div>;
      return mine?.guess!=null?<div className="card center sub">Waiting for {names[1-slot]}...</div>:<GuessScreen q={q} names={names} guessing={slot} truth={other.ans} onSubmit={guessQ} onReveal={nextRound}/>;
    }
    
    if(room.phase==="results"){
      return<ResultsScreen names={names} answers={answers} questions={questions} leave={()=>{localStorage.removeItem("kyp_code");setCode("");setRoom(null);}}/>;
    }
    
    return<div className="card center sub">Loading...</div>;
  };
  
  return<div className={`app${match?" match":""}`}><div className="wrap"><div className="hdr"><div className="logo">Know Your Partner</div><button className="pill" onClick={()=>{if(confirm("Leave?"))localStorage.removeItem("kyp_code");setCode("");setRoom(null);}}>Leave</button></div>{renderBody()}<div className="small" style={{textAlign:"center",marginTop:18,opacity:.6}}>v2.0</div></div></div>;
}

ReactDOM.createRoot(document.getElementById("root")).render(<App/>);
</script>
</body>
</html>
