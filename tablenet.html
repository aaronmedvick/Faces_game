function makeMock() {
  const LS = window["localStorage"];

  const load = t => { try { return JSON.parse(LS.getItem("tn_mock_" + t) || "{}"); } catch (e) { return {}; } };
  const save = (t, o) => { try { LS.setItem("tn_mock_" + t, JSON.stringify(o)); } catch (e) {} };
  function qb(t) {
    const st = { op: "select", filters: [], order: null, row: null, single: false };
    const run = () => {
      const tbl = load(t);
      if (st.op === "insert" || st.op === "upsert") {
        const k = st.row[PK[t]];
        if (st.op === "insert" && tbl[k]) return { data: null, error: { message: "duplicate" } };
        tbl[k] = { created_at: new Date().toISOString(), ...(tbl[k] || {}), ...st.row }; save(t, tbl);
        return { data: null, error: null };
      }
      const match = r => st.filters.every(([c, v]) => r[c] === v);
      if (st.op === "update") { Object.keys(tbl).forEach(k => { if (match(tbl[k])) tbl[k] = { ...tbl[k], ...st.row }; }); save(t, tbl); return { data: null, error: null }; }
      const rows = Object.values(tbl).filter(match);
      if (st.order) rows.sort((a, b) => String(a[st.order]).localeCompare(String(b[st.order])));
      return st.single ? { data: rows[0] || null, error: null } : { data: rows, error: null };
    };
    const q = {
      select() { return q; }, limit() { return q; },
      eq(c, v) { st.filters.push([c, v]); return q; }, order(c) { st.order = c; return q; },
      maybeSingle() { st.single = true; return Promise.resolve(run()); },
      insert(r) { st.op = "insert"; st.row = r; return q; },
      upsert(r) { st.op = "upsert"; st.row = r; return q; },
      update(r) { st.op = "update"; st.row = r; return q; },
      then(res, rej) { return Promise.resolve(run()).then(res, rej); }
    };

    from: qb,
    channel() {

      const ch = { on(a, b, cb) { cbs.push(cb); return ch; }, subscribe() { window.addEventListener("storage", h); ch._h = h; return ch; } };
      return ch;
    },
    removeChannel(ch) { if (ch && ch._h) window.removeEventListener("storage", ch._h); }
  };
}

/* ============ ROTATION ENGINE ============
   n prime, n*n people, n tables of n, n+1 rounds, nobody repeats.
   Seat i (0-based) is the point (x,y) = (i mod n, floor(i/n)) in Z_n x Z_n.
   Round r < n: table = (y + r*x) mod n.   Round n: table = x.
   Each parallel class of lines = one round, every pair shares exactly one line. */
const PRIMES = [3, 5, 7, 11, 13];
function tableOf(num, r, n) {
  const i = num - 1, x = i % n, y = Math.floor(i / n);
  return r < n ? (y + r * x) % n : x;
}
function bestN(count) { let b = 0; for (const p of PRIMES) if (p * p <= count) b = p; return b; }
function tableMates(table, r, n) {
  const out = [];
  for (let k = 1; k <= n * n; k++) if (tableOf(k, r, n) === table) out.push(k);
  return out;
}

const TOPICS = [

function mkCode() { const c = "ABCDEFGHJKMNPQRSTUVWXYZ23456789"; let s = ""; for (let i = 0; i < 4; i++) s += c[Math.floor(Math.random() * c.length)]; return s; }

/* ============ SMALL COMPONENTS ============ */
function Timer({ startedAt, mins }) {
  const [now, setNow] = useState(Date.now());
  useEffect(() => { const t = setInterval(() => setNow(Date.now()), 1000); return () => clearInterval(t); }, []);
  if (!startedAt) return null;
  const left = Math.round((new Date(startedAt).getTime() + mins * 60000 - now) / 1000);
  const abs = Math.abs(left), m = Math.floor(abs / 60), s = String(abs % 60).padStart(2, "0");
  return <div className={"timer" + (left < 0 ? " up" : "")}>{left < 0 ? "+" : ""}{m}:{s}</div>;
}

  return <div ref={ref} style={{ background: "#fff", padding: 8, borderRadius: 12, display: "inline-block" }} />;
}

/* ============ APP ============ */
function App() {
  const saved = loadProfile();
  const [prof, setProf] = useState({ name: KV.getItem("hub_name") || saved.name || "", headline: saved.headline || "", email: saved.email || "", phone: saved.phone || "", links: saved.links || "" });

  /* ---- list export ---- */
  function starredRows() {
    return Object.values(marks).filter(m => m.starred).map(m => ({ p: byUid[m.target], m })).filter(x => x.p);
  }
  function csvText() {
    const esc = s => '"' + String(s || "").replace(/"/g, '""') + '"';
    const lines = [["Name", "Seat", "Headline", "Email", "Phone", "Links", "Note"].join(",")];
    starredRows().forEach(({ p, m }) => {
      const met = hasMet(p.uid);
      lines.push([p.name, assign[p.uid] || "", p.headline, met ? p.email : "", met ? p.phone : "", met ? p.links : "", m.note].map(esc).join(","));
    });
    return lines.join("\n");
  }
  function downloadCsv() {
    const a = document.createElement("a");
    a.href = URL.createObjectURL(new Blob([csvText()], { type: "text/csv" }));
    a.download = "table-networking-" + code + ".csv"; document.body.appendChild(a); a.click(); a.remove();
  }
  function copyCsv() { try { navigator.clipboard.writeText(csvText()); alert("Copied. Paste into Sheets or Excel."); } catch (e) { alert("Copy failed. Use Download."); } }

  /* ============ SCREENS ============ */
  if (!joined) {
    return (
      <div className="wrap">
        <div className="top"><div className="brand">TABLE NETWORKING</div>{DEMO ? <span className="pill">DEMO MODE</span> : null}</div>
        <div className="brandBig">Meet everyone.</div>
        <div className="sub">Rotating tables, nobody repeats. Star the people you want to follow up with.</div>
        <div className="card">
          <div className="label" style={{ marginTop: 0 }}>Your profile</div>
          <input className="input" placeholder="Name *" value={prof.name} onChange={setP("name")} />
          <input className="input" placeholder="What you do (headline)" value={prof.headline} onChange={setP("headline")} />
          <input className="input" type="email" placeholder="Email" value={prof.email} onChange={setP("email")} />
          <input className="input" type="tel" placeholder="Phone" value={prof.phone} onChange={setP("phone")} />
          <input className="input" placeholder="Website / LinkedIn / Instagram" value={prof.links} onChange={setP("links")} />
          <div className="phead" style={{ marginTop: 8 }}>Email, phone and links are only shown to people you sit with.</div>
        </div>
        <div className="card">
          <div className="label" style={{ marginTop: 0 }}>Join an event</div>
          <input className="input" placeholder="Event code" value={code} onChange={e => setCode(e.target.value.toUpperCase())} maxLength={4} style={{ textTransform: "uppercase", letterSpacing: ".3em", textAlign: "center" }} />
          <button className="go" disabled={!profOk || code.trim().length < 4 || busy} onClick={join}>Join</button>
        </div>
        <div className="card">
          <div className="label" style={{ marginTop: 0 }}>Host an event</div>
          <input className="input" placeholder="Event name" value={evName} onChange={e => setEvName(e.target.value)} />
          <input className="input" type="number" min="1" max="30" placeholder="Minutes per round" value={mins} onChange={e => setMins(e.target.value)} />
          <button className="ghost" disabled={!profOk || busy} onClick={host}>Create event</button>
        </div>
        {err ? <div className="err">{err}</div> : null}
        {DEMO ? <div className="phead" style={{ marginTop: 10 }}>Demo mode: data lives in this browser only. Open extra tabs to act as other people, or host and tap "fill to 25".</div> : null}
      </div>
    );
  }

  if (!ev) return <div className="wrap"><div className="sub">Loading…</div></div>;

  const me = byUid[MYID];
  const joinUrl = location.origin + location.pathname + "?code=" + code;
  const lobby = ev.status === "lobby";
  const done = ev.status === "done";
  const nn = bestN(people.length);

  let tabs = [["table", "Table"], ["people", "Everyone"], ["list", "My List ★"]];
  if (isHost) tabs.push(["host", "Host"]);

  const sheetP = open ? byUid[open] : null;

  function renderTable() {
    if (lobby) {
      return <>
        <div className="card" style={{ textAlign: "center" }}>
          <div className="label" style={{ marginTop: 0 }}>Waiting for the host to start</div>
          <div className="big">{people.length}</div>
          <div className="phead">checked in</div>
          {isHost ? <div style={{ marginTop: 14 }}><QR text={joinUrl} /><div className="who" style={{ marginTop: 8 }}>Code {code}</div></div> : null}
        </div>
        {isHost ? (nn
          ? <button className="go" onClick={startEvent}>Start: {nn * nn} seats, {nn} tables, {nn + 1} rounds</button>
          : <div className="card phead">Need at least 9 people to start (3 tables of 3).</div>) : null}
        {isHost && DEMO && people.length < 25 ? <button className="ghost" onClick={addBots}>Demo: fill to 25 people</button> : null}
        {isHost && nn && people.length > nn * nn ? <div className="phead">{people.length - nn * nn} extra people will be floaters (no seat, can still browse and star).</div> : null}
      </>;
    }
    if (done) return <div className="card"><div className="pname">Event finished.</div><div className="phead">Check My List to follow up with your stars.</div></div>;
    if (!myNum) return <div className="card"><div className="pname">You're a floater this event.</div><div className="phead">No seat, but you can browse Everyone and star people.</div></div>;
    const t = tableOf(myNum, round, n);
    const mates = tableMates(t, round, n);
    const topic = (ev.topics || [])[round] || "";
    return <>
      <div className="card" style={{ textAlign: "center" }}>
        <div className="row" style={{ justifyContent: "space-between" }}>
          <span className="pill">ROUND {round + 1} / {n + 1}</span>
          <Timer startedAt={ev.round_started_at} mins={ev.mins} />
        </div>
        <div className="label">Go to table</div>
        <div className="big">{t + 1}</div>
        <div className="phead" style={{ marginTop: 6 }}>You are seat #{myNum}</div>
      </div>
      <div className="card"><div className="label" style={{ marginTop: 0 }}>Talk about</div><div className="topic">{topic}</div></div>
      <div className="label">At your table</div>
      {mates.map(k => {
        const uid = uidByNum[k]; const p = byUid[uid]; if (!p) return null;
        return <PersonRow key={k} p={p} num={k} me={uid === MYID} mark={marks[uid]} onOpen={() => setOpen(uid)} onStar={() => toggleStar(uid)} />;
      })}
    </>;
  }

  function renderPeople() {
    const list = people.filter(p => !q || (p.name + " " + (p.headline || "")).toLowerCase().includes(q.toLowerCase()))
      .sort((a, b) => (assign[a.uid] || 999) - (assign[b.uid] || 999) || a.name.localeCompare(b.name));
    return <>
      <input className="input" style={{ marginTop: 0 }} placeholder="Search name or headline" value={q} onChange={e => setQ(e.target.value)} />
      <div className="label">{people.length} at this event</div>
      {list.map(p => <PersonRow key={p.uid} p={p} num={assign[p.uid]} me={p.uid === MYID} mark={marks[p.uid]} onOpen={() => setOpen(p.uid)} onStar={() => toggleStar(p.uid)} />)}
    </>;
  }

  function renderList() {
    const rows = starredRows();
    return <>
      <div className="label" style={{ marginTop: 0 }}>{rows.length} starred</div>
      {rows.length === 0 ? <div className="card phead">Star people at your table and they show up here with your notes.</div> : null}
      {rows.map(({ p }) => <PersonRow key={p.uid} p={p} num={assign[p.uid]} me={false} mark={marks[p.uid]} onOpen={() => setOpen(p.uid)} onStar={() => toggleStar(p.uid)} />)}
      {rows.length ? <>
        <button className="go" onClick={downloadCsv}>Download CSV</button>
        <button className="ghost" onClick={copyCsv}>Copy for Sheets</button>
      </> : null}
    </>;
  }

  function renderHost() {
    if (lobby) return <div className="card phead">Start the event from the Table tab.</div>;
    const mates = [];
    if (!done) for (let t = 0; t < n; t++) mates.push([t, tableMates(t, round, n)]);
    return <>
      <div className="card">
        <div className="row" style={{ justifyContent: "space-between" }}>
          <span className="pill">ROUND {Math.min(round + 1, n + 1)} / {n + 1}</span>
          <Timer startedAt={ev.round_started_at} mins={ev.mins} />
        </div>
        {!done && round > 0 ? <button className="ghost" onClick={() => setRound(round - 1)}>← Previous round</button> : null}
        {!done && round < n ? <button className="go" onClick={() => setRound(round + 1)}>Next round →</button> : null}
        {!done && round === n ? <button className="go" onClick={endEvent}>End event</button> : null}
        {!done ? <button className="ghost danger" onClick={() => { if (confirm("End the event now?")) endEvent(); }}>End early</button> : null}
      </div>
      {!done ? <>
        <div className="label">Tables this round</div>
        <div className="tgrid">
          {mates.map(([t, ks]) => <div className="tcell" key={t}><b>Table {t + 1}</b><br />{ks.map(k => (byUid[uidByNum[k]] || {}).name || "?").join(", ")}</div>)}
        </div>
      </> : null}
    </>;
  }

  return (
    <div className="wrap">
      <div className="top">
        <div className="brand">{ev.name.toUpperCase()}</div>
        <div className="who">{code} · {me ? me.name : ""} <span style={{ cursor: "pointer", color: "var(--rose)" }} onClick={leave}>leave</span></div>
      </div>
      {tab === "table" && renderTable()}
      {tab === "people" && renderPeople()}
      {tab === "list" && renderList()}
      {tab === "host" && isHost && renderHost()}
      <div className="tabs"><div className="in">
        {tabs.map(([k, l]) => <button key={k} className={"tab" + (tab === k ? " on" : "")} onClick={() => setTab(k)}>{l}</button>)}
      </div></div>
      {sheetP ? <PersonSheet key={sheetP.uid} p={sheetP} num={assign[sheetP.uid]} me={sheetP.uid === MYID} met={hasMet(sheetP.uid)} mark={marks[sheetP.uid]} onSave={patch => saveMark(sheetP.uid, patch)} onClose={() => setOpen(null)} /> : null}
    </div>
  );
}

boot().then(() => ReactDOM.createRoot(document.getElementById("root")).render(<App />));
</script>
</body>
</html>
