<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
<title>Game Admin</title>
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;600;700&family=JetBrains+Mono:wght@700&display=swap" rel="stylesheet" />
<style>
*{box-sizing:border-box}html,body{margin:0}
:root{--ink:#0E0B1A;--velvet:#171126;--panel:#1E1735;--haze:#332853;--candle:#F5B14C;--psychic:#A78BFA;--mist:#E9E3F6;--dim:#8B82A6;--mint:#7DF0A6;--rose:#F26D8B}
body{background:radial-gradient(120% 80% at 50% -10%,#241a3d 0%,var(--ink) 55%);min-height:100vh;font-family:'Space Grotesk',system-ui,sans-serif;color:var(--mist);-webkit-font-smoothing:antialiased}
.wrap{max-width:560px;margin:0 auto;padding:18px 16px 40px}
h1{font-size:22px;margin:6px 0 2px}.sub{color:var(--dim);font-size:12px;letter-spacing:.14em;text-transform:uppercase;margin-bottom:16px}
.card{background:linear-gradient(180deg,var(--panel),var(--velvet));border:1px solid var(--haze);border-radius:16px;padding:14px 16px;margin-bottom:12px}
.row{display:flex;align-items:center;gap:10px}
.nm{font-weight:700}.u{font-family:'JetBrains Mono',monospace;font-size:11px;color:var(--dim);word-break:break-all}
label{display:block;font-size:11px;letter-spacing:.1em;text-transform:uppercase;color:var(--dim);margin:10px 0 4px}
input,select,textarea{width:100%;padding:11px;border-radius:10px;border:1px solid var(--haze);background:var(--velvet);color:var(--mist);font-family:inherit;font-size:15px}
textarea{min-height:60px}
button{font-family:inherit;font-weight:700;cursor:pointer;border:none;border-radius:10px}
.primary{background:var(--candle);color:var(--ink);padding:12px 14px;width:100%;font-size:15px;margin-top:12px}
.chip{font-size:11px;font-weight:700;padding:5px 9px;border-radius:999px;border:1px solid var(--haze);background:var(--velvet);color:var(--dim);margin-right:6px}
.chip.on.live{background:var(--mint);color:var(--ink);border-color:var(--mint)}
.chip.on.demo{background:var(--candle);color:var(--ink);border-color:var(--candle)}
.chip.on.soon{background:var(--psychic);color:var(--ink);border-color:var(--psychic)}
.chip.on.off{background:var(--rose);color:var(--ink);border-color:var(--rose)}
.del{background:none;color:var(--rose);border:1px solid var(--rose);padding:5px 9px;font-size:11px;border-radius:999px;margin-left:auto}
.msg{font-size:12px;color:var(--mint);min-height:16px;margin-top:6px}
</style>
</head>
<body>
<div class="wrap"><div id="app">Loading…</div></div>
<script src="https://unpkg.com/@supabase/supabase-js@2/dist/umd/supabase.js"></script>
<script>
const SUPABASE_URL="https://gyvgzeculdaxcwinblld.supabase.co";
const SUPABASE_KEY="sb_publishable_kS8hQSqZR8Sog9imuq8dCg_-6iBy2Hi";
const ADMIN_PASS="coldcase";   // <-- change this to your own passphrase
const sb=supabase.createClient(SUPABASE_URL,SUPABASE_KEY);
const app=document.getElementById("app");
const STATUSES=["live","demo","soon","off"];
const esc=s=>(s||"").replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/"/g,"&quot;");
const slugify=s=>(s||"").toLowerCase().replace(/[^a-z0-9]+/g,"").slice(0,40)||("g"+Date.now());

if(sessionStorage.getItem("cc_admin")!=="1"){
  const p=prompt("Admin passphrase");
  if(p===ADMIN_PASS) sessionStorage.setItem("cc_admin","1");
  else { app.innerHTML="<h1>Locked</h1><p class='sub'>Wrong passphrase — reload to try again.</p>"; throw new Error("locked"); }
}

async function load(){ const r=await sb.from("pages").select("*").order("sort").order("name"); return r.data||[]; }
async function setStatus(slug,status){ const r=await sb.from("pages").update({status}).eq("slug",slug); if(r.error) alert("Save failed: "+r.error.message); render(r.error?("⚠ "+r.error.message):"Saved ✓", !!r.error); }
async function setUrl(slug){ const v=(document.getElementById("u_"+slug).value||"").trim(); const r=await sb.from("pages").update({url:v}).eq("slug",slug); if(r.error) alert("Save failed: "+r.error.message); render(r.error?("⚠ "+r.error.message):"Link saved ✓", !!r.error); }
async function del(slug){ if(!confirm("Delete this game from the hub?")) return; const r=await sb.from("pages").delete().eq("slug",slug); if(r.error) alert("Delete failed: "+r.error.message); render(r.error?("⚠ "+r.error.message):"Deleted", !!r.error); }
async function addGame(){
  const name=document.getElementById("f_name").value.trim();
  const url=document.getElementById("f_url").value.trim();
  if(!name){ document.getElementById("msg").textContent="Enter a name"; return; }
  const row={ slug:slugify(name), name, tag:document.getElementById("f_tag").value.trim(),
    emoji:document.getElementById("f_emoji").value.trim()||"🎮", url,
    descr:document.getElementById("f_desc").value.trim(), status:document.getElementById("f_status").value,
    sort:parseInt(document.getElementById("f_sort").value||"0",10)||0 };
  const r=await sb.from("pages").upsert(row);
  if(r.error){ alert("Save failed: "+r.error.message); document.getElementById("msg").textContent="⚠ "+r.error.message; return; }
  render("Saved ✓");
}

async function render(msg,isError){
  const games=await load();
  app.innerHTML =
    "<h1>Game Admin</h1><div class='sub'>manage what shows on the hub</div>" +
    games.map(g=>{
      const chips=STATUSES.map(s=>"<button class='chip"+(g.status===s?" on "+s:"")+"' onclick=\"setStatus('"+g.slug+"','"+s+"')\">"+s+"</button>").join("");
      return "<div class='card'><div class='row'><div style='flex:1'><div class='nm'>"+g.emoji+" "+esc(g.name)+"</div></div><button class='del' onclick=\"del('"+g.slug+"')\">delete</button></div>" +
        "<div class='row' style='margin-top:8px;gap:8px'><input id='u_"+g.slug+"' value=\""+esc(g.url)+"\" placeholder='link e.g. liarspoker.html' style='flex:1'><button class='chip' style='padding:10px 12px' onclick=\"setUrl('"+g.slug+"')\">save link</button></div>" +
        "<div style='margin-top:10px'>"+chips+"</div></div>";
    }).join("") +
    "<div class='card'><div class='nm' style='margin-bottom:4px'>Add / update a game</div>" +
    "<label>Name</label><input id='f_name' placeholder='Cold Read'>" +
    "<label>File or link (url)</label><input id='f_url' placeholder='coldcase.html'>" +
    "<div class='row' style='gap:10px'><div style='flex:0 0 70px'><label>Emoji</label><input id='f_emoji' placeholder='🎲'></div><div style='flex:1'><label>Tag</label><input id='f_tag' placeholder='Party game'></div><div style='flex:0 0 70px'><label>Sort</label><input id='f_sort' type='number' value='0'></div></div>" +
    "<label>Description</label><textarea id='f_desc' placeholder='One-line pitch'></textarea>" +
    "<label>Status</label><select id='f_status'><option value='live'>live</option><option value='demo'>demo</option><option value='soon' selected>coming soon</option><option value='off'>off (hidden)</option></select>" +
    "<button class='primary' onclick='addGame()'>Save game</button><div class='msg' id='msg' style='color:"+(isError?"var(--rose)":"var(--mint)")+"'>"+esc(msg||"")+"</div></div>";
}
render();
</script>
</body>
</html>
